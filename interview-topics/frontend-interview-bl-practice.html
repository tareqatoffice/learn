**Answer:** Both memoizations cost more than they save. Adding two numbers is cheaper than `useMemo`'s bookkeeping, and `useCallback` only helps when the function goes to a memoized child or into a dependency array. It's a good example of "looks smart, adds noise" — measure with the Profiler before optimizing.

<script>
(function () {
  "use strict";
  var STORE_KEY = "fe-interview-practice-v1";
  var state = { answers: {}, status: {} };
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { var p = JSON.parse(raw); state.answers = p.answers || {}; state.status = p.status || {}; }
  } catch (e) {}
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------- Minimal markdown ---------- */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + esc(codes[+i]) + "</code>"; });
    return s;
  }
  function md(text) {
    var lines = text.replace(/\s+$/, "").split("\n");
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*$/.test(l)) { i++; continue; }
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      if (/^\|/.test(l)) {
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); };
        var head = cells(rows[0]);
        var html = '<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.slice(2).forEach(function (r) { html += "<tr>" + cells(r).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; });
        out.push(html + "</tbody></table></div>");
        continue;
      }
      if (/^>/.test(l)) {
        var q = [];
        while (i < lines.length && /^>/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + md(q.join("\n")) + "</blockquote>");
        continue;
      }
      if (/^\d+\.\s/.test(l) || /^-\s/.test(l)) {
        var ordered = /^\d+\.\s/.test(l), items = [];
        var re = ordered ? /^\d+\.\s/ : /^-\s/;
        while (i < lines.length && re.test(lines[i])) { items.push(lines[i].replace(re, "")); i++; }
        var tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(function (it) { return "<li>" + inline(it) + "</li>"; }).join("") + "</" + tag + ">");
        continue;
      }
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(```|\||>|\d+\.\s|-\s)/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("");
  }

  /* ---------- Parse source ---------- */
  var src = document.getElementById("src").textContent;
  var sections = [], cur = null, q = null;
  src.split("\n").forEach(function (line) {
    var m2 = /^## (.+)$/.exec(line), m3 = /^### (.+)$/.exec(line);
    if (m2) { cur = { title: m2[1], qs: [] }; sections.push(cur); q = null; return; }
    if (m3 && cur) { q = { title: m3[1], body: [] }; cur.qs.push(q); return; }
    if (q) q.body.push(line);
  });
  var all = [];
  sections.forEach(function (s, si) {
    s.id = "sec-" + si;
    s.qs.forEach(function (qq, qi) {
      var tm = /^((?:Q|T|B)\d+)\.\s+(.*)$/.exec(qq.title);
      qq.num = tm ? tm[1] : "Q" + (qi + 1);
      qq.text = tm ? tm[2] : qq.title;
      var sk = /^(\w+)\./.exec(s.title); qq.id = (sk ? sk[1] : si) + "-" + qq.num;
      var body = qq.body, splitAt = -1;
      for (var k = 0; k < body.length; k++) { if (/^\*\*(Answer|Issues to find):\*\*/.test(body[k])) { splitAt = k; break; } }
      if (splitAt >= 0) {
        qq.prompt = body.slice(0, splitAt).join("\n").trim();
        qq.answer = body.slice(splitAt).join("\n").replace(/^\*\*(Answer|Issues to find):\*\*\s*/, "").trim();
      } else { qq.prompt = ""; qq.answer = body.join("\n").trim(); }
      qq.section = s;
      all.push(qq);
    });
  });

  /* ---------- Render ---------- */
  var main = document.getElementById("main"), nav = document.getElementById("nav"), jump = document.getElementById("jump");
  sections.forEach(function (s) {
    var sec = document.createElement("section");
    sec.className = "group"; sec.id = s.id;
    sec.innerHTML = "<h2>" + inline(s.title) + "</h2>";
    s.qs.forEach(function (qq) {
      var card = document.createElement("article");
      card.className = "q"; card.id = "q-" + qq.id;
      var aid = "ans-" + qq.id;
      card.innerHTML =
        '<div class="q-head"><span class="q-num">' + qq.num + '</span><h3 class="q-title">' + inline(qq.text) + '</h3><span class="q-badge hidden"></span></div>' +
        '<div class="q-body">' +
          (qq.prompt ? '<div class="prompt md">' + md(qq.prompt) + "</div>" : "") +
          '<label class="mine-label" for="t-' + qq.id + '">Your answer</label>' +
          '<textarea class="mine" id="t-' + qq.id + '" placeholder="Type or speak-and-type your answer before revealing…"></textarea>' +
          '<div class="actions"><button class="btn reveal" aria-expanded="false" aria-controls="' + aid + '">Show answer</button><span class="saved"></span></div>' +
          '<div class="answer" id="' + aid + '"><div><div class="answer-inner"><p class="ans-label">Model answer</p><div class="md">' + md(qq.answer) + "</div></div>" +
          '<div class="grade">How did you do? <button class="btn got" aria-pressed="false">Got it</button><button class="btn review" aria-pressed="false">Review again</button></div></div></div>' +
        "</div>";
      qq.el = card;
      var ta = card.querySelector("textarea");
      ta.value = state.answers[qq.id] || "";
      var savedEl = card.querySelector(".saved"), timer;
      ta.addEventListener("input", function () {
        state.answers[qq.id] = ta.value;
        clearTimeout(timer);
        timer = setTimeout(function () { save(); savedEl.textContent = "Saved"; updateCounts(); }, 400);
      });
      var rbtn = card.querySelector(".reveal"), ans = card.querySelector(".answer");
      rbtn.addEventListener("click", function () { setOpen(qq, !ans.classList.contains("open")); });
      card.querySelector(".btn.got").addEventListener("click", function () { setStatus(qq, "got"); });
      card.querySelector(".btn.review").addEventListener("click", function () { setStatus(qq, "review"); });
      sec.appendChild(card);
      paintStatus(qq);
    });
    main.appendChild(sec);
    var li = document.createElement("li");
    li.innerHTML = '<a href="#' + s.id + '"><span>' + inline(s.title) + '</span><span class="count" data-sec="' + s.id + '"></span></a>';
    nav.appendChild(li);
    var opt = document.createElement("option"); opt.value = s.id; opt.textContent = s.title; jump.appendChild(opt);
  });
  var emptyEl = document.createElement("p"); emptyEl.className = "empty hidden"; emptyEl.textContent = "No questions match this filter. Try All, or clear the search.";
  main.appendChild(emptyEl);
  jump.addEventListener("change", function () { document.getElementById(jump.value).scrollIntoView(); });

  function setOpen(qq, open) {
    var ans = qq.el.querySelector(".answer"), b = qq.el.querySelector(".reveal");
    ans.classList.toggle("open", open);
    b.setAttribute("aria-expanded", String(open));
    b.textContent = open ? "Hide answer" : "Show answer";
    b.classList.toggle("secondary", open);
  }
  function setStatus(qq, st) {
    if (state.status[qq.id] === st) delete state.status[qq.id]; else state.status[qq.id] = st;
    save(); paintStatus(qq); updateCounts();
  }
  function paintStatus(qq) {
    var st = state.status[qq.id] || "";
    qq.el.setAttribute("data-status", st);
    var badge = qq.el.querySelector(".q-badge");
    badge.className = "q-badge " + (st || "hidden");
    badge.textContent = st === "got" ? "Got it" : st === "review" ? "Review" : "";
    qq.el.querySelector(".btn.got").setAttribute("aria-pressed", String(st === "got"));
    qq.el.querySelector(".btn.review").setAttribute("aria-pressed", String(st === "review"));
  }
  function attempted(qq) { return !!(state.answers[qq.id] && state.answers[qq.id].trim()) || !!state.status[qq.id]; }
  function updateCounts() {
    var att = 0, got = 0, rev = 0;
    all.forEach(function (qq) { if (attempted(qq)) att++; if (state.status[qq.id] === "got") got++; if (state.status[qq.id] === "review") rev++; });
    document.getElementById("p-att").textContent = att;
    document.getElementById("p-got").textContent = got;
    document.getElementById("p-rev").textContent = rev;
    document.getElementById("p-total").textContent = all.length;
    document.getElementById("bar-got").style.width = (got / all.length * 100) + "%";
    var br = document.getElementById("bar-rev");
    br.style.left = (got / all.length * 100) + "%"; br.style.width = (rev / all.length * 100) + "%";
    sections.forEach(function (s) {
      var g = s.qs.filter(function (qq) { return state.status[qq.id] === "got"; }).length;
      document.querySelector('.count[data-sec="' + s.id + '"]').textContent = g + "/" + s.qs.length;
    });
  }

  /* ---------- Filters ---------- */
  var filter = "all", term = "";
  function applyFilter() {
    var shown = 0;
    sections.forEach(function (s) {
      var any = false;
      s.qs.forEach(function (qq) {
        var st = state.status[qq.id];
        var ok = filter === "all" || (filter === "todo" && !attempted(qq)) || (filter === st);
        if (ok && term) ok = (qq.text + " " + qq.prompt).toLowerCase().indexOf(term) >= 0;
        qq.el.classList.toggle("hidden", !ok);
        if (ok) { any = true; shown++; }
      });
      document.getElementById(s.id).classList.toggle("hidden", !any);
    });
    emptyEl.classList.toggle("hidden", shown > 0);
  }
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () {
      filter = c.getAttribute("data-filter");
      document.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === c)); });
      applyFilter();
    });
  });
  document.getElementById("search").addEventListener("input", function (e) { term = e.target.value.trim().toLowerCase(); applyFilter(); });
  document.getElementById("hide-all").addEventListener("click", function () { all.forEach(function (qq) { setOpen(qq, false); }); });
  document.getElementById("shuffle").addEventListener("click", function () {
    var pool = all.filter(function (qq) { return !qq.el.classList.contains("hidden"); });
    if (!pool.length) return;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    setOpen(pick, false);
    pick.el.scrollIntoView({ block: "start" });
    pick.el.querySelector("textarea").focus({ preventScroll: true });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all your typed answers and marks? This can't be undone.")) return;
    state = { answers: {}, status: {} }; save();
    all.forEach(function (qq) { qq.el.querySelector("textarea").value = ""; qq.el.querySelector(".saved").textContent = ""; paintStatus(qq); setOpen(qq, false); });
    updateCounts(); applyFilter();
  });

  /* ---------- Theme ---------- */
  var themeBtn = document.getElementById("theme"), root = document.documentElement;
  function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function labelTheme() { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; }
  try { var saved = localStorage.getItem(STORE_KEY + "-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  labelTheme();
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(STORE_KEY + "-theme", next); } catch (e) {}
    labelTheme();
  });

  /* ---------- Active section in nav ---------- */
  if ("IntersectionObserver" in window) {
    var links = {};
    nav.querySelectorAll("a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.toggle("active", k === en.target.id); });
        }
      });
    }, { rootMargin: "-140px 0px -65% 0px" });
    sections.forEach(function (s) { io.observe(document.getElementById(s.id)); });
  }

  updateCounts();
})();
</script>
