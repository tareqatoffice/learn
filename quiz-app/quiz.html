nents?** Lift to the common parent.\\n6. **Used widely and updated rarely?** Context.\\n7. **Used widely and updated often?** External store with selectors.\\n\\n**Watch out.** Duplicated state is the most common source of bugs. Storing both `items` and `selectedItem` (a copy) means they drift when the item is edited. Store `selectedId` and derive the item."},{"id":"react-questions-ebook-af4pgr","book":"React","part":"Part 4 — State Management","question":"Context vs Redux vs Zustand — how do you choose?","prompt":"","answer":"**Short answer.** Context avoids prop drilling but re-renders every consumer on change. Redux Toolkit and Zustand are external stores where components subscribe to slices through selectors, so only affected components re-render. Choose based on update frequency and team needs, not habit.\\n\\n**Explanation.**\\n\\n| | Context | Zustand | Redux Toolkit |\\n|---|---|---|---|\\n| Boilerplate | Minimal | Minimal | Moderate |\\n| Selective subscriptions | No | Yes | Yes |\\n| DevTools / time travel | No | Via middleware | Built in |\\n| Best for | Theme, auth, locale | Small–medium shared client state | Large apps, strict conventions, many contributors |\\n\\n```jsx\\n// Zustand\\nconst useCart = create(set => ({\\n  items: [],\\n  add: item => set(s => ({ items: [...s.items, item] })),\\n}));\\n\\nfunction CartCount() {\\n  const count = useCart(s => s.items.length);   // re-renders only when length changes\\n  return \\u003cspan>{count}\\u003c/span>;\\n}\\n```\\n\\n**Watch out.** Most \\"we need Redux\\" cases are actually server-state cases. Once API data moves into TanStack Query, the remaining global client state is often small enough for context or Zustand."},{"id":"react-questions-ebook-jxe75v","book":"React","part":"Part 4 — State Management","question":"What is the difference between server state and client state?","prompt":"","answer":"**Short answer.** Client state is owned by the browser — UI toggles, form drafts, selected tab. Server state is a cached copy of data owned by the backend — it can go stale and needs refetching, deduplication, and invalidation. They need different tools.\\n\\n**Explanation.** Server-state problems that `useState + useEffect` doesn\'t solve: caching between screens, deduplicating identical requests, background refetch, retries, pagination, optimistic updates, and invalidation after mutations.\\n\\n```jsx\\nfunction Todos() {\\n  const { data, isPending, error } = useQuery({\\n    queryKey: [\'todos\'],\\n    queryFn: () => fetch(\'/api/todos\').then(r => r.json()),\\n  });\\n\\n  const qc = useQueryClient();\\n  const add = useMutation({\\n    mutationFn: createTodo,\\n    onSuccess: () => qc.invalidateQueries({ queryKey: [\'todos\'] }),\\n  });\\n  // ...\\n}\\n```\\n\\n**Watch out.** Copying query data into a Redux store or `useState` \\"so it\'s global\\" defeats the cache. Any component can call the same `useQuery` key — the cache *is* the global store."},{"id":"react-questions-ebook-1lqdpo5","book":"React","part":"Part 4 — State Management","question":"Controlled vs uncontrolled components","prompt":"","answer":"**Short answer.** A controlled input\'s value comes from React state and changes through `onChange`. An uncontrolled input keeps its own value in the DOM, and you read it with a ref or from the form on submit.\\n\\n**Explanation.**\\n\\n```jsx\\n// Controlled — React is the source of truth\\nconst [email, setEmail] = useState(\'\');\\n\\u003cinput value={email} onChange={e => setEmail(e.target.value)} />\\n\\n// Uncontrolled — DOM is the source of truth\\n\\u003cform action={async formData => { await save(formData.get(\'email\')); }}>\\n  \\u003cinput name=\\"email\\" defaultValue=\\"\\" />\\n\\u003c/form>\\n```\\n\\n| | Controlled | Uncontrolled |\\n|---|---|---|\\n| Live validation / formatting | Easy | Harder |\\n| Re-render per keystroke | Yes | No |\\n| Code | More | Less |\\n\\nReact 19 form Actions make uncontrolled forms a first-class choice again (Q38).\\n\\n**Watch out.** Switching an input from `value={undefined}` to `value=\\"x\\"` triggers \\"A component is changing an uncontrolled input to be controlled\\". Initialize controlled state with `\'\'`, not `undefined`."},{"id":"react-questions-ebook-1a8vlg7","book":"React","part":"Part 4 — State Management","question":"What is prop drilling and how do you avoid it?","prompt":"","answer":"**Short answer.** Prop drilling is passing props through intermediate components that don\'t use them, just to reach a deep child. Fix it with composition first, context second.\\n\\n**Explanation.** Composition is often overlooked:\\n\\n```jsx\\n// Drilling: Layout and Sidebar pass `user` through without using it\\n\\u003cLayout user={user} />\\n\\n// Composition: the component that has `user` builds the deep child directly\\n\\u003cLayout sidebar={\\u003cSidebar>\\u003cUserMenu user={user} />\\u003c/Sidebar>} />\\n```\\n\\n`Layout` now receives a ready-made element and doesn\'t need to know about `user` at all.\\n\\n**Watch out.** Passing props two or three levels is fine and keeps data flow explicit. Reaching for context immediately makes components harder to reuse and test."},{"id":"react-questions-ebook-mrev7t","book":"React","part":"Part 5 — Performance","question":"What does `React.memo` do?","prompt":"","answer":"**Short answer.** `React.memo` wraps a component so it skips re-rendering when its props are shallowly equal to the previous props. It only helps if the props are actually stable.\\n\\n**Explanation.**\\n\\n```jsx\\nconst Row = memo(function Row({ item, onSelect }) {\\n  return \\u003cli onClick={() => onSelect(item.id)}>{item.name}\\u003c/li>;\\n});\\n\\nfunction List({ items }) {\\n  const [selected, setSelected] = useState(null);\\n  const onSelect = useCallback(id => setSelected(id), []);\\n  return items.map(i => \\u003cRow key={i.id} item={i} onSelect={onSelect} />);\\n}\\n```\\n\\nThings that silently break memo: inline objects (`style={{...}}`), inline arrays, inline functions, and `children` JSX (a new element object every render).\\n\\n**Watch out.** `memo` doesn\'t stop re-renders caused by the component\'s own state or by context it consumes. And with the React Compiler enabled, explicit `memo` is mostly unnecessary."},{"id":"react-questions-ebook-kiyuiz","book":"React","part":"Part 5 — Performance","question":"What is the React Compiler?","prompt":"","answer":"**Short answer.** A build-time tool (v1.0 stable since October 2025) that analyzes components and hooks and automatically memoizes values, functions, and JSX — the work you used to do by hand with `useMemo`, `useCallback`, and `memo`.\\n\\n**Explanation.** It works because components are supposed to be pure and follow the rules of hooks. If they do, the compiler can prove which values depend on which inputs and cache them at a finer granularity than manual memoization usually achieves.\\n\\nIt ships as a Babel plugin, with integrations for Vite, Next.js, and Expo. Components that break the rules — mutating props, reading refs during render — are skipped rather than miscompiled.\\n\\n**Watch out.** The compiler doesn\'t fix architecture problems: a context that changes on every keystroke, or a 10,000-row list that isn\'t virtualized, is still slow. It also makes the rules of React stricter in practice — code that \\"worked\\" while impure may behave differently."},{"id":"react-questions-ebook-lwqaxd","book":"React","part":"Part 5 — Performance","question":"How do you code-split a React app?","prompt":"","answer":"**Short answer.** Use dynamic `import()` with `React.lazy` and wrap the lazy component in `\\u003cSuspense>` with a fallback. Split at route level first, then at heavy, rarely-used components.\\n\\n**Explanation.**\\n\\n```jsx\\nimport { lazy, Suspense } from \'react\';\\n\\nconst Chart = lazy(() => import(\'./Chart\'));   // separate chunk\\n\\nfunction Dashboard() {\\n  return (\\n    \\u003cSuspense fallback={\\u003cSpinner />}>\\n      \\u003cChart />\\n    \\u003c/Suspense>\\n  );\\n}\\n```\\n\\nGood candidates: routes, modals, rich text editors, charting and map libraries, admin-only screens.\\n\\n**Watch out.** Calling `lazy` inside a component recreates it every render and resets state. Declare it at module level. Also preload on intent (hover over a link) to hide the loading delay."},{"id":"react-questions-ebook-1pztki7","book":"React","part":"Part 5 — Performance","question":"How do you render a list of 10,000 items?","prompt":"","answer":"**Short answer.** Virtualize it: render only the rows visible in the viewport plus a small buffer, and use spacers to keep the scrollbar correct. Libraries: TanStack Virtual, react-window, react-virtuoso.\\n\\n**Explanation.**\\n\\n```jsx\\nimport { useVirtualizer } from \'@tanstack/react-virtual\';\\n\\nfunction BigList({ rows }) {\\n  const parentRef = useRef(null);\\n  const v = useVirtualizer({\\n    count: rows.length,\\n    getScrollElement: () => parentRef.current,\\n    estimateSize: () => 36,\\n  });\\n\\n  return (\\n    \\u003cdiv ref={parentRef} style={{ height: 400, overflow: \'auto\' }}>\\n      \\u003cdiv style={{ height: v.getTotalSize(), position: \'relative\' }}>\\n        {v.getVirtualItems().map(item => (\\n          \\u003cdiv key={item.key}\\n               style={{ position: \'absolute\', top: 0, transform: `translateY(${item.start}px)`, height: item.size }}>\\n            {rows[item.index].name}\\n          \\u003c/div>\\n        ))}\\n      \\u003c/div>\\n    \\u003c/div>\\n  );\\n}\\n```\\n\\n**Watch out.** Virtualization breaks browser find-in-page and complicates accessibility (screen readers see only rendered rows). Pagination or \\"load more\\" may be the better product answer for some lists. CSS `content-visibility: auto` is a lighter alternative for long, non-interactive content."},{"id":"react-questions-ebook-pr0311","book":"React","part":"Part 5 — Performance","question":"`useTransition` vs `useDeferredValue`","prompt":"","answer":"**Short answer.** Both mark work as non-urgent so React can keep the UI responsive. `useTransition` wraps the *state update* you control. `useDeferredValue` gives you a lagging copy of a *value* you receive, typically a prop.\\n\\n**Explanation.**\\n\\n```jsx\\n// useTransition — you own the setter\\nconst [isPending, startTransition] = useTransition();\\n\\nfunction onTabClick(tab) {\\n  startTransition(() => setTab(tab));   // heavy tab render can be interrupted\\n}\\n\\n// useDeferredValue — you only have the value\\nfunction Results({ query }) {\\n  const deferredQuery = useDeferredValue(query);\\n  const isStale = query !== deferredQuery;\\n  return (\\n    \\u003cdiv style={{ opacity: isStale ? 0.5 : 1 }}>\\n      \\u003cSlowList query={deferredQuery} />\\n    \\u003c/div>\\n  );\\n}\\n```\\n\\nTyping stays instant: the urgent update (the input) renders first, the deferred render happens in the background and is thrown away if a newer value arrives.\\n\\n**Watch out.** Transitions don\'t make slow code faster, they make it interruptible. `SlowList` should still be memoized so the deferred value actually skips work. And a controlled input\'s own state must **not** be updated inside a transition — that makes typing lag."},{"id":"react-questions-ebook-zvgbz9","book":"React","part":"Part 5 — Performance","question":"How do you find out why a React app is slow?","prompt":"","answer":"**Short answer.** Measure before changing anything. Use the React DevTools Profiler to see which components render, how often, and why; use the browser Performance panel for long tasks and layout; check Core Web Vitals (especially INP) in the field.\\n\\n**Explanation.** A practical checklist:\\n\\n1. **Profiler** with \\"Record why each component rendered\\" — look for components re-rendering on every keystroke.\\n2. **Highlight updates** in DevTools — flashing areas that shouldn\'t change.\\n3. **Performance panel** — long tasks over 50 ms, forced reflows, big scripting blocks.\\n4. **Bundle analyzer** — oversized dependencies (moment.js, full lodash import, icon packs).\\n5. **Field data** — INP, LCP, CLS from real users.\\n\\nCommon fixes in rough order of payoff: move state down, split context, virtualize long lists, code-split heavy routes, memoize expensive children, use transitions for heavy updates.\\n\\n**Watch out.** Profiling a development build overstates costs (Strict Mode double rendering, dev-only checks). Confirm with a production build before optimizing."},{"id":"react-questions-ebook-go70x2","book":"React","part":"Part 6 — Concurrent React and React 19","question":"What is Suspense?","prompt":"","answer":"**Short answer.** `\\u003cSuspense>` shows a fallback while something inside it isn\'t ready yet — lazy code, or data read through a Suspense-enabled source. It lets you declare loading states by *position in the tree* instead of with `isLoading` flags in every component.\\n\\n**Explanation.**\\n\\n```jsx\\n\\u003cSuspense fallback={\\u003cPageSkeleton />}>\\n  \\u003cHeader />\\n  \\u003cSuspense fallback={\\u003cFeedSkeleton />}>\\n    \\u003cFeed />\\n  \\u003c/Suspense>\\n\\u003c/Suspense>\\n```\\n\\nNested boundaries let parts of the page reveal independently. During a transition, React keeps the old UI on screen instead of swapping back to a fallback.\\n\\nWhat can suspend: `React.lazy`, `use(promise)`, Suspense-enabled data libraries (TanStack Query\'s `useSuspenseQuery`, Relay), and async Server Components.\\n\\n**Watch out.** Suspense does not detect a `fetch` inside `useEffect`. Data only suspends if the source integrates with Suspense. Also pair Suspense with an error boundary — a rejected promise throws to the nearest one."},{"id":"react-questions-ebook-107yh5a","book":"React","part":"Part 6 — Concurrent React and React 19","question":"What is the `use` API?","prompt":"","answer":"**Short answer.** `use(resource)` reads the value of a promise or a context. With a promise, the component suspends until it resolves. Unlike hooks, it can be called conditionally.\\n\\n**Explanation.**\\n\\n```jsx\\n// Server Component starts the fetch, passes the promise down\\nexport default function Page() {\\n  const commentsPromise = getComments();\\n  return (\\n    \\u003cSuspense fallback={\\u003cp>Loading comments…\\u003c/p>}>\\n      \\u003cComments commentsPromise={commentsPromise} />\\n    \\u003c/Suspense>\\n  );\\n}\\n\\n// Client Component reads it\\n\'use client\';\\nfunction Comments({ commentsPromise }) {\\n  const comments = use(commentsPromise);\\n  return comments.map(c => \\u003cp key={c.id}>{c.text}\\u003c/p>);\\n}\\n```\\n\\n```jsx\\nfunction Heading({ show }) {\\n  if (!show) return null;\\n  const theme = use(ThemeContext);   // conditional context read — allowed\\n  return \\u003ch1 className={theme}>Hi\\u003c/h1>;\\n}\\n```\\n\\n**Watch out.** Don\'t create the promise inside the Client Component during render — every render creates a new promise and it suspends forever. Promises passed to `use` must be cached: created in a Server Component, a loader, or a data library."},{"id":"react-questions-ebook-1pjyt8n","book":"React","part":"Part 6 — Concurrent React and React 19","question":"What are Actions?","prompt":"","answer":"**Short answer.** In React 19, an Action is an async function used as a transition. React tracks its pending state, errors, and optimistic updates for you. You can pass an Action to `\\u003cform action>`, `startTransition`, `useActionState`, or `useOptimistic`.\\n\\n**Explanation.** Before:\\n\\n```jsx\\nconst [isPending, setIsPending] = useState(false);\\nconst [error, setError] = useState(null);\\n\\nasync function handleSubmit(e) {\\n  e.preventDefault();\\n  setIsPending(true);\\n  const err = await updateName(name);\\n  setIsPending(false);\\n  if (err) setError(err);\\n}\\n```\\n\\nAfter:\\n\\n```jsx\\nconst [isPending, startTransition] = useTransition();\\n\\nfunction handleSubmit() {\\n  startTransition(async () => {\\n    const err = await updateName(name);\\n    if (err) {\\n      startTransition(() => setError(err));\\n    }\\n  });\\n}\\n```\\n\\n`isPending` is true for the whole async function. Updates inside it are batched and committed when it finishes.\\n\\n**Watch out.** State updates after an `await` inside a transition need their own `startTransition` wrapper to be marked as transitions (shown above). This is a known limitation interviewers sometimes probe."},{"id":"react-questions-ebook-wcg1w4","book":"React","part":"Part 6 — Concurrent React and React 19","question":"`useActionState`, `useFormStatus`, and form actions","prompt":"","answer":"**Short answer.** `\\u003cform action={fn}>` calls `fn(formData)` on submit, resets uncontrolled fields on success, and treats it as an Action. `useActionState` wraps an action and gives you its last result and pending flag. `useFormStatus` lets a child of a form read whether the form is submitting.\\n\\n**Explanation.**\\n\\n```jsx\\nasync function signup(prevState, formData) {\\n  const email = formData.get(\'email\');\\n  if (!email.includes(\'@\')) return { error: \'Invalid email\' };\\n  await createAccount(email);\\n  return { error: null };\\n}\\n\\nfunction SignupForm() {\\n  const [state, formAction, isPending] = useActionState(signup, { error: null });\\n  return (\\n    \\u003cform action={formAction}>\\n      \\u003cinput name=\\"email\\" />\\n      \\u003cSubmitButton />\\n      {state.error && \\u003cp role=\\"alert\\">{state.error}\\u003c/p>}\\n    \\u003c/form>\\n  );\\n}\\n\\nfunction SubmitButton() {\\n  const { pending } = useFormStatus();   // reads the parent \\u003cform>\\n  return \\u003cbutton disabled={pending}>{pending ? \'Saving…\' : \'Sign up\'}\\u003c/button>;\\n}\\n```\\n\\nWith a framework that supports Server Functions, `signup` can be a `\'use server\'` function and the form works even before JavaScript loads (progressive enhancement).\\n\\n**Watch out.** `useFormStatus` only reads the status of a `\\u003cform>` that is a *parent* of the component calling it — not a form rendered in the same component."},{"id":"react-questions-ebook-1sh78l6","book":"React","part":"Part 6 — Concurrent React and React 19","question":"What is `useOptimistic`?","prompt":"","answer":"**Short answer.** It shows a temporary, optimistic value while an Action is in flight, and automatically reverts to the real state when the Action finishes or fails.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Thread({ messages, sendMessage }) {\\n  const [optimistic, addOptimistic] = useOptimistic(\\n    messages,\\n    (state, text) => [...state, { text, sending: true }]\\n  );\\n\\n  async function action(formData) {\\n    const text = formData.get(\'text\');\\n    addOptimistic(text);\\n    await sendMessage(text);   // parent updates `messages` on success\\n  }\\n\\n  return (\\n    \\u003c>\\n      {optimistic.map((m, i) => (\\n        \\u003cp key={i} style={{ opacity: m.sending ? 0.5 : 1 }}>{m.text}\\u003c/p>\\n      ))}\\n      \\u003cform action={action}>\\u003cinput name=\\"text\\" />\\u003c/form>\\n    \\u003c/>\\n  );\\n}\\n```\\n\\n**Watch out.** Optimistic UI must be honest about failure. If `sendMessage` throws, the optimistic item disappears — show an error so the user knows their message didn\'t send."},{"id":"react-questions-ebook-19ak4jv","book":"React","part":"Part 6 — Concurrent React and React 19","question":"What else changed in React 19?","prompt":"","answer":"**Short answer.** `ref` is a regular prop for function components (no more `forwardRef`), `\\u003cContext>` can be used as a provider, ref callbacks can return cleanup functions, document metadata (`\\u003ctitle>`, `\\u003cmeta>`, `\\u003clink>`) can be rendered anywhere and is hoisted to `\\u003chead>`, and hydration errors are reported as a single readable diff.\\n\\n**Explanation.**\\n\\n```jsx\\n// ref as a prop — forwardRef no longer needed\\nfunction TextInput({ ref, ...props }) {\\n  return \\u003cinput ref={ref} {...props} />;\\n}\\n\\n// ref callback cleanup\\n\\u003cdiv ref={node => {\\n  const observer = new ResizeObserver(onResize);\\n  observer.observe(node);\\n  return () => observer.disconnect();\\n}} />\\n\\n// metadata from any component\\nfunction BlogPost({ post }) {\\n  return (\\n    \\u003carticle>\\n      \\u003ctitle>{post.title}\\u003c/title>\\n      \\u003cmeta name=\\"description\\" content={post.summary} />\\n      \\u003ch1>{post.title}\\u003c/h1>\\n    \\u003c/article>\\n  );\\n}\\n```\\n\\nAlso: stylesheet and script deduplication with `precedence`, resource preloading APIs (`preload`, `preinit`), and full support for custom elements. React 19.2 added `\\u003cActivity>` to hide parts of the UI while preserving their state, and stabilized `useEffectEvent`.\\n\\n**Watch out.** Removed in 19: `propTypes` and `defaultProps` on function components (use default parameters), string refs, legacy context, `ReactDOM.render` (use `createRoot`), and `ReactDOM.hydrate` (use `hydrateRoot`)."},{"id":"react-questions-ebook-4c7v3z","book":"React","part":"Part 7 — Server Rendering and Server Components","question":"CSR vs SSR vs SSG vs ISR","prompt":"","answer":"**Short answer.** CSR renders in the browser after JavaScript loads. SSR renders HTML on the server per request. SSG renders HTML at build time. ISR is SSG that regenerates pages in the background after a time or on demand.\\n\\n**Explanation.**\\n\\n| | When HTML is made | First paint | Freshness | Server cost |\\n|---|---|---|---|---|\\n| CSR | In browser | Slow (after JS) | Always fresh | None |\\n| SSR | Each request | Fast | Always fresh | Per request |\\n| SSG | Build time | Fastest (CDN) | Stale until rebuild | None at runtime |\\n| ISR | Build + periodic regen | Fastest (CDN) | Bounded staleness | Occasional |\\n\\nPick by page: marketing and docs → SSG; product pages → ISR; dashboards behind login → CSR or SSR; personalized feeds → SSR with streaming.\\n\\n**Watch out.** SSR shows content sooner but the page isn\'t interactive until hydration finishes. A big JS bundle still means a slow time to interactive — SSR alone doesn\'t fix that."},{"id":"react-questions-ebook-105tmng","book":"React","part":"Part 7 — Server Rendering and Server Components","question":"What is hydration, and what causes a hydration mismatch?","prompt":"","answer":"**Short answer.** Hydration is React attaching event handlers and state to server-rendered HTML instead of re-creating it. A mismatch happens when the first client render produces different output than the server did.\\n\\n**Explanation.** Common causes:\\n\\n- `Date.now()`, `new Date().toLocaleString()`, `Math.random()` in render\\n- `typeof window !== \'undefined\'` branches that render differently\\n- Reading `localStorage` during render\\n- Invalid HTML nesting (`\\u003cdiv>` inside `\\u003cp>`, `\\u003ca>` inside `\\u003ca>`) that the browser \\"fixes\\"\\n- Browser extensions injecting attributes\\n\\nFix for client-only values: render the server-safe version first, then update after mount.\\n\\n```jsx\\nfunction LocalTime({ iso }) {\\n  const [text, setText] = useState(null);\\n  useEffect(() => setText(new Date(iso).toLocaleTimeString()), [iso]);\\n  return \\u003ctime dateTime={iso}>{text ?? iso}\\u003c/time>;\\n}\\n```\\n\\n**Watch out.** `suppressHydrationWarning` silences the warning on one element\'s text — it doesn\'t fix the mismatch, and it only goes one level deep. Use it sparingly, for things like timestamps."},{"id":"react-questions-ebook-40lzxy","book":"React","part":"Part 7 — Server Rendering and Server Components","question":"What are React Server Components?","prompt":"","answer":"**Short answer.** Server Components run only on the server (at request or build time). They can be `async`, read databases and files directly, and send their *rendered output* — not their code — to the client. Their dependencies never enter the JS bundle.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/products/page.jsx — Server Component (the default in RSC frameworks)\\nimport db from \'@/lib/db\';\\nimport AddToCart from \'./AddToCart\';\\n\\nexport default async function ProductsPage() {\\n  const products = await db.product.findMany();\\n  return products.map(p => (\\n    \\u003carticle key={p.id}>\\n      \\u003ch2>{p.name}\\u003c/h2>\\n      \\u003cAddToCart productId={p.id} />     {/* Client Component island */}\\n    \\u003c/article>\\n  ));\\n}\\n```\\n\\n| | Server Component | Client Component |\\n|---|---|---|\\n| Runs | Server only | Server (SSR) + client |\\n| `useState`, `useEffect`, event handlers | No | Yes |\\n| `async` / direct DB access | Yes | No |\\n| Code shipped to browser | No | Yes |\\n\\n**Watch out.** RSC is not the same as SSR. SSR turns any component into HTML for the first load; Client Components still hydrate and ship their code. Server Components produce a serialized tree that also works on client-side navigation, and their code never ships."},{"id":"react-questions-ebook-96obn1","book":"React","part":"Part 7 — Server Rendering and Server Components","question":"What do `\'use client\'` and `\'use server\'` mean?","prompt":"","answer":"**Short answer.** `\'use client\'` marks a module as the boundary where the tree crosses from server to client — that module and everything it imports become Client Components. `\'use server\'` marks functions as Server Functions that the client can call like an RPC.\\n\\n**Explanation.**\\n\\n```jsx\\n// AddToCart.jsx\\n\'use client\';\\nimport { addToCart } from \'./actions\';\\n\\nexport default function AddToCart({ productId }) {\\n  const [added, setAdded] = useState(false);\\n  return \\u003cbutton onClick={async () => { await addToCart(productId); setAdded(true); }}>Add\\u003c/button>;\\n}\\n\\n// actions.js\\n\'use server\';\\nexport async function addToCart(productId) {\\n  const session = await getSession();\\n  if (!session) throw new Error(\'Unauthorized\');\\n  await db.cart.add(session.userId, productId);\\n}\\n```\\n\\nRules worth knowing:\\n\\n- Props from Server to Client Components must be serializable — no functions (except Server Functions), no class instances.\\n- A Client Component can render a Server Component only if it receives it as `children` or another prop.\\n- `\'use client\'` is not needed in every client file — only at the entry of the client subtree.\\n\\n**Watch out.** A Server Function is a **public HTTP endpoint**. Anyone can call it with any arguments. Always authenticate, authorize, and validate input inside it — never trust that only your form calls it."},{"id":"react-questions-ebook-1trvw1c","book":"React","part":"Part 7 — Server Rendering and Server Components","question":"What is streaming SSR?","prompt":"","answer":"**Short answer.** Instead of waiting for the whole page to render, the server sends HTML in chunks as each Suspense boundary resolves. The shell shows immediately; slower sections stream in and hydrate independently.\\n\\n**Explanation.** With `renderToPipeableStream` (Node) or `renderToReadableStream` (web streams), React sends the shell plus fallbacks first, then later sends the content for each boundary with a small inline script that swaps it into place.\\n\\nBenefits: faster first byte and first paint, slow data doesn\'t block fast data, and **selective hydration** — React hydrates the part the user interacts with first.\\n\\n**Watch out.** Once the first byte is sent, the status code and headers are fixed. Errors in streamed sections can\'t turn into a 500 or a redirect — handle them with error boundaries, and do auth checks before the shell renders."},{"id":"react-questions-ebook-17jy12u","book":"React","part":"Part 8 — Component Patterns","question":"Composition vs inheritance","prompt":"","answer":"**Short answer.** React favors composition: build complex components by combining simpler ones and passing elements through `children` or other props. Inheritance between components is practically never used.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Dialog({ title, children, footer }) {\\n  return (\\n    \\u003cdiv role=\\"dialog\\" aria-labelledby=\\"dlg-title\\">\\n      \\u003ch2 id=\\"dlg-title\\">{title}\\u003c/h2>\\n      \\u003cdiv>{children}\\u003c/div>\\n      \\u003cfooter>{footer}\\u003c/footer>\\n    \\u003c/div>\\n  );\\n}\\n\\n\\u003cDialog title=\\"Delete file?\\" footer={\\u003c>\\u003cButton>Cancel\\u003c/Button>\\u003cButton danger>Delete\\u003c/Button>\\u003c/>}>\\n  This cannot be undone.\\n\\u003c/Dialog>\\n```\\n\\n\\"Specialization\\" is done by wrapping, not extending: `function DeleteDialog(props) { return \\u003cDialog title=\\"Delete?\\" {...props} /> }`.\\n\\n**Watch out.** A component with ten boolean props (`isCompact`, `hasIcon`, `showFooter`, …) is a sign composition was skipped. Prefer slots (`icon={\\u003cIcon />}`) or compound components."},{"id":"react-questions-ebook-1tp3utn","book":"React","part":"Part 8 — Component Patterns","question":"What are compound components?","prompt":"","answer":"**Short answer.** A set of components that work together and share implicit state through context — like `\\u003cselect>` and `\\u003coption>`. The parent owns state; children read it. Users control layout and order.\\n\\n**Explanation.**\\n\\n```jsx\\nconst TabsContext = createContext(null);\\n\\nfunction Tabs({ defaultValue, children }) {\\n  const [value, setValue] = useState(defaultValue);\\n  return \\u003cTabsContext value={{ value, setValue }}>{children}\\u003c/TabsContext>;\\n}\\n\\nfunction Tab({ value, children }) {\\n  const ctx = useContext(TabsContext);\\n  return (\\n    \\u003cbutton role=\\"tab\\" aria-selected={ctx.value === value} onClick={() => ctx.setValue(value)}>\\n      {children}\\n    \\u003c/button>\\n  );\\n}\\n\\nfunction Panel({ value, children }) {\\n  const ctx = useContext(TabsContext);\\n  return ctx.value === value ? \\u003cdiv role=\\"tabpanel\\">{children}\\u003c/div> : null;\\n}\\n\\nTabs.Tab = Tab;\\nTabs.Panel = Panel;\\n\\n\\u003cTabs defaultValue=\\"a\\">\\n  \\u003cTabs.Tab value=\\"a\\">Account\\u003c/Tabs.Tab>\\n  \\u003cTabs.Tab value=\\"b\\">Billing\\u003c/Tabs.Tab>\\n  \\u003cTabs.Panel value=\\"a\\">…\\u003c/Tabs.Panel>\\n  \\u003cTabs.Panel value=\\"b\\">…\\u003c/Tabs.Panel>\\n\\u003c/Tabs>\\n```\\n\\nHeadless libraries (Radix, React Aria, Headless UI, Base UI) use this pattern.\\n\\n**Watch out.** Throw a helpful error when a child is used outside its parent (`if (!ctx) throw new Error(\'Tab must be inside Tabs\')`), otherwise users get a cryptic \\"cannot read properties of null\\"."},{"id":"react-questions-ebook-1fam6qp","book":"React","part":"Part 8 — Component Patterns","question":"What is an error boundary?","prompt":"","answer":"**Short answer.** A component that catches JavaScript errors thrown while rendering its children, logs them, and shows fallback UI instead of unmounting the whole app. It must be a class component (or use a library like `react-error-boundary`).\\n\\n**Explanation.**\\n\\n```jsx\\nclass ErrorBoundary extends React.Component {\\n  state = { error: null };\\n\\n  static getDerivedStateFromError(error) {\\n    return { error };\\n  }\\n\\n  componentDidCatch(error, info) {\\n    reportError(error, info.componentStack);\\n  }\\n\\n  render() {\\n    if (this.state.error) return this.props.fallback;\\n    return this.props.children;\\n  }\\n}\\n\\n\\u003cErrorBoundary fallback={\\u003cp>Something went wrong.\\u003c/p>}>\\n  \\u003cWidget />\\n\\u003c/ErrorBoundary>\\n```\\n\\nError boundaries do **not** catch errors in: event handlers, async code (`setTimeout`, promise callbacks outside render), server rendering, or the boundary itself.\\n\\n**Watch out.** Place boundaries at meaningful granularity — around routes and independent widgets — so one broken chart doesn\'t blank the dashboard. React 19 adds `onCaughtError` and `onUncaughtError` options on `createRoot` for central reporting."},{"id":"react-questions-ebook-11q1wxm","book":"React","part":"Part 8 — Component Patterns","question":"HOCs vs render props vs hooks","prompt":"","answer":"**Short answer.** All three share logic between components. Hooks replaced HOCs and render props for most use cases because they don\'t add wrapper components, don\'t collide on prop names, and make data flow explicit.\\n\\n**Explanation.**\\n\\n```jsx\\n// HOC — wraps a component, injects props\\nconst withUser = Comp => props => \\u003cComp {...props} user={useUser()} />;\\n\\n// Render prop — a function child decides what to render\\n\\u003cMouseTracker>{({ x, y }) => \\u003cCursor x={x} y={y} />}\\u003c/MouseTracker>\\n\\n// Hook — just call it\\nfunction Cursor() {\\n  const { x, y } = useMousePosition();\\n  return \\u003cdiv style={{ left: x, top: y }} />;\\n}\\n```\\n\\n| Problem | HOC | Render prop | Hook |\\n|---|---|---|---|\\n| Wrapper hell in DevTools | Yes | Yes | No |\\n| Prop name collisions | Yes | No | No |\\n| Obvious data source | No | Yes | Yes |\\n\\n**Watch out.** HOCs are still reasonable for cross-cutting wrapping that isn\'t about data — e.g. adding an error boundary or auth gate around a route component. Render props survive in libraries that control *what* renders (virtualized lists, form libraries)."},{"id":"react-questions-ebook-piiaw7","book":"React","part":"Part 8 — Component Patterns","question":"What are portals?","prompt":"","answer":"**Short answer.** `createPortal(children, domNode)` renders children into a different DOM node — typically `document.body` — while keeping them in the same place in the React tree. Used for modals, tooltips, and toasts that must escape `overflow: hidden` or `z-index` stacking.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Modal({ children, onClose }) {\\n  return createPortal(\\n    \\u003cdiv className=\\"backdrop\\" onClick={onClose}>\\n      \\u003cdiv role=\\"dialog\\" aria-modal=\\"true\\" onClick={e => e.stopPropagation()}>\\n        {children}\\n      \\u003c/div>\\n    \\u003c/div>,\\n    document.body\\n  );\\n}\\n```\\n\\nContext, state, and **event bubbling** follow the React tree, not the DOM tree. A click inside the portal bubbles to React ancestors of `\\u003cModal>` even though the DOM node is elsewhere.\\n\\n**Watch out.** Portals don\'t make a modal accessible. You still need focus trapping, `Escape` to close, returning focus to the trigger, and `inert` on the background. The native `\\u003cdialog>` element with `showModal()` now handles most of that for you."},{"id":"react-questions-ebook-1bcvzps","book":"React","part":"Part 9 — Forms and Data Fetching","question":"What\'s wrong with fetching data in `useEffect`, and how do you do it correctly?","prompt":"","answer":"**Short answer.** The naive version has a race condition — a slow earlier response can overwrite a newer one — and it re-implements caching, deduplication, and retries badly. If you must use an effect, add cleanup that ignores or aborts stale requests.\\n\\n**Explanation.**\\n\\n```jsx\\n// Bug: type \\"re\\" then \\"react\\" — if \\"re\\" resolves last, it wins\\nuseEffect(() => {\\n  fetch(`/api/search?q=${query}`).then(r => r.json()).then(setResults);\\n}, [query]);\\n\\n// Fix: abort stale requests\\nuseEffect(() => {\\n  const controller = new AbortController();\\n  fetch(`/api/search?q=${encodeURIComponent(query)}`, { signal: controller.signal })\\n    .then(r => r.json())\\n    .then(setResults)\\n    .catch(err => { if (err.name !== \'AbortError\') setError(err); });\\n  return () => controller.abort();\\n}, [query]);\\n```\\n\\nOther effect-fetching problems: network waterfalls (parent fetches, renders child, child fetches), no caching across navigation, nothing rendered on the server.\\n\\nPreferred options, in order: framework data loading (Server Components, route loaders), a server-state library (TanStack Query, SWR), then a carefully written effect.\\n\\n**Watch out.** Interviewers love the race-condition question. Be ready to write the abort version from memory."},{"id":"react-questions-ebook-1p8rwji","book":"React","part":"Part 9 — Forms and Data Fetching","question":"How do you build a form with validation?","prompt":"","answer":"**Short answer.** For simple forms, React 19 form Actions with `useActionState` plus HTML validation attributes. For complex forms — many fields, dynamic arrays, cross-field rules — a form library (React Hook Form, TanStack Form) with a schema validator (Zod, Valibot). Always validate again on the server.\\n\\n**Explanation.**\\n\\n```jsx\\nconst schema = z.object({\\n  email: z.string().email(),\\n  password: z.string().min(8),\\n});\\n\\nfunction LoginForm() {\\n  const { register, handleSubmit, formState: { errors, isSubmitting } } =\\n    useForm({ resolver: zodResolver(schema) });\\n\\n  return (\\n    \\u003cform onSubmit={handleSubmit(login)} noValidate>\\n      \\u003cinput type=\\"email\\" {...register(\'email\')} aria-invalid={!!errors.email} />\\n      {errors.email && \\u003cp role=\\"alert\\">{errors.email.message}\\u003c/p>}\\n      \\u003cinput type=\\"password\\" {...register(\'password\')} />\\n      \\u003cbutton disabled={isSubmitting}>Log in\\u003c/button>\\n    \\u003c/form>\\n  );\\n}\\n```\\n\\nReact Hook Form uses uncontrolled inputs under the hood, so typing doesn\'t re-render the whole form.\\n\\n**Watch out.** Client validation is a UX feature, not a security feature. The same schema should run on the server, and server errors (e.g. \\"email already taken\\") must be shown on the right field."},{"id":"react-questions-ebook-th44he","book":"React","part":"Part 9 — Forms and Data Fetching","question":"How do you debounce a search input in React?","prompt":"","answer":"**Short answer.** Keep the input\'s value as immediate state, and derive a debounced copy that drives the expensive work. Either a small `useDebouncedValue` hook, or `useDeferredValue` if the cost is rendering rather than network.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction useDebouncedValue(value, delay = 300) {\\n  const [debounced, setDebounced] = useState(value);\\n  useEffect(() => {\\n    const id = setTimeout(() => setDebounced(value), delay);\\n    return () => clearTimeout(id);\\n  }, [value, delay]);\\n  return debounced;\\n}\\n\\nfunction Search() {\\n  const [q, setQ] = useState(\'\');\\n  const debouncedQ = useDebouncedValue(q);\\n  const { data } = useQuery({\\n    queryKey: [\'search\', debouncedQ],\\n    queryFn: () => search(debouncedQ),\\n    enabled: debouncedQ.length > 1,\\n  });\\n  return \\u003cinput value={q} onChange={e => setQ(e.target.value)} />;\\n}\\n```\\n\\n**Watch out.** Writing `const debounced = debounce(fn, 300)` in the component body creates a new debouncer each render, so it never actually debounces. If you use a debounce utility, keep it stable with `useMemo` or `useRef`."},{"id":"react-questions-ebook-alogb1","book":"React","part":"Part 10 — Testing","question":"How do you test React components?","prompt":"","answer":"**Short answer.** With React Testing Library and a test runner (Vitest or Jest): render the component, interact with it the way a user would, and assert on what the user sees. Don\'t test implementation details like state values or which hooks were called.\\n\\n**Explanation.**\\n\\n```jsx\\nimport { render, screen } from \'@testing-library/react\';\\nimport userEvent from \'@testing-library/user-event\';\\n\\ntest(\'adds a todo\', async () => {\\n  const user = userEvent.setup();\\n  render(\\u003cTodoApp />);\\n\\n  await user.type(screen.getByRole(\'textbox\', { name: /new todo/i }), \'Buy milk\');\\n  await user.click(screen.getByRole(\'button\', { name: /add/i }));\\n\\n  expect(screen.getByRole(\'listitem\')).toHaveTextContent(\'Buy milk\');\\n});\\n```\\n\\nQuery priority: `getByRole` → `getByLabelText` → `getByText` → `getByTestId` as a last resort. Role-based queries double as an accessibility check.\\n\\nA balanced test strategy: many component/integration tests, some unit tests for pure logic (reducers, utilities), a few end-to-end tests (Playwright) for critical user flows.\\n\\n**Watch out.** Prefer `userEvent` over `fireEvent` — it simulates the full sequence (focus, keydown, input, keyup) a real user produces. And `getBy*` throws if nothing matches; use `queryBy*` to assert something is *absent*."},{"id":"react-questions-ebook-10fb1ni","book":"React","part":"Part 10 — Testing","question":"How do you test async behavior and API calls?","prompt":"","answer":"**Short answer.** Mock the network, not your modules — Mock Service Worker (MSW) intercepts requests at the network layer. Use `findBy*` queries, which wait for elements to appear.\\n\\n**Explanation.**\\n\\n```jsx\\nimport { http, HttpResponse } from \'msw\';\\nimport { setupServer } from \'msw/node\';\\n\\nconst server = setupServer(\\n  http.get(\'/api/user\', () => HttpResponse.json({ name: \'Ana\' }))\\n);\\nbeforeAll(() => server.listen());\\nafterEach(() => server.resetHandlers());\\nafterAll(() => server.close());\\n\\ntest(\'shows the user name\', async () => {\\n  render(\\u003cProfile />);\\n  expect(await screen.findByText(\'Ana\')).toBeInTheDocument();\\n});\\n\\ntest(\'shows an error\', async () => {\\n  server.use(http.get(\'/api/user\', () => new HttpResponse(null, { status: 500 })));\\n  render(\\u003cProfile />);\\n  expect(await screen.findByRole(\'alert\')).toHaveTextContent(/failed/i);\\n});\\n```\\n\\n**Watch out.** \\"not wrapped in act(...)\\" warnings usually mean a state update happened after the test finished asserting. The fix is to await the final UI state (`findBy*`, `waitFor`), not to sprinkle `act` everywhere."},{"id":"react-questions-ebook-12yu2of","book":"React","part":"Part 10 — Testing","question":"How do you test a custom hook?","prompt":"","answer":"**Short answer.** Through a component that uses it, if possible. For reusable hooks, use `renderHook` from React Testing Library.\\n\\n**Explanation.**\\n\\n```jsx\\nimport { renderHook, act } from \'@testing-library/react\';\\n\\ntest(\'counter increments\', () => {\\n  const { result } = renderHook(() => useCounter(5));\\n  act(() => result.current.increment());\\n  expect(result.current.count).toBe(6);\\n});\\n\\ntest(\'debounced value updates after the delay\', () => {\\n  vi.useFakeTimers();\\n  const { result, rerender } = renderHook(({ value }) => useDebouncedValue(value, 300), {\\n    initialProps: { value: \'a\' },\\n  });\\n  rerender({ value: \'b\' });\\n  expect(result.current).toBe(\'a\');\\n  act(() => vi.advanceTimersByTime(300));\\n  expect(result.current).toBe(\'b\');\\n  vi.useRealTimers();\\n});\\n```\\n\\nHooks that need context are tested by passing a `wrapper` option that renders the providers.\\n\\n**Watch out.** If a hook is only used by one component, testing it in isolation couples tests to an internal detail. Test the component instead."},{"id":"react-questions-ebook-ufasiy","book":"React","part":"Part 11 — Security and Accessibility","question":"How does React protect against XSS, and where are the gaps?","prompt":"","answer":"**Short answer.** React escapes every string rendered as text or attribute, so `\\u003cdiv>{userInput}\\u003c/div>` is safe. The gaps are anything that bypasses escaping: `dangerouslySetInnerHTML`, `javascript:` URLs in `href`, spreading untrusted objects as props, and server data injected into inline scripts.\\n\\n**Explanation.**\\n\\n```jsx\\n// Safe — escaped\\n\\u003cp>{comment.text}\\u003c/p>\\n\\n// Dangerous — raw HTML\\n\\u003cdiv dangerouslySetInnerHTML={{ __html: comment.html }} />\\n// Fix: sanitize first\\n\\u003cdiv dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(comment.html) }} />\\n\\n// Dangerous — javascript: URL\\n\\u003ca href={user.website}>Website\\u003c/a>   // \\"javascript:alert(1)\\"\\n// Fix: allow only http(s)\\nconst safe = /^https?:\\\\/\\\\//i.test(user.website) ? user.website : \'#\';\\n\\n// Dangerous — attacker controls props\\n\\u003cdiv {...JSON.parse(untrusted)} />   // could inject dangerouslySetInnerHTML\\n```\\n\\nDefense in depth: a Content Security Policy, auth tokens in `HttpOnly` cookies rather than `localStorage`, and authorization checks on the server (especially in Server Functions — Q44).\\n\\n**Watch out.** React warns about `javascript:` URLs in development, but don\'t rely on it. Validate URL schemes yourself."},{"id":"react-questions-ebook-smvk7h","book":"React","part":"Part 11 — Security and Accessibility","question":"How do you make a React app accessible?","prompt":"","answer":"**Short answer.** Use semantic HTML first, label every control, manage focus on route changes and in dialogs, make everything keyboard-operable, and test with a screen reader and an automated checker. React doesn\'t add accessibility — it just doesn\'t get in the way.\\n\\n**Explanation.** The checklist interviewers look for:\\n\\n- `\\u003cbutton>` for actions, `\\u003ca href>` for navigation — never a clickable `\\u003cdiv>`.\\n- Every input has a `\\u003clabel htmlFor>` (or `aria-label` when there\'s no visible label). `useId` for IDs.\\n- Images have meaningful `alt`, or `alt=\\"\\"` if decorative.\\n- Error messages use `role=\\"alert\\"` or `aria-live` so screen readers announce them.\\n- On client-side route change, move focus to the main heading and update `document.title`.\\n- Modals trap focus, close on `Escape`, and return focus to the trigger.\\n- Color contrast meets WCAG AA (4.5:1 for body text).\\n- `eslint-plugin-jsx-a11y` in CI, axe in tests, plus manual keyboard and screen-reader passes.\\n\\n```jsx\\n// Bad\\n\\u003cdiv onClick={save}>Save\\u003c/div>\\n\\n// Good — focusable, keyboard-operable, announced as a button\\n\\u003cbutton type=\\"button\\" onClick={save}>Save\\u003c/button>\\n```\\n\\n**Watch out.** ARIA can make things worse. \\"No ARIA is better than bad ARIA\\" — a `role=\\"button\\"` on a `\\u003cdiv>` still needs `tabIndex`, Enter and Space handling, and focus styles. The native element gives you all of that for free."},{"id":"react-questions-ebook-j9lq3f","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What does this log after one click?","prompt":"```jsx\\nfunction Counter() {\\n  const [count, setCount] = useState(0);\\n  function handleClick() {\\n    setCount(count + 1);\\n    setCount(count + 1);\\n    console.log(count);\\n  }\\n  return \\u003cbutton onClick={handleClick}>{count}\\u003c/button>;\\n}\\n```","answer":"Logs `0`, and the button then shows `1`. `count` is a snapshot of the current render (0), so both calls set it to `0 + 1`. The log reads the same snapshot. Use `setCount(c => c + 1)` twice to get 2."},{"id":"react-questions-ebook-l7vdk","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What does this render?","prompt":"```jsx\\nfunction Cart({ items }) {\\n  return \\u003cdiv>{items.length && \\u003cp>{items.length} items\\u003c/p>}\\u003c/div>;\\n}\\n\\u003cCart items={[]} />\\n```","answer":"It renders `0`. `0 && …` evaluates to `0`, and React renders numbers. Use `items.length > 0 && …` or a ternary. (`false`, `null`, and `undefined` render nothing; `0` and `NaN` do render.)"},{"id":"react-questions-ebook-1tvut03","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Why does this effect run in an infinite loop?","prompt":"```jsx\\nfunction Users({ filter }) {\\n  const [users, setUsers] = useState([]);\\n  const options = { filter, limit: 20 };\\n\\n  useEffect(() => {\\n    fetchUsers(options).then(setUsers);\\n  }, [options]);\\n}\\n```","answer":"`options` is a new object on every render, so the dependency always \\"changes\\". Each fetch sets state, which re-renders, which creates a new `options`, which re-runs the effect. Fix: move the object inside the effect and depend on `[filter]`."},{"id":"react-questions-ebook-cunzyh","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Spot the bug.","prompt":"```jsx\\nfunction Timer() {\\n  const [seconds, setSeconds] = useState(0);\\n  useEffect(() => {\\n    setInterval(() => setSeconds(seconds + 1), 1000);\\n  }, []);\\n  return \\u003cp>{seconds}\\u003c/p>;\\n}\\n```","answer":"Two bugs. First, a stale closure: `seconds` is always `0` inside the interval, so the display stops at `1`. Use `setSeconds(s => s + 1)`. Second, no cleanup: the interval keeps running after unmount, and Strict Mode creates two of them. Store the id and return `() => clearInterval(id)`."},{"id":"react-questions-ebook-148iw9l","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What\'s wrong with this state update?","prompt":"```jsx\\nfunction addTag(tag) {\\n  post.tags.push(tag);\\n  setPost(post);\\n}\\n```","answer":"It mutates state and passes the same reference back. `Object.is(post, post)` is true, so React bails out and nothing re-renders. Create new objects: `setPost(p => ({ ...p, tags: [...p.tags, tag] }))`."},{"id":"react-questions-ebook-1izzl1v","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Why does this input lose focus on every keystroke?","prompt":"```jsx\\nfunction Form() {\\n  const [name, setName] = useState(\'\');\\n  const Field = () => \\u003cinput value={name} onChange={e => setName(e.target.value)} />;\\n  return \\u003cField />;\\n}\\n```","answer":"`Field` is defined inside `Form`, so each render creates a new component type. React sees a different type at that position, unmounts the old input, and mounts a new one — losing focus. Define `Field` outside `Form` and pass props, or inline the `\\u003cinput>`."},{"id":"react-questions-ebook-16eekx9","book":"React","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Why is this a security problem?","prompt":"```jsx\\n\'use server\';\\nexport async function deletePost(postId) {\\n  await db.post.delete({ where: { id: postId } });\\n}\\n```","answer":"A Server Function is a public endpoint. Anyone can call it with any `postId` — no authentication and no ownership check. Verify the session and scope the delete: `where: { id: postId, a
