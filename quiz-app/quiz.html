a |\\n| ISR (Incremental Static Regeneration) | At build, then re-built in background after N seconds | Product listings, CMS content | `export const revalidate = 60` or `fetch(url, { next: { revalidate: 60 } })` |\\n| SSR (Dynamic) | On every request | Personalized pages, dashboards, auth data | Reading `cookies()`/`headers()`, or `cache: \'no-store\'` |\\n| CSR (Client) | In the browser after JS loads | Highly interactive widgets behind login | `\'use client\'` + TanStack Query |\\n\\n**Strong answer:** \\"I pick per page — static where possible for speed and cost, ISR for content that changes occasionally, dynamic only when the data is per-user.\\" Note: caching defaults changed across Next.js 14 → 15 (fetch is no longer cached by default in 15), so always check the version the team uses."},{"id":"frontend-interview-bl-4mng9s","book":"Frontend Interview","part":"3. Next.js","question":"App Router vs Pages Router?","prompt":"","answer":"Pages Router (`pages/`) uses `getServerSideProps`/`getStaticProps`. App Router (`app/`, Next 13.4+) is built on React Server Components with nested layouts, `loading.tsx`, `error.tsx`, streaming, and fetch-in-component data loading. New projects use App Router; many existing codebases still have Pages Router, so knowing both is valuable."},{"id":"frontend-interview-bl-wys4yt","book":"Frontend Interview","part":"3. Next.js","question":"Server Components vs Client Components?","prompt":"","answer":"**Say this:** In the App Router, components are Server Components by default. They run only on the server, can fetch data directly or query a database, and send zero JavaScript to the browser. Client Components (marked `\'use client\'`) are needed for state, effects, event handlers and browser APIs.\\n\\n**Best practice:** keep `\'use client\'` as low in the tree as possible — make the page a Server Component and only the interactive pieces (a like button, a filter dropdown) client components. You can pass Server Components as `children` into Client Components.\\n\\n```tsx\\n// app/products/page.tsx — Server Component\\nexport default async function ProductsPage() {\\n  const products = await getProducts(); // runs on server\\n  return \\u003cProductGrid products={products} />;\\n}\\n```\\n\\n**Common mistake:** importing server-only code (DB clients, secrets) into a client file. Use the `server-only` package to make that a build error."},{"id":"frontend-interview-bl-i7adh2","book":"Frontend Interview","part":"3. Next.js","question":"What are Server Actions?","prompt":"","answer":"Async functions marked `\'use server\'` that run on the server and can be called directly from forms or client components — no separate API route needed for mutations. Always validate input (Zod) and check authorization inside them, because they are public HTTP endpoints under the hood."},{"id":"frontend-interview-bl-11fqbp0","book":"Frontend Interview","part":"3. Next.js","question":"Explain special files in the App Router.","prompt":"","answer":"`layout.tsx` (shared UI that persists across navigation), `page.tsx` (the route), `loading.tsx` (Suspense fallback while streaming), `error.tsx` (error boundary), `not-found.tsx`, `route.ts` (API endpoint), and `middleware.ts` at the root (runs before requests — auth redirects, i18n, A/B tests)."},{"id":"frontend-interview-bl-fn9at8","book":"Frontend Interview","part":"3. Next.js","question":"How do you handle SEO in Next.js?","prompt":"","answer":"- `export const metadata` or `generateMetadata()` for title, description, Open Graph and Twitter cards per page.\\n- `app/sitemap.ts` and `app/robots.ts` to generate sitemap and robots files.\\n- Server rendering so crawlers get full HTML.\\n- Semantic HTML, one `h1` per page, descriptive `alt` text.\\n- JSON-LD structured data for products, articles, FAQs.\\n- Canonical URLs to avoid duplicate content.\\n\\n```tsx\\nexport async function generateMetadata({ params }): Promise\\u003cMetadata> {\\n  const product = await getProduct(params.slug);\\n  return {\\n    title: `${product.name} | Store`,\\n    description: product.summary,\\n    openGraph: { images: [product.image] },\\n  };\\n}\\n```"},{"id":"frontend-interview-bl-ln5vhr","book":"Frontend Interview","part":"3. Next.js","question":"What does `next/image` do?","prompt":"","answer":"It automatically resizes, serves modern formats (WebP/AVIF), lazy-loads below-the-fold images, and requires width/height (or `fill`) to prevent layout shift (CLS). Use `priority` on the hero/LCP image so it loads immediately."},{"id":"frontend-interview-bl-oh7e9v","book":"Frontend Interview","part":"3. Next.js","question":"What does `next/font` do?","prompt":"","answer":"It self-hosts Google or local fonts at build time, removes external network requests, and avoids layout shift from font swapping."},{"id":"frontend-interview-bl-13ug488","book":"Frontend Interview","part":"3. Next.js","question":"How do you handle environment variables?","prompt":"","answer":"Variables are server-only by default. Only those prefixed `NEXT_PUBLIC_` are bundled into browser code. Never put secrets in `NEXT_PUBLIC_` variables — anyone can read them in the JS bundle."},{"id":"frontend-interview-bl-75o474","book":"Frontend Interview","part":"3. Next.js","question":"How do you protect routes / handle auth?","prompt":"","answer":"Check the session in `middleware.ts` for fast redirects, and **also** re-check authorization on the server where data is read (Server Components, Server Actions, route handlers). Middleware alone is not enough. Libraries commonly used: Auth.js (NextAuth), Clerk, or a custom JWT/cookie flow with httpOnly cookies."},{"id":"frontend-interview-bl-mbc4kl","book":"Frontend Interview","part":"3. Next.js","question":"Dynamic routes and route groups?","prompt":"","answer":"`app/blog/[slug]/page.tsx` for dynamic segments, `[...slug]` for catch-all, `generateStaticParams()` to pre-build dynamic pages at build time, and `(group)` folders to organize routes or share a layout without affecting the URL."},{"id":"frontend-interview-bl-13u0fhn","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"What is semantic HTML and why does it matter?","prompt":"","answer":"Using elements that describe meaning — `header`, `nav`, `main`, `article`, `section`, `button`, `footer` — instead of `div` everywhere. It improves accessibility (screen readers navigate by landmarks), SEO (crawlers understand structure), and keyboard behavior (a real `button` is focusable and responds to Enter/Space; a `div` with `onClick` is not)."},{"id":"frontend-interview-bl-1twd12u","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"What accessibility (a11y) practices do you follow?","prompt":"","answer":"Semantic elements, `alt` on images (empty `alt=\\"\\"` for decorative), labels tied to inputs, visible focus states (`focus-visible:`), color contrast at least 4.5:1 for body text (WCAG AA), keyboard navigation and focus trapping in modals, and ARIA only when no native element works. Test with Lighthouse, axe DevTools and by tabbing through the page."},{"id":"frontend-interview-bl-16vf9gl","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"Explain the CSS box model and `box-sizing`.","prompt":"","answer":"Every element is content + padding + border + margin. With `box-sizing: border-box`, width includes padding and border, which makes layout math predictable. Tailwind\'s Preflight sets this globally."},{"id":"frontend-interview-bl-1un40kx","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"Flexbox vs Grid — when do you use each?","prompt":"","answer":"**Flexbox** is one-dimensional (a row *or* a column): navbars, button groups, centering, aligning items in a card. **Grid** is two-dimensional (rows *and* columns): page layouts, card galleries, dashboards. Rule of thumb: content-driven sizing → flex; layout-driven structure → grid.\\n\\n```html\\n\\u003c!-- Responsive card grid: 1 col mobile, 2 tablet, 4 desktop -->\\n\\u003cdiv class=\\"grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4\\">...\\u003c/div>\\n```"},{"id":"frontend-interview-bl-1ydv5zl","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"CSS specificity and positioning?","prompt":"","answer":"Specificity order: inline styles > IDs > classes/attributes/pseudo-classes > elements. `!important` overrides everything — avoid it. Position: `relative` (offset from itself, creates a positioning context), `absolute` (relative to nearest positioned ancestor), `fixed` (to viewport), `sticky` (scrolls until a threshold, then sticks — great for headers and table headers)."},{"id":"frontend-interview-bl-z8tj1q","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"How do you approach responsive design?","prompt":"","answer":"**Mobile-first:** write base styles for small screens, then add `sm:`, `md:`, `lg:`, `xl:` overrides for larger screens (Tailwind breakpoints are min-width: 640, 768, 1024, 1280, 1536 px). Use relative units (`rem`, `%`, `fr`), fluid typography with `clamp()`, `max-w-*` containers, responsive images (`srcset` or `next/image` `sizes`), and test on real devices plus DevTools device mode. Mention **container queries** (`@container`, Tailwind `@container`/`@md:`) for components that adapt to their parent\'s width, not the screen."},{"id":"frontend-interview-bl-sdeilv","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"Why Tailwind? What are its downsides?","prompt":"","answer":"**Pros:** fast development, no naming fatigue, consistent spacing/color scale from a design system, tiny production CSS (only used classes are generated), styles live with the markup, easy responsive and state variants.\\n\\n**Cons and how you handle them:** long class strings (extract components, use `cva` for variants), learning curve, and conflicting classes when overriding (solve with `tailwind-merge`). Avoid building class names dynamically like `text-${color}-500` — Tailwind can\'t detect them at build time; use a full-class lookup map instead."},{"id":"frontend-interview-bl-7asfb3","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"How do you customize Tailwind to match a design system?","prompt":"","answer":"Put the Figma tokens (colors, fonts, spacing, radii, shadows) into the theme. In **Tailwind v4** (released 2025) this is done in CSS with `@theme { --color-brand-500: #2563eb; }`; in v3 it\'s `tailwind.config.js` under `theme.extend`. Use CSS variables for theming so dark mode is just a variable swap."},{"id":"frontend-interview-bl-12tmik2","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"How do you implement dark mode?","prompt":"","answer":"Tailwind\'s `dark:` variant, driven either by `prefers-color-scheme` or a `class`/`data-theme` on `html` toggled by the user and saved. In Next.js, `next-themes` prevents the flash of wrong theme on load."},{"id":"frontend-interview-bl-1ylmme4","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"Walk me through converting a Figma design into a pixel-perfect, responsive UI.","prompt":"","answer":"1. **Study the whole design first** — all screens, breakpoints (mobile/tablet/desktop frames), hover/focus/disabled/empty/loading/error states. Ask the designer about anything missing *before* coding.\\n2. **Extract design tokens** — colors, typography scale, spacing, radius, shadows — from Figma styles/variables (Dev Mode shows them), and map them into the Tailwind theme.\\n3. **Break the page into components** — identify repeated pieces (buttons, inputs, cards, navbar) and build them first as reusable components, ideally matching Figma component names and variants.\\n4. **Build layout with Flex/Grid** using Figma\'s Auto Layout as a hint (Auto Layout ≈ flexbox: direction, gap, padding).\\n5. **Make it responsive** — mobile-first, define behavior between the designed breakpoints, not just at them.\\n6. **Export assets correctly** — SVG for icons/logos, WebP/AVIF for photos, use `next/image`.\\n7. **Verify pixel accuracy** — compare side by side or with an overlay tool (e.g. PerfectPixel extension), check spacing in DevTools, and test real content lengths (long names, translations).\\n8. **Review with the designer** — share a preview deployment (Vercel preview URL) for feedback.\\n\\n**Bonus to mention:** AI tools and Figma\'s Dev Mode / MCP integrations can generate a first draft of a component from a frame, but you always refactor the output to use your design tokens and existing components rather than hard-coded pixel values."},{"id":"frontend-interview-bl-axva37","book":"Frontend Interview","part":"4. HTML, CSS, Tailwind & Figma","question":"What do you do when a design isn\'t feasible or breaks on some screens?","prompt":"","answer":"Don\'t silently change it. Flag it to the designer with a screenshot and a proposed alternative (\\"the 4-column table won\'t fit at 375px — can we switch to stacked cards on mobile?\\"). This shows collaboration, which the JD explicitly asks for."},{"id":"frontend-interview-bl-y302ws","book":"Frontend Interview","part":"5. REST APIs & State","question":"What is REST? Explain HTTP methods and status codes.","prompt":"","answer":"REST is an API style where URLs represent resources (`/users/42`) and HTTP methods represent actions: `GET` read, `POST` create, `PUT` replace, `PATCH` partial update, `DELETE` remove. `GET`, `PUT` and `DELETE` should be idempotent (same result if repeated).\\n\\nStatus codes to know: `200` OK, `201` Created, `204` No Content, `400` Bad Request (validation), `401` Unauthorized (not logged in), `403` Forbidden (logged in, no permission), `404` Not Found, `409` Conflict, `422` Unprocessable, `429` Too Many Requests, `500` Server Error."},{"id":"frontend-interview-bl-1rpjtf7","book":"Frontend Interview","part":"5. REST APIs & State","question":"How do you structure API calls in a frontend app?","prompt":"","answer":"Centralize them in an API layer instead of calling `fetch` inside components:\\n\\n```typescript\\n// lib/api.ts\\nconst BASE = process.env.NEXT_PUBLIC_API_URL;\\n\\nexport async function api\\u003cT>(path: string, init?: RequestInit): Promise\\u003cT> {\\n  const res = await fetch(`${BASE}${path}`, {\\n    ...init,\\n    headers: { \'Content-Type\': \'application/json\', ...init?.headers },\\n    credentials: \'include\',\\n  });\\n  if (!res.ok) throw new ApiError(res.status, await res.text());\\n  return res.json();\\n}\\n\\nexport const getUsers = () => api\\u003cUser[]>(\'/users\');\\n```\\n\\nBenefits: one place for base URL, auth headers, error handling, token refresh and typing. With Axios you\'d use interceptors for the same purpose."},{"id":"frontend-interview-bl-1kv6wrs","book":"Frontend Interview","part":"5. REST APIs & State","question":"How do you handle loading, error and empty states?","prompt":"","answer":"Every data-driven component has four states: loading (skeleton, not just a spinner, to avoid layout shift), error (friendly message + retry button), empty (helpful message + call to action), and success. Interviewers like candidates who mention the empty state — it\'s often forgotten."},{"id":"frontend-interview-bl-4bv543","book":"Frontend Interview","part":"5. REST APIs & State","question":"What is CORS?","prompt":"","answer":"A browser security rule: a page on `app.com` can\'t read responses from `api.com` unless the server sends `Access-Control-Allow-Origin` headers allowing it. It\'s fixed on the **server**, not the frontend. For non-simple requests the browser sends an `OPTIONS` preflight first. In Next.js you can sidestep it by proxying through a route handler or `rewrites`."},{"id":"frontend-interview-bl-a9fsb6","book":"Frontend Interview","part":"5. REST APIs & State","question":"Where do you store auth tokens?","prompt":"","answer":"Prefer **httpOnly, Secure, SameSite cookies** set by the server — JavaScript can\'t read them, so XSS can\'t steal them. `localStorage` is readable by any script on the page, so it\'s riskier. Mention access token + refresh token flow and handling `401` by refreshing then retrying."},{"id":"frontend-interview-bl-word1h","book":"Frontend Interview","part":"5. REST APIs & State","question":"Server state vs client state?","prompt":"","answer":"| | Server state | Client (UI) state |\\n| --- | --- | --- |\\n| Examples | Users, products, orders from the API | Modal open, selected tab, theme, form draft, cart before checkout |\\n| Owner | The backend; you have a cached copy | The browser |\\n| Problems | Caching, staleness, refetching, deduping, pagination, retries | Sharing across components |\\n| Tool | TanStack Query, SWR, RTK Query, Server Components | `useState`, Context, Zustand, Redux |\\n\\n**Say this:** \\"I don\'t put API data into Redux anymore. TanStack Query handles server state, and I use Zustand or local state for the small amount of true client state.\\""},{"id":"frontend-interview-bl-jpp3n0","book":"Frontend Interview","part":"5. REST APIs & State","question":"What does TanStack Query give you?","prompt":"","answer":"Caching by query key, automatic background refetching, request deduplication, retries, loading/error states, pagination and infinite scroll, mutations with cache invalidation, and optimistic updates.\\n\\n```tsx\\nconst { data, isPending, isError, refetch } = useQuery({\\n  queryKey: [\'users\', page],\\n  queryFn: () => getUsers(page),\\n  staleTime: 60_000,\\n});\\n\\nconst qc = useQueryClient();\\nconst addUser = useMutation({\\n  mutationFn: createUser,\\n  onSuccess: () => qc.invalidateQueries({ queryKey: [\'users\'] }),\\n});\\n```\\n\\n**Key concepts:** `staleTime` (how long data counts as fresh — no refetch), `gcTime` (formerly `cacheTime`, how long unused data stays in memory), and query keys as dependency arrays — when `page` changes, it fetches the new page automatically."},{"id":"frontend-interview-bl-togilj","book":"Frontend Interview","part":"5. REST APIs & State","question":"How do optimistic updates work?","prompt":"","answer":"Update the UI immediately before the server responds, then roll back if it fails. In TanStack Query: in `onMutate`, cancel ongoing queries, snapshot the old cache, set the new value; in `onError`, restore the snapshot; in `onSettled`, invalidate to sync with the server. Good for likes, toggles, todo checkboxes."},{"id":"frontend-interview-bl-12ric0","book":"Frontend Interview","part":"5. REST APIs & State","question":"Redux vs Zustand — when would you choose each?","prompt":"","answer":"**Redux Toolkit:** structured (slices, actions, reducers), excellent DevTools with time-travel, middleware, strong conventions for large teams and complex state logic; RTK Query included for API caching. More boilerplate than Zustand.\\n\\n**Zustand:** tiny, minimal boilerplate, no provider needed, components subscribe to slices of state so they re-render only when that slice changes. Great for small-to-medium apps.\\n\\n```typescript\\nimport { create } from \'zustand\';\\n\\ntype CartState = {\\n  items: CartItem[];\\n  add: (item: CartItem) => void;\\n  remove: (id: string) => void;\\n};\\n\\nexport const useCart = create\\u003cCartState>()((set) => ({\\n  items: [],\\n  add: (item) => set((s) => ({ items: [...s.items, item] })),\\n  remove: (id) => set((s) => ({ items: s.items.filter((i) => i.id !== id) })),\\n}));\\n\\n// Select only what you need to avoid extra re-renders\\nconst count = useCart((s) => s.items.length);\\n```"},{"id":"frontend-interview-bl-10cnsw2","book":"Frontend Interview","part":"5. REST APIs & State","question":"Explain Redux data flow.","prompt":"","answer":"UI dispatches an **action** → a **reducer** (pure function) computes new state from old state + action → the **store** updates → subscribed components re-render via `useSelector`. Redux Toolkit uses Immer, so you can write \\"mutating\\" code in reducers that is converted to immutable updates."},{"id":"frontend-interview-bl-193eqt8","book":"Frontend Interview","part":"5. REST APIs & State","question":"How would you implement search with an API?","prompt":"","answer":"Debounce the input (300ms), put the term in the query key, keep previous results visible while loading (`placeholderData: keepPreviousData`), cancel outdated requests (TanStack passes an `AbortSignal`), and sync the term to the URL (`?q=`) so results are shareable and survive refresh. This combines several JD skills in one answer."},{"id":"frontend-interview-bl-1xxzgl0","book":"Frontend Interview","part":"5. REST APIs & State","question":"Pagination vs infinite scroll?","prompt":"","answer":"Pagination: better for SEO, jumping to a page, and data tables. Infinite scroll: better for feeds on mobile; use `useInfiniteQuery` and an `IntersectionObserver` to load more; virtualize very long lists (TanStack Virtual)."},{"id":"frontend-interview-bl-674wbc","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"What are Core Web Vitals?","prompt":"","answer":"| Metric | Measures | Good target | Common fixes |\\n| --- | --- | --- | --- |\\n| LCP (Largest Contentful Paint) | Loading — when the main content appears | ≤ 2.5 s | Optimize hero image (`next/image` + `priority`), SSR/SSG, CDN, preload fonts |\\n| INP (Interaction to Next Paint) | Responsiveness — delay after clicks/typing | ≤ 200 ms | Less JS, split long tasks, `useTransition`, move work off the main thread |\\n| CLS (Cumulative Layout Shift) | Visual stability — content jumping | ≤ 0.1 | Set image width/height, reserve space for ads/embeds, `next/font`, skeletons |\\n\\nINP replaced FID (First Input Delay) as a Core Web Vital in March 2024 — mentioning this shows you\'re current."},{"id":"frontend-interview-bl-c9rgur","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"How would you approach a slow page?","prompt":"","answer":"1. **Measure:** Lighthouse and PageSpeed Insights (lab + real-user field data), Chrome DevTools Performance tab, React DevTools Profiler, and `@next/bundle-analyzer` for bundle size.\\n2. **Identify the bottleneck:** big JS bundle? slow API? huge images? too many re-renders? render-blocking resources?\\n3. **Fix the biggest issue first**, then re-measure to prove the improvement with numbers.\\n\\nThen list fixes by category:\\n\\n- **Less JavaScript:** Server Components, code splitting with `next/dynamic` / `React.lazy` for heavy components (charts, editors, modals), tree-shakable imports (`import debounce from \'lodash/debounce\'`, not all of lodash), remove unused dependencies.\\n- **Assets:** `next/image`, WebP/AVIF, SVG icons, `next/font`, lazy-load below-the-fold media.\\n- **Rendering:** avoid unnecessary re-renders (memoization where profiled, state colocation, Zustand selectors), virtualize long lists (TanStack Virtual), debounce expensive handlers.\\n- **Network:** caching (ISR, TanStack Query `staleTime`, HTTP cache headers), CDN, prefetching (Next.js `Link` prefetches automatically), parallel requests instead of waterfalls.\\n- **Third-party scripts:** load with `next/script` and `strategy=\\"lazyOnload\\"` or `afterInteractive`.\\n\\nHave one real story ready: \\"Our product page LCP was 4.1s; the hero image was a 2MB PNG. Switching to `next/image` with `priority` and AVIF brought it to 1.9s.\\""},{"id":"frontend-interview-bl-bkycqa","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"What is code splitting and lazy loading?","prompt":"","answer":"Splitting the JS bundle into chunks so users download only what the current page needs. Next.js splits by route automatically; you add manual splits for heavy components:\\n\\n```tsx\\nconst Chart = dynamic(() => import(\'@/components/Chart\'), {\\n  ssr: false,\\n  loading: () => \\u003cSkeleton className=\\"h-64\\" />,\\n});\\n```"},{"id":"frontend-interview-bl-o2hjdy","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"What is hydration, and what causes hydration errors?","prompt":"","answer":"Hydration is React attaching event handlers to server-rendered HTML so it becomes interactive. A **hydration mismatch** happens when server HTML differs from the first client render — common causes: `Date.now()`/`Math.random()` in render, reading `window`/`localStorage` during render, locale-specific date formatting, or invalid HTML nesting (a `div` inside a `p`). Fix by moving browser-only logic into `useEffect`, or using `dynamic(..., { ssr: false })`."},{"id":"frontend-interview-bl-17cb80t","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"What else improves SEO beyond metadata?","prompt":"","answer":"Fast Core Web Vitals (a ranking signal), mobile-friendliness, server-rendered content, clean URLs (`/products/blue-shoes` not `?id=123`), internal linking with real `\\u003ca>` tags (Next.js `Link` renders them), structured data (JSON-LD), sitemap, canonical tags, correct `lang` attribute, and proper 404/301 handling."},{"id":"frontend-interview-bl-xc8lg1","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"How do you ensure cross-browser compatibility?","prompt":"","answer":"- Define target browsers with **Browserslist**; Next.js/SWC and Autoprefixer use it to transpile JS and prefix CSS.\\n- Check feature support on **caniuse.com** before using newer APIs (e.g. `:has()`, container queries, `structuredClone`).\\n- Use **progressive enhancement** and feature detection (`@supports`, `\'IntersectionObserver\' in window`) with fallbacks.\\n- Test on real Safari/iOS — it\'s the most common source of bugs (`100vh` with the mobile address bar → use `100dvh`; date input styling; flex `gap` in very old versions).\\n- Use cross-browser testing tools like **BrowserStack** or **Playwright** (which runs Chromium, Firefox and WebKit).\\n- CSS reset/normalize (Tailwind Preflight already does this)."},{"id":"frontend-interview-bl-79ttzi","book":"Frontend Interview","part":"6. Performance, SEO & Browsers","question":"What are web performance quick wins you always apply?","prompt":"","answer":"Image optimization, font optimization, lazy-loading heavy components, avoiding layout shift, compressing (Brotli/gzip, handled by Vercel/CDN), caching static assets with long `Cache-Control` and hashed filenames, and keeping dependencies lean (check size on bundlephobia before installing)."},{"id":"frontend-interview-bl-156w4nh","book":"Frontend Interview","part":"7. AI-assisted development","question":"Which AI tools do you use, and for what?","prompt":"","answer":"Name tools and match each to a task — concrete beats generic:\\n\\n| Tool | What you use it for |\\n| --- | --- |\\n| GitHub Copilot (inline + chat) | Autocomplete for boilerplate, repetitive JSX, types, small functions while typing |\\n| Claude Code / Cursor (agentic, repo-aware) | Multi-file changes, refactors, scaffolding a feature, running tests and fixing failures, explaining unfamiliar parts of a codebase |\\n| ChatGPT / Claude chat | Thinking through architecture, comparing approaches, debugging an error with context, writing docs and regex |\\n| v0 / Figma Dev Mode / design-to-code tools | First draft of a UI from a design or description, which you then refactor into your components |\\n\\n**Sample answer:** \\"I use Copilot all day for autocomplete. For bigger tasks I use Claude Code — for example, I asked it to migrate our data fetching from `useEffect` to TanStack Query across 12 components. It did the bulk in minutes, and I spent my time reviewing each diff, fixing two places where it dropped error handling, and adding tests.\\""},{"id":"frontend-interview-bl-12v6rhq","book":"Frontend Interview","part":"7. AI-assisted development","question":"Walk me through your AI-assisted workflow on a feature.","prompt":"","answer":"1. **Understand the task myself first** — I can\'t evaluate output for a problem I haven\'t thought about.\\n2. **Give context** — relevant files, types, the API contract, existing components to reuse, coding conventions (many tools support a project rules file like `CLAUDE.md`, `.cursorrules` or Copilot custom instructions).\\n3. **Ask for a plan before code** on anything non-trivial, and correct the plan.\\n4. **Generate in small, reviewable chunks**, not a whole feature at once.\\n5. **Review every line**, run the type checker, linter and tests.\\n6. **Use AI for tests and docs too**, then verify those tests actually fail when the code is broken.\\n7. **Commit with a clear message** and go through normal code review — AI code gets the same scrutiny as human code."},{"id":"frontend-interview-bl-9ml1vd","book":"Frontend Interview","part":"7. AI-assisted development","question":"What is prompt engineering? How do you write a good prompt for code?","prompt":"","answer":"**Say this:** It\'s structuring instructions and context so the model produces accurate, usable output. For code, the key ingredients are context, constraints, examples and a clear output format.\\n\\n**Weak prompt:** \\"Make a login form.\\"\\n\\n**Strong prompt:**\\n\\n> \\"Create a `LoginForm` component in Next.js 15 App Router with TypeScript and Tailwind. Use React Hook Form with a Zod schema: email (valid email) and password (min 8 chars). Reuse our `Button` and `Input` from `@/components/ui`. On submit call the existing `login()` server action from `@/app/actions/auth.ts`, show field errors under inputs, disable the button while submitting, and show a server error message at the top. It must be keyboard accessible with proper labels. Don\'t add new dependencies. Return only the component file.\\"\\n\\nTechniques worth naming: give a role and context, specify versions (models often default to outdated APIs like Pages Router), show an example of your existing code style, ask it to reason step by step or plan first, ask for edge cases and tests, and iterate with specific feedback (\\"the error state doesn\'t reset when the user types — fix only that\\")."},{"id":"frontend-interview-bl-tbqguu","book":"Frontend Interview","part":"7. AI-assisted development","question":"How do you review and validate AI-generated code?","prompt":"","answer":"- **Correctness:** Does it actually solve the requirement? Test edge cases: empty arrays, null/undefined, slow or failed network, very long text, double clicks.\\n- **Hallucinations:** Do the imported packages, functions and API options really exist in our versions? (A classic: invented props or deprecated Next.js APIs.)\\n- **Types:** No `any`, no unsafe `as` casts hiding problems; `tsc` passes.\\n- **Security:** No secrets in client code, no `dangerouslySetInnerHTML` with user input, input validated on the server, auth checked in server actions/routes, no SQL/command injection.\\n- **Performance:** No fetching in loops, unnecessary re-renders, effects without cleanup, or huge new dependencies.\\n- **Accessibility:** Semantic elements, labels, keyboard support — AI often outputs clickable `div`s.\\n- **Consistency/maintainability:** Matches our patterns, reuses existing components and utils instead of duplicating, readable naming, no dead code.\\n- **Licensing/dependencies:** Any new package is justified, maintained and license-compatible.\\n- **Tests:** Run existing tests; add new ones; make sure AI-written tests assert meaningful behavior and aren\'t just written to pass.\\n\\n**The golden rule to say out loud:** \\"If I can\'t explain a line in code review, it doesn\'t get merged — regardless of who or what wrote it.\\""},{"id":"frontend-interview-bl-1yde7rk","book":"Frontend Interview","part":"7. AI-assisted development","question":"Give an example where AI gave you wrong or bad code.","prompt":"","answer":"Prepare a real story. Typical, believable examples:\\n\\n- It used `getServerSideProps` inside an App Router project (outdated API).\\n- It wrote a `useEffect` fetch with no cleanup, causing a race condition when the user switched tabs quickly.\\n- It suggested storing a JWT in `localStorage`.\\n- It invented a prop on a library component that didn\'t exist.\\n- It made tests pass by mocking the very function under test.\\n\\nStructure: what you asked → what it produced → how you caught it (types, test, review, docs) → what you changed → what you learned (e.g. \\"now I always state the Next.js version in my prompt\\")."},{"id":"frontend-interview-bl-3zucda","book":"Frontend Interview","part":"7. AI-assisted development","question":"How do you use AI for debugging?","prompt":"","answer":"Give the full error message and stack trace, the relevant code, what you expected vs what happened, and what you already tried. Ask it for **possible causes ranked by likelihood** rather than a single fix, then verify each with logs or breakpoints. AI speeds up the hypothesis step; you still confirm the root cause. For agentic tools, let them run the failing test and iterate, but review the final diff."},{"id":"frontend-interview-bl-ck8qkx","book":"Frontend Interview","part":"7. AI-assisted development","question":"How do you use AI for testing and documentation?","prompt":"","answer":"Testing: generate test cases from a component, especially edge cases you may forget; generate mock data and MSW handlers. Then review that assertions check behavior. Documentation: JSDoc comments, README setup steps, PR descriptions, Storybook stories, and explaining legacy code to new teammates."},{"id":"frontend-interview-bl-tnjtp4","book":"Frontend Interview","part":"7. AI-assisted development","question":"What are the risks of AI coding tools for a team, and how do you manage them?","prompt":"","answer":"- **Security & privacy:** never paste secrets, credentials, customer data or proprietary code into tools the company hasn\'t approved; use enterprise versions with no-training data policies.\\n- **Code quality drift:** inconsistent patterns and duplicate code → solve with shared rules files, linting, and code review.\\n- **Over-reliance / skill atrophy:** keep understanding fundamentals; use AI as a pair programmer, not an autopilot.\\n- **Hallucinated or vulnerable dependencies:** verify every package (typosquatting is real).\\n- **License concerns:** check that generated code doesn\'t reproduce licensed code verbatim; many tools offer filters for this."},{"id":"frontend-interview-bl-1t8h2he","book":"Frontend Interview","part":"7. AI-assisted development","question":"Does AI make developers less necessary?","prompt":"","answer":"Good balanced answer: \\"It shifts the work. Typing code is faster, so more of the value is in understanding requirements, designing components, reviewing, testing and making judgment calls on trade-offs. A developer who uses AI well and reviews carefully ships much more than one who doesn\'t — but someone still has to own the quality.\\""},{"id":"frontend-interview-bl-528mpd","book":"Frontend Interview","part":"7. AI-assisted development","question":"Have you heard of MCP or agents?","prompt":"","answer":"**MCP (Model Context Protocol)** is an open standard that lets AI tools connect to external systems — GitHub, Figma, databases, issue trackers — so an assistant can read a Figma frame or a Jira ticket directly. **Agentic tools** like Claude Code can plan, edit multiple files, run commands and tests, and iterate. Mention that you still keep them on a review loop: small tasks, clear instructions, inspect the diff."},{"id":"frontend-interview-bl-120tfqv","book":"Frontend Interview","part":"7. AI-assisted development","question":"Review this AI-generated component. What\'s wrong with it?","prompt":"","answer":"```tsx\\n\'use client\';\\nexport default function UserList() {\\n  const [users, setUsers] = useState\\u003cany>([]);\\n  useEffect(() => {\\n    fetch(\'https://api.example.com/users?key=sk_live_123\')\\n      .then(res => res.json())\\n      .then(data => setUsers(data));\\n  });\\n  return (\\n    \\u003cdiv>\\n      {users.map((u, i) => (\\n        \\u003cdiv key={i} onClick={() => alert(u.name)}\\n          dangerouslySetInnerHTML={{ __html: u.bio }} />\\n      ))}\\n    \\u003c/div>\\n  );\\n}\\n```\\n\\n**Answer:** missing dependency array → infinite fetch loop; API secret exposed in client code; `any` type; no `res.ok` check, loading, error or empty states; no abort/cleanup; index as key; clickable `div` (not accessible — use `button`); `dangerouslySetInnerHTML` with user data → XSS (sanitize with DOMPurify or render as text); could be a Server Component or use TanStack Query; missing imports for `useState`/`useEffect`."},{"id":"frontend-interview-bl-kp1q27","book":"Frontend Interview","part":"8. Testing","question":"What types of tests are there?","prompt":"","answer":"- **Unit:** one function or component in isolation (utils, hooks, a `Button`). Fast, many of them.\\n- **Integration:** several pieces together (a form + validation + mocked API). Often the best value for frontend.\\n- **End-to-end (E2E):** a real browser running real user flows (login → add to cart → checkout) with **Playwright** or Cypress. Slower, fewer of them, cover critical paths.\\n\\nMention the **testing trophy** idea (Kent C. Dodds): static checks (TypeScript, ESLint) at the base, most effort on integration tests."},{"id":"frontend-interview-bl-mbuntu","book":"Frontend Interview","part":"8. Testing","question":"Jest vs Vitest?","prompt":"","answer":"Same API style (`describe`, `it`, `expect`, mocks). **Vitest** is built on Vite, faster, and has native ESM/TypeScript support — popular for new projects. **Jest** is the long-time standard with a large ecosystem; Next.js has an official `next/jest` setup. Switching between them is mostly changing `jest.fn()` to `vi.fn()`."},{"id":"frontend-interview-bl-5pmduz","book":"Frontend Interview","part":"8. Testing","question":"What is the philosophy of React Testing Library?","prompt":"","answer":"\\"The more your tests resemble the way your software is used, the more confidence they give you.\\" Test behavior the user sees, not implementation details (no checking internal state or component methods). Query elements the way a user or screen reader would.\\n\\n**Query priority:** `getByRole` (best — also verifies accessibility) → `getByLabelText` → `getByPlaceholderText` → `getByText` → `getByTestId` (last resort).\\n\\n**Query variants:** `getBy` (throws if missing — for elements that should exist), `queryBy` (returns null — to assert something is *not* there), `findBy` (async — waits for elements that appear after fetching)."},{"id":"frontend-interview-bl-qmxxoe","book":"Frontend Interview","part":"8. Testing","question":"Write a test for a Counter component.","prompt":"","answer":"```tsx\\nimport { render, screen } from \'@testing-library/react\';\\nimport userEvent from \'@testing-library/user-event\';\\nimport { Counter } from \'./Counter\';\\n\\ntest(\'increments the count when the button is clicked\', async () => {\\n  const user = userEvent.setup();\\n  render(\\u003cCounter />);\\n\\n  expect(screen.getByText(\'Count: 0\')).toBeInTheDocument();\\n  await user.click(screen.getByRole(\'button\', { name: /increment/i }));\\n  expect(screen.getByText(\'Count: 1\')).toBeInTheDocument();\\n});\\n```\\n\\nPrefer `userEvent` over `fireEvent` — it simulates real interactions (focus, typing key by key, hover)."},{"id":"frontend-interview-bl-yc3d42","book":"Frontend Interview","part":"8. Testing","question":"How do you test components that call APIs?","prompt":"","answer":"Mock at the network level with **MSW (Mock Service Worker)** rather than mocking `fetch` or your API module. Components run their real fetching code, and the same handlers can be reused in Storybook and development.\\n\\n```tsx\\nserver.use(\\n  http.get(\'/api/users\', () => HttpResponse.json([{ id: \'1\', name: \'Asha\' }]))\\n);\\nrender(\\u003cUserList />, { wrapper: QueryProvider });\\nexpect(await screen.findByText(\'Asha\')).toBeInTheDocument();\\n```\\n\\nAlso test the error path by returning a 500 and asserting the error message and retry button appear."},{"id":"frontend-interview-bl-1gpja5r","book":"Frontend Interview","part":"8. Testing","question":"How do you test custom hooks?","prompt":"","answer":"With `renderHook` from React Testing Library, wrapping state changes in `act`."},{"id":"frontend-interview-bl-43slr9","book":"Frontend Interview","part":"8. Testing","question":"What should and shouldn\'t you test?","prompt":"","answer":"**Test:** user-visible behavior, conditional rendering, form validation, loading/error/empty states, utility functions with edge cases, critical flows with E2E. **Don\'t test:** library internals (that React\'s `useState` works), CSS details, or implementation details that change when you refactor. Code coverage is a guide, not a goal — 100% coverage with weak assertions is worse than 70% with meaningful tests."},{"id":"frontend-interview-bl-y910ia","book":"Frontend Interview","part":"8. Testing","question":"What about snapshot tests?","prompt":"","answer":"Useful for small, stable output, but large snapshots get blindly updated and stop catching bugs. Prefer explicit assertions. For visual regressions, use tools like Chromatic or Playwright screenshots."},{"id":"frontend-interview-bl-sxs9tk","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"Describe your Git workflow.","prompt":"","answer":"A typical answer: \\"I create a feature branch from `main` (e.g. `feat/user-profile`), commit small logical changes with clear messages, push and open a pull request. CI runs lint, type check, tests and a preview deploy. After review and approval, it\'s squash-merged into `main`, which deploys automatically.\\" This is **GitHub Flow**; mention **Git Flow** (develop/release/hotfix branches) if the team does scheduled releases."},{"id":"frontend-interview-bl-1h16owr","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"`git merge` vs `git rebase`?","prompt":"","answer":"**Merge** combines branches with a merge commit and keeps full history. **Rebase** replays your commits on top of the target branch, giving a clean linear history. Rule: rebase your own local/feature branch to update it; never rebase a shared branch others have pulled, because it rewrites history."},{"id":"frontend-interview-bl-1rwgkfx","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"How do you resolve a merge conflict?","prompt":"","answer":"Pull the latest `main`, run the merge or rebase, open the conflicted files, understand **both** changes (talk to the other developer if unclear), keep the correct combination, remove the conflict markers, run the app and tests, then commit. Never just pick \\"accept mine\\" without understanding the other change."},{"id":"frontend-interview-bl-8mv6k8","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"Which other Git commands should you know?","prompt":"","answer":"- `git stash` / `git stash pop` — temporarily shelve uncommitted work.\\n- `git cherry-pick \\u003csha>` — apply one commit to another branch (e.g. a hotfix).\\n- `git reset --soft HEAD~1` — undo the last commit but keep changes; `git revert \\u003csha>` — undo a commit safely on a shared branch by creating a new commit.\\n- `git commit --amend` — fix the last commit message or add a forgotten file (before pushing).\\n- `git log --oneline --graph`, `git diff`, `git blame` — investigate history.\\n- `git bisect` — binary search for the commit that introduced a bug."},{"id":"frontend-interview-bl-1h8linm","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"What makes a good commit message and PR?","prompt":"","answer":"Commits: **Conventional Commits** format — `feat: add product filters`, `fix: prevent double submit on checkout`, `refactor:`, `test:`, `docs:`, `chore:`. Small, focused PRs (ideally under ~400 lines) with a description covering what changed, why, how to test, screenshots or a video for UI changes, and a linked ticket."},{"id":"frontend-interview-bl-156cz8b","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"What do you look for when reviewing someone\'s code?","prompt":"","answer":"In priority order: correctness and edge cases → security → readability and naming → consistency with project patterns and reuse of existing components → performance → accessibility → tests. Automate style (Prettier, ESLint) so reviews focus on logic rather than formatting."},{"id":"frontend-interview-bl-1rdm0r5","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"How do you give and receive code review feedback?","prompt":"","answer":"**Giving:** be specific and kind, explain *why*, ask questions instead of commanding (\\"What happens if `items` is empty here?\\"), label minor points as `nit:`, and praise good solutions. **Receiving:** don\'t take it personally, ask for clarification, push back respectfully with reasoning when you disagree, and thank the reviewer. Interviewers want someone who is easy to work with."},{"id":"frontend-interview-bl-yenokn","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"What does \\"clean, maintainable, testable code\\" mean to you?","prompt":"","answer":"- **Readable names** — `isLoading`, `fetchUserOrders`, not `flag`, `doStuff`.\\n- **Small, single-purpose functions and components** — if a component is 400 lines, split it.\\n- **Separation of concerns** — UI components separate from data fetching and business logic (custom hooks, service layer), which also makes them easy to test.\\n- **DRY, but not too early** — extract on the second or third repetition, not the first.\\n- **Strong types**, no magic numbers (named constants), early returns instead of deep nesting.\\n- **Consistent folder structure** — e.g. feature-based: `features/cart/{components,hooks,api}`.\\n- **Tooling** — ESLint, Prettier, TypeScript strict mode, Husky + lint-staged to run checks before commit."},{"id":"frontend-interview-bl-1yyh0nq","book":"Frontend Interview","part":"9. Git, code review & clean code","question":"What principles do you follow? (SOLID, KISS, YAGNI)","prompt":"","answer":"**KISS** — keep it simple. **YAGNI** — don\'t build features or abstractions you don\'t need yet. **Single Responsibility** — each component/hook does one thing. **Composition over inheritance** — React\'s model. Briefly connecting these to your component design is enough."},{"id":"frontend-interview-bl-1ok3uxu","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"What is Docker and why use it for a frontend app?","prompt":"","answer":"Docker packages an app with its runtime and dependencies into an **image** that runs the same everywhere as a **container**. It removes \\"works on my machine\\" problems and makes deploying to any cloud consistent. An image is the blueprint; a container is a running instance."},{"id":"frontend-interview-bl-1p8y9jl","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"What does a Dockerfile for Next.js look like?","prompt":"","answer":"A **multi-stage build** keeps the final image small:\\n\\n```dockerfile\\nFROM node:20-alpine AS deps\\nWORKDIR /app\\nCOPY package.json package-lock.json ./\\nRUN npm ci\\n\\nFROM node:20-alpine AS builder\\nWORKDIR /app\\nCOPY --from=deps /app/node_modules ./node_modules\\nCOPY . .\\nRUN npm run build\\n\\nFROM node:20-alpine AS runner\\nWORKDIR /app\\nENV NODE_ENV=production\\nCOPY --from=builder /app/.next/standalone ./\\nCOPY --from=builder /app/.next/static ./.next/static\\nCOPY --from=builder /app/public ./public\\nEXPOSE 3000\\nCMD [\\"node\\", \\"server.js\\"]\\n```\\n\\nThis requires `output: \'standalone\'` in `next.config`. Also use a `.dockerignore` (exclude `node_modules`, `.next`, `.env`). Docker Compose runs multiple services together locally (frontend + API + database)."},{"id":"frontend-interview-bl-tjjxal","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"What is CI/CD? Describe a pipeline you\'d set up.","prompt":"","answer":"**CI (Continuous Integration):** every push/PR automatically installs, lints, type-checks, tests and builds. **CD (Continuous Delivery/Deployment):** passing code is automatically deployed to staging or production.\\n\\n```yaml\\n# .github/workflows/ci.yml\\nname: CI\\non: [pull_request]\\njobs:\\n  build:\\n    runs-on: ubuntu-latest\\n    steps:\\n      - uses: actions/checkout@v4\\n      - uses: actions/setup-node@v4\\n        with: { node-version: 20, cache: npm }\\n      - run: npm ci\\n      - run: npm run lint\\n      - run: npx tsc --noEmit\\n      - run: npm test -- --run\\n      - run: npm run build\\n```\\n\\nVercel or Netlify add automatic **preview deployments** per PR — great for designer and QA review."},{"id":"frontend-interview-bl-1hro305","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"Which cloud platforms/hosting have you used?","prompt":"","answer":"Common answers: **Vercel** (made by the Next.js team; zero-config, edge network, preview URLs), **Netlify**, **AWS** (Amplify, S3 + CloudFront for static sites, ECS/EC2 for Docker containers, Lambda), **GCP Cloud Run** or **Azure**. Know the basic idea of a **CDN** (caches assets on servers close to users) and **environment variables per environment** (dev/staging/prod)."},{"id":"frontend-interview-bl-q5v5h6","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"What Node.js knowledge is relevant for a frontend developer?","prompt":"","answer":"- npm/pnpm/yarn, `package.json` scripts, semantic versioning (`^1.2.3` allows minor updates), lockfiles and why `npm ci` is used in CI.\\n- Node is the runtime for Next.js server code, route handlers and build tools.\\n- Building simple REST APIs with **Express** or Next.js route handlers: routes, middleware, JSON parsing, error handling.\\n- Async I/O and the event loop (same model as the browser, plus `process.nextTick`).\\n- Environment variables via `process.env`.\\n\\n```typescript\\n// app/api/users/route.ts — a Next.js route handler\\nexport async function GET() {\\n  const users = await db.user.findMany();\\n  return Response.json(users);\\n}\\n```"},{"id":"frontend-interview-bl-ok5cqm","book":"Frontend Interview","part":"10. Docker, CI/CD, cloud & Node","question":"What is the difference between edge and Node.js runtime in Next.js?","prompt":"","answer":"The **Node.js runtime** supports all Node APIs and is the default. The **Edge runtime** runs on lightweight servers close to users with faster cold starts but a limited API (no file system, many Node packages unsupported) — used for middleware and simple, latency-sensitive responses."},{"id":"frontend-interview-bl-18il6g2","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"Tell me about a challenging bug you solved.","prompt":"","answer":"Use STAR: Situation, Task, Action (most of the answer), Result (with a number). Sample:\\n\\n> **S:** Users on iPhones reported the checkout button sometimes did nothing. **T:** I owned the checkout UI. **A:** I couldn\'t reproduce on desktop, so I used Safari remote debugging on a real device and found a hydration mismatch caused by formatting a date with the device locale during render. The mismatch broke event handlers. I moved the formatting into a client-only effect, added a test, and documented the pattern for the team. **R:** The issue disappeared and checkout completion on iOS rose about 6% the following week."},{"id":"frontend-interview-bl-pznyuj","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"Tell me about a time you disagreed with a designer or backend developer.","prompt":"","answer":"> **S:** A designer wanted a data table with 9 columns on mobile. **T:** I needed to ship a usable mobile view. **A:** I built a quick prototype showing horizontal scrolling was awkward, then proposed a stacked card layout with the 3 key fields visible and a details expand. I showed both on a preview URL instead of arguing in abstract. **R:** The designer agreed, updated the Figma, and we used that pattern for other tables too.\\n\\nKey message: disagree with evidence, stay respectful, focus on the user."},{"id":"frontend-interview-bl-1b0y4z3","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"How do you work with backend developers when the API isn\'t ready?","prompt":"","answer":"Agree on the API contract early (OpenAPI/Swagger spec or shared TypeScript types), build the UI against **mock data with MSW**, and switch to the real endpoint when it\'s ready. Raise contract issues early (missing fields, pagination format, error shapes) rather than working around them in the frontend."},{"id":"frontend-interview-bl-z0xb0l","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"How do you work with QA?","prompt":"","answer":"Write clear PR descriptions with test steps, share preview deployments, reproduce reported bugs before fixing, add a regression test for each bug fixed, and treat QA as partners. Ask them about edge cases early during development, not just at the end."},{"id":"frontend-interview-bl-1wkoa5k","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"Tell me about a time you missed a deadline or a task took longer than expected.","prompt":"","answer":"Show ownership: you noticed early, communicated to the lead/PM with a revised estimate and options (cut scope, ship in phases), and learned something (e.g. \\"now I break tasks into smaller pieces and flag risk at standup\\"). Never blame others."},{"id":"frontend-interview-bl-1o0ysob","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"Tell me about a project you\'re proud of.","prompt":"","answer":"Pick one that hits the JD: Next.js + TypeScript, reusable components, API integration, measurable performance or business results. Explain the problem, your architecture choices and **why**, a challenge, and the result. Prepare to go deep — interviewers often ask follow-ups on folder structure, state management choices and what you\'d do differently."},{"id":"frontend-interview-bl-j1725f","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"How do you keep up with frontend changes?","prompt":"","answer":"Name specific sources: official React and Next.js blogs/docs, release notes, newsletters (e.g. *This Week in React*, *JavaScript Weekly*), YouTube or podcasts you actually follow, and side projects where you try new features (React 19, Tailwind v4, Server Actions). Mention you also experiment with new AI coding tools."},{"id":"frontend-interview-bl-1n63coy","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"How do you handle unclear requirements?","prompt":"","answer":"Ask clarifying questions early, write down assumptions and confirm them with the PM, build a small version first, and get feedback quickly. A wrong assumption caught on day one costs much less than on the last day."},{"id":"frontend-interview-bl-t0lwii","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"Why do you want this role / this company?","prompt":"","answer":"Research the company\'s product beforehand. Connect three things: their product or mission, the tech stack (React/Next.js/TypeScript — your strength), and their emphasis on AI-assisted development (you already work this way and want a team that embraces it)."},{"id":"frontend-interview-bl-caf4o5","book":"Frontend Interview","part":"11. Behavioral (STAR)","question":"What is your biggest weakness?","prompt":"","answer":"Pick a real, non-critical one with active improvement. Example: \\"I used to over-polish UI details before getting feedback. Now I share a preview early, get input from design and product, and polish afterwards — it\'s made me faster and reduced rework.\\""},{"id":"frontend-system-design-ebook-1xab46a","book":"Frontend System Design","part":"PART I — THE METHOD","question":"Explain: What a frontend system design round actually tests","prompt":"","answer":"Backend system design asks \\"how do you handle 100M users?\\" Frontend system design asks **\\"how do you handle one user, well, on a bad phone, on a bad network, at scale of features and teams?\\"**\\n\\nInterviewers are scoring five things:\\n\\n| Signal | What it looks like |\\n|---|---|\\n| **Scoping** | You narrow an intentionally vague prompt before designing. |\\n| **Architecture** | You can draw components, boundaries, and data flow, and justify them. |\\n| **Depth** | You can go three levels deep in at least one area (rendering, caching, real-time, a11y). |\\n| **Tradeoffs** | Every choice has a named alternative and a reason for rejection. |\\n| **Product sense** | You mention loading states, empty states, errors, offline, and the user on 3G. |\\n\\nThe single biggest differentiator between mid and senior candidates: **seniors talk about failure states and degradation; mid-level candidates only design the happy path.**"},{"id":"frontend-system-design-ebook-1ltrzso","book":"Frontend System Design","part":"PART I — THE METHOD","question":"Explain: The RADIO framework","prompt":"","answer":"Use it out loud. It gives the interviewer a map of where you are.\\n\\n**R — Requirements (5 min)**\\n- Functional: what can the user do?\\n- Non-functional: latency targets, device/browser support, offline, a11y level, i18n, SEO.\\n- Scale: items per page, updates per second, concurrent editors, payload sizes.\\n- Explicitly state what you\'re **descoping**: \\"I\'ll assume auth exists and skip it.\\"\\n\\n**A — Architecture (10 min)**\\nBoxes and arrows. Server → API layer → client data layer → view layer. Name each module\'s responsibility. Draw the component tree for the UI.\\n\\n**D — Data model (5–8 min)**\\nTwo models, and say so:\\n- **Server entity model** (`Post`, `User`, `Comment`)\\n- **Client-side model** (normalized store, UI-only state like `isComposerOpen`, ephemeral state like draft text)\\n\\n**I — Interface / API (5–8 min)**\\n- Network API: endpoints, params, response shape, pagination style.\\n- Component API: props of the reusable pieces.\\nWrite actual shapes. Concrete beats abstract.\\n\\n**O — Optimizations & deep dives (15 min)**\\nPerformance, network, rendering, accessibility, offline, security, error handling. This is where seniority shows. Pick two or three and go deep rather than listing ten shallowly."},{"id":"frontend-system-design-ebook-1fz13ip","book":"Frontend System Design","part":"PART I — THE METHOD","question":"Explain: Time budget (45 minutes)","prompt":"","answer":"```\\n0–5    Clarify requirements, write them down\\n5–15   High-level architecture + component tree\\n15–22  Data model + API design\\n22–40  Deep dives (interviewer usually steers here)\\n40–45  Tradeoff summary, what you\'d do with more time\\n```\\n\\nIf the interviewer interrupts to steer, abandon your plan and follow them. The steering *is* the question."},{"id":"frontend-system-design-ebook-u1rj7m","book":"Frontend System Design","part":"PART I — THE METHOD","question":"Explain: How you get downgraded","prompt":"","answer":"- **Designing before scoping.** Jumping to \\"I\'d use React Query\\" in minute one.\\n- **Framework-name soup.** Naming tools instead of describing mechanisms. Say \\"a normalized cache keyed by entity id with a TTL\\", not \\"Redux Toolkit Query\\".\\n- **No numbers.** \\"It\'ll be fast\\" vs \\"the initial payload is ~40KB gzipped, so LCP under 2.5s on 4G is achievable\\".\\n- **Ignoring accessibility.** In a *frontend* interview this reads as inexperience, not as a missing nice-to-have.\\n- **One-way doors without acknowledgment.** Choosing WebSockets without mentioning SSE and polling.\\n- **Happy path only.** No empty state, no error state, no retry, no offline.\\n- **Not managing the clock.** Spending 25 minutes on requirements."},{"id":"frontend-system-design-ebook-18snk5f","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Rendering strategies","prompt":"","answer":"| Strategy | How it works | Best for | Cost |\\n|---|---|---|---|\\n| **CSR** | Ship JS shell, fetch data in browser | Dashboards, logged-in apps, no SEO need | Poor FCP/LCP, blank screen, weak SEO |\\n| **SSR** | Render HTML per request on server | Personalized + SEO pages (feeds, PDPs) | Server cost, TTFB tied to data fetch |\\n| **SSG** | Render HTML at build time | Docs, marketing, blogs | Stale content, long builds at scale |\\n| **ISR / on-demand revalidation** | SSG + background regeneration | Large catalogs, semi-static pages | Cache invalidation complexity |\\n| **Streaming SSR** | Flush HTML in chunks as data resolves | Pages with slow sub-sections | Requires framework support, harder error handling |\\n| **Islands / partial hydration** | Static HTML, hydrate only interactive parts | Content sites with sparse interactivity | Cross-island communication is awkward |\\n| **Server Components** | Component tree split; some render only on server | Large apps wanting smaller bundles | New mental model, ecosystem gaps |\\n\\n**Key insight to voice:** hydration is the hidden cost of SSR. HTML arrives fast (good LCP) but the page is not interactive until JS downloads, parses, and hydrates (bad INP/TTI). Streaming + selective hydration + code splitting is the mitigation.\\n\\n**Choosing rule of thumb:**\\n- Content must be indexed by search engines → SSR or SSG.\\n- Content is personalized *and* indexable → SSR with edge caching keyed by segment.\\n- Behind login and interaction-heavy → CSR with an app shell + skeleton."},{"id":"frontend-system-design-ebook-1sc6ss","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: The network layer","prompt":"","answer":"### REST vs GraphQL vs RPC\\n\\n- **REST** — cache-friendly (HTTP semantics work out of the box), simple, but over/under-fetching and N+1 round trips for composite screens.\\n- **GraphQL** — one round trip for a composite screen, client picks fields; but HTTP caching is lost (POST to a single endpoint), query cost control needed, larger client runtime.\\n- **RPC (tRPC / gRPC-Web)** — typed end-to-end, minimal overhead, great for internal apps; weak for public APIs.\\n\\nAnswer template: *\\"I\'d use REST with a BFF. A Backend-For-Frontend endpoint like `GET /feed-page` aggregates the three calls the screen needs, so mobile clients make one request. That gives me GraphQL\'s round-trip benefit without giving up HTTP caching.\\"*\\n\\n### Pagination\\n\\n| Type | Request | Pros | Cons |\\n|---|---|---|---|\\n| **Offset** | `?page=3&limit=20` | Jump to any page, simple | Item shift causes duplicates/skips; slow deep offsets |\\n| **Cursor** | `?after=eyJpZCI6...&limit=20` | Stable under inserts, fast | No random page access |\\n\\nFor feeds, chats, and any list where items are inserted at the head: **always cursor-based**. Say why: a new post arriving between page 1 and page 2 pushes item 20 to position 21, so offset pagination shows it twice.\\n\\n### HTTP caching\\n\\n```\\nCache-Control: public, max-age=31536000, immutable   → hashed static assets\\nCache-Control: private, no-cache                     → HTML, must revalidate\\nCache-Control: public, s-maxage=60, stale-while-revalidate=600  → CDN-cached API\\nETag / If-None-Match                                 → cheap 304s for JSON\\n```\\n\\n`stale-while-revalidate` is the single most quotable header in these interviews: serve stale instantly, refresh in the background.\\n\\n### Request lifecycle concerns\\n- **Deduplication** — two components asking for the same resource share one in-flight promise.\\n- **Cancellation** — `AbortController` on unmount and on new keystrokes.\\n- **Retry with jittered exponential backoff** — `min(cap, base * 2^n) ± random`, only for idempotent requests and 5xx/network errors, never 4xx.\\n- **Timeouts** — a request without a timeout is a hang.\\n- **Idempotency keys** — for POSTs like \\"place order\\", so a retry doesn\'t double-charge."},{"id":"frontend-system-design-ebook-1phkehi","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Real-time data delivery","prompt":"","answer":"| Technique | Direction | Cost | Use when |\\n|---|---|---|---|\\n| **Short polling** | C→S repeatedly | Wasteful, simple | Low-frequency updates, tolerant of delay |\\n| **Long polling** | C→S held open | Moderate | Fallback where WS is blocked |\\n| **SSE** | S→C only | Cheap, auto-reconnect, HTTP/2 friendly | Feeds, notifications, live scores, LLM token streams |\\n| **WebSocket** | Bidirectional | Stateful connections, needs its own scaling | Chat, collaborative editing, multiplayer |\\n| **WebRTC** | Peer-to-peer | Complex, NAT traversal | Audio/video, low-latency data |\\n\\nPractical answers to give:\\n- Choose **SSE** when updates are server→client only. It\'s a one-liner with `EventSource`, reconnects automatically, and survives proxies.\\n- Choose **WebSocket** when the client sends high-frequency messages (typing indicators, cursor positions).\\n- Always design the **fallback ladder**: WS → SSE → long polling.\\n- Always handle **reconnect + backfill**: on reconnect, send `lastEventId` and fetch the gap over REST. Without this, users silently lose messages.\\n- **Backpressure**: if the server pushes 200 updates/sec, don\'t re-render 200 times. Buffer in a queue, flush on `requestAnimationFrame`, coalesce updates for the same entity id."},{"id":"frontend-system-design-ebook-1vmth29","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Client-side state architecture","prompt":"","answer":"Split state into four categories out loud — this alone signals seniority:\\n\\n1. **Server cache state** — data owned by the server (posts, users). Needs TTL, revalidation, deduplication, invalidation. Tools: React Query / SWR / Apollo / RTK Query.\\n2. **Global UI state** — theme, sidebar, current workspace. Small, rarely changing. Context or a tiny store.\\n3. **Local component state** — form inputs, hover, open/closed. `useState`. Keep it local; lifting everything to global is a common anti-pattern.\\n4. **URL state** — filters, sort, page, selected tab, modal id. If a user should be able to refresh or share the link and get the same screen, it belongs in the URL.\\n\\n### Normalization\\nStore entities flat, keyed by id, and store lists as arrays of ids:\\n\\n```js\\n{\\n  entities: {\\n    posts: { p1: { id:\'p1\', authorId:\'u1\', text:\'…\', likeCount: 12 } },\\n    users: { u1: { id:\'u1\', name:\'Ada\', avatar:\'…\' } }\\n  },\\n  feeds: { home: { ids: [\'p1\',\'p2\'], nextCursor: \'abc\', status: \'idle\' } }\\n}\\n```\\n\\nWhy: one user object updated in one place updates every post that references it. Denormalized trees force you to hunt and patch duplicates — the classic source of \\"the like count is wrong in one place\\"."},{"id":"frontend-system-design-ebook-1l9urxz","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Rendering performance & virtualization","prompt":"","answer":"### Core Web Vitals (know the thresholds)\\n- **LCP** ≤ 2.5s — largest text/image paint. Fix with SSR, priority hints, preloading the hero image, avoiding lazy-loading above the fold.\\n- **INP** ≤ 200ms — interaction to next paint. Fix by breaking long tasks (`scheduler.yield`, `isInputPending`), debouncing, moving work to Web Workers.\\n- **CLS** ≤ 0.1 — layout shift. Fix by reserving space: explicit `width/height` or `aspect-ratio` on images, skeletons sized like the real content, `font-display: optional/swap` with size-adjusted fallbacks.\\n\\n### List virtualization\\nRender only the visible window plus an overscan buffer.\\n\\n- **Fixed height** — trivial: `startIndex = floor(scrollTop / rowHeight)`.\\n- **Variable height** — measure with `ResizeObserver`, keep a cumulative-offset array (or a Fenwick tree for O(log n) updates), estimate unmeasured rows.\\n- **Bidirectional / anchored** (chat, feeds) — when prepending items, adjust `scrollTop` by the inserted height in the same frame, or use CSS `overflow-anchor`, otherwise the viewport jumps.\\n- Trade-off to name: virtualization breaks Ctrl+F, breaks naive screen-reader traversal, and breaks anchor links. Mitigate with `aria-setsize`/`aria-posinset` and a \\"load all\\" escape hatch for print/export.\\n\\n### Bundle strategy\\n- Route-level code splitting first, then component-level for heavy widgets (editors, charts, maps).\\n- Preload on intent: `mouseenter`/`focus`/viewport-visible on a link → prefetch the route chunk.\\n- Ship modern syntax to modern browsers (`module`/`nomodule` or build targets); differential loading commonly cuts 15–20%.\\n- Budget it: \\"≤170KB gzipped JS for the critical path\\" is a defensible number to state.\\n\\n### Rendering hygiene\\n- Avoid layout thrash: batch DOM reads then writes; `getBoundingClientRect` in a loop after writes forces sync layout each iteration.\\n- Animate only `transform` and `opacity` (compositor-only properties).\\n- Use `content-visibility: auto` for long off-screen sections.\\n- Use `IntersectionObserver` rather than scroll listeners.\\n- Offload parsing/diffing/sorting of large datasets to a **Web Worker**; keep the main thread for input."},{"id":"frontend-system-design-ebook-7s41ii","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Browser storage & caching","prompt":"","answer":"| Store | Size | Sync/Async | Good for |\\n|---|---|---|---|\\n| Memory | RAM | Sync | Hot cache within a session |\\n| `sessionStorage` | ~5MB | Sync | Per-tab wizard state |\\n| `localStorage` | ~5MB | Sync (blocks main thread) | Small prefs, feature flags |\\n| **IndexedDB** | Large (quota-based) | Async | Offline data, message history, drafts, blobs |\\n| **Cache API** | Quota-based | Async | Service worker asset/response caching |\\n| Cookies | ~4KB | Sync | Auth tokens (`HttpOnly; Secure; SameSite=Lax`) |\\n\\nNotes worth saying: storage can be **evicted** under pressure, so treat it as a cache, not a database; use `navigator.storage.persist()` when data matters. Never put access tokens in `localStorage` if you can avoid it — any XSS reads it."},{"id":"frontend-system-design-ebook-1bjutmr","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Offline, optimistic updates, and conflict resolution","prompt":"","answer":"**Optimistic update pattern**\\n1. Generate a client-side temp id (`tmp_uuid`).\\n2. Apply the change to the store immediately; mark it `pending`.\\n3. Enqueue the mutation in a durable queue (IndexedDB).\\n4. On success, reconcile: swap temp id for the server id.\\n5. On failure, roll back and surface a retry affordance — never a silent revert.\\n\\n**Ordering**: mutations touching the same entity must be applied in order. Queue per-entity, not globally, so one stuck upload doesn\'t block unrelated edits.\\n\\n**Conflict resolution ladder**\\n- **Last-write-wins** — simple, lossy. Fine for a \\"read\\" flag.\\n- **Version / ETag check** — server rejects stale writes with 409; client merges or prompts. Good default for documents and forms.\\n- **Operational Transformation (OT)** — transform concurrent ops against each other; requires a central server; what Google Docs historically used.\\n- **CRDTs** — data structures that merge deterministically without a server (Yjs, Automerge). Better for P2P/offline; larger metadata footprint."},{"id":"frontend-system-design-ebook-1no89k9","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Accessibility (say this in every interview)","prompt":"","answer":"- **Semantics first**: `\\u003cbutton>`, `\\u003cnav>`, `\\u003cmain>`, headings in order. ARIA is a patch, not a foundation.\\n- **Keyboard**: everything reachable, visible focus ring, logical tab order, Escape closes overlays.\\n- **Focus management**: move focus into a dialog on open, trap it, restore it to the trigger on close.\\n- **Live regions**: `aria-live=\\"polite\\"` for async results (\\"12 results found\\"), `assertive` only for errors.\\n- **Composite widgets**: follow the ARIA Authoring Practices pattern (combobox, listbox, grid, tabs) — roving tabindex, arrow-key navigation.\\n- **Contrast** 4.5:1 for body text; don\'t encode meaning in color alone.\\n- **Motion**: honor `prefers-reduced-motion`.\\n- **Testing**: axe in CI, plus manual keyboard + screen reader passes."},{"id":"frontend-system-design-ebook-1q035vc","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Internationalization","prompt":"","answer":"- Externalize strings with ICU message format; support plurals and gender, never string concatenation.\\n- **RTL**: use logical CSS properties (`margin-inline-start`, `padding-block`), mirror icons, `dir=\\"rtl\\"` on `\\u003chtml>`.\\n- Locale-aware formatting via `Intl.NumberFormat`, `Intl.DateTimeFormat`, `Intl.RelativeTimeFormat`, `Intl.Collator`.\\n- Split translation bundles per locale and load lazily; don\'t ship 40 languages to everyone.\\n- Design for **text expansion** — German/Finnish can run 30–40% longer than English; avoid fixed-width buttons.\\n- Store and transmit timestamps in UTC; render in the user\'s timezone."},{"id":"frontend-system-design-ebook-zty0tu","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Frontend security","prompt":"","answer":"- **XSS** — never `innerHTML` untrusted content; sanitize with DOMPurify if you must render HTML; enforce a strict **CSP** (`script-src \'self\' \'nonce-…\'`, no `unsafe-inline`); use Trusted Types where supported.\\n- **CSRF** — `SameSite=Lax/Strict` cookies plus a per-session anti-CSRF token for state-changing requests.\\n- **Token storage** — prefer `HttpOnly` cookies. If you must use JS-readable tokens, keep them in memory with a short TTL and a refresh flow.\\n- **Clickjacking** — `X-Frame-Options: DENY` / `frame-ancestors \'none\'`.\\n- **Third-party scripts** — the largest real-world risk. Use SRI, self-host where possible, sandbox in iframes, and audit what they can reach.\\n- **Dependency hygiene** — lockfiles, automated audit, minimize transitive surface.\\n- **Never trust the client** — validation on the client is UX; authorization happens on the server."},{"id":"frontend-system-design-ebook-vm1qbb","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Observability","prompt":"","answer":"- **RUM**: collect LCP/INP/CLS/TTFB via `web-vitals`, send with `navigator.sendBeacon` on `visibilitychange` (not `unload`).\\n- **Errors**: `window.onerror`, `unhandledrejection`, framework error boundaries; upload source maps privately for symbolication.\\n- **Sampling**: 100% of errors, 1–10% of performance events at scale; always tag release version + user segment.\\n- **Custom timings**: `performance.mark`/`measure` around key flows (\\"time to first message rendered\\").\\n- **Watch p75/p95, not averages.** Averages hide the users who are suffering."},{"id":"frontend-system-design-ebook-u3wq9h","book":"Frontend System Design","part":"PART II — THE TOOLKIT","question":"Explain: Component API design","prompt":"","answer":"For any reusable component, discuss:\\n- **Props**: minimal, typed, no boolean explosion (prefer `variant=\\"danger\\"` over five booleans).\\n- **Controlled vs uncontrolled**: support both (`value` + `defaultValue`).\\n- **Composition over configuration**: `\\u003cSelect>\\u003cOption/>\\u003c/Select>` beats `options={[…]}` when consumers need custom rendering.\\n- **Escape hatches**: `className`, `render` props / slots, forwarded refs.\\n- **Events**: `onChange(value, meta)` — pass useful payloads, not just raw DOM events.\\n- **A11y baked in**: the component owns its ARIA wiring so consumers can\'t get it wrong.\\n- **Theming**: CSS custom properties over prop-based styles."},{"id":"frontend-system-design-ebook-13ko8mg","book":"Frontend System Design","part":"PART III — THE QUESTION BANK","question":"Design a News Feed (Facebook / Twitter)","prompt":"","answer":"**Prompt:** Design the frontend for an infinite news feed with posts, likes, comments, and image/video media.\\n\\n### Clarifying questions\\n- Feed ordering: chronological or ranked by the server? (Assume server-ranked.)\\n- Are new posts pushed live, or is there a \\"new posts\\" pill?\\n- Media types? Do we autoplay video?\\n- SEO required? (For a logged-in feed, usually no.)\\n- Do we support editing/deleting posts inline?\\n\\n### Requirements\\n- Functional: infinite scroll, create post, like/unlike, comment, view media, report.\\n- Non-functional: LCP \\u003c 2.5s on 4G, smooth 60fps scroll, works with 10k posts scrolled in a session without memory growth, WCAG 2.1 AA, offline read of cached feed.\\n\\n### Architecture\\n\\n```\\n        ┌──────────────────────────────────────────┐\\n        │              App Shell                   │\\n        │  ┌────────┐  ┌──────────────────────┐    │\\n        │  │ NavBar │  │ FeedContainer        │    │\\n        │  └────────┘  │  ├ Composer          │    │\\n        │              │  ├ NewPostsPill      │    │\\n        │              │  ├ VirtualList       │    │\\n        │              │  │   └ PostCard[]    │    │\\n        │              │  │       ├ Header    │    │\\n        │              │  │       ├ Content   │    │\\n        │              │  │       ├ Media     │    │\\n        │              │  │       ├ Actions   │    │\\n        │              │  │       └ Comments  │    │\\n        │              │  └ Sentinel(IO)      │    │\\n        │              └──────────────────────┘    │\\n        └──────────────────────────────────────────┘\\n                    │            ▲\\n             mutations           │ normalized entities\\n                    ▼            │\\n        ┌──────────────────────────────────────────┐\\n        │  Data layer: cache + dedupe + retry      │\\n        │  ├ HTTP client (fetch + AbortController) │\\n        │  ├ Normalized entity store               │\\n        │  └ SSE/WS channel for live counts        │\\n        └──────────────────────────────────────────┘\\n                    │\\n                  BFF  →  Feed svc / Post svc / User svc / Media CDN\\n```\\n\\n### Data model (client, normalized)\\n\\n```ts\\ntype Post = {\\n  id: string; authorId: string; createdAt: string;\\n  text: string; media: Media[];\\n  likeCount: number; commentCount: number;\\n  viewerHasLiked: boolean;\\n  status?: \'pending\' | \'failed\';   // for optimistic posts\\n};\\ntype Media = { id: string; type: \'image\'|\'video\'; url: string;\\n               width: number; height: number; blurhash: string;\\n               hlsUrl?: string; posterUrl?: string };\\n```\\n\\n`width/height` are **required** — they let you reserve space and keep CLS at zero.\\n\\n### API\\n\\n```\\nGET /api/feed?cursor=\\u003copaque>&limit=10\\n→ { items: Post[], users: User[], nextCursor: string|null }\\n\\nPOST /api/posts            { text, mediaIds[] }   Idempotency-Key: \\u003cuuid>\\nPOST /api/posts/:id/like   → { likeCount, viewerHasLiked }\\nDELETE /api/posts/:id/like\\nGET  /api/posts/:id/comments?cursor=&limit=20\\n```\\n\\nCursor pagination, not offset — new posts arriving at the head would otherwise duplicate items across pages.\\n\\n### Deep dive: infinite scroll\\n- `IntersectionObserver` on a sentinel element ~2 viewports before the end, with `rootMargin: \'800px\'`, so the next page loads before the user hits the bottom.\\n- Guard against duplicate fetches with an `isFetchingNextPage` flag keyed by cursor.\\n- Render skeleton cards while loading; keep them the same height as real cards.\\n- Keep the feed list **virtualized*
