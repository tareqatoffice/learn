pt":"","answer":"**Short answer.** It resolves the path, loads the file, wraps it in a function, executes it once, caches the result, and returns `module.exports`.\\n\\n**Explanation.** Every CommonJS file is wrapped before execution:\\n\\n```js\\n(function (exports, require, module, __filename, __dirname) {\\n  // your file\'s code lives here\\n});\\n```\\n\\nThat is why those five identifiers exist without being declared, and why top-level `var` in a module is not global.\\n\\nResolution order for `require(\'foo\')`:\\n1. Core module? (`fs`, `http`) → return it.\\n2. Starts with `./`, `../`, `/`? → resolve as file, then as directory (`index.js` or the `main` field of its `package.json`).\\n3. Otherwise walk up `node_modules` folders from the current directory to the filesystem root.\\n\\n**Watch out.** The module cache is keyed by resolved filename. A module\'s top-level code runs **once** per process, no matter how many files require it. This is what makes the singleton pattern trivial in Node:\\n\\n```js\\n// db.js\\nconst pool = createPool(process.env.DATABASE_URL);\\nmodule.exports = pool;   // every requirer gets the same pool\\n```"},{"id":"nodejs-questions-ebook-43ivu2","book":"Node.js","part":"Part 3 — Modules","question":"`exports` vs `module.exports`","prompt":"","answer":"**Short answer.** `exports` is just a local variable initially pointing at the same object as `module.exports`. Reassigning `exports` breaks the link; only `module.exports` is actually returned.\\n\\n**Explanation.**\\n\\n```js\\n// Works — mutating the shared object\\nexports.add = (a, b) => a + b;\\n\\n// Broken — rebinds the local variable only\\nexports = { add: (a, b) => a + b };\\n\\n// Correct way to export a single thing\\nmodule.exports = (a, b) => a + b;\\n```\\n\\n**Watch out.** Mixing both in one file is a classic bug: `module.exports = X` followed later by `exports.y = z` silently discards `y`."},{"id":"nodejs-questions-ebook-741iby","book":"Node.js","part":"Part 3 — Modules","question":"What are circular dependencies and how does Node handle them?","prompt":"","answer":"**Short answer.** When A requires B and B requires A, Node returns B a *partially populated* copy of A\'s exports rather than looping forever.\\n\\n**Explanation.**\\n\\n```js\\n// a.js\\nexports.name = \'A\';\\nconst b = require(\'./b\');\\nconsole.log(\'in a, b.name =\', b.name);\\n\\n// b.js\\nconst a = require(\'./a\');\\nconsole.log(\'in b, a.name =\', a.name);  // \'A\' — set before the require\\nexports.name = \'B\';\\n```\\n\\nIf you move `exports.name = \'A\'` below the `require(\'./b\')` line, b sees `undefined`.\\n\\n**Watch out.** The fix is almost never a clever require trick. It\'s a design change: extract the shared piece into a third module, or pass the dependency in rather than importing it."},{"id":"nodejs-questions-ebook-17namsl","book":"Node.js","part":"Part 4 — Core APIs","question":"What is a Buffer?","prompt":"","answer":"**Short answer.** A fixed-length chunk of raw binary data outside the V8 heap — Node\'s way of handling bytes before JavaScript had typed arrays.\\n\\n**Explanation.**\\n\\n```js\\nconst buf = Buffer.from(\'হ্যালো\', \'utf8\');\\nconsole.log(buf.length);          // bytes, not characters\\nconsole.log(buf.toString(\'hex\'));\\nconsole.log(buf.toString(\'base64\'));\\n\\nconst empty = Buffer.alloc(10);        // zero-filled, safe\\nconst fast  = Buffer.allocUnsafe(10);  // faster, may contain old memory\\n```\\n\\nBuffers appear everywhere: file reads without an encoding, socket data, crypto output, image bytes.\\n\\n**Watch out.** `Buffer.allocUnsafe` can leak previously used memory into your output if you don\'t overwrite every byte. Never send it anywhere without filling it first. Also: `buf.length` is byte length — a multi-byte character counts more than once, which breaks naive slicing of UTF-8 text."},{"id":"nodejs-questions-ebook-128a8fg","book":"Node.js","part":"Part 4 — Core APIs","question":"What are streams, and what are the four types?","prompt":"","answer":"**Short answer.** Streams process data in chunks instead of loading it all into memory. The four types are Readable, Writable, Duplex, and Transform.\\n\\n**Explanation.** Reading a 4 GB file into a Buffer will exhaust memory. Streaming it uses a constant, small buffer:\\n\\n```js\\nconst fs = require(\'fs\');\\nconst zlib = require(\'zlib\');\\nconst { pipeline } = require(\'stream/promises\');\\n\\nawait pipeline(\\n  fs.createReadStream(\'access.log\'),\\n  zlib.createGzip(),\\n  fs.createWriteStream(\'access.log.gz\')\\n);\\n```\\n\\n| Type | Example |\\n|---|---|\\n| Readable | `fs.createReadStream`, HTTP request |\\n| Writable | `fs.createWriteStream`, HTTP response |\\n| Duplex | TCP socket (both ends independent) |\\n| Transform | `zlib.createGzip`, `crypto.createCipheriv` |\\n\\n**Watch out.** Use `pipeline`, not `.pipe()`. `.pipe()` does not forward errors or destroy the remaining streams on failure, which leaks file descriptors. `pipeline` cleans up everything."},{"id":"nodejs-questions-ebook-1iklsma","book":"Node.js","part":"Part 4 — Core APIs","question":"What is backpressure?","prompt":"","answer":"**Short answer.** The mechanism that stops a fast producer from overwhelming a slow consumer. `write()` returns `false` when the internal buffer is full; you should pause until `\'drain\'`.\\n\\n**Explanation.**\\n\\n```js\\n// Wrong — memory grows without bound if the socket is slow\\nreadable.on(\'data\', chunk => writable.write(chunk));\\n\\n// Right — respect the return value\\nreadable.on(\'data\', chunk => {\\n  if (!writable.write(chunk)) {\\n    readable.pause();\\n    writable.once(\'drain\', () => readable.resume());\\n  }\\n});\\n\\n// Best — pipeline handles all of this for you\\nawait pipeline(readable, writable);\\n```\\n\\n**Watch out.** This is the number one cause of mysterious memory growth when proxying uploads or streaming database results to a client on a slow connection."},{"id":"nodejs-questions-ebook-1jarxas","book":"Node.js","part":"Part 4 — Core APIs","question":"What is `EventEmitter`?","prompt":"","answer":"**Short answer.** Node\'s implementation of the observer pattern. Objects emit named events; listeners subscribe. Most core objects — servers, sockets, streams, processes — are emitters.\\n\\n**Explanation.**\\n\\n```js\\nconst { EventEmitter } = require(\'events\');\\n\\nclass Job extends EventEmitter {\\n  async run() {\\n    this.emit(\'start\');\\n    try {\\n      const result = await doWork();\\n      this.emit(\'done\', result);\\n    } catch (err) {\\n      this.emit(\'error\', err);\\n    }\\n  }\\n}\\n\\nconst job = new Job();\\njob.on(\'done\', r => console.log(\'finished\', r));\\njob.on(\'error\', e => console.error(e));   // required, see below\\njob.once(\'start\', () => console.log(\'started once\'));\\n```\\n\\n**Watch out.** Two traps.\\n\\n1. An `\'error\'` event with **no listener** throws and crashes the process. Always attach one.\\n2. Listeners are called **synchronously** in registration order. A slow listener blocks the emitter. And more than 10 listeners on one event logs a memory-leak warning — usually a real bug where you attach inside a request handler and never remove."},{"id":"nodejs-questions-ebook-6dna2m","book":"Node.js","part":"Part 4 — Core APIs","question":"How do you read and write files properly?","prompt":"","answer":"**Short answer.** Use the promise API `fs/promises` for one-shot operations, and streams for large files.\\n\\n**Explanation.**\\n\\n```js\\nconst fs = require(\'fs/promises\');\\nconst path = require(\'path\');\\n\\n// Read\\nconst text = await fs.readFile(path.join(__dirname, \'data.json\'), \'utf8\');\\n\\n// Write atomically-ish: write to temp, then rename\\nconst tmp = `${target}.${process.pid}.tmp`;\\nawait fs.writeFile(tmp, payload);\\nawait fs.rename(tmp, target);   // rename is atomic on the same filesystem\\n\\n// Directory\\nawait fs.mkdir(dir, { recursive: true });\\nconst entries = await fs.readdir(dir, { withFileTypes: true });\\n```\\n\\n**Watch out.** Never build paths with string concatenation — use `path.join` so it works on every OS, and validate any user-supplied segment. `path.join(\'/uploads\', \'../../etc/passwd\')` escapes the directory. Resolve and then check the prefix:\\n\\n```js\\nconst full = path.resolve(UPLOAD_DIR, userInput);\\nif (!full.startsWith(path.resolve(UPLOAD_DIR) + path.sep)) throw new Error(\'bad path\');\\n```"},{"id":"nodejs-questions-ebook-2bwjym","book":"Node.js","part":"Part 4 — Core APIs","question":"`path.join` vs `path.resolve`","prompt":"","answer":"**Short answer.** `join` concatenates segments and normalizes. `resolve` processes right-to-left until it builds an absolute path, treating a leading `/` as a reset.\\n\\n```js\\npath.join(\'/a\', \'b\', \'../c\');   // \'/a/c\'\\npath.resolve(\'/a\', \'/b\', \'c\');  // \'/b/c\'   — the second absolute path wins\\npath.resolve(\'b\', \'c\');         // \'\\u003ccwd>/b/c\'\\n```"},{"id":"nodejs-questions-ebook-19n8jhd","book":"Node.js","part":"Part 5 — Processes, Clusters, and Worker Threads","question":"`child_process`: `spawn` vs `exec` vs `fork`","prompt":"","answer":"**Short answer.** `spawn` streams output and is safe for large or long-running commands. `exec` buffers all output and runs through a shell. `fork` is a special case of spawn for launching another Node script with an IPC channel.\\n\\n**Explanation.**\\n\\n```js\\nconst { spawn, exec, fork } = require(\'child_process\');\\n\\n// spawn — streams, no shell by default\\nconst p = spawn(\'ffmpeg\', [\'-i\', input, output]);\\np.stdout.on(\'data\', d => console.log(d.toString()));\\np.on(\'close\', code => console.log(\'exit\', code));\\n\\n// exec — buffered, shell interpretation\\nexec(\'git rev-parse HEAD\', (err, stdout) => console.log(stdout.trim()));\\n\\n// fork — another Node process with message passing\\nconst worker = fork(\'./report-builder.js\');\\nworker.send({ reportId: 42 });\\nworker.on(\'message\', msg => console.log(\'got\', msg));\\n```\\n\\n**Watch out.** `exec` runs your string through `/bin/sh`. Interpolating user input into it is command injection. Use `spawn` with an argument array, which never touches a shell. Also, `exec` has a `maxBuffer` (1 MB default) — exceed it and the child is killed."},{"id":"nodejs-questions-ebook-hnbxxl","book":"Node.js","part":"Part 5 — Processes, Clusters, and Worker Threads","question":"What is the `cluster` module?","prompt":"","answer":"**Short answer.** It forks the Node process once per CPU core, letting all workers share one listening port so you use the whole machine.\\n\\n**Explanation.**\\n\\n```js\\nconst cluster = require(\'cluster\');\\nconst os = require(\'os\');\\n\\nif (cluster.isPrimary) {\\n  for (let i = 0; i \\u003c os.cpus().length; i++) cluster.fork();\\n  cluster.on(\'exit\', (worker, code) => {\\n    console.log(`worker ${worker.process.pid} died (${code}), restarting`);\\n    cluster.fork();\\n  });\\n} else {\\n  require(\'./server\');   // each worker runs a full server\\n}\\n```\\n\\nThe primary process accepts connections and distributes them (round-robin on Linux by default).\\n\\n**Watch out.** Workers share nothing. In-memory sessions, caches, rate-limit counters, and WebSocket connection maps all break the moment you cluster. Move that state to Redis. In containerized deployments, most teams skip `cluster` entirely and run one process per container, letting the orchestrator scale — simpler and more observable."},{"id":"nodejs-questions-ebook-1lwmbe5","book":"Node.js","part":"Part 5 — Processes, Clusters, and Worker Threads","question":"`cluster` vs `worker_threads` — when do you use which?","prompt":"","answer":"**Short answer.** `cluster` scales I/O throughput with separate processes and separate memory. `worker_threads` runs CPU-bound JavaScript on other threads inside one process, with the ability to share memory.\\n\\n**Explanation.**\\n\\n```js\\n// main.js\\nconst { Worker } = require(\'worker_threads\');\\n\\nfunction hashInWorker(payload) {\\n  return new Promise((resolve, reject) => {\\n    const w = new Worker(\'./hash-worker.js\', { workerData: payload });\\n    w.on(\'message\', resolve);\\n    w.on(\'error\', reject);\\n    w.on(\'exit\', code => code !== 0 && reject(new Error(`exit ${code}`)));\\n  });\\n}\\n\\n// hash-worker.js\\nconst { workerData, parentPort } = require(\'worker_threads\');\\nparentPort.postMessage(expensiveHash(workerData));\\n```\\n\\n| | cluster | worker_threads |\\n|---|---|---|\\n| Unit | process | thread |\\n| Memory | isolated | can share via `SharedArrayBuffer` |\\n| Startup cost | high (~30 ms+) | lower (~5 ms) |\\n| Crash blast radius | one worker | can take down the process |\\n| Use for | HTTP concurrency | CPU tasks: parsing, hashing, image work |\\n\\n**Watch out.** Spawning a worker per request is slower than doing the work inline. Keep a pool (e.g. `piscina`)."},{"id":"nodejs-questions-ebook-3w3upa","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"Build an HTTP server without a framework.","prompt":"","answer":"**Short answer.** The `http` module gives you a request/response callback; everything Express does is built on it.\\n\\n```js\\nconst http = require(\'http\');\\n\\nconst server = http.createServer((req, res) => {\\n  if (req.method === \'GET\' && req.url === \'/health\') {\\n    res.writeHead(200, { \'Content-Type\': \'application/json\' });\\n    return res.end(JSON.stringify({ ok: true }));\\n  }\\n  res.writeHead(404).end(\'Not Found\');\\n});\\n\\nserver.listen(3000, () => console.log(\'listening on 3000\'));\\n```\\n\\n**Watch out.** `req` is a Readable stream. The body has not arrived when the handler is called — you must collect `\'data\'` chunks and wait for `\'end\'`, which is exactly what `express.json()` does for you."},{"id":"nodejs-questions-ebook-1204mf2","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"What is middleware?","prompt":"","answer":"**Short answer.** A function with the signature `(req, res, next)` that runs in order on the way to a route handler. It can inspect, modify, respond, or pass control onward.\\n\\n**Explanation.**\\n\\n```js\\n// Logging middleware\\napp.use((req, res, next) => {\\n  const start = Date.now();\\n  res.on(\'finish\', () => {\\n    logger.info({ method: req.method, url: req.originalUrl,\\n                  status: res.statusCode, ms: Date.now() - start });\\n  });\\n  next();\\n});\\n\\n// Auth middleware\\nfunction requireAuth(req, res, next) {\\n  const token = req.headers.authorization?.split(\' \')[1];\\n  if (!token) return res.status(401).json({ error: \'Missing token\' });\\n  try {\\n    req.user = jwt.verify(token, process.env.JWT_SECRET);\\n    next();\\n  } catch {\\n    res.status(401).json({ error: \'Invalid token\' });\\n  }\\n}\\n\\napp.get(\'/orders\', requireAuth, listOrders);\\n```\\n\\n**Watch out.** Forgetting `next()` hangs the request silently — no error, no response, just a client timeout. And calling `next()` *after* sending a response produces \\"Cannot set headers after they are sent\\". Always `return` when you respond."},{"id":"nodejs-questions-ebook-1idsyv7","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"How does Express error handling work?","prompt":"","answer":"**Short answer.** An error-handling middleware takes **four** arguments `(err, req, res, next)` and must be registered last. Errors reach it via `next(err)` or by throwing in a synchronous handler.\\n\\n**Explanation.**\\n\\n```js\\nclass AppError extends Error {\\n  constructor(message, status = 500, code) {\\n    super(message);\\n    this.status = status;\\n    this.code = code;\\n  }\\n}\\n\\n// Wrapper so async rejections reach Express\\nconst ca = fn => (req, res, next) => Promise.resolve(fn(req, res, next)).catch(next);\\n\\napp.get(\'/users/:id\', ca(async (req, res) => {\\n  const user = await db.users.findById(req.params.id);\\n  if (!user) throw new AppError(\'User not found\', 404, \'USER_NOT_FOUND\');\\n  res.json(user);\\n}));\\n\\n// 404 fallthrough\\napp.use((req, res) => res.status(404).json({ error: \'Not found\' }));\\n\\n// Central error handler — four args, registered last\\napp.use((err, req, res, next) => {\\n  const status = err.status || 500;\\n  if (status >= 500) logger.error({ err, url: req.originalUrl });\\n  res.status(status).json({\\n    error: status >= 500 ? \'Internal server error\' : err.message,\\n    code: err.code\\n  });\\n});\\n```\\n\\n**Watch out.** In Express 4, a rejected promise in an async handler is **not** caught automatically — the request hangs. Either wrap every async handler as above or upgrade to Express 5, which forwards rejections to the error handler."},{"id":"nodejs-questions-ebook-wvfcgh","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"`app.use` vs `app.get` vs `router`","prompt":"","answer":"**Short answer.** `app.use` mounts middleware for all methods on a path prefix. `app.get` matches one method and an exact path pattern. `Router` is a mountable mini-app for grouping routes.\\n\\n```js\\nconst router = express.Router();\\nrouter.get(\'/\', listProducts);\\nrouter.post(\'/\', requireAuth, createProduct);\\nrouter.get(\'/:id\', getProduct);\\n\\napp.use(\'/api/v1/products\', router);\\n```"},{"id":"nodejs-questions-ebook-1hyd4rk","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"Design a REST API — what makes it good?","prompt":"","answer":"**Short answer.** Nouns for resources, HTTP verbs for actions, correct status codes, versioning, pagination, consistent error shapes, and idempotency where it matters.\\n\\n**Explanation.**\\n\\n```\\nGET    /api/v1/orders?page=2&limit=20&status=pending\\nPOST   /api/v1/orders\\nGET    /api/v1/orders/:id\\nPATCH  /api/v1/orders/:id\\nDELETE /api/v1/orders/:id\\nPOST   /api/v1/orders/:id/cancel      // an action that isn\'t CRUD\\n```\\n\\nStatus codes that actually get used:\\n\\n| Code | Meaning |\\n|---|---|\\n| 200 / 201 / 204 | OK / Created / No Content |\\n| 400 | Malformed or invalid input |\\n| 401 / 403 | Not authenticated / authenticated but not allowed |\\n| 404 | Resource does not exist |\\n| 409 | Conflict — duplicate, version mismatch |\\n| 422 | Semantically invalid |\\n| 429 | Rate limited |\\n| 500 / 503 | Server fault / temporarily unavailable |\\n\\nConsistent error envelope:\\n\\n```json\\n{ \\"error\\": { \\"code\\": \\"INSUFFICIENT_STOCK\\", \\"message\\": \\"Only 3 units left\\", \\"field\\": \\"quantity\\" } }\\n```\\n\\n**Watch out.** PUT should be idempotent (same request twice = same state). POST is not — so for payments and order creation, accept an `Idempotency-Key` header and de-duplicate on it. Ask this in an interview and few candidates mention it."},{"id":"nodejs-questions-ebook-2walhy","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"How do you handle file uploads?","prompt":"","answer":"**Short answer.** Use `multer` for `multipart/form-data`, cap the size, validate the type, and stream large files straight to object storage rather than through your process memory.\\n\\n```js\\nconst multer = require(\'multer\');\\nconst upload = multer({\\n  limits: { fileSize: 5 * 1024 * 1024, files: 1 },\\n  fileFilter: (req, file, cb) => {\\n    const ok = [\'image/jpeg\', \'image/png\', \'application/pdf\'].includes(file.mimetype);\\n    cb(ok ? null : new AppError(\'Unsupported file type\', 400), ok);\\n  }\\n});\\n\\napp.post(\'/documents\', requireAuth, upload.single(\'file\'), handler);\\n```\\n\\n**Watch out.** `file.mimetype` comes from the client and is trivially spoofed. For anything sensitive, sniff the magic bytes server-side. Never store an uploaded file under its original name — generate one, or you inherit path traversal and overwrite bugs."},{"id":"nodejs-questions-ebook-1snwmts","book":"Node.js","part":"Part 6 — HTTP, Express, and API Design","question":"What is CORS and when do you hit it?","prompt":"","answer":"**Short answer.** A browser security policy. The browser refuses cross-origin responses unless the server sends `Access-Control-Allow-Origin` headers permitting it.\\n\\n```js\\nconst cors = require(\'cors\');\\napp.use(cors({\\n  origin: [\'https://app.example.com\'],\\n  credentials: true,      // required to send cookies\\n  methods: [\'GET\', \'POST\', \'PATCH\', \'DELETE\']\\n}));\\n```\\n\\n**Watch out.** `origin: \'*\'` and `credentials: true` are incompatible — the browser rejects the combination. Also, CORS is enforced by the browser only; it protects your users, not your server. Postman and curl ignore it entirely, so CORS is never an authorization mechanism."},{"id":"nodejs-questions-ebook-pbv9w3","book":"Node.js","part":"Part 7 — Databases and Data Access","question":"Why do you need a connection pool?","prompt":"","answer":"**Short answer.** Opening a database connection costs a TCP handshake plus authentication — tens of milliseconds. A pool keeps a set of connections open and hands them out per query.\\n\\n```js\\nconst { Pool } = require(\'pg\');\\nconst pool = new Pool({\\n  connectionString: process.env.DATABASE_URL,\\n  max: 20,\\n  idleTimeoutMillis: 30_000,\\n  connectionTimeoutMillis: 5_000\\n});\\n\\nconst { rows } = await pool.query(\'SELECT * FROM orders WHERE user_id = $1\', [userId]);\\n```\\n\\n**Watch out.** Pool size is per process. Four clustered workers with `max: 20` means 80 connections — which may exceed your Postgres `max_connections`. Size the pool as `db_limit / process_count`, with room for migrations and admin tools."},{"id":"nodejs-questions-ebook-qte7dv","book":"Node.js","part":"Part 7 — Databases and Data Access","question":"How do you prevent SQL injection?","prompt":"","answer":"**Short answer.** Parameterized queries. Always. Never build SQL by string concatenation.\\n\\n```js\\n// Vulnerable\\ndb.query(`SELECT * FROM users WHERE email = \'${email}\'`);\\n\\n// Safe — the driver sends the value separately from the statement\\ndb.query(\'SELECT * FROM users WHERE email = $1\', [email]);\\n```\\n\\n**Watch out.** Parameters can only substitute *values*, not identifiers. `ORDER BY $1` won\'t work for a column name, so dynamic sorting must be validated against a whitelist:\\n\\n```js\\nconst SORTABLE = new Set([\'created_at\', \'total\', \'status\']);\\nif (!SORTABLE.has(sortBy)) throw new AppError(\'Invalid sort field\', 400);\\n```"},{"id":"nodejs-questions-ebook-10z17u","book":"Node.js","part":"Part 7 — Databases and Data Access","question":"What is the N+1 query problem?","prompt":"","answer":"**Short answer.** Fetching a list with one query, then issuing one more query per row to load a relation — 1 + N round trips where 2 would do.\\n\\n```js\\n// N+1\\nconst orders = await Order.find();\\nfor (const o of orders) o.customer = await Customer.findById(o.customerId);\\n\\n// Fixed with a join / populate\\nconst orders = await Order.find().populate(\'customer\');\\n\\n// Or batch it\\nconst ids = [...new Set(orders.map(o => o.customerId))];\\nconst customers = await Customer.find({ _id: { $in: ids } });\\nconst byId = new Map(customers.map(c => [String(c._id), c]));\\norders.forEach(o => { o.customer = byId.get(String(o.customerId)); });\\n```\\n\\n**Watch out.** N+1 is invisible in development with 10 rows and catastrophic in production with 10,000. Log query counts per request in staging."},{"id":"nodejs-questions-ebook-1ec5uaq","book":"Node.js","part":"Part 7 — Databases and Data Access","question":"How do you use transactions?","prompt":"","answer":"**Short answer.** Wrap the operations in BEGIN/COMMIT, roll back on any error, and always release the connection in a `finally`.\\n\\n```js\\nasync function transfer(fromId, toId, amount) {\\n  const client = await pool.connect();\\n  try {\\n    await client.query(\'BEGIN\');\\n    await client.query(\'UPDATE accounts SET balance = balance - $1 WHERE id = $2\', [amount, fromId]);\\n    await client.query(\'UPDATE accounts SET balance = balance + $1 WHERE id = $2\', [amount, toId]);\\n    await client.query(\'COMMIT\');\\n  } catch (err) {\\n    await client.query(\'ROLLBACK\');\\n    throw err;\\n  } finally {\\n    client.release();\\n  }\\n}\\n```\\n\\n**Watch out.** Never call an external HTTP API inside an open transaction. A slow third party holds a database lock for its entire timeout window and can cascade into pool exhaustion."},{"id":"nodejs-questions-ebook-308r2o","book":"Node.js","part":"Part 7 — Databases and Data Access","question":"When would you choose SQL vs NoSQL for a Node app?","prompt":"","answer":"**Short answer.** Relational when your data has relationships and you need transactional integrity — orders, payments, inventory. Document when your records are self-contained, schema varies, and read patterns are known — event logs, CMS content, product catalogs with irregular attributes.\\n\\n**Watch out.** \\"MongoDB because Node\\" is not a reason. The real questions are: do you need multi-row atomicity, do you need ad-hoc joins, and how will the access pattern change. Most business applications are relational underneath and are poorly served by pretending otherwise."},{"id":"nodejs-questions-ebook-6vf8b3","book":"Node.js","part":"Part 8 — Security","question":"How do you store passwords?","prompt":"","answer":"**Short answer.** Hash them with a slow, salted algorithm — bcrypt, scrypt, or Argon2. Never encrypt, never use MD5 or SHA-256 alone.\\n\\n```js\\nconst bcrypt = require(\'bcrypt\');\\n\\nconst hash = await bcrypt.hash(password, 12);   // cost factor 12\\nconst ok = await bcrypt.compare(candidate, hash);\\n```\\n\\n**Explanation.** Fast hashes are the problem: a GPU tries billions of SHA-256 guesses per second. bcrypt is deliberately slow and includes a per-password salt, so rainbow tables are useless and brute force is expensive. The cost factor is a tunable exponent — raise it as hardware improves.\\n\\n**Watch out.** Use the async version. `bcrypt.hashSync` with cost 12 blocks the event loop for ~250 ms, so a login burst becomes a self-inflicted denial of service. Also, compare with `bcrypt.compare`, never `===`, so the comparison stays constant-time."},{"id":"nodejs-questions-ebook-r2qpag","book":"Node.js","part":"Part 8 — Security","question":"JWT vs session cookies","prompt":"","answer":"**Short answer.** Sessions store state server-side and hand the client an opaque ID — easy to revoke. JWTs are self-contained signed tokens — stateless and scalable, but you cannot un-issue one before it expires.\\n\\n**Explanation.**\\n\\n```js\\nconst token = jwt.sign(\\n  { sub: user.id, role: user.role },\\n  process.env.JWT_SECRET,\\n  { expiresIn: \'15m\' }\\n);\\n```\\n\\nThe standard compromise: a short-lived access token (10–15 minutes) plus a long-lived refresh token stored in the database, so revocation works by deleting the refresh token.\\n\\n| | Session | JWT |\\n|---|---|---|\\n| Server state | yes (store/Redis) | none |\\n| Revocation | immediate | hard — needs a blocklist |\\n| Payload visible to client | no | yes (base64, not encrypted) |\\n| Scales across services | needs shared store | naturally |\\n\\n**Watch out.** JWT payloads are **encoded, not encrypted** — anyone can read them. Never put anything sensitive inside. And always specify the algorithm on verify; accepting `alg: none` or letting the token dictate the algorithm is a well-known attack."},{"id":"nodejs-questions-ebook-kxuje0","book":"Node.js","part":"Part 8 — Security","question":"Where should you store a token in the browser?","prompt":"","answer":"**Short answer.** An `httpOnly`, `Secure`, `SameSite` cookie. `localStorage` is readable by any injected script, so any XSS becomes full account takeover.\\n\\n```js\\nres.cookie(\'refresh\', token, {\\n  httpOnly: true,\\n  secure: process.env.NODE_ENV === \'production\',\\n  sameSite: \'strict\',\\n  maxAge: 7 * 24 * 60 * 60 * 1000\\n});\\n```\\n\\n**Watch out.** Cookies bring CSRF risk back, which `SameSite=strict` or `lax` largely handles; add a CSRF token for state-changing requests if you support older browsers or cross-site flows."},{"id":"nodejs-questions-ebook-14lb5iv","book":"Node.js","part":"Part 8 — Security","question":"Name the common Node security mistakes and their fixes.","prompt":"","answer":"| Risk | Fix |\\n|---|---|\\n| SQL / NoSQL injection | Parameterized queries; validate and cast input types |\\n| XSS in rendered templates | Escape output; set a Content-Security-Policy |\\n| Secrets in git | Environment variables, a secret manager, `.gitignore` |\\n| Vulnerable dependencies | `npm audit`, Dependabot, lock files, fewer deps |\\n| Missing security headers | `helmet()` |\\n| No rate limiting | `express-rate-limit`, stricter on auth endpoints |\\n| Verbose error responses | Generic message to client, full detail to logs |\\n| Unbounded request body | `express.json({ limit: \'100kb\' })` |\\n| Command injection | `spawn` with an args array, never `exec` with interpolation |\\n| Path traversal | `path.resolve` + prefix check |\\n\\n```js\\nconst helmet = require(\'helmet\');\\nconst rateLimit = require(\'express-rate-limit\');\\n\\napp.use(helmet());\\napp.use(\'/api/auth\', rateLimit({ windowMs: 15 * 60_000, max: 10 }));\\napp.use(express.json({ limit: \'100kb\' }));\\napp.disable(\'x-powered-by\');\\n```\\n\\n**Watch out.** NoSQL injection is real: if `req.body.password` arrives as `{ \\"$ne\\": null }` and you pass it straight into a Mongo query, the comparison always matches. Validate that inputs are the type you expect — `zod`, `joi`, or an explicit `String()` cast."},{"id":"nodejs-questions-ebook-3258ck","book":"Node.js","part":"Part 8 — Security","question":"How do you validate input?","prompt":"","answer":"**Short answer.** At the boundary, with a schema, before anything touches business logic. Reject early with a 400 and a field-level message.\\n\\n```js\\nconst { z } = require(\'zod\');\\n\\nconst createOrder = z.object({\\n  productId: z.string().uuid(),\\n  quantity: z.number().int().positive().max(100),\\n  note: z.string().max(500).optional()\\n});\\n\\nconst validate = schema => (req, res, next) => {\\n  const result = schema.safeParse(req.body);\\n  if (!result.success) {\\n    return res.status(400).json({ error: \'Validation failed\', details: result.error.issues });\\n  }\\n  req.body = result.data;   // parsed and coerced\\n  next();\\n};\\n\\napp.post(\'/orders\', requireAuth, validate(createOrder), handler);\\n```\\n\\n**Watch out.** Validation is not authorization. Confirming the payload is well-formed says nothing about whether *this* user may act on *that* resource. Check ownership separately — a huge share of real-world breaches are broken object-level authorization, not injection."},{"id":"nodejs-questions-ebook-1x5a0yk","book":"Node.js","part":"Part 9 — Performance, Memory, and Scaling","question":"How do you find out why a Node app is slow?","prompt":"","answer":"**Short answer.** Measure before guessing. Use the built-in profiler, `--inspect` with Chrome DevTools, event loop lag metrics, and APM traces.\\n\\n```bash\\nnode --prof app.js && node --prof-process isolate-*.log > profile.txt\\nnode --inspect app.js         # then chrome://inspect\\nnode --cpu-prof app.js        # writes a .cpuprofile\\nclinic doctor -- node app.js  # high-level diagnosis\\n```\\n\\nEvent loop lag is the single most useful number:\\n\\n```js\\nlet last = Date.now();\\nsetInterval(() => {\\n  const lag = Date.now() - last - 1000;\\n  if (lag > 100) logger.warn({ lag }, \'event loop lag\');\\n  last = Date.now();\\n}, 1000);\\n```\\n\\n**Watch out.** Slowness in Node is usually one of four things: a blocked event loop, an N+1 query, a missing index, or a serial `await` chain that should be parallel. Check those before optimizing algorithms."},{"id":"nodejs-questions-ebook-1ow2z7c","book":"Node.js","part":"Part 9 — Performance, Memory, and Scaling","question":"How do you find a memory leak?","prompt":"","answer":"**Short answer.** Watch `heapUsed` over time; if it climbs and never returns after GC, take two heap snapshots under load and compare retained objects.\\n\\n```js\\nsetInterval(() => {\\n  const { heapUsed, rss } = process.memoryUsage();\\n  logger.info({ heapMB: (heapUsed / 1e6).toFixed(1), rssMB: (rss / 1e6).toFixed(1) });\\n}, 30_000);\\n```\\n\\nCommon causes:\\n\\n- A module-level array or `Map` that only ever grows (a cache with no eviction).\\n- Listeners added per request to a long-lived emitter and never removed.\\n- Closures capturing large objects held by a timer that is never cleared.\\n- Unbounded buffering because backpressure was ignored.\\n- Global variables written accidentally.\\n\\n```js\\n// Leak\\nconst cache = new Map();\\napp.get(\'/x/:id\', (req, res) => { cache.set(req.params.id, buildBig()); /* ... */ });\\n\\n// Fixed — bounded LRU with TTL\\nconst LRU = require(\'lru-cache\');\\nconst cache = new LRU({ max: 1000, ttl: 5 * 60_000 });\\n```\\n\\n**Watch out.** Rising RSS is not automatically a leak — V8 grows the heap lazily and only compacts under pressure. The signal is that heap usage after a full GC keeps trending up across hours."},{"id":"nodejs-questions-ebook-12vqo5w","book":"Node.js","part":"Part 9 — Performance, Memory, and Scaling","question":"What caching strategies apply to a Node API?","prompt":"","answer":"**Short answer.** Cache at the layer with the best hit ratio and the cheapest invalidation: HTTP headers at the edge, Redis for shared computed data, in-process for tiny hot lookups.\\n\\n```js\\n// Cache-aside with Redis\\nasync function getProduct(id) {\\n  const key = `product:${id}`;\\n  const hit = await redis.get(key);\\n  if (hit) return JSON.parse(hit);\\n\\n  const product = await db.products.findById(id);\\n  await redis.set(key, JSON.stringify(product), \'EX\', 300);\\n  return product;\\n}\\n\\n// Invalidate on write\\nasync function updateProduct(id, patch) {\\n  const updated = await db.products.update(id, patch);\\n  await redis.del(`product:${id}`);\\n  return updated;\\n}\\n```\\n\\n**Watch out.** Two things kill naive caches: a stampede (a thousand requests miss simultaneously and all hit the database — fix with a lock or `stale-while-revalidate`), and forgotten invalidation paths (an admin tool that writes directly to the database never clears Redis)."},{"id":"nodejs-questions-ebook-dn6n2h","book":"Node.js","part":"Part 9 — Performance, Memory, and Scaling","question":"How would you scale a Node application?","prompt":"","answer":"**Short answer.** Vertically first (use all cores), then horizontally (multiple instances behind a load balancer), with all shared state moved out of process.\\n\\nThe order I\'d actually work through:\\n\\n1. Fix the obvious — indexes, N+1s, serial awaits, blocked loop.\\n2. Cache what\'s read-heavy.\\n3. Move slow work off the request path into a queue (BullMQ, RabbitMQ).\\n4. Run multiple instances; put sessions, rate limits, and caches in Redis.\\n5. Add a CDN for static and cacheable responses.\\n6. Read replicas for the database.\\n7. Split out the one service with a different scaling profile — not a full microservice rewrite.\\n\\n**Watch out.** \\"We\'ll go microservices\\" is rarely the right first answer. It trades a performance problem for a distributed-systems problem, and interviewers notice when a candidate reaches for it too early."},{"id":"nodejs-questions-ebook-1m19kt4","book":"Node.js","part":"Part 9 — Performance, Memory, and Scaling","question":"How do you handle long-running jobs?","prompt":"","answer":"**Short answer.** Accept the request, enqueue the work, return `202` with a job ID, and process it in a separate worker.\\n\\n```js\\n// API\\napp.post(\'/reports\', async (req, res) => {\\n  const job = await reportQueue.add(\'monthly\', { userId: req.user.sub, ...req.body });\\n  res.status(202).json({ jobId: job.id, status: \'queued\' });\\n});\\n\\n// Worker process\\nnew Worker(\'reports\', async job => {\\n  const file = await buildReport(job.data);\\n  await notify(job.data.userId, file);\\n}, { connection: redisConfig, concurrency: 5 });\\n```\\n\\n**Watch out.** Jobs must be idempotent — queues guarantee at-least-once delivery, so the same job can run twice after a crash. Also set attempts, backoff, and a dead-letter path."},{"id":"nodejs-questions-ebook-19mlcvo","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"Operational errors vs programmer errors","prompt":"","answer":"**Short answer.** Operational errors are expected runtime failures — a timeout, a 404, invalid input. Programmer errors are bugs — calling `undefined`, a typo, a broken invariant. Handle the first; crash on the second.\\n\\n**Explanation.** The distinction drives your strategy. A failed database call should be retried or surfaced as a 503. A `TypeError` means your assumptions are wrong and continuing risks writing bad data — log it and restart.\\n\\n```js\\nclass AppError extends Error {\\n  constructor(message, status, code) {\\n    super(message);\\n    this.name = \'AppError\';\\n    this.status = status;\\n    this.code = code;\\n    this.isOperational = true;\\n    Error.captureStackTrace(this, this.constructor);\\n  }\\n}\\n```\\n\\n**Watch out.** Swallowing errors is worse than crashing. `catch (e) {}` turns a five-minute bug into a five-day one."},{"id":"nodejs-questions-ebook-x8h9pt","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"How do you handle `uncaughtException` correctly?","prompt":"","answer":"**Short answer.** Log it with full context, attempt a fast graceful shutdown, and exit. Do not resume normal operation.\\n\\n```js\\nprocess.on(\'uncaughtException\', err => {\\n  logger.fatal({ err }, \'Uncaught exception\');\\n  server.close(() => process.exit(1));\\n  setTimeout(() => process.exit(1), 5000).unref();  // hard stop if drain stalls\\n});\\n```\\n\\n**Explanation.** After an uncaught exception, the stack unwound in the middle of unknown work. Locks may be held, a transaction may be half-applied, an object may be partly mutated. A restarted process is a known-good state; a limping one is not."},{"id":"nodejs-questions-ebook-1il5lr0","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"How do you shut down gracefully?","prompt":"","answer":"**Short answer.** Stop accepting new connections, finish in-flight requests, close database and queue connections, then exit — all within a deadline.\\n\\n```js\\nasync function shutdown(signal) {\\n  logger.info({ signal }, \'shutting down\');\\n  server.close(async () => {\\n    try {\\n      await Promise.all([pool.end(), redis.quit(), queue.close()]);\\n      process.exit(0);\\n    } catch (err) {\\n      logger.error({ err }, \'shutdown error\');\\n      process.exit(1);\\n    }\\n  });\\n  setTimeout(() => process.exit(1), 15_000).unref();\\n}\\n\\nprocess.on(\'SIGTERM\', () => shutdown(\'SIGTERM\'));\\nprocess.on(\'SIGINT\',  () => shutdown(\'SIGINT\'));\\n```\\n\\n**Watch out.** Kubernetes sends `SIGTERM` then `SIGKILL` after a grace period. If you ignore `SIGTERM`, every deployment drops in-flight requests. Also flip your readiness probe to failing *before* closing the server, so the load balancer stops routing to you first."},{"id":"nodejs-questions-ebook-hxuiaa","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"What should logging look like in production?","prompt":"","answer":"**Short answer.** Structured JSON to stdout, with levels, a request correlation ID, and no secrets. Let the platform handle shipping and rotation.\\n\\n```js\\nconst pino = require(\'pino\');\\nconst logger = pino({\\n  level: process.env.LOG_LEVEL || \'info\',\\n  redact: [\'req.headers.authorization\', \'password\', \'*.token\']\\n});\\n\\napp.use((req, res, next) => {\\n  req.id = req.headers[\'x-request-id\'] || crypto.randomUUID();\\n  req.log = logger.child({ reqId: req.id });\\n  next();\\n});\\n```\\n\\n**Watch out.** `console.log` to stdout is synchronous when stdout is a file or a TTY — under heavy traffic that blocks the event loop. Use a proper logger."},{"id":"nodejs-questions-ebook-xwp1kj","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"How do you test a Node application?","prompt":"","answer":"**Short answer.** Unit tests for pure logic, integration tests for routes plus a real database, and a thin layer of end-to-end tests. Mock the network boundary, not your own code.\\n\\n```js\\n// Integration test with supertest\\nconst request = require(\'supertest\');\\n\\ndescribe(\'POST /orders\', () => {\\n  it(\'rejects a negative quantity\', async () => {\\n    const res = await request(app)\\n      .post(\'/orders\')\\n      .set(\'Authorization\', `Bearer ${token}`)\\n      .send({ productId: id, quantity: -1 });\\n\\n    expect(res.status).toBe(400);\\n    expect(res.body.error).toBe(\'Validation failed\');\\n  });\\n});\\n```\\n\\nNode 20+ ships a built-in runner if you\'d rather avoid Jest:\\n\\n```js\\nimport test from \'node:test\';\\nimport assert from \'node:assert/strict\';\\n\\ntest(\'adds\', () => assert.equal(add(2, 3), 5));\\n```\\n\\n**Watch out.** Over-mocking produces tests that pass while production breaks. Mocking your own repository layer tests only that your mocks agree with each other. Run integration tests against a real database in a container (Testcontainers) — it catches the bugs that matter."},{"id":"nodejs-questions-ebook-dm6kbi","book":"Node.js","part":"Part 10 — Errors, Testing, and Debugging","question":"How do you debug a running Node process?","prompt":"","answer":"```bash\\nnode --inspect=0.0.0.0:9229 app.js    # attach Chrome DevTools or VS Code\\nnode --inspect-brk app.js             # break before the first line\\nkill -SIGUSR1 \\u003cpid>                   # enable the inspector on a live process\\n```\\n\\nPlus: `NODE_OPTIONS=\'--stack-trace-limit=50\'` for deeper traces, and `--trace-warnings` to get a stack for that \\"MaxListenersExceeded\\" message instead of a bare line."},{"id":"nodejs-questions-ebook-fscehz","book":"Node.js","part":"Part 11 — Production and Deployment","question":"How do you manage configuration and secrets?","prompt":"","answer":"**Short answer.** Environment variables, validated at startup, never committed. Fail loudly on boot if something required is missing.\\n\\n```js\\nconst { z } = require(\'zod\');\\n\\nconst env = z.object({\\n  NODE_ENV: z.enum([\'development\', \'test\', \'production\']),\\n  PORT: z.coerce.number().default(3000),\\n  DATABASE_URL: z.string().url(),\\n  JWT_SECRET: z.string().min(32)\\n}).parse(process.env);\\n\\nmodule.exports = env;\\n```\\n\\n**Watch out.** Crashing at startup for a missing variable is correct. Discovering it at 2 a.m. because one rarely-hit endpoint needed `SMTP_HOST` is not."},{"id":"nodejs-questions-ebook-6cdtng","book":"Node.js","part":"Part 11 — Production and Deployment","question":"What does a good production Dockerfile look like?","prompt":"","answer":"```dockerfile\\nFROM node:20-alpine AS deps\\nWORKDIR /app\\nCOPY package*.json ./\\nRUN npm ci --omit=dev\\n\\nFROM node:20-alpine\\nWORKDIR /app\\nENV NODE_ENV=production\\nCOPY --from=deps /app/node_modules ./node_modules\\nCOPY . .\\nUSER node\\nEXPOSE 3000\\nCMD [\\"node\\", \\"server.js\\"]\\n```\\n\\n**Watch out.** Three details people miss: copy `package*.json` before the source so the dependency layer caches; run as a non-root `USER`; and use `CMD [\\"node\\", ...]` rather than `npm start`, so your process is PID 1 and actually receives `SIGTERM`."},{"id":"nodejs-questions-ebook-1p89xs1","book":"Node.js","part":"Part 11 — Production and Deployment","question":"What is PM2 and do you still need it?","prompt":"","answer":"**Short answer.** A process manager providing clustering, auto-restart, log management, and zero-downtime reloads. Useful on a plain VM; largely redundant under Docker or Kubernetes, which already supervise and restart.\\n\\n```bash\\npm2 start ecosystem.config.js\\npm2 reload app        # zero-downtime rolling restart\\npm2 logs / pm2 monit\\n```"},{"id":"nodejs-questions-ebook-7ft2e5","book":"Node.js","part":"Part 11 — Production and Deployment","question":"What should a health check endpoint return?","prompt":"","answer":"**Short answer.** Two endpoints. Liveness answers \\"is the process alive\\" cheaply. Readiness answers \\"can I serve traffic\\" and checks dependencies.\\n\\n```js\\napp.get(\'/livez\', (req, res) => res.json({ ok: true }));\\n\\napp.get(\'/readyz\', async (req, res) => {\\n  const checks = await Promise.allSettled([pool.query(\'SELECT 1\'), redis.ping()]);\\n  const healthy = checks.every(c => c.status === \'fulfilled\');\\n  res.status(healthy ? 200 : 503).json({\\n    ok: healthy,\\n    db: checks[0].status,\\n    cache: checks[1].status\\n  });\\n});\\n```\\n\\n**Watch out.** If liveness checks the database, a brief database blip makes the orchestrator kill every healthy pod — turning a small outage into a full one. Keep liveness dumb."},{"id":"nodejs-questions-ebook-1sts5ew","book":"Node.js","part":"Part 11 — Production and Deployment","question":"What do you monitor?","prompt":"","answer":"Golden signals plus Node specifics:\\n\\n- **Latency** — p50, p95, p99 per route (averages hide everything).\\n- **Traffic** — requests per second.\\n- **Errors** — 5xx rate, unhandled rejections.\\n- **Saturation** — CPU, RSS, heap used, event loop lag, pool utilization.\\n\\nEvent loop lag and 99th-percentile latency are the two numbers that tell you the truth about a Node service."},{"id":"nodejs-questions-ebook-hek9w","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What does this print?","prompt":"```js\\nconsole.log(\'start\');\\nsetTimeout(() => console.log(\'timeout\'), 0);\\nPromise.resolve().then(() => console.log(\'promise\'));\\nprocess.nextTick(() => console.log(\'tick\'));\\nconsole.log(\'end\');\\n```","answer":"```\\nstart\\nend\\ntick\\npromise\\ntimeout\\n```\\nSync code → nextTick queue → microtask queue → timers phase."},{"id":"nodejs-questions-ebook-niulxr","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Why does this loop print `3 3 3` and how do you fix it?","prompt":"```js\\nfor (var i = 0; i \\u003c 3; i++) setTimeout(() => console.log(i), 0);\\n```","answer":"`var` is function-scoped, so all three callbacks close over the same binding, which is `3` by the time any timer fires. Change to `let` — it creates a fresh binding per iteration, printing `0 1 2`."},{"id":"nodejs-questions-ebook-w9as0j","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What is wrong here?","prompt":"```js\\napp.get(\'/users\', async (req, res) => {\\n  const users = await db.users.find();\\n  res.json(users);\\n});\\n```","answer":"No error handling. In Express 4, if `find()` rejects, nothing catches it — the request hangs until the client times out and you get an unhandled rejection. Wrap with an async handler helper or upgrade to Express 5."},{"id":"nodejs-questions-ebook-iubpwg","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"How long does this take, and how would you speed it up?","prompt":"```js\\nconst a = await fetchA();  // 300ms\\nconst b = await fetchB();  // 300ms\\nconst c = await fetchC();  // 300ms\\n```","answer":"900 ms. If they\'re independent: `const [a, b, c] = await Promise.all([fetchA(), fetchB(), fetchC()]);` → ~300 ms."},{"id":"nodejs-questions-ebook-wj3doq","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Spot the bug.","prompt":"```js\\nasync function getAll(ids) {\\n  return ids.map(async id => await fetchItem(id));\\n}\\n```","answer":"It returns an array of pending promises, not values. `map` does not await. Fix: `return Promise.all(ids.map(fetchItem));`"},{"id":"nodejs-questions-ebook-143mg4t","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Why is this a security problem?","prompt":"```js\\napp.get(\'/orders/:id\', requireAuth, async (req, res) => {\\n  const order = await Order.findById(req.params.id);\\n  res.json(order);\\n});\\n```","answer":"Authentication without authorization. Any logged-in user can read any order by guessing an ID. Scope the query: `Order.findOne({ _id: req.params.id, userId: req.user.sub })`, and return 404 rather than 403 so you don\'t leak existence."},{"id":"nodejs-questions-ebook-1enmjmu","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"What\'s the difference between `null`, `undefined`, and a missing key in JSON output?","prompt":"","answer":"`undefined` values are **dropped** by `JSON.stringify`; `null` is serialized. So `{ a: undefined, b: null }` becomes `{\\"b\\":null}`. This bites when an API client distinguishes \\"field absent\\" (don\'t change) from \\"field null\\" (clear it) — as PATCH semantics usually do."},{"id":"nodejs-questions-ebook-11dcl6o","book":"Node.js","part":"Part 12 — Rapid-Fire and Code Puzzles","question":"Quick definitions","prompt":"","answer":"| Term | One line |\\n|---|---|\\n| **REPL** | Read-Eval-Print Loop — the interactive `node` shell |\\n| **libuv** | C library providing the event loop, thread pool, and async I/O |\\n| **V8** | Google\'s JavaScript engine — parses, JIT-compiles, manages the heap |\\n| **npx** | Runs a package binary without installing it globally |\\n| **`package-lock.json`** | Exact resolved dependency tree for reproducible installs |\\n| **CORS** | Browser policy controlling cross-origin requests |\\n| **Middleware** | `(req, res, next)` function in the request pipeline |\\n| **Backpressure** | Slowing a producer when the consumer\'s buffer is full |\\n| **Idempotency** | Repeating the request produces the same final state |\\n| **Thread pool** | libuv\'s 4 default threads for fs, DNS, and some crypto |\\n| **`--max-old-space-size`** | Flag to raise the V8 heap limit |\\n| **Graceful shutdown** | Drain in-flight work on SIGTERM before exiting |"},{"id":"react-questions-ebook-1a2oeen","book":"React","part":"Part 1 — Fundamentals","question":"What is React?","prompt":"","answer":"**Short answer.** React is a JavaScript library for building user interfaces out of components. You describe what the UI should look like for a given state, and React works out how to update the DOM to match.\\n\\n**Explanation.** The core idea is `UI = f(state)`. You never write \\"find this element and change its text\\". You write a function that returns a description of the UI, and when state changes React calls it again and applies the difference.\\n\\nReact itself is split into two parts:\\n\\n| Piece | Role |\\n|---|---|\\n| `react` | Components, hooks, element creation — platform-agnostic |\\n| Renderer (`react-dom`, `react-native`, …) | Turns element trees into real platform output |\\n\\nThis split is why the same mental model works for web, mobile, PDFs, terminals, and 3D scenes.\\n\\n**Watch out.** \\"Library vs framework\\" is a common follow-up. React handles rendering only — no router, no data layer, no build tooling. Frameworks such as Next.js and React Router (framework mode) add those. The React team now recommends starting new apps with a framework rather than a bare client-side setup."},{"id":"react-questions-ebook-ocx9yp","book":"React","part":"Part 1 — Fundamentals","question":"What is the virtual DOM, and is it why React is fast?","prompt":"","answer":"**Short answer.** The virtual DOM is the tree of plain JavaScript objects (React elements) your components return. React compares the new tree with the previous one and applies only the needed DOM changes. It is not inherently faster than well-written direct DOM code — it makes *declarative* code fast enough.\\n\\n**Explanation.** A JSX expression produces an object, not a DOM node:\\n\\n```jsx\\nconst el = \\u003ch1 className=\\"title\\">Hi\\u003c/h1>;\\n// roughly: { type: \'h1\', props: { className: \'title\', children: \'Hi\' }, key: null }\\n```\\n\\nOn every update React builds a new tree, *diffs* it against the old one (reconciliation), and commits the minimal set of mutations. The win is developer ergonomics: you re-describe the whole UI each time, and React avoids re-creating the whole DOM.\\n\\n**Watch out.** Saying \\"the virtual DOM makes React faster than the DOM\\" is a red flag in interviews. The diff itself is overhead. Libraries such as Svelte and Solid skip the virtual DOM entirely and are often faster. The honest answer: the virtual DOM is a pragmatic trade-off for a simple programming model."},{"id":"react-questions-ebook-8m0nop","book":"React","part":"Part 1 — Fundamentals","question":"What is JSX?","prompt":"","answer":"**Short answer.** JSX is a syntax extension that lets you write HTML-like markup inside JavaScript. A compiler turns it into function calls that create React elements.\\n\\n**Explanation.**\\n\\n```jsx\\n// You write\\n\\u003cButton variant=\\"primary\\" onClick={save}>Save\\u003c/Button>\\n\\n// The modern JSX transform compiles to\\nimport { jsx as _jsx } from \'react/jsx-runtime\';\\n_jsx(Button, { variant: \'primary\', onClick: save, children: \'Save\' });\\n```\\n\\nDifferences from HTML that trip people up:\\n\\n| HTML | JSX |\\n|---|---|\\n| `class` | `className` |\\n| `for` | `htmlFor` |\\n| `onclick=\\"...\\"` | `onClick={fn}` |\\n| `style=\\"color: red\\"` | `style={{ color: \'red\' }}` |\\n| Unclosed `\\u003cimg>` | Must self-close: `\\u003cimg />` |\\n\\nExpressions go in `{}`; statements (`if`, `for`) do not. Use ternaries, `&&`, or `.map()` instead.\\n\\n**Watch out.** Since the new JSX transform (React 17) you no longer need `import React from \'react\'` in every file. Interviewers sometimes check whether you know why that import used to be required — the old transform compiled to `React.createElement`."},{"id":"react-questions-ebook-1y64yp2","book":"React","part":"Part 1 — Fundamentals","question":"Props vs state — what\'s the difference?","prompt":"","answer":"**Short answer.** Props are inputs passed from a parent and are read-only to the child. State is data a component owns and can change over time, which triggers a re-render.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Counter({ step }) {          // step is a prop\\n  const [count, setCount] = useState(0); // count is state\\n  return \\u003cbutton onClick={() => setCount(c => c + step)}>{count}\\u003c/button>;\\n}\\n```\\n\\n| | Props | State |\\n|---|---|---|\\n| Owned by | Parent | The component itself |\\n| Mutable by the component? | No | Yes, via the setter |\\n| Change causes re-render? | Yes, when parent re-renders with new props | Yes |\\n\\nData flows down through props; events flow up through callbacks passed as props. This is \\"one-way data flow\\".\\n\\n**Watch out.** Copying a prop into state (`useState(props.value)`) only uses the prop on the first render. Later prop changes are ignored. Either use the prop directly, or reset the component with a `key` (see Q6)."},{"id":"react-questions-ebook-qjglub","book":"React","part":"Part 1 — Fundamentals","question":"What makes a valid component?","prompt":"","answer":"**Short answer.** A function that starts with a capital letter, takes a props object, and returns something React can render: JSX, a string, a number, an array, `null`, or a boolean.\\n\\n**Explanation.** The capital letter matters: `\\u003cbutton>` is a DOM tag, `\\u003cButton>` is a component reference. Components must be *pure during render* — same props and state produce the same output, with no side effects like network calls, subscriptions, or mutating outside variables.\\n\\n```jsx\\nlet renders = 0;\\nfunction Bad() {\\n  renders++;                 // side effect during render — impure\\n  return \\u003cp>{renders}\\u003c/p>;\\n}\\n```\\n\\nSide effects belong in event handlers or effects.\\n\\n**Watch out.** Class components still work but are legacy. Hooks are function-only, and new React features (Server Components, the React Compiler) assume function components. Error boundaries are the one thing that still needs a class (see Q48)."},{"id":"react-questions-ebook-19mquzf","book":"React","part":"Part 1 — Fundamentals","question":"Why do lists need keys, and why is the index a bad key?","prompt":"","answer":"**Short answer.** Keys tell React which item is which between renders, so it can move, insert, and remove items correctly instead of re-using the wrong DOM nodes and state. The index changes when items are reordered or inserted, so state gets attached to the wrong item.\\n\\n**Explanation.**\\n\\n```jsx\\n{todos.map((todo, i) => (\\n  \\u003cTodoRow key={i} todo={todo} />   // bug: insert at the top and every row\'s state shifts\\n))}\\n\\n{todos.map(todo => (\\n  \\u003cTodoRow key={todo.id} todo={todo} />  // correct: stable identity\\n))}\\n```\\n\\nIf `TodoRow` has an `\\u003cinput>` or local state and you prepend an item, with index keys the first row\'s input text \\"moves\\" to the new item.\\n\\nKeys are also a reset tool. Changing a component\'s key throws away its state and mounts a fresh instance:\\n\\n```jsx\\n\\u003cProfileForm key={userId} userId={userId} />\\n```\\n\\n**Watch out.** Index keys are acceptable only when the list is static — never reordered, filtered, or inserted into. Generating keys with `Math.random()` during render is worse than index: every render remounts every item."},{"id":"react-questions-ebook-196x32f","book":"React","part":"Part 2 — Rendering and Reconciliation","question":"What causes a component to re-render?","prompt":"","answer":"**Short answer.** Three things: its own state changes, its parent re-renders, or a context it consumes changes. Props changing is not a separate trigger — props only change because the parent re-rendered.\\n\\n**Explanation.** By default, when a component renders, *every child renders too*, whether its props changed or not. React then diffs the output and touches the DOM only where something differs.\\n\\n```jsx\\nfunction Parent() {\\n  const [n, setN] = useState(0);\\n  return (\\n    \\u003c>\\n      \\u003cbutton onClick={() => setN(n + 1)}>{n}\\u003c/button>\\n      \\u003cExpensiveChild />   {/* re-renders on every click */}\\n    \\u003c/>\\n  );\\n}\\n```\\n\\nWays to stop that: move state down into a smaller component, pass the child as `children` from above (it\'s created by a component that did not re-render), or wrap it in `React.memo` (Q29).\\n\\n**Watch out.** \\"Re-render\\" means calling the component function, not updating the DOM. A re-render that produces identical output costs CPU but no DOM work. Don\'t optimize re-renders you haven\'t measured."},{"id":"react-questions-ebook-lew7jb","book":"React","part":"Part 2 — Rendering and Reconciliation","question":"What is reconciliation and how does the diffing algorithm work?","prompt":"","answer":"**Short answer.** Reconciliation is how React compares the new element tree with the previous one. It uses two heuristics to make the diff O(n): elements of different types produce entirely different trees, and keys identify children across renders.\\n\\n**Explanation.**\\n\\n- **Different type at the same position** — React unmounts the old subtree (destroying its state) and mounts a new one. `\\u003cdiv>` → `\\u003cspan>`, or `\\u003cUserCard>` → `\\u003cAdminCard>`, both reset everything below.\\n- **Same DOM type** — React keeps the node and updates only changed attributes.\\n- **Same component type** — React keeps the instance (and its state) and re-renders it with new props.\\n- **Lists** — matched by `key`.\\n\\n```jsx\\n{isAdmin ? \\u003cForm role=\\"admin\\" /> : \\u003cForm role=\\"user\\" />}\\n// Same type, same position — state is PRESERVED when isAdmin flips.\\n```\\n\\n**Watch out.** Defining a component inside another component creates a new type on every render, so React remounts it every time and its state is lost:\\n\\n```jsx\\nfunction Page() {\\n  function Row() { /* ... */ }   // new function each render = new type\\n  return \\u003cRow />;                // remounts on every Page render\\n}\\n```\\n\\nAlways define components at module level."},{"id":"react-questions-ebook-6zgmol","book":"React","part":"Part 2 — Rendering and Reconciliation","question":"What are the render and commit phases?","prompt":"","answer":"**Short answer.** In the render phase React calls your components and computes what changed — this is pure and can be paused, repeated, or thrown away. In the commit phase React applies the changes to the DOM and runs effects — this is synchronous and cannot be interrupted.\\n\\n**Explanation.**\\n\\n| Phase | What happens | Side effects allowed? |\\n|---|---|---|\\n| Render | Call components, diff trees | No |\\n| Commit | Mutate DOM, attach refs, run `useLayoutEffect` | Yes |\\n| After paint | Run `useEffect` | Yes |\\n\\nBecause render can run multiple times before a commit (concurrent rendering, Strict Mode), anything impure there — logging analytics, mutating globals, starting requests — can happen twice or for a render that never commits.\\n\\n**Watch out.** Fiber is the internal data structure that makes the render phase interruptible. You don\'t need its internals for most interviews, but you should know it is what enables time-slicing, Suspense, and transitions."},{"id":"react-questions-ebook-13l5a2u","book":"React","part":"Part 2 — Rendering and Reconciliation","question":"What is batching?","prompt":"","answer":"**Short answer.** React groups multiple state updates that happen in the same tick into a single re-render. Since React 18 this is automatic everywhere — event handlers, promises, timeouts, native listeners.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction handleClick() {\\n  setCount(c => c + 1);\\n  setFlag(f => !f);\\n  // one re-render, not two\\n}\\n\\nsetTimeout(() => {\\n  setCount(c => c + 1);\\n  setFlag(f => !f);\\n  // also one re-render since React 18 (was two in React 17)\\n}, 0);\\n```\\n\\nIf you genuinely need the DOM updated before the next line runs, use `flushSync` from `react-dom` — rarely needed, and it hurts performance.\\n\\n**Watch out.** Batching is why `console.log(count)` right after `setCount` shows the old value. The setter schedules an update; it does not change the variable in the current render (see Q13)."},{"id":"react-questions-ebook-11v1erw","book":"React","part":"Part 2 — Rendering and Reconciliation","question":"Why does my component render twice in development?","prompt":"","answer":"**Short answer.** `\\u003cStrictMode>` intentionally double-invokes component functions, initializers, and reducers, and mounts → unmounts → remounts effects in development. It surfaces impure renders and effects missing cleanup. It does nothing in production.\\n\\n**Explanation.** If your effect breaks when run twice, it was already broken — it would also break on fast refresh, on navigating away and back, or with features that preserve state while hiding UI (`\\u003cActivity>`).\\n\\n```jsx\\nuseEffect(() => {\\n  const conn = createConnection(roomId);\\n  conn.connect();\\n  return () => conn.disconnect();   // with cleanup, the double run is harmless\\n}, [roomId]);\\n```\\n\\n**Watch out.** \\"How do I stop the double fetch?\\" — the wrong answer is a `useRef` flag to skip the second run. The right answers: add cleanup that ignores or aborts the stale request, or move fetching out of effects into a data library or framework loader."},{"id":"react-questions-ebook-1eezwui","book":"React","part":"Part 3 — Hooks","question":"What are the rules of hooks, and why do they exist?","prompt":"","answer":"**Short answer.** Call hooks only at the top level of a component or custom hook — never inside conditions, loops, or nested functions, and never from regular functions. React identifies each hook by its call order, so the order must be the same on every render.\\n\\n**Explanation.** React stores hook state in a list attached to the component. On each render it walks that list in order. A conditional hook shifts every subsequent hook to the wrong slot.\\n\\n```jsx\\nfunction Bad({ isLoggedIn }) {\\n  if (isLoggedIn) {\\n    const [name, setName] = useState(\'\');   // slot 0 only sometimes\\n  }\\n  const [theme] = useState(\'dark\');         // sometimes slot 0, sometimes slot 1\\n}\\n```\\n\\n`eslint-plugin-react-hooks` enforces this — treat its errors as bugs.\\n\\n**Watch out.** `use()` (React 19) is the exception: it can be called inside conditions and loops, because it does not store state in a slot. It still must be called inside a component or hook."},{"id":"react-questions-ebook-17964uq","book":"React","part":"Part 3 — Hooks","question":"How does `useState` work, and when do you need the functional update form?","prompt":"","answer":"**Short answer.** `useState` returns the current value and a setter. The setter schedules a re-render with a new value. Use the functional form `setX(prev => ...)` when the new value depends on the old one, because `x` inside a closure is a snapshot of that render.\\n\\n**Explanation.**\\n\\n```jsx\\nconst [count, setCount] = useState(0);\\n\\nfunction addThree() {\\n  setCount(count + 1);\\n  setCount(count + 1);\\n  setCount(count + 1);\\n  // count was 0 in this render for all three calls → result is 1\\n}\\n\\nfunction addThreeCorrectly() {\\n  setCount(c => c + 1);\\n  setCount(c => c + 1);\\n  setCount(c => c + 1);\\n  // updates are queued and applied in order → result is 3\\n}\\n```\\n\\nOther details:\\n\\n- **Lazy initializer** — `useState(() => expensiveParse(data))` runs the function only on the first render. `useState(expensiveParse(data))` runs it on every render and throws the result away.\\n- **Bail-out** — setting the same value (by `Object.is`) skips the re-render.\\n- **Immutability** — state objects must be replaced, not mutated, or React won\'t see a change.\\n\\n```jsx\\nsetUser({ ...user, name: \'Ana\' });   // new object — correct\\nuser.name = \'Ana\'; setUser(user);    // same reference — no re-render\\n```\\n\\n**Watch out.** State is a per-render snapshot, not a live variable. Reading it after calling the setter in the same handler always gives the old value."},{"id":"react-questions-ebook-1jc7yb0","book":"React","part":"Part 3 — Hooks","question":"Explain `useEffect` — dependencies, cleanup, and timing.","prompt":"","answer":"**Short answer.** `useEffect` synchronizes a component with something outside React — a subscription, a timer, a DOM API, a network connection. It runs after the browser paints. The dependency array says when to re-sync; the returned function cleans up before the next sync and on unmount.\\n\\n**Explanation.**\\n\\n```jsx\\nuseEffect(() => {\\n  const id = setInterval(() => setTick(t => t + 1), 1000);\\n  return () => clearInterval(id);\\n}, []);\\n```\\n\\n| Dependencies | Runs |\\n|---|---|\\n| none | After every render |\\n| `[]` | After mount only (and cleanup on unmount) |\\n| `[a, b]` | After mount, and whenever `a` or `b` changes (`Object.is`) |\\n\\nOrder on a dependency change: old cleanup → new effect.\\n\\nThink of an effect as \\"keep X in sync with these values\\", not as a lifecycle method. The question is never \\"when does this run?\\" but \\"what does it synchronize with?\\".\\n\\n**Watch out.** Lying about dependencies to make an effect run less often creates stale-closure bugs. If an effect re-runs too much, fix the cause: move objects/functions inside the effect, use the functional setter, or use `useEffectEvent` for non-reactive logic (Q20)."},{"id":"react-questions-ebook-1fwrd52","book":"React","part":"Part 3 — Hooks","question":"When should you *not* use an effect?","prompt":"","answer":"**Short answer.** When there is no external system involved. Deriving data from props or state, handling a user event, and resetting state on prop change all have better tools than `useEffect`.\\n\\n**Explanation.**\\n\\n```jsx\\n// Bad: derived state through an effect — extra render, can drift\\nconst [fullName, setFullName] = useState(\'\');\\nuseEffect(() => setFullName(first + \' \' + last), [first, last]);\\n\\n// Good: compute during render\\nconst fullName = first + \' \' + last;\\n```\\n\\n| Instead of an effect to… | Do this |\\n|---|---|\\n| Compute a value from props/state | Compute it in render (`useMemo` if expensive) |\\n| Respond to a click or submit | Put the logic in the event handler |\\n| Reset all state when a prop changes | Pass that prop as `key` |\\n| Notify a parent of a change | Call the parent callback in the same event handler |\\n| Fetch data | A framework loader or a data library (TanStack Query, SWR) |\\n\\n**Watch out.** \\"Effect chains\\" — one effect sets state that triggers another effect — are a common smell. They cause cascading renders and are hard to follow. Collapse them into the event handler that started the chain."},{"id":"react-questions-ebook-1inmzoi","book":"React","part":"Part 3 — Hooks","question":"`useEffect` vs `useLayoutEffect`","prompt":"","answer":"**Short answer.** `useEffect` runs after the browser paints. `useLayoutEffect` runs after DOM mutations but *before* paint, blocking it. Use the layout version only when you must measure the DOM and change something before the user sees a flicker.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Tooltip({ anchorRect, children }) {\\n  const ref = useRef(null);\\n  const [height, setHeight] = useState(0);\\n\\n  useLayoutEffect(() => {\\n    setHeight(ref.current.getBoundingClientRect().height);\\n  }, []);\\n\\n  const top = anchorRect.top - height;   // positioned correctly on first paint\\n  return \\u003cdiv ref={ref} style={{ top }}>{children}\\u003c/div>;\\n}\\n```\\n\\nWith `useEffect` the tooltip would flash in the wrong place for one frame.\\n\\n**Watch out.** `useLayoutEffect` does nothing during server rendering. It also blocks paint, so heavy work inside it makes the page feel slow. Default to `useEffect`."},{"id":"react-questions-ebook-mbf6dm","book":"React","part":"Part 3 — Hooks","question":"What is `useRef` used for?","prompt":"","answer":"**Short answer.** A ref is a mutable box `{ current }` that persists across renders without causing re-renders when changed. Two uses: holding a DOM node, and holding a value you need to remember but don\'t render (timer IDs, previous values, instance-like data).\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Search() {\\n  const inputRef = useRef(null);\\n  return (\\n    \\u003c>\\n      \\u003cinput ref={inputRef} />\\n      \\u003cbutton onClick={() => inputRef.current.focus()}>Focus\\u003c/button>\\n    \\u003c/>\\n  );\\n}\\n\\nfunction Stopwatch() {\\n  const intervalRef = useRef(null);\\n  const start = () => { intervalRef.current = setInterval(tick, 1000); };\\n  const stop  = () => clearInterval(intervalRef.current);\\n  // ...\\n}\\n```\\n\\n| | `useState` | `useRef` |\\n|---|---|---|\\n| Changing it re-renders? | Yes | No |\\n| Value updated | On next render | Immediately |\\n| Read during render? | Yes | Avoid (except lazy initialization) |\\n\\n**Watch out.** Don\'t read or write `ref.current` during render — the output then depends on something React doesn\'t track, which breaks purity. Refs belong in effects and event handlers."},{"id":"react-questions-ebook-1ul3jlu","book":"React","part":"Part 3 — Hooks","question":"`useMemo` vs `useCallback` — and when are they worth it?","prompt":"","answer":"**Short answer.** `useMemo` caches a computed value; `useCallback` caches a function. Both recompute only when dependencies change. They\'re worth it when the computation is genuinely expensive, or when a stable reference prevents work downstream — a `React.memo` child or an effect dependency.\\n\\n**Explanation.**\\n\\n```jsx\\nconst visible = useMemo(\\n  () => todos.filter(t => matches(t, filter)),   // expensive on 10k items\\n  [todos, filter]\\n);\\n\\nconst handleSelect = useCallback(id => setSelected(id), []);\\n// useCallback(fn, deps) is the same as useMemo(() => fn, deps)\\n\\nreturn \\u003cMemoizedList items={visible} onSelect={handleSelect} />;\\n```\\n\\nWithout `useCallback`, `handleSelect` is a new function every render, and `MemoizedList`\'s `React.memo` comparison always fails.\\n\\n**Watch out.** Wrapping everything in `useMemo`/`useCallback` adds noise and some cost for no benefit. With the **React Compiler** most manual memoization becomes unnecessary — the compiler inserts it automatically (Q30). Interviewers increasingly ask whether you know this."},{"id":"react-questions-ebook-lp0wmq","book":"React","part":"Part 3 — Hooks","question":"When do you choose `useReducer` over `useState`?","prompt":"","answer":"**Short answer.** When state has several fields that change together, when the next state depends on the previous one in non-trivial ways, or when you want update logic testable outside the component.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction reducer(state, action) {\\n  switch (action.type) {\\n    case \'added\':\\n      return { ...state, items: [...state.items, action.item] };\\n    case \'removed\':\\n      return { ...state, items: state.items.filter(i => i.id !== action.id) };\\n    case \'cleared\':\\n      return { ...state, items: [] };\\n    default:\\n      throw new Error(`Unknown action: ${action.type}`);\\n  }\\n}\\n\\nconst [state, dispatch] = useReducer(reducer, { items: [] });\\ndispatch({ type: \'added\', item });\\n```\\n\\nBenefits: event handlers describe *what happened*, the reducer decides *how state changes*, and `dispatch` is stable, so it can be passed down without `useCallback`.\\n\\n**Watch out.** Reducers must be pure — no API calls, no `Date.now()`, no mutation. Strict Mode calls them twice in development to catch this."},{"id":"react-questions-ebook-1wnz1vm","book":"React","part":"Part 3 — Hooks","question":"What is a stale closure, and how does `useEffectEvent` help?","prompt":"","answer":"**Short answer.** A stale closure is a function that captured values from an old render and keeps using them. `useEffectEvent` (stable in React 19.2) creates a function that always sees the latest props and state but is *not* a dependency, so it can be called from an effect without re-triggering it.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction Chat({ roomId, theme }) {\\n  useEffect(() => {\\n    const conn = connect(roomId);\\n    conn.on(\'connected\', () => showToast(\'Connected\', theme));\\n    return () => conn.disconnect();\\n  }, [roomId, theme]);   // changing theme reconnects — wrong\\n}\\n```\\n\\n`theme` is only *read* in the callback, it shouldn\'t cause a reconnect. The fix:\\n\\n```jsx\\nfunction Chat({ roomId, theme }) {\\n  const onConnected = useEffectEvent(() => showToast(\'Connected\', theme));\\n\\n  useEffect(() => {\\n    const conn = connect(roomId);\\n    conn.on(\'connected\', onConnected);\\n    return () => conn.disconnect();\\n  }, [roomId]);          // only roomId is reactive\\n}\\n```\\n\\nThe classic stale closure without this hook:\\n\\n```jsx\\nuseEffect(() => {\\n  const id = setInterval(() => setCount(count + 1), 1000);  // count is always 0\\n  return () => clearInterval(id);\\n}, []);\\n// Fix: setCount(c => c + 1)\\n```\\n\\n**Watch out.** Effect events can only be called from inside effects — not passed to children or called during render."},{"id":"react-questions-ebook-e0p16a","book":"React","part":"Part 3 — Hooks","question":"How does `useContext` work, and what are its performance pitfalls?","prompt":"","answer":"**Short answer.** Context passes a value down the tree without threading props through every level. Every component that reads the context re-renders when the provider\'s value changes by `Object.is` — even if it only uses one field.\\n\\n**Explanation.**\\n\\n```jsx\\nconst ThemeContext = createContext(\'light\');\\n\\nfunction App() {\\n  const [theme, setTheme] = useState(\'dark\');\\n  return (\\n    \\u003cThemeContext value={theme}>        {/* React 19: \\u003cContext> works as a provider */}\\n      \\u003cPage />\\n    \\u003c/ThemeContext>\\n  );\\n}\\n\\nfunction Button() {\\n  const theme = useContext(ThemeContext);\\n  return \\u003cbutton className={theme}>OK\\u003c/button>;\\n}\\n```\\n\\nThe common bug:\\n\\n```jsx\\n\\u003cAuthContext value={{ user, login, logout }}>   // new object every render\\n```\\n\\nEvery consumer re-renders whenever `App` re-renders. Fix by memoizing the value, or splitting into separate contexts (state vs actions), so components that only need `logout` don\'t re-render when `user` changes.\\n\\n**Watch out.** Context is a transport mechanism, not a state manager. It\'s ideal for low-frequency values — theme, locale, current user. For high-frequency updates shared by many components, use an external store with selectors (Zustand, Redux) — see Q25."},{"id":"react-questions-ebook-13yichj","book":"React","part":"Part 3 — Hooks","question":"What is a custom hook, and what makes a good one?","prompt":"","answer":"**Short answer.** A custom hook is a function whose name starts with `use` that calls other hooks. It shares *stateful logic*, not state — each component that calls it gets its own independent copy.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction useOnlineStatus() {\\n  const [online, setOnline] = useState(navigator.onLine);\\n  useEffect(() => {\\n    const on = () => setOnline(true);\\n    const off = () => setOnline(false);\\n    window.addEventListener(\'online\', on);\\n    window.addEventListener(\'offline\', off);\\n    return () => {\\n      window.removeEventListener(\'online\', on);\\n      window.removeEventListener(\'offline\', off);\\n    };\\n  }, []);\\n  return online;\\n}\\n```\\n\\nGood custom hooks have a concrete purpose (`useOnlineStatus`, `useDebouncedValue`, `useChatRoom`). Weak ones wrap lifecycle concepts (`useMount`, `useUpdateEffect`) and hide what the effect synchronizes with.\\n\\n**Watch out.** For subscribing to an external store, prefer `useSyncExternalStore` — it handles concurrent rendering correctly (no \\"tearing\\"). The example above can be written as:\\n\\n```jsx\\nconst online = useSyncExternalStore(subscribe, () => navigator.onLine, () => true);\\n```"},{"id":"react-questions-ebook-1xiyqi9","book":"React","part":"Part 3 — Hooks","question":"What is `useId` for?","prompt":"","answer":"**Short answer.** It generates a unique, stable ID that matches between server and client render — used to link labels to inputs and for ARIA attributes.\\n\\n**Explanation.**\\n\\n```jsx\\nfunction EmailField() {\\n  const id = useId();\\n  return (\\n    \\u003c>\\n      \\u003clabel htmlFor={id}>Email\\u003c/label>\\n      \\u003cinput id={id} type=\\"email\\" aria-describedby={`${id}-hint`} />\\n      \\u003cp id={`${id}-hint`}>We never share it.\\u003c/p>\\n    \\u003c/>\\n  );\\n}\\n```\\n\\nA counter or `Math.random()` gives different values on server and client and causes hydration mismatches. A hardcoded ID breaks when the component appears twice on a page.\\n\\n**Watch out.** `useId` is not for list keys. Keys must come from your data."},{"id":"react-questions-ebook-1rrn5pl","book":"React","part":"Part 4 — State Management","question":"Where should state live?","prompt":"","answer":"**Short answer.** As close as possible to where it\'s used. Lift it to the nearest common parent only when siblings need to share it. Push it into context or a store only when it\'s needed widely.\\n\\n**Explanation.** A useful decision order:\\n\\n1. **Can it be derived?** Then it isn\'t state — compute it.\\n2. **Is it server data?** Use a server-state cache (TanStack Query, SWR, framework loaders), not `useState`.\\n3. **Is it URL-worthy?** Filters, tabs, pagination, search terms → put them in the URL so links and the back button work.\\n4. **Is it used by one component?** Local `useState`.\\n5. **Shared by a few nearby compo
