g a promise)"},{"id":"nestjs-interview-guide-f6i2b6","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"How do you enable graceful shutdown?","prompt":"","answer":"`app.enableShutdownHooks()`"},{"id":"nestjs-interview-guide-wm33vf","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"What does `synchronize: true` do, and when?","prompt":"","answer":"Auto-alters schema — development only, never production"},{"id":"nestjs-interview-guide-xws9k9","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"How do you get metadata inside a guard?","prompt":"","answer":"`Reflector`"},{"id":"nestjs-interview-guide-4ledpk","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"What\'s the fix for GraphQL N+1?","prompt":"","answer":"DataLoader, instantiated per request"},{"id":"nestjs-interview-guide-bqu15c","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"Where should business logic live?","prompt":"","answer":"Services, not controllers"},{"id":"nestjs-interview-guide-b9xg3n","book":"NestJS","part":"Part 5 — Rapid-fire and a prep plan","question":"How do you mock a TypeORM repository in a test?","prompt":"","answer":"`getRepositoryToken(Entity)` with `useValue`"},{"id":"nextjs-questions-ebook-1k18o0b","book":"Next.js","part":"Part 1 — Fundamentals","question":"What is Next.js, and why use it instead of plain React?","prompt":"","answer":"**Short answer.** Next.js is a React framework. React gives you components; Next adds routing, server rendering, data fetching, caching, bundling, and deployment conventions so you don\'t assemble them yourself.\\n\\n**Explanation.** What Next provides on top of React:\\n\\n| Concern | Plain React (Vite SPA) | Next.js |\\n|---|---|---|\\n| Routing | Add a router library | File-system routing |\\n| Rendering | Client-only | Static, dynamic, streaming server rendering |\\n| Server Components | Not available without a framework | Default |\\n| Data mutations | Your own API | Server Actions + Route Handlers |\\n| Images, fonts, scripts | Manual | `next/image`, `next/font`, `next/script` |\\n| Bundler | Vite | Turbopack (default since 16) |\\n\\n**Watch out.** \\"Next.js is for SEO\\" is an incomplete answer. The bigger wins are less client JavaScript (Server Components), faster first paint (streaming), and colocated server code. A dashboard behind login still benefits, even with no SEO needs."},{"id":"nextjs-questions-ebook-1paq5q9","book":"Next.js","part":"Part 1 — Fundamentals","question":"App Router vs Pages Router","prompt":"","answer":"**Short answer.** The Pages Router (`pages/`) is the original: every page is a Client Component, data comes from `getServerSideProps`/`getStaticProps`. The App Router (`app/`, since 13.4) is built on React Server Components, nested layouts, streaming, and Server Actions. New projects should use the App Router.\\n\\n**Explanation.**\\n\\n| | Pages Router | App Router |\\n|---|---|---|\\n| Directory | `pages/` | `app/` |\\n| Default component type | Client | Server |\\n| Data fetching | `getServerSideProps`, `getStaticProps` | `async` components + `fetch` / DB calls |\\n| Layouts | `_app.js`, manual per-page | Nested `layout.js`, preserved on navigation |\\n| Loading / error UI | Manual | `loading.js`, `error.js` conventions |\\n| Mutations | API routes | Server Actions, Route Handlers |\\n| API endpoints | `pages/api/*` | `app/**/route.js` |\\n\\nBoth can coexist in one project during migration. A route must not exist in both.\\n\\n**Watch out.** The Pages Router is still supported — saying \\"it\'s deprecated\\" is wrong. But new React features (Server Components, `use cache`, streaming per segment) only exist in the App Router."},{"id":"nextjs-questions-ebook-twvca1","book":"Next.js","part":"Part 1 — Fundamentals","question":"What are the App Router file conventions?","prompt":"","answer":"**Short answer.** Folders define URL segments; special files inside a folder define the UI for that segment. A folder becomes a public route only when it has a `page.js` or `route.js`.\\n\\n**Explanation.**\\n\\n```\\napp/\\n├─ layout.js          ← root layout (required, contains \\u003chtml> and \\u003cbody>)\\n├─ page.js            ← \\"/\\"\\n├─ not-found.js       ← 404 UI\\n├─ global-error.js    ← catches errors in the root layout\\n└─ dashboard/\\n   ├─ layout.js       ← wraps everything under /dashboard\\n   ├─ loading.js      ← Suspense fallback for this segment\\n   ├─ error.js        ← error boundary for this segment\\n   ├─ page.js         ← \\"/dashboard\\"\\n   └─ settings/\\n      └─ page.js      ← \\"/dashboard/settings\\"\\n```\\n\\n| File | Purpose |\\n|---|---|\\n| `page.js` | Unique UI of a route; makes it public |\\n| `layout.js` | Shared UI; persists across navigation |\\n| `template.js` | Like layout, but remounts on every navigation |\\n| `loading.js` | Wraps the page in `\\u003cSuspense>` |\\n| `error.js` | Wraps the page in an error boundary (must be a Client Component) |\\n| `not-found.js` | UI for `notFound()` |\\n| `route.js` | HTTP endpoint (cannot coexist with `page.js` in the same folder) |\\n| `default.js` | Fallback for parallel route slots |\\n\\nThe rendered nesting is: `layout → template → error → loading → not-found → page`.\\n\\n**Watch out.** Because only `page.js` and `route.js` are public, you can colocate components, tests, and utilities inside `app/` safely. Prefix a folder with `_` (`_components`) to opt it out of routing explicitly."},{"id":"nextjs-questions-ebook-1ecv72v","book":"Next.js","part":"Part 1 — Fundamentals","question":"Layout vs template — what\'s the difference?","prompt":"","answer":"**Short answer.** A layout is preserved across navigations between its child routes — its state, effects, and DOM stay alive. A template is re-created on every navigation, so state resets and effects re-run.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/dashboard/layout.js\\nexport default function DashboardLayout({ children }) {\\n  return (\\n    \\u003cdiv className=\\"grid\\">\\n      \\u003cSidebar />          {/* keeps scroll position and open menus across pages */}\\n      \\u003cmain>{children}\\u003c/main>\\n    \\u003c/div>\\n  );\\n}\\n```\\n\\nUse a template for things that should restart per page: enter animations, per-page analytics effects, or a form that must reset.\\n\\n**Watch out.** Layouts don\'t receive `searchParams`, and they don\'t re-render on navigation between their children. If a layout needs the current pathname, use `usePathname()` in a Client Component inside it. Don\'t fetch page-specific data in a layout expecting it to refresh."},{"id":"nextjs-questions-ebook-55oaje","book":"Next.js","part":"Part 1 — Fundamentals","question":"Are components Server or Client Components by default in Next.js?","prompt":"","answer":"**Short answer.** Everything in `app/` is a Server Component by default. You opt into the client with `\'use client\'` at the top of a file, which makes that module and everything it imports part of the client bundle.\\n\\n**Explanation.** Push `\'use client\'` as deep as possible:\\n\\n```jsx\\n// app/products/[id]/page.js — Server Component\\nimport { getProduct } from \'@/lib/data\';\\nimport AddToCartButton from \'./AddToCartButton\';\\n\\nexport default async function ProductPage({ params }) {\\n  const { id } = await params;\\n  const product = await getProduct(id);\\n  return (\\n    \\u003c>\\n      \\u003ch1>{product.name}\\u003c/h1>\\n      \\u003cp>{product.description}\\u003c/p>\\n      \\u003cAddToCartButton id={product.id} />   {/* only this ships JS */}\\n    \\u003c/>\\n  );\\n}\\n```\\n\\n```jsx\\n// app/products/[id]/AddToCartButton.js\\n\'use client\';\\nexport default function AddToCartButton({ id }) {\\n  const [pending, setPending] = useState(false);\\n  // ...\\n}\\n```\\n\\nYou need a Client Component for: state, effects, event handlers, browser APIs, and hooks such as `useRouter`, `usePathname`, `useSearchParams`.\\n\\n**Watch out.** Putting `\'use client\'` on the root layout to \\"make things work\\" turns the whole app into client code and throws away the main benefit of the App Router. Also, use the `server-only` package in modules with secrets so importing them from a Client Component fails the build:\\n\\n```js\\nimport \'server-only\';\\n```"},{"id":"nextjs-questions-ebook-tgrbfu","book":"Next.js","part":"Part 2 — Routing","question":"How do dynamic routes work, and why is `params` a promise?","prompt":"","answer":"**Short answer.** A folder named `[slug]` matches one segment; `[...slug]` matches one or more; `[[...slug]]` matches zero or more. Since Next.js 15, `params` and `searchParams` are promises you must `await` — synchronous access was removed in 16.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/blog/[slug]/page.js  →  /blog/hello-world\\nexport default async function Post({ params, searchParams }) {\\n  const { slug } = await params;\\n  const { ref } = await searchParams;\\n  const post = await getPost(slug);\\n  return \\u003carticle>{post.title}\\u003c/article>;\\n}\\n```\\n\\n| Folder | Matches | `params` |\\n|---|---|---|\\n| `[slug]` | `/a` | `{ slug: \'a\' }` |\\n| `[...slug]` | `/a/b/c` | `{ slug: [\'a\',\'b\',\'c\'] }` |\\n| `[[...slug]]` | `/` and `/a/b` | `{}` or `{ slug: [\'a\',\'b\'] }` |\\n\\nIn a Client Component, unwrap with `use(params)` or read with `useParams()`.\\n\\n**Watch out.** They became async so Next can start rendering parts of the page that don\'t depend on request data before the request data is known. Reading `searchParams` makes the page dynamic — read it only in the components that need it, inside a Suspense boundary, rather than at the top of the page."},{"id":"nextjs-questions-ebook-gotmo1","book":"Next.js","part":"Part 2 — Routing","question":"What are route groups?","prompt":"","answer":"**Short answer.** A folder in parentheses — `(marketing)` — organizes routes without affecting the URL. Used to give different sections different layouts, or to split the app into multiple root layouts.\\n\\n**Explanation.**\\n\\n```\\napp/\\n├─ (marketing)/\\n│  ├─ layout.js        ← public header/footer\\n│  ├─ page.js          ← \\"/\\"\\n│  └─ pricing/page.js  ← \\"/pricing\\"\\n└─ (app)/\\n   ├─ layout.js        ← authenticated shell with sidebar\\n   └─ dashboard/page.js ← \\"/dashboard\\"\\n```\\n\\n**Watch out.** Two groups must not resolve to the same URL (`(a)/about` and `(b)/about` is a build error). Navigating between different root layouts triggers a full page load, not a client-side transition."},{"id":"nextjs-questions-ebook-31uzcn","book":"Next.js","part":"Part 2 — Routing","question":"What are parallel routes?","prompt":"","answer":"**Short answer.** Named slots, created with `@folder`, that render multiple pages in the same layout at once — each with its own loading and error states, and its own navigation.\\n\\n**Explanation.**\\n\\n```\\napp/dashboard/\\n├─ layout.js\\n├─ page.js\\n├─ @analytics/page.js\\n└─ @team/page.js\\n```\\n\\n```jsx\\nexport default function Layout({ children, analytics, team }) {\\n  return (\\n    \\u003c>\\n      {children}\\n      \\u003cdiv className=\\"grid\\">\\n        {analytics}\\n        {team}\\n      \\u003c/div>\\n    \\u003c/>\\n  );\\n}\\n```\\n\\nUses: dashboards with independent panels, conditional rendering by role (`{isAdmin ? admin : user}`), and modals (with intercepting routes).\\n\\n**Watch out.** On a hard refresh, Next can\'t know what a slot should show for an unmatched URL. Each slot needs a `default.js` (returning `null` or a fallback) — since Next.js 16 builds fail without it."},{"id":"nextjs-questions-ebook-a6jeq8","book":"Next.js","part":"Part 2 — Routing","question":"What are intercepting routes?","prompt":"","answer":"**Short answer.** They let a route load inside the current layout during client navigation, while a direct visit or refresh shows the full page. The classic use: clicking a photo opens it in a modal with a shareable URL; refreshing shows the photo page.\\n\\n**Explanation.** Conventions mirror relative paths: `(.)` same level, `(..)` one level up, `(...)` from the app root.\\n\\n```\\napp/\\n├─ feed/\\n│  ├─ page.js\\n│  └─ @modal/\\n│     ├─ default.js            ← returns null\\n│     └─ (..)photo/[id]/page.js ← modal version, shown on client nav\\n└─ photo/[id]/page.js           ← full page, shown on refresh/direct link\\n```\\n\\n```jsx\\n// app/feed/@modal/(..)photo/[id]/page.js\\nexport default async function PhotoModal({ params }) {\\n  const { id } = await params;\\n  return \\u003cModal>\\u003cPhoto id={id} />\\u003c/Modal>;\\n}\\n```\\n\\nClose the modal with `router.back()`.\\n\\n**Watch out.** `(..)` is based on *route segments*, not file-system folders — slots like `@modal` don\'t count as a segment. This is the most common reason interception \\"doesn\'t work\\"."},{"id":"nextjs-questions-ebook-3gqqjc","book":"Next.js","part":"Part 2 — Routing","question":"How does navigation work — `\\u003cLink>`, prefetching, and `useRouter`?","prompt":"","answer":"**Short answer.** `\\u003cLink>` does client-side navigation and prefetches routes as they enter the viewport. `useRouter()` gives imperative navigation in Client Components. On the server, use `redirect()` and `notFound()`.\\n\\n**Explanation.**\\n\\n```jsx\\nimport Link from \'next/link\';\\n\\u003cLink href=\\"/dashboard\\">Dashboard\\u003c/Link>\\n```\\n\\n```jsx\\n\'use client\';\\nimport { useRouter } from \'next/navigation\';   // NOT \'next/router\' in the App Router\\n\\nconst router = useRouter();\\nrouter.push(\'/dashboard\');\\nrouter.replace(\'/login\');\\nrouter.refresh();   // re-fetch Server Components for the current route, keep client state\\nrouter.back();\\n```\\n\\n```jsx\\n// Server Component or Server Action\\nimport { redirect, notFound } from \'next/navigation\';\\n\\nconst post = await getPost(slug);\\nif (!post) notFound();\\nif (!session) redirect(\'/login\');\\n```\\n\\nPrefetching: static routes are prefetched in full; dynamic routes prefetch down to the nearest `loading.js`, so the loading UI appears instantly on click.\\n\\n**Watch out.** `redirect()` works by throwing a special error. Don\'t call it inside a `try/catch` that swallows errors — call it after the `try` block."},{"id":"nextjs-questions-ebook-n40kv5","book":"Next.js","part":"Part 2 — Routing","question":"What do `loading.js` and `error.js` do?","prompt":"","answer":"**Short answer.** `loading.js` wraps the segment\'s page in `\\u003cSuspense>` with your file as the fallback, so navigation shows it instantly while the page streams. `error.js` wraps the segment in an error boundary and shows a recovery UI.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/dashboard/loading.js\\nexport default function Loading() {\\n  return \\u003cDashboardSkeleton />;\\n}\\n```\\n\\n```jsx\\n// app/dashboard/error.js\\n\'use client\';\\nexport default function Error({ error, reset }) {\\n  return (\\n    \\u003cdiv role=\\"alert\\">\\n      \\u003cp>Couldn\'t load the dashboard.\\u003c/p>\\n      \\u003cbutton onClick={() => reset()}>Try again\\u003c/button>\\n    \\u003c/div>\\n  );\\n}\\n```\\n\\nKey behaviors:\\n\\n- The layout at the same level stays interactive — errors and loading replace only the page below it.\\n- `error.js` does not catch errors thrown by the layout in the same folder; that goes to the parent\'s `error.js`. The root layout needs `global-error.js`.\\n- In production, error messages from Server Components are replaced with a generic message plus a `digest` you can match in server logs — secrets don\'t leak.\\n\\n**Watch out.** `loading.js` is one coarse boundary per segment. For finer control — showing the header immediately while a slow widget streams — add your own `\\u003cSuspense>` boundaries inside the page."},{"id":"nextjs-questions-ebook-tcu21z","book":"Next.js","part":"Part 2 — Routing","question":"How do you handle a 404?","prompt":"","answer":"**Short answer.** Call `notFound()` when data is missing; it renders the nearest `not-found.js` and returns a 404 status. Unmatched URLs render `app/not-found.js`.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/blog/[slug]/page.js\\nimport { notFound } from \'next/navigation\';\\n\\nexport default async function Post({ params }) {\\n  const { slug } = await params;\\n  const post = await getPost(slug);\\n  if (!post) notFound();\\n  return \\u003cArticle post={post} />;\\n}\\n```\\n\\n**Watch out.** Returning `\\u003cp>Not found\\u003c/p>` from the page renders the message with a **200** status — bad for SEO and monitoring. Always use `notFound()`."},{"id":"nextjs-questions-ebook-18zbfv","book":"Next.js","part":"Part 3 — Rendering","question":"Static vs dynamic rendering — what decides which one a route gets?","prompt":"","answer":"**Short answer.** Static rendering happens at build time (or on revalidation) and the HTML is cached and served from a CDN. Dynamic rendering happens per request. A route becomes dynamic when it reads request-time data: `cookies()`, `headers()`, `searchParams`, `connection()`, or uncached data.\\n\\n**Explanation.**\\n\\n| Makes it dynamic | Why |\\n|---|---|\\n| `await cookies()` / `await headers()` | Values only exist per request |\\n| `await searchParams` | Query string is per request |\\n| `await connection()` | Explicit \\"wait for a real request\\" |\\n| `fetch(url, { cache: \'no-store\' })` | Explicitly uncached data |\\n| `export const dynamic = \'force-dynamic\'` | Route segment config |\\n\\nCheck the build output: Next prints which routes are static (`○`) and which are dynamic (`ƒ`).\\n\\n**Watch out.** One `cookies()` call in the root layout makes *every* route dynamic. Read request data as low in the tree as possible — ideally inside a Suspense boundary so the rest of the page can still be prerendered (Q15)."},{"id":"nextjs-questions-ebook-3z7jrd","book":"Next.js","part":"Part 3 — Rendering","question":"How does streaming work in Next.js?","prompt":"","answer":"**Short answer.** Next renders Server Components in chunks. The static shell is sent immediately; each `\\u003cSuspense>` boundary (including `loading.js`) shows its fallback and streams its real content when ready. The user sees and interacts with the page before slow data finishes.\\n\\n**Explanation.**\\n\\n```jsx\\nexport default function Dashboard() {\\n  return (\\n    \\u003c>\\n      \\u003ch1>Dashboard\\u003c/h1>\\n      \\u003cSuspense fallback={\\u003cCardSkeleton />}>\\n        \\u003cRevenue />           {/* awaits a slow query */}\\n      \\u003c/Suspense>\\n      \\u003cSuspense fallback={\\u003cListSkeleton />}>\\n        \\u003cLatestInvoices />    {/* independent, streams separately */}\\n      \\u003c/Suspense>\\n    \\u003c/>\\n  );\\n}\\n\\nasync function Revenue() {\\n  const data = await getRevenue();   // 3s\\n  return \\u003cChart data={data} />;\\n}\\n```\\n\\nBoundaries resolve independently, so the slowest query no longer blocks the whole page.\\n\\n**Watch out.** Once streaming starts, the HTTP status is already 200. A `notFound()` or `redirect()` deep inside a streamed boundary works via injected client-side handling, but search engines and monitoring may see the 200. Do existence and auth checks before the first Suspense boundary."},{"id":"nextjs-questions-ebook-14k04l5","book":"Next.js","part":"Part 3 — Rendering","question":"What are Cache Components and Partial Prerendering?","prompt":"","answer":"**Short answer.** Cache Components (enabled with `cacheComponents: true`, Next.js 16) make one route both static and dynamic: everything that can be prerendered becomes a static shell served instantly, and request-specific parts stream in through Suspense holes. This is the model formerly called Partial Prerendering (PPR).\\n\\n**Explanation.** Under this model, data access is dynamic by default. You decide per component:\\n\\n- Wrap request-time work in `\\u003cSuspense>` — it becomes a dynamic hole.\\n- Mark cacheable work with `\'use cache\'` — it becomes part of the static shell.\\n\\n```jsx\\n// next.config.js\\nexport default { cacheComponents: true };\\n```\\n\\n```jsx\\nexport default function ProductPage({ params }) {\\n  return (\\n    \\u003c>\\n      \\u003cProductDetails params={params} />     {/* \'use cache\' — in the static shell */}\\n      \\u003cSuspense fallback={\\u003cCartSkeleton />}>\\n        \\u003cCartSummary />                       {/* reads cookies — streamed per request */}\\n      \\u003c/Suspense>\\n    \\u003c/>\\n  );\\n}\\n\\nasync function CartSummary() {\\n  const cartId = (await cookies()).get(\'cart\')?.value;\\n  const cart = await getCart(cartId);\\n  return \\u003cMiniCart cart={cart} />;\\n}\\n```\\n\\nIf a component reads uncached or request data outside a Suspense boundary, the build fails with a clear error — you\'re forced to choose \\"cache it\\" or \\"stream it\\".\\n\\n**Watch out.** The mental model changed: in the old model you opted *out* of static rendering; with Cache Components you opt *in* to caching. Expect interviewers to ask which model a project uses."},{"id":"nextjs-questions-ebook-55yy0n","book":"Next.js","part":"Part 3 — Rendering","question":"What is `generateStaticParams`?","prompt":"","answer":"**Short answer.** It tells Next which values of a dynamic segment to prerender at build time. Params not in the list are rendered on first request and then cached (unless you disable that with `dynamicParams = false`).\\n\\n**Explanation.**\\n\\n```jsx\\n// app/blog/[slug]/page.js\\nexport async function generateStaticParams() {\\n  const posts = await getAllPosts();\\n  return posts.map(p => ({ slug: p.slug }));\\n}\\n\\nexport const dynamicParams = true;   // default: unknown slugs render on demand\\n```\\n\\nFor large sites, prerender only the most popular pages and let the rest render on demand — builds stay fast.\\n\\n**Watch out.** `generateStaticParams` replaces `getStaticPaths` from the Pages Router. Fetch calls inside it and inside the page are deduplicated, so you don\'t pay twice for the same request."},{"id":"nextjs-questions-ebook-81n9b4","book":"Next.js","part":"Part 3 — Rendering","question":"Node.js runtime vs Edge runtime","prompt":"","answer":"**Short answer.** The Node.js runtime is the default and supports all Node APIs and npm packages. The Edge runtime is a lighter, Web-API-only environment with faster cold starts, but no file system, no native modules, and limited package support.\\n\\n**Explanation.**\\n\\n| | Node.js | Edge |\\n|---|---|---|\\n| APIs | Full Node + Web APIs | Web APIs only |\\n| npm compatibility | Full | Partial |\\n| DB drivers | Any | HTTP-based drivers only |\\n| Cold start | Slower | Faster |\\n| Default | Yes | Opt-in: `export const runtime = \'edge\'` |\\n\\n**Watch out.** Edge compute near the user doesn\'t help if your database is in one region — every query crosses the world. Most apps should stay on Node.js. Since Next.js 16, `proxy.ts` runs on Node.js (Q31)."},{"id":"nextjs-questions-ebook-4xwaiq","book":"Next.js","part":"Part 4 — Data Fetching","question":"How do you fetch data in the App Router?","prompt":"","answer":"**Short answer.** Make the Server Component `async` and `await` your data directly — `fetch`, an ORM, or any server SDK. No `useEffect`, no API route in between, no loading state boilerplate.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/orders/page.js\\nimport { db } from \'@/lib/db\';\\n\\nexport default async function Orders() {\\n  const orders = await db.order.findMany({ orderBy: { createdAt: \'desc\' }, take: 20 });\\n  return \\u003cOrderTable orders={orders} />;\\n}\\n```\\n\\nCalling your own Route Handler from a Server Component (`fetch(\'/api/orders\')`) is an anti-pattern: it adds an HTTP hop to the same server. Call the data function directly.\\n\\n**Watch out.** Put data access in a dedicated module (a \\"data access layer\\") that checks authorization and returns only the fields the UI needs. Server Components can\'t leak secrets by themselves, but passing a whole DB row to a Client Component as a prop sends every field to the browser."},{"id":"nextjs-questions-ebook-m8ib2h","book":"Next.js","part":"Part 4 — Data Fetching","question":"How do you avoid request waterfalls?","prompt":"","answer":"**Short answer.** Start independent requests in parallel with `Promise.all`, or split them into separate components under separate Suspense boundaries so each one streams on its own.\\n\\n**Explanation.**\\n\\n```jsx\\n// Waterfall: 3 sequential round-trips\\nconst user = await getUser(id);\\nconst posts = await getPosts(id);\\nconst followers = await getFollowers(id);\\n\\n// Parallel: one round-trip time\\nconst [user, posts, followers] = await Promise.all([\\n  getUser(id),\\n  getPosts(id),\\n  getFollowers(id),\\n]);\\n```\\n\\nEven better for UX, give each section its own component and boundary, so the fast data appears before the slow data.\\n\\n**Watch out.** Nested layouts and pages are rendered in parallel by Next, but `await`s *within* one component are sequential. Some waterfalls are real dependencies (you need `user.teamId` to fetch the team) — those are fine."},{"id":"nextjs-questions-ebook-1jb2wmu","book":"Next.js","part":"Part 4 — Data Fetching","question":"How does request deduplication work?","prompt":"","answer":"**Short answer.** Within one server render, identical `fetch` GET calls are memoized automatically. For non-`fetch` data sources (ORMs, SDKs), wrap the function in React\'s `cache()` so multiple components can call it and the query runs once per request.\\n\\n**Explanation.**\\n\\n```js\\n// lib/data.js\\nimport { cache } from \'react\';\\nimport \'server-only\';\\n\\nexport const getUser = cache(async (id) => {\\n  return db.user.findUnique({ where: { id } });\\n});\\n```\\n\\nNow `layout.js`, `page.js`, and `generateMetadata` can all call `getUser(id)` — one query. This lets you fetch where you need data instead of drilling it down as props.\\n\\n**Watch out.** React `cache()` lasts for **one request** only. It\'s deduplication, not caching across users or requests — for that, use `\'use cache\'` (Q23)."},{"id":"nextjs-questions-ebook-1aetg7z","book":"Next.js","part":"Part 4 — Data Fetching","question":"When do you still fetch on the client?","prompt":"","answer":"**Short answer.** For data that depends on client-only state or must update without navigation: infinite scroll, polling, live search-as-you-type, user-specific widgets after interaction. Use TanStack Query or SWR rather than raw `useEffect`.\\n\\n**Explanation.** A good hybrid: the server renders the first page of data, the client takes over for interaction.\\n\\n```jsx\\n// Server Component\\nconst initial = await getComments(postId);\\nreturn \\u003cComments postId={postId} initial={initial} />;\\n\\n// Client Component\\n\'use client\';\\nfunction Comments({ postId, initial }) {\\n  const { data } = useQuery({\\n    queryKey: [\'comments\', postId],\\n    queryFn: () => fetchComments(postId),\\n    initialData: initial,\\n  });\\n  // ...\\n}\\n```\\n\\nYou can also pass a promise from a Server Component and unwrap it with `use()` in a Client Component, so the client component streams without blocking the parent.\\n\\n**Watch out.** Real-time data (chat, notifications) needs a WebSocket or SSE service. Serverless function platforms usually can\'t hold long-lived connections — use a dedicated service."},{"id":"nextjs-questions-ebook-1vh4uyt","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"What are the caching layers in Next.js?","prompt":"","answer":"**Short answer.** Four: request memoization (per render), the Data Cache (fetch results across requests), the Full Route Cache (rendered HTML + RSC payload on the server), and the client-side Router Cache (RSC payloads in the browser for back/forward and prefetches).\\n\\n**Explanation.**\\n\\n| Layer | Where | What | Lifetime |\\n|---|---|---|---|\\n| Request memoization | Server | Duplicate `fetch` / `cache()` calls in one render | One request |\\n| Data Cache | Server | `fetch` results / `\'use cache\'` results | Until revalidated |\\n| Full Route Cache | Server | Rendered output of static routes | Until revalidated or redeployed |\\n| Router Cache | Browser | RSC payloads of visited/prefetched routes | Session, with staleness rules |\\n\\nInvalidation flows top-down: revalidating data invalidates the routes built from it.\\n\\n**Watch out.** Next.js 15 reversed the defaults: `fetch` is **not** cached by default, GET Route Handlers are not cached by default, and page segments are not reused from the client Router Cache by default. Many tutorials still describe the old aggressive-caching behavior — say which version you mean."},{"id":"nextjs-questions-ebook-up125p","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"How does `\'use cache\'` work?","prompt":"","answer":"**Short answer.** `\'use cache\'` marks a function, component, or whole file as cacheable. Its return value is cached, keyed automatically by its arguments and closed-over values. `cacheLife` sets how long; `cacheTag` labels it for on-demand invalidation.\\n\\n**Explanation.**\\n\\n```js\\nimport { cacheLife, cacheTag } from \'next/cache\';\\n\\nexport async function getProduct(id) {\\n  \'use cache\';\\n  cacheLife(\'hours\');            // built-in profiles: seconds, minutes, hours, days, weeks, max\\n  cacheTag(`product-${id}`);\\n  return db.product.findUnique({ where: { id } });\\n}\\n```\\n\\n```jsx\\nexport default async function PricingTable() {\\n  \'use cache\';\\n  cacheLife(\'days\');\\n  const plans = await getPlans();\\n  return \\u003cTable plans={plans} />;\\n}\\n```\\n\\nIt works for any data source, not just `fetch`, and replaces the older `unstable_cache` and most `fetch` cache options.\\n\\n**Watch out.** A cached function can\'t read `cookies()`, `headers()`, or `searchParams` inside its body — that would leak one user\'s data to another. Read them outside and pass the values in as arguments, which then become part of the cache key."},{"id":"nextjs-questions-ebook-1boxqq6","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"Time-based vs on-demand revalidation","prompt":"","answer":"**Short answer.** Time-based revalidation refreshes cached data after a period (stale-while-revalidate). On-demand revalidation refreshes it immediately when you know data changed — after a mutation or a CMS webhook — using tags or paths.\\n\\n**Explanation.**\\n\\n```js\\n// Time-based\\nfetch(url, { next: { revalidate: 3600 } });   // fetch option\\ncacheLife(\'hours\');                            // \'use cache\'\\n```\\n\\n```js\\n// On-demand\\nimport { revalidateTag, updateTag, revalidatePath } from \'next/cache\';\\n\\nrevalidateTag(\'products\', \'max\');   // mark stale; next visitor gets stale, refresh happens in background\\nupdateTag(`product-${id}`);         // Server Actions only: expire now, so the user sees their own write\\nrevalidatePath(\'/blog\');            // invalidate everything a path rendered\\n```\\n\\n| API | Use when |\\n|---|---|\\n| `revalidateTag(tag, profile)` | Content changes elsewhere (CMS webhook); slight staleness OK |\\n| `updateTag(tag)` | User just edited something and must see it immediately (\\"read your own writes\\") |\\n| `revalidatePath(path)` | You don\'t have tags; coarse invalidation |\\n| `refresh()` | Refresh uncached data on the current page from a Server Action |\\n\\n**Watch out.** Tags are more precise than paths. One product edit should invalidate `product-42`, not every page under `/shop`. Design tags around entities when you design the data layer."},{"id":"nextjs-questions-ebook-1ph2jrl","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"What is ISR, and how does it map to the App Router?","prompt":"","answer":"**Short answer.** Incremental Static Regeneration serves a static page and regenerates it in the background after it goes stale, without a full rebuild. In the App Router, it\'s simply a static route with time-based or on-demand revalidation.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/blog/[slug]/page.js\\nexport const revalidate = 3600;   // route segment config: regenerate at most hourly\\n\\nexport async function generateStaticParams() { /* popular slugs */ }\\n```\\n\\nFlow: request 1 after the hour gets the stale page instantly and triggers a rebuild; the next request gets the fresh page. With a CMS webhook calling `revalidateTag`, pages update within seconds of publishing.\\n\\n**Watch out.** When self-hosting multiple instances, each instance has its own file-system cache — revalidating on one doesn\'t update the others. Configure a shared cache handler (e.g. Redis) via `cacheHandler` in `next.config.js`."},{"id":"nextjs-questions-ebook-nch1b2","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"Why isn\'t my page showing updated data?","prompt":"","answer":"**Short answer.** Something is still cached: a static route never revalidated, a `\'use cache\'` function with a long `cacheLife`, the client Router Cache holding an old RSC payload, or a CDN in front caching the response.\\n\\n**Explanation.** Debugging order:\\n\\n1. **Build output** — is the route `○` static? Then it\'s prerendered until revalidated.\\n2. **Data layer** — is the function cached? With what lifetime and tags?\\n3. **After a mutation** — did the Server Action call `updateTag` / `revalidatePath`?\\n4. **Client** — the page was navigated to before; `router.refresh()` or invalidation from an action fixes it.\\n5. **CDN / proxy** — check `Cache-Control` and `x-nextjs-cache` response headers.\\n\\n**Watch out.** Development mode doesn\'t behave like production for caching. Always reproduce cache bugs with `next build && next start`."},{"id":"nextjs-questions-ebook-a1s2xv","book":"Next.js","part":"Part 5 — Caching and Revalidation","question":"How do you cache per-user data safely?","prompt":"","answer":"**Short answer.** Don\'t put user-specific data into a shared cache keyed without the user. Either keep it dynamic (stream it in a Suspense boundary), or pass the user ID as an argument to a cached function so it\'s part of the key.\\n\\n**Explanation.**\\n\\n```js\\n// Safe: userId is part of the cache key\\nasync function getRecommendations(userId) {\\n  \'use cache\';\\n  cacheLife(\'minutes\');\\n  cacheTag(`recs-${userId}`);\\n  return recommender.forUser(userId);\\n}\\n\\n// Caller reads the session outside the cached scope\\nconst session = await auth();\\nconst recs = await getRecommendations(session.userId);\\n```\\n\\nFor data that must never be cached on shared infrastructure, Next provides `\'use cache: private\'`, which caches only in the browser.\\n\\n**Watch out.** The classic incident: a page that reads cookies is accidentally made static (or a CDN caches it), and every visitor sees the first visitor\'s account. Make sure authenticated responses carry `Cache-Control: private, no-store` at the edge."},{"id":"nextjs-questions-ebook-i7adh2","book":"Next.js","part":"Part 6 — Mutations: Server Actions and Route Handlers","question":"What are Server Actions?","prompt":"","answer":"**Short answer.** Async functions marked `\'use server\'` that run on the server but can be called from the client — as a form `action`, from an event handler, or via `useActionState`. Next generates the endpoint, serializes arguments, and can return updated UI in the same round-trip.\\n\\n**Explanation.**\\n\\n```js\\n// app/todos/actions.js\\n\'use server\';\\nimport { z } from \'zod\';\\nimport { updateTag } from \'next/cache\';\\nimport { auth } from \'@/lib/auth\';\\n\\nconst schema = z.object({ title: z.string().min(1).max(200) });\\n\\nexport async function createTodo(prevState, formData) {\\n  const session = await auth();\\n  if (!session) return { error: \'Not signed in\' };\\n\\n  const parsed = schema.safeParse({ title: formData.get(\'title\') });\\n  if (!parsed.success) return { error: \'Title is required\' };\\n\\n  await db.todo.create({ data: { title: parsed.data.title, userId: session.userId } });\\n  updateTag(`todos-${session.userId}`);\\n  return { error: null };\\n}\\n```\\n\\n```jsx\\n\'use client\';\\nimport { useActionState } from \'react\';\\nimport { createTodo } from \'./actions\';\\n\\nexport function NewTodo() {\\n  const [state, action, pending] = useActionState(createTodo, { error: null });\\n  return (\\n    \\u003cform action={action}>\\n      \\u003cinput name=\\"title\\" />\\n      \\u003cbutton disabled={pending}>Add\\u003c/button>\\n      {state.error && \\u003cp role=\\"alert\\">{state.error}\\u003c/p>}\\n    \\u003c/form>\\n  );\\n}\\n```\\n\\nForms using a Server Action work before JavaScript loads (progressive enhancement).\\n\\n**Watch out.** Server Actions are POST requests and run one at a time per client. They\'re for mutations — don\'t use them to fetch data for rendering."},{"id":"nextjs-questions-ebook-1t67f6p","book":"Next.js","part":"Part 6 — Mutations: Server Actions and Route Handlers","question":"Why are Server Actions a security concern?","prompt":"","answer":"**Short answer.** Each Server Action is a public HTTP endpoint. Anyone can call it with any arguments, even if your UI only shows the button to admins. Every action must authenticate, authorize, and validate its input itself.\\n\\n**Explanation.** Checklist for every action:\\n\\n1. **Authenticate** — read the session inside the action.\\n2. **Authorize** — check the user may act on *this* resource (`where: { id, ownerId: session.userId }`).\\n3. **Validate** — parse arguments with a schema; never trust types from the client.\\n4. **Return minimal data** — no full DB rows, no stack traces.\\n\\nNext adds protections: action IDs are encrypted and non-deterministic, unused actions are removed from the build, POST-only with an `Origin` vs `Host` check against CSRF, and closed-over variables are encrypted. These don\'t replace authorization.\\n\\n**Watch out.** Checking auth in `proxy.ts` or the page that renders the form is not enough — the action can be called directly. The check must be in the action (or the data layer it calls)."},{"id":"nextjs-questions-ebook-egx5lo","book":"Next.js","part":"Part 6 — Mutations: Server Actions and Route Handlers","question":"Server Actions vs Route Handlers — when to use which?","prompt":"","answer":"**Short answer.** Use Server Actions for mutations triggered by your own Next.js UI. Use Route Handlers (`route.js`) for public or external APIs: webhooks, mobile clients, third parties, file downloads, streaming responses, and non-POST methods.\\n\\n**Explanation.**\\n\\n```js\\n// app/api/webhooks/stripe/route.js\\nexport async function POST(request) {\\n  const body = await request.text();\\n  const sig = request.headers.get(\'stripe-signature\');\\n  const event = stripe.webhooks.constructEvent(body, sig, process.env.STRIPE_WEBHOOK_SECRET);\\n\\n  if (event.type === \'checkout.session.completed\') {\\n    await fulfillOrder(event.data.object);\\n    revalidateTag(\'orders\', \'max\');\\n  }\\n  return Response.json({ received: true });\\n}\\n```\\n\\n| | Server Action | Route Handler |\\n|---|---|---|\\n| Caller | Your React UI | Anyone over HTTP |\\n| Methods | POST only | GET, POST, PUT, PATCH, DELETE, … |\\n| URL | Generated, internal | Stable, documented |\\n| Returns | Serializable values / UI update | Any `Response` |\\n\\n**Watch out.** Don\'t build a Route Handler just so your own Server Components can call it — call the data function directly (Q18)."},{"id":"nextjs-questions-ebook-cmot12","book":"Next.js","part":"Part 7 — Proxy, Authentication, and Request Data","question":"What is `proxy.ts` (formerly middleware)?","prompt":"","answer":"**Short answer.** Code that runs before a request is routed — for redirects, rewrites, setting headers and cookies, and cheap checks like \\"has a session cookie\\". Next.js 16 renamed `middleware.ts` to `proxy.ts` and runs it on the Node.js runtime.\\n\\n**Explanation.**\\n\\n```ts\\n// proxy.ts (project root or src/)\\nimport { NextResponse } from \'next/server\';\\n\\nexport function proxy(request) {\\n  const session = request.cookies.get(\'session\');\\n  if (!session && request.nextUrl.pathname.startsWith(\'/dashboard\')) {\\n    return NextResponse.redirect(new URL(\'/login\', request.url));\\n  }\\n  return NextResponse.next();\\n}\\n\\nexport const config = {\\n  matcher: [\'/dashboard/:path*\'],\\n};\\n```\\n\\nGood uses: locale redirects, A/B test bucketing via rewrites, auth redirects, adding security headers.\\n\\n**Watch out.** Proxy is an optimistic check, not authorization. In 2025 a vulnerability (CVE-2025-29927) let attackers skip middleware entirely with a crafted header — apps that relied on it as their only auth check were exposed. Always re-check auth in the data layer and in Server Actions."},{"id":"nextjs-questions-ebook-1yw7q35","book":"Next.js","part":"Part 7 — Proxy, Authentication, and Request Data","question":"How do you implement authentication in the App Router?","prompt":"","answer":"**Short answer.** Store the session in an `HttpOnly`, `Secure`, `SameSite` cookie (a signed/encrypted token or a session ID). Do an optimistic redirect in `proxy.ts`, then enforce real authorization close to the data — in a data access layer, Server Components, and Server Actions. Libraries: Auth.js, Better Auth, Clerk, or your provider\'s SDK.\\n\\n**Explanation.**\\n\\n```js\\n// lib/dal.js — data access layer\\nimport \'server-only\';\\nimport { cache } from \'react\';\\nimport { cookies } from \'next/headers\';\\nimport { redirect } from \'next/navigation\';\\n\\nexport const verifySession = cache(async () => {\\n  const token = (await cookies()).get(\'session\')?.value;\\n  const session = await decrypt(token);\\n  if (!session?.userId) redirect(\'/login\');\\n  return { userId: session.userId, role: session.role };\\n});\\n\\nexport async function getInvoices() {\\n  const { userId } = await verifySession();\\n  return db.invoice.findMany({\\n    where: { userId },\\n    select: { id: true, amount: true, status: true },   // DTO, not the whole row\\n  });\\n}\\n```\\n\\n**Watch out.** Checking auth only in a layout is a mistake. Layouts don\'t re-render on client navigation between their children, and a page or action can be reached without the layout\'s check running. Check in each page/action — `cache()` makes repeated checks cheap."},{"id":"nextjs-questions-ebook-156tbcw","book":"Next.js","part":"Part 7 — Proxy, Authentication, and Request Data","question":"How do you read cookies, headers, and search params?","prompt":"","answer":"**Short answer.** On the server: `await cookies()`, `await headers()` from `next/headers`, and `await searchParams` in a page. On the client: `useSearchParams()`, `usePathname()`, `useParams()`. Setting cookies is only allowed in Server Actions, Route Handlers, and proxy — not during rendering.\\n\\n**Explanation.**\\n\\n```js\\nimport { cookies, headers } from \'next/headers\';\\n\\nconst cookieStore = await cookies();\\nconst theme = cookieStore.get(\'theme\')?.value ?? \'light\';\\nconst ua = (await headers()).get(\'user-agent\');\\n```\\n\\n```js\\n\'use server\';\\nexport async function setTheme(theme) {\\n  (await cookies()).set(\'theme\', theme, { httpOnly: true, sameSite: \'lax\', path: \'/\' });\\n}\\n```\\n\\n**Watch out.** `useSearchParams()` in a Client Component on a static route makes that component client-rendered up to the nearest Suspense boundary. Without a boundary the whole page falls back to client rendering, and builds warn about it. Wrap it in `\\u003cSuspense>`."},{"id":"nextjs-questions-ebook-1sw8qkj","book":"Next.js","part":"Part 7 — Proxy, Authentication, and Request Data","question":"How do you keep secrets out of the client bundle?","prompt":"","answer":"**Short answer.** Only env vars prefixed `NEXT_PUBLIC_` are inlined into client JavaScript; everything else is server-only. Mark server modules with `import \'server-only\'`, and never pass secret-bearing objects as props to Client Components.\\n\\n**Explanation.**\\n\\n```bash\\nDATABASE_URL=postgres://...         # server only\\nSTRIPE_SECRET_KEY=sk_live_...       # server only\\nNEXT_PUBLIC_STRIPE_KEY=pk_live_...  # bundled into the browser\\n```\\n\\nLeak paths interviewers look for:\\n\\n- A `NEXT_PUBLIC_` prefix on a secret \\"to make it work in a component\\".\\n- A Server Component passing `user` (with `passwordHash`) as a prop to a Client Component.\\n- A Server Action returning a full DB record.\\n\\nReact\'s taint APIs (`experimental_taintObjectReference`, `experimental_taintUniqueValue`) can block specific objects or values from ever crossing to the client.\\n\\n**Watch out.** `NEXT_PUBLIC_` values are inlined at **build** time. Changing them in the deployment environment without rebuilding has no effect — a common Docker gotcha (Q40)."},{"id":"nextjs-questions-ebook-ln5vhr","book":"Next.js","part":"Part 8 — Built-in Optimizations","question":"What does `next/image` do?","prompt":"","answer":"**Short answer.** It serves responsive, lazily loaded, modern-format (WebP/AVIF) images resized on demand, and reserves space to prevent layout shift.\\n\\n**Explanation.**\\n\\n```jsx\\nimport Image from \'next/image\';\\nimport hero from \'./hero.jpg\';   // static import: width/height/blur inferred\\n\\n\\u003cImage src={hero} alt=\\"Team at work\\" placeholder=\\"blur\\" preload />\\n\\n\\u003cImage\\n  src={product.imageUrl}\\n  alt={product.name}\\n  width={600}\\n  height={400}\\n  sizes=\\"(max-width: 768px) 100vw, 50vw\\"\\n/>\\n```\\n\\n- `sizes` tells the browser which width to download — without it, responsive images download too large.\\n- Mark the LCP image with `preload` (formerly `priority`) so it isn\'t lazy-loaded.\\n- Remote domains must be allowed in `images.remotePatterns`.\\n\\n**Watch out.** The optimizer runs on your server or platform and can be costly at scale. For a CDN that already optimizes images, configure a custom `loader` or set `unoptimized`."},{"id":"nextjs-questions-ebook-oh7e9v","book":"Next.js","part":"Part 8 — Built-in Optimizations","question":"What does `next/font` do?","prompt":"","answer":"**Short answer.** It downloads fonts at build time and self-hosts them — no request to Google at runtime — and generates fallback metrics so text doesn\'t shift when the web font loads.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/layout.js\\nimport { Inter } from \'next/font/google\';\\n\\nconst inter = Inter({ subsets: [\'latin\'], display: \'swap\', variable: \'--font-inter\' });\\n\\nexport default function RootLayout({ children }) {\\n  return (\\n    \\u003chtml lang=\\"en\\" className={inter.variable}>\\n      \\u003cbody>{children}\\u003c/body>\\n    \\u003c/html>\\n  );\\n}\\n```\\n\\nBenefits: no layout shift (CLS), no third-party request (privacy, GDPR), and fonts are preloaded only on routes that use them.\\n\\n**Watch out.** Each `Inter()` call creates a separate font instance. Define fonts once in a shared module and import them."},{"id":"nextjs-questions-ebook-15r7vhy","book":"Next.js","part":"Part 8 — Built-in Optimizations","question":"How do you set metadata and SEO tags?","prompt":"","answer":"**Short answer.** Export a static `metadata` object or an async `generateMetadata` function from a layout or page. Next merges them down the tree and renders the `\\u003chead>` tags. File conventions handle icons, Open Graph images, `sitemap`, and `robots`.\\n\\n**Explanation.**\\n\\n```jsx\\n// app/layout.js\\nexport const metadata = {\\n  title: { default: \'Acme\', template: \'%s | Acme\' },\\n  description: \'Acme store\',\\n};\\n\\n// app/products/[id]/page.js\\nexport async function generateMetadata({ params }) {\\n  const { id } = await params;\\n  const product = await getProduct(id);   // deduplicated with the page\'s call\\n  return {\\n    title: product.name,\\n    description: product.summary,\\n    openGraph: { images: [product.imageUrl] },\\n    alternates: { canonical: `/products/${id}` },\\n  };\\n}\\n```\\n\\nFile conventions: `favicon.ico`, `icon.png`, `opengraph-image.tsx` (generated with `ImageResponse`), `sitemap.ts`, `robots.ts`.\\n\\n**Watch out.** `metadata` and `generateMetadata` work only in Server Components. Setting `document.title` from a Client Component isn\'t seen by crawlers that don\'t run JavaScript."},{"id":"nextjs-questions-ebook-9lgeze","book":"Next.js","part":"Part 8 — Built-in Optimizations","question":"How do you load third-party scripts?","prompt":"","answer":"**Short answer.** With `next/script` and a loading strategy, so analytics and widgets don\'t block rendering.\\n\\n**Explanation.**\\n\\n```jsx\\nimport Script from \'next/script\';\\n\\n\\u003cScript src=\\"https://example.com/analytics.js\\" strategy=\\"afterInteractive\\" />\\n\\u003cScript src=\\"https://example.com/chat.js\\" strategy=\\"lazyOnload\\" />\\n```\\n\\n| Strategy | Loads |\\n|---|---|\\n| `beforeInteractive` | Before hydration — only for critical scripts, root layout only |\\n| `afterInteractive` (default) | Right after hydration |\\n| `lazyOnload` | During browser idle time |\\n\\nFor Google Analytics and Tag Manager, `@next/third-parties` provides optimized components.\\n\\n**Watch out.** Third-party scripts are one of the biggest causes of poor INP. Audit them, load late, and remove the ones nobody uses."},{"id":"nextjs-questions-ebook-1s8iaek","book":"Next.js","part":"Part 8 — Built-in Optimizations","question":"How do you reduce bundle size in a Next.js app?","prompt":"","answer":"**Short answer.** Keep components on the server, push `\'use client\'` to leaves, lazy-load heavy client components with `next/dynamic`, and analyze the bundle to find large dependencies.\\n\\n**Explanation.**\\n\\n```jsx\\nimport dynamic from \'next/dynamic\';\\n\\nconst Editor = dynamic(() => import(\'./Editor\'), {\\n  loading: () => \\u003cEditorSkeleton />,\\n});\\n\\nconst Map = dynamic(() => import(\'./Map\'), { ssr: false });  // only allowed in Client Components\\n```\\n\\nOther levers:\\n\\n- Run a bundle analyzer and check what each `\'use client\'` boundary pulls in.\\n- `optimizePackageImports` in `next.config.js` for libraries with many exports (icon sets, utility libraries).\\n- Do formatting (dates, markdown, syntax highlighting) in Server Components, so those libraries never ship.\\n\\n**Watch out.** A Client Component imported by a Server Component is a *boundary* — the client component and all its imports ship. A tiny `\'use client\'` wrapper that imports a whole UI library can be the biggest file in your bundle."},{"id":"nextjs-questions-ebook-2pfw7q","book":"Next.js","part":"Part 9 — Configuration and Deployment","question":"How do environment variables work?","prompt":"","answer":"**Short answer.** `.env`, `.env.local`, `.env.development`, and `.env.production` are loaded automatically. Server code reads any variable from `process.env`; client code can only read `NEXT_PUBLIC_*`, which are inlined at build time.\\n\\n**Explanation.** Load order (first wins): `process.env` → `.env.$(NODE_ENV).local` → `.env.local` (not loaded in test) → `.env.$(NODE_ENV)` → `.env`.\\n\\nRules of thumb:\\n\\n- Commit `.env.example`, never `.env.local`.\\n- Validate env vars at startup with a schema, so a missing variable fails the deploy, not a user request.\\n- Runtime-only values (different per environment, same build) must be read on the server, not via `NEXT_PUBLIC_`.\\n\\n**Watch out.** \\"Build once, deploy everywhere\\" breaks with `NEXT_PUBLIC_` variables — they\'re baked into the JS. Read them on the server and pass them down, or expose them through a small endpoint."},{"id":"nextjs-questions-ebook-ttqq09","book":"Next.js","part":"Part 9 — Configuration and Deployment","question":"How do you self-host Next.js?","prompt":"","answer":"**Short answer.** Run `next build` then `next start` on a Node server, or use `output: \'standalone\'` to produce a minimal folder with only the needed `node_modules` — ideal for Docker. Put a CDN in front for static assets.\\n\\n**Explanation.**\\n\\n```js\\n// next.config.js\\nexport default { output: \'standalone\' };\\n```\\n\\n```dockerfile\\nFROM node:22-alpine AS build\\nWORKDIR /app\\nCOPY package*.json ./\\nRUN npm ci\\nCOPY . .\\nRUN npm run build\\n\\nFROM node:22-alpine\\nWORKDIR /app\\nENV NODE_ENV=production\\nCOPY --from=build /app/.next/standalone ./\\nCOPY --from=build /app/.next/static ./.next/static\\nCOPY --from=build /app/public ./public\\nUSER node\\nEXPOSE 3000\\nCMD [\\"node\\", \\"server.js\\"]\\n```\\n\\nSelf-hosting concerns: shared cache handler for multiple instances (Q25), image optimization CPU cost, graceful shutdown, and the same build ID across instances so Server Action IDs match.\\n\\n**Watch out.** `output: \'export\'` is a different thing — a fully static site with no server. No Server Actions, no dynamic rendering, no ISR, no proxy."},{"id":"nextjs-questions-ebook-1drdazh","book":"Next.js","part":"Part 9 — Configuration and Deployment","question":"What is Turbopack?","prompt":"","answer":"**Short answer.** A Rust-based bundler built for Next.js. It\'s the default for both `next dev` and `next build` since Next.js 16, replacing webpack, with much faster startup and Fast Refresh.\\n\\n**Explanation.** It\'s incremental: it caches work at the function level, so changing one file recomputes only what depends on it. You can still opt back into webpack with `--webpack` if a project depends on custom webpack configuration.\\n\\n**Watch out.** Custom `webpack()` config in `next.config.js` doesn\'t apply to Turbopack. Projects with webpack loaders or plugins need to migrate them to `turbopack` config options or stay on webpack."},{"id":"nextjs-questions-ebook-i62hn6","book":"Next.js","part":"Part 9 — Configuration and Deployment","question":"How do you add observability?","prompt":"","answer":"**Short answer.** Use `instrumentation.ts` to initialize monitoring (OpenTelemetry, Sentry) once when the server starts, and its `onRequestError` hook to report server errors with route context.\\n\\n**Explanation.**\\n\\n```ts\\n// instrumentation.ts\\nexport async function register() {\\n  if (process.env.NEXT_RUNTIME === \'nodejs\') {\\n    await import(\'./otel.node\');\\n  }\\n}\\n\\nexport async function onRequestError(error, request, context) {\\n  await reportError(error, {\\n    path: request.path,\\n    routeType: context.routeType,   // \'render\' | \'route\' | \'action\' | \'proxy\'\\n  });\\n}\\n```\\n\\nClient-side, `instrumentation-client.ts` runs before hydration — the place for client error tracking and analytics. `useReportWebVitals` reports LCP, CLS, and INP.\\n\\n**Watch out.** Production error messages from Server Components are replaced with a `digest`. Log the digest on the server so you can match a user\'s error screen to the real stack trace."},{"id":"nextjs-questions-ebook-a0l3la","book":"Next.js","part":"Part 10 — Errors and Testing","question":"How does error handling differ between Server Components, Server Actions, and Route Handlers?","prompt":"","answer":"**Short answer.** In rendering, thrown errors go to the nearest `error.js`. In Server Actions, return expected errors as values (validation, \\"not allowed\\") and let unexpected ones throw. In Route Handlers, return an appropriate status code with `Response.json`.\\n\\n**Explanation.**\\n\\n```js\\n// Server Action — expected errors are data\\nexport async function updateProfile(prev, formData) {\\n  const parsed = schema.safeParse(Object.fromEntries(formData));\\n  if (!parsed.success) return { errors: parsed.error.flatten().fieldErrors };\\n  await save(parsed.data);\\n  return { errors: null };\\n}\\n```\\n\\n```js\\n// Route Handler — HTTP semantics\\nexport async function GET(req, { params }) {\\n  const { id } = await params;\\n  const item = await getItem(id);\\n  if (!item) return Response.json({ error: \'Not found\' }, { status: 404 });\\n  return Response.json(item);\\n}\\n```\\n\\n**Watch out.** Throwing for validation errors in a Server Action sends the user to the error boundary and loses their form input. Model expected failures as return values."},{"id":"nextjs-questions-ebook-1a5tb34","book":"Next.js","part":"Part 10 — Errors and Testing","question":"How do you test a Next.js app?","prompt":"","answer":"**Short answer.** Unit and component tests with Vitest or Jest + React Testing Library for Client Components and pure logic; test data-layer functions and Server Actions as plain async functions; use Playwright end-to-end tests for routes, async Server Components, and full flows.\\n\\n**Explanation.**\\n\\n| What | How |\\n|---|---|\\n| Client Components | RTL + Vitest/Jest |\\n| Utilities, schemas, reducers | Unit tests |\\n| Data access layer, Server Actions | Call directly, mock DB or use a test DB |\\n| Async Server Components | E2E (Playwright) — unit runners don\'t fully support them |\\n| Proxy, redirects, caching | E2E against `next build && next start` |\\n\\n```ts\\n// e2e/checkout.spec.ts\\ntest(\'guest can checkout\', async ({ page }) => {\\n  await page.goto(\'/products/1\');\\n  await page.getByRole(\'button\', { name: \'Add to cart\' }).click();\\n  await page.getByRole(\'link\', { name: \'Cart\' }).click();\\n  await expect(page.getByText(\'1 item\')).toBeVisible();\\n});\\n```\\n\\n**Watch out.** Run E2E tests against a production build. Dev mode compiles on demand and caches differently, so it hides timing and caching bugs."},{"id":"nextjs-questions-ebook-c4gcz1","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"What\'s wrong with this page?","prompt":"```jsx\\nexport default function Page({ params }) {\\n  const post = getPost(params.slug);\\n  return \\u003ch1>{post.title}\\u003c/h1>;\\n}\\n```","answer":"Two bugs. `params` is a promise since Next.js 15 (sync access removed in 16), and `getPost` is presumably async but isn\'t awaited. Fix: `export default async function Page({ params }) { const { slug } = await params; const post = await getPost(slug); ... }`."},{"id":"nextjs-questions-ebook-3kqb5n","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Why does this fail to build?","prompt":"```jsx\\n// app/dashboard/page.js\\nimport { useState } from \'react\';\\n\\nexport default async function Dashboard() {\\n  const [tab, setTab] = useState(\'overview\');\\n  const data = await getData();\\n  return \\u003cTabs value={tab} onChange={setTab} data={data} />;\\n}\\n```","answer":"Server Components can\'t use state or pass event handlers, and Client Components can\'t be `async`. Split it: keep `Dashboard` as an async Server Component that fetches `data`, and move the tab state into a `\'use client\'` `DashboardTabs` component that receives `data` as a prop."},{"id":"nextjs-questions-ebook-1srj9kv","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Spot the bug.","prompt":"```js\\n\'use server\';\\nexport async function deleteInvoice(id) {\\n  try {\\n    await db.invoice.delete({ where: { id } });\\n    redirect(\'/invoices\');\\n  } catch (e) {\\n    return { error: \'Failed to delete\' };\\n  }\\n}\\n```","answer":"Three problems. `redirect()` throws a special error, so the `catch` swallows it and the user gets `{ error: \'Failed to delete\' }` after a successful delete — call `redirect` after the `try/catch`. There\'s no auth or ownership check — any caller can delete any invoice. And nothing invalidates the cached invoice list (`updateTag` / `revalidatePath`)."},{"id":"nextjs-questions-ebook-1eiqb3y","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Why is the whole site dynamic?","prompt":"```jsx\\n// app/layout.js\\nimport { cookies } from \'next/headers\';\\n\\nexport default async function RootLayout({ children }) {\\n  const theme = (await cookies()).get(\'theme\')?.value ?? \'light\';\\n  return \\u003chtml className={theme}>\\u003cbody>{children}\\u003c/body>\\u003c/html>;\\n}\\n```","answer":"Reading cookies in the root layout makes every route request-dependent, so nothing can be prerendered. Options: set the theme class on the client with a small inline script, read the cookie in a small component inside a Suspense boundary, or use a CSS `prefers-color-scheme` default with a client toggle."},{"id":"nextjs-questions-ebook-1z0bpei","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Why does this leak data?","prompt":"```jsx\\n// Server Component\\nconst user = await db.user.findUnique({ where: { id } });\\nreturn \\u003cProfileCard user={user} />;   // ProfileCard is \'use client\'\\n```","answer":"Every field on `user` — including `passwordHash`, `email`, internal flags — is serialized into the RSC payload and visible in the browser. Select only the fields the client needs (`select: { name: true, avatarUrl: true }`) or map to a DTO before passing it across the boundary."},{"id":"nextjs-questions-ebook-1rhqwcc","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Why is `useRouter` undefined / throwing here?","prompt":"```jsx\\n\'use client\';\\nimport { useRouter } from \'next/router\';\\n```","answer":"`next/router` is the Pages Router API. In the App Router, import `useRouter`, `usePathname`, and `useSearchParams` from `next/navigation`. Note that the App Router\'s `useRouter` has no `pathname` or `query` — use the separate hooks."},{"id":"nextjs-questions-ebook-1pefznt","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"The user updated their profile but still sees the old name. Why?","prompt":"```js\\n\'use server\';\\nexport async function updateName(formData) {\\n  const { userId } = await verifySession();\\n  await db.user.update({ where: { id: userId }, data: { name: formData.get(\'name\') } });\\n}\\n```\\n\\n```js\\nexport async function getUser(id) {\\n  \'use cache\';\\n  cacheTag(`user-${id}`);\\n  return db.user.findUnique({ where: { id } });\\n}\\n```","answer":"The action writes to the database but never invalidates the cached `getUser` result. Add ``updateTag(`user-${userId}`)`` at the end of the action — `updateTag` (not `revalidateTag`) so the user immediately reads their own write."},{"id":"nextjs-questions-ebook-11dcl6o","book":"Next.js","part":"Part 11 — Rapid-Fire and Code Puzzles","question":"Quick definitions","prompt":"","answer":"| Term | One line |\\n|---|---|\\n| **App Router** | `app/` directory router built on React Server Components |\\n| **Segment** | One part of the URL path, mapped to a folder |\\n| **Layout** | Shared UI preserved across navigation between child routes |\\n| **Route group** | `(folder)` — organizes routes without changing the URL |\\n| **Parallel route** | `@slot` — renders multiple pages in one layout |\\n| **Intercepting route** | `(..)path` — shows a route in the current context (e.g. a modal) |\\n| **Static rendering** | HTML generated at build time or on revalidation |\\n| **Dynamic rendering** | HTML generated per request |\\n| **Cache Components** | Opt-in model mixing a static shell with streamed dynamic holes |\\n| **`\'use cache\'`** | Directive that caches a function or component\'s output |\\n| **`cacheTag` / `updateTag`** | Label cached data / expire it immediately after a mutation |\\n| **ISR** | Static pages regenerated in the background after they go stale |\\n| **Server Action** | `\'use server\'` function callable from the client — a public POST endpoint |\\n| **Route Handler** | `route.js` — a custom HTTP endpoint |\\n| **`proxy.ts`** | Pre-routing request hook (formerly `middleware.ts`) |\\n| **Standalone output** | Minimal server bundle for Docker / self-hosting |"},{"id":"nodejs-questions-ebook-12s9epx","book":"Node.js","part":"Part 1 — Fundamentals","question":"What is Node.js?","prompt":"","answer":"**Short answer.** Node.js is a runtime that lets JavaScript run outside the browser. It pairs Google\'s V8 engine with libuv, a C library that provides the event loop and asynchronous I/O.\\n\\n**Explanation.** JavaScript by itself is only a language spec. It has no way to open a file, listen on a port, or read an environment variable. The browser adds DOM APIs; Node adds server APIs — `fs`, `net`, `http`, `crypto`, `process`. So \\"Node is JavaScript for the server\\" is a shorthand for: same language, different set of host objects.\\n\\nThe three pieces that matter:\\n\\n| Piece | Role |\\n|---|---|\\n| V8 | Compiles and executes JavaScript |\\n| libuv | Event loop, thread pool, async file and network I/O |\\n| Node bindings | C++ glue exposing libuv and OS features as JS APIs |\\n\\n**Watch out.** A common follow-up: \\"Is Node single-threaded?\\" The JavaScript you write runs on one thread. Node itself is not single-threaded — libuv keeps a thread pool (default 4) for file system work, DNS lookups, and some crypto."},{"id":"nodejs-questions-ebook-3sxisy","book":"Node.js","part":"Part 1 — Fundamentals","question":"Why is Node good for I/O-heavy work and bad for CPU-heavy work?","prompt":"","answer":"**Short answer.** Node handles thousands of concurrent connections cheaply because waiting on I/O costs no thread. But any long synchronous computation blocks the single JS thread, and every other request stalls behind it.\\n\\n**Explanation.** A traditional thread-per-request server allocates a thread (often ~1 MB of stack) per connection; 10,000 idle connections means 10,000 mostly-sleeping threads. Node instead registers a callback and moves on. Idle connections cost a file descriptor and a small object.\\n\\nThe flip side: there is exactly one thread running your code. This is the whole ballgame.\\n\\n```js\\n// This freezes the entire server for ~2 seconds.\\napp.get(\'/bad\', (req, res) => {\\n  let total = 0;\\n  for (let i = 0; i \\u003c 5e9; i++) total += i;\\n  res.json({ total });\\n});\\n```\\n\\nDuring that loop, no other request is accepted, no timer fires, no socket is read.\\n\\n**Fixes for CPU work:** offload to a `worker_threads` pool, spawn a child process, push the job to a queue consumed by a separate service, or use a native addon.\\n\\n**Watch out.** \\"CPU-heavy\\" includes things people don\'t think of: huge `JSON.parse`, synchronous `bcrypt` with a high cost factor, large regex backtracking, image resizing, and `JSON.stringify` on a multi-megabyte object."},{"id":"nodejs-questions-ebook-g8ez5s","book":"Node.js","part":"Part 1 — Fundamentals","question":"Blocking vs non-blocking, synchronous vs asynchronous","prompt":"","answer":"**Short answer.** Blocking means the call does not return until the work finishes, holding the thread. Non-blocking returns immediately and delivers the result later via callback, promise, or event.\\n\\n**Explanation.**\\n\\n```js\\nconst fs = require(\'fs\');\\n\\n// Blocking — nothing else runs until the disk answers\\nconst data = fs.readFileSync(\'big.log\', \'utf8\');\\nconsole.log(data.length);\\n\\n// Non-blocking — the read happens on the thread pool\\nfs.readFile(\'big.log\', \'utf8\', (err, data) => {\\n  if (err) return console.error(err);\\n  console.log(data.length);\\n});\\nconsole.log(\'this prints first\');\\n```\\n\\n**Watch out.** Sync APIs are fine in exactly two places: startup (loading config before the server listens) and CLI scripts where nothing else is running. They are never fine inside a request handler."},{"id":"nodejs-questions-ebook-mbnlwe","book":"Node.js","part":"Part 1 — Fundamentals","question":"What is `process` and what do you actually use it for?","prompt":"","answer":"**Short answer.** A global object representing the running Node process — its environment, arguments, streams, lifecycle events, and resource usage.\\n\\n**Explanation.** The pieces worth knowing:\\n\\n```js\\nprocess.env.NODE_ENV;        // environment variables\\nprocess.argv;                // [node, script, ...args]\\nprocess.cwd();               // working directory\\nprocess.pid;                 // process id\\nprocess.memoryUsage();       // heapUsed, rss, external\\nprocess.uptime();            // seconds since start\\nprocess.exit(1);             // exit with a status code\\nprocess.nextTick(fn);        // run fn right after the current operation\\nprocess.on(\'SIGTERM\', shutdown);\\nprocess.on(\'uncaughtException\', handler);\\nprocess.on(\'unhandledRejection\', handler);\\n```\\n\\n**Watch out.** `process.exit()` kills the process immediately, discarding pending writes to stdout and open sockets. In a shutdown handler, stop accepting connections, drain, then let Node exit naturally — or call `exit` only after the drain completes."},{"id":"nodejs-questions-ebook-n4gxcr","book":"Node.js","part":"Part 1 — Fundamentals","question":"What is `npm`, and what is the difference between `dependencies`, `devDependencies`, and `peerDependencies`?","prompt":"","answer":"**Short answer.** `dependencies` are needed at runtime. `devDependencies` are needed only to build or test. `peerDependencies` declare a package your consumer must supply — typical for plugins.\\n\\n**Explanation.**\\n\\n```json\\n{\\n  \\"dependencies\\":     { \\"express\\": \\"^4.19.2\\" },\\n  \\"devDependencies\\":  { \\"jest\\": \\"^29.7.0\\" },\\n  \\"peerDependencies\\": { \\"react\\": \\">=18\\" }\\n}\\n```\\n\\n`npm ci` installs strictly from `package-lock.json`, deletes `node_modules` first, and fails if the lock file disagrees with `package.json`. Use it in CI and Docker builds. Use `npm install` locally when you intend to change the dependency tree.\\n\\n**Watch out.** Semver ranges: `^4.19.2` allows any 4.x above 4.19.2; `~4.19.2` allows 4.19.x only; `4.19.2` pins exactly. The lock file is what actually makes builds reproducible — commit it."},{"id":"nodejs-questions-ebook-fqbrqz","book":"Node.js","part":"Part 1 — Fundamentals","question":"What does the caret in `\\"^1.2.3\\"` mean for a `0.x` package?","prompt":"","answer":"**Short answer.** For `0.x` versions, caret behaves like tilde — `^0.2.3` allows `0.2.x` but not `0.3.0`.\\n\\n**Explanation.** Semver treats `0.x` as unstable, so the minor position is treated as breaking. This surprises people who assume `^` always allows minor bumps."},{"id":"nodejs-questions-ebook-dbuu1z","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"Explain the event loop.","prompt":"","answer":"**Short answer.** The event loop is libuv\'s cycle that repeatedly checks queues of completed work and runs the associated JavaScript callbacks, one at a time, on the main thread.\\n\\n**Explanation.** Each turn of the loop moves through ordered phases:\\n\\n1. **timers** — callbacks from `setTimeout` and `setInterval` whose time has come.\\n2. **pending callbacks** — deferred system-level callbacks, e.g. certain TCP errors.\\n3. **idle / prepare** — internal use.\\n4. **poll** — retrieve new I/O events; execute I/O callbacks. If nothing is scheduled, the loop may block here waiting for work.\\n5. **check** — `setImmediate` callbacks.\\n6. **close callbacks** — `socket.on(\'close\')` and friends.\\n\\nBetween every callback, Node drains two microtask queues: first `process.nextTick`, then promise callbacks. Microtasks always run before the loop moves on.\\n\\n```\\n   ┌───────────────┐\\n┌─▶│    timers     │  setTimeout / setInterval\\n│  ├───────────────┤\\n│  │ pending cbs   │\\n│  ├───────────────┤\\n│  │ idle, prepare │\\n│  ├───────────────┤     ┌───────────────┐\\n│  │     poll      │◀────│  incoming I/O │\\n│  ├───────────────┤     └───────────────┘\\n│  │     check     │  setImmediate\\n│  ├───────────────┤\\n└──│ close callbacks│\\n   └───────────────┘\\n```\\n\\n**Watch out.** The classic follow-up: \\"So where do promises run?\\" Not in a phase — they run in the microtask queue that drains after each callback, so they always beat the next timer or I/O callback."},{"id":"nodejs-questions-ebook-1t8ud24","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"`setTimeout(fn, 0)` vs `setImmediate(fn)` — which runs first?","prompt":"","answer":"**Short answer.** From the main module, the order is non-deterministic. From inside an I/O callback, `setImmediate` always runs first.\\n\\n**Explanation.**\\n\\n```js\\nsetTimeout(() => console.log(\'timeout\'), 0);\\nsetImmediate(() => console.log(\'immediate\'));\\n// Order varies run to run — depends on how long process startup took.\\n```\\n\\nWhy: `setTimeout(fn, 0)` is clamped to 1 ms. If the loop takes longer than 1 ms to reach the timers phase, the timer is ready and fires first. If not, it waits a turn and `setImmediate` wins.\\n\\n```js\\nconst fs = require(\'fs\');\\nfs.readFile(__filename, () => {\\n  setTimeout(() => console.log(\'timeout\'), 0);\\n  setImmediate(() => console.log(\'immediate\'));\\n});\\n// Always: immediate, then timeout\\n```\\n\\nInside the I/O callback we are already in the poll phase. The next phase is **check**, so `setImmediate` runs; timers come around only on the following iteration."},{"id":"nodejs-questions-ebook-g4u53h","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"`process.nextTick()` vs `queueMicrotask()` vs `Promise.then()`","prompt":"","answer":"**Short answer.** All three defer work to before the next event loop phase. `process.nextTick` has the highest priority; promise callbacks and `queueMicrotask` share the standard microtask queue.\\n\\n**Explanation.**\\n\\n```js\\nsetTimeout(() => console.log(\'1: timeout\'));\\nsetImmediate(() => console.log(\'2: immediate\'));\\nPromise.resolve().then(() => console.log(\'3: promise\'));\\nprocess.nextTick(() => console.log(\'4: nextTick\'));\\nqueueMicrotask(() => console.log(\'5: microtask\'));\\nconsole.log(\'6: sync\');\\n\\n// 6: sync\\n// 4: nextTick\\n// 3: promise\\n// 5: microtask\\n// 1: timeout\\n// 2: immediate\\n```\\n\\nSynchronous code first. Then the nextTick queue drains completely. Then microtasks (promises and `queueMicrotask` in FIFO order together). Only then does the loop proceed.\\n\\n**Watch out.** `process.nextTick` can starve the loop:\\n\\n```js\\nfunction loop() { process.nextTick(loop); }\\nloop(); // Server hangs forever — I/O never gets a turn.\\n```\\n\\nThe nextTick queue is drained *entirely* before moving on, so a self-scheduling tick never yields. `setImmediate` in the same pattern is safe."},{"id":"nodejs-questions-ebook-52mxz7","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"Callbacks, promises, async/await — what problem does each solve?","prompt":"","answer":"**Short answer.** Callbacks were the original async primitive but compose badly. Promises make async values first-class and chainable. `async/await` is syntax over promises that restores linear, try/catch-able code.\\n\\n**Explanation.** The Node callback convention is error-first:\\n\\n```js\\nfs.readFile(path, (err, data) => {\\n  if (err) return cb(err);\\n  // ...\\n});\\n```\\n\\nNesting three or four of these produces the pyramid everyone complains about, and — more importantly — errors must be manually forwarded at every level.\\n\\nPromises fix composition:\\n\\n```js\\nconst fsp = require(\'fs/promises\');\\n\\nasync function loadConfig(path) {\\n  try {\\n    const raw = await fsp.readFile(path, \'utf8\');\\n    return JSON.parse(raw);\\n  } catch (err) {\\n    throw new Error(`Config load failed: ${err.message}`, { cause: err });\\n  }\\n}\\n```\\n\\nConvert legacy callback APIs with `util.promisify`:\\n\\n```js\\nconst { promisify } = require(\'util\');\\nconst sleep = promisify(setTimeout);\\nawait sleep(1000);\\n```\\n\\n**Watch out.** `await` inside a loop serializes work. If the calls are independent, run them concurrently:\\n\\n```js\\n// Slow — 10 sequential round trips\\nfor (const id of ids) results.push(await fetchUser(id));\\n\\n// Fast — all in flight at once\\nconst results = await Promise.all(ids.map(fetchUser));\\n```\\n\\nBut be careful with `Promise.all` on thousands of items — you\'ll open thousands of sockets. Use a concurrency limiter (`p-limit`) for large sets."},{"id":"nodejs-questions-ebook-16dpif5","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"`Promise.all` vs `allSettled` vs `race` vs `any`","prompt":"","answer":"**Short answer.**\\n\\n| Method | Resolves when | Rejects when |\\n|---|---|---|\\n| `all` | every promise fulfills | any one rejects (fails fast) |\\n| `allSettled` | every promise settles | never |\\n| `race` | first promise settles, either way | first settles as a rejection |\\n| `any` | first promise fulfills | all reject (`AggregateError`) |\\n\\n**Explanation.** Use `allSettled` when partial success is acceptable — sending 100 notifications, three fail, you still want the other 97 and a report:\\n\\n```js\\nconst results = await Promise.allSettled(users.map(notify));\\nconst failed = results.filter(r => r.status === \'rejected\');\\n```\\n\\nUse `race` for timeouts:\\n\\n```js\\nconst withTimeout = (p, ms) => Promise.race([\\n  p,\\n  new Promise((_, rej) => setTimeout(() => rej(new Error(\'timeout\')), ms))\\n]);\\n```\\n\\n**Watch out.** `Promise.all` rejecting does not cancel the other promises. They keep running; their results are discarded. If they have side effects, that matters."},{"id":"nodejs-questions-ebook-757q74","book":"Node.js","part":"Part 2 — The Event Loop and Asynchrony","question":"What is an unhandled promise rejection and how should you handle it?","prompt":"","answer":"**Short answer.** A rejected promise with no `.catch` handler. Since Node 15 this crashes the process by default.\\n\\n**Explanation.**\\n\\n```js\\nprocess.on(\'unhandledRejection\', (reason, promise) => {\\n  logger.fatal({ reason }, \'Unhandled rejection\');\\n  // Log, then let the process die and be restarted by the supervisor.\\n  process.exit(1);\\n});\\n```\\n\\nThe correct posture is: log with full context, then exit. An unhandled rejection means your program is in a state you did not anticipate; continuing risks corrupted data. Let PM2, Docker, systemd, or Kubernetes restart a clean process.\\n\\n**Watch out.** Do not use these handlers as a general error mechanism to keep the server alive. They are a last-resort safety net and a signal that you missed a `catch`."},{"id":"nodejs-questions-ebook-1bk10e7","book":"Node.js","part":"Part 3 — Modules","question":"CommonJS vs ES Modules","prompt":"","answer":"**Short answer.** CommonJS (`require`/`module.exports`) is Node\'s original, synchronous, dynamically-resolved module system. ESM (`import`/`export`) is the JavaScript standard — statically analysable, asynchronous, and supports top-level `await`.\\n\\n**Explanation.**\\n\\n```js\\n// CommonJS\\nconst express = require(\'express\');\\nmodule.exports = { start };\\n\\n// ESM\\nimport express from \'express\';\\nexport { start };\\n```\\n\\n| | CommonJS | ESM |\\n|---|---|---|\\n| Loading | synchronous | asynchronous |\\n| Resolution | at runtime | at parse time |\\n| Conditional import | `if (x) require(\'y\')` works | needs dynamic `import()` |\\n| Top-level await | no | yes |\\n| `__dirname` | available | use `import.meta.url` |\\n| Tree shaking | poor | good |\\n\\nEnable ESM by setting `\\"type\\": \\"module\\"` in `package.json`, or using the `.mjs` extension. CommonJS files can be forced with `.cjs`.\\n\\n```js\\n// __dirname replacement in ESM\\nimport { fileURLToPath } from \'url\';\\nimport { dirname } from \'path\';\\nconst __dirname = dirname(fileURLToPath(import.meta.url));\\n```\\n\\n**Watch out.** ESM can import CommonJS (usually as a default export). CommonJS cannot `require` an ESM module — it must use dynamic `await import()`. This asymmetry is the source of most \\"Cannot use import statement outside a module\\" pain."},{"id":"nodejs-questions-ebook-18zg3mr","book":"Node.js","part":"Part 3 — Modules","question":"What does `require()` actually do?","prom
