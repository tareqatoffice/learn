, the browser compares them in order: origin and importance, then context (shadow DOM), then style attribute, then cascade layer, then specificity, then source order. The first criterion that differs decides.\\n\\n**Explanation.**\\n\\n| Step | Rule |\\n|---|---|\\n| 1. Origin & importance | User-agent \\u003c user \\u003c author for normal declarations; `!important` reverses the order |\\n| 2. Context | Shadow DOM encapsulation |\\n| 3. Element-attached | Inline `style=\\"\\"` beats selectors |\\n| 4. Layers | Later `@layer` beats earlier; unlayered styles beat all layers |\\n| 5. Specificity | Higher specificity wins |\\n| 6. Order of appearance | Later declaration wins |\\n\\n```css\\n@layer base, components;\\n@layer components { .btn { color: blue; } }\\n@layer base { #main .btn { color: red; } }   /* higher specificity, but earlier layer — loses */\\n```\\n\\n**Watch out.** Layers are checked *before* specificity. That\'s the whole point of `@layer`: a low-specificity rule in a later layer beats a high-specificity rule in an earlier one. Many people still answer \\"specificity first\\"."},{"id":"css-questions-ebook-1o3o79g","book":"CSS","part":"Part 1 — Fundamentals","question":"How is specificity calculated?","prompt":"","answer":"**Short answer.** As a three-part score (A, B, C): A = ID selectors, B = classes, attributes, and pseudo-classes, C = type selectors and pseudo-elements. Compare A first, then B, then C. The universal selector and combinators add nothing.\\n\\n**Explanation.**\\n\\n| Selector | (A, B, C) |\\n|---|---|\\n| `p` | (0, 0, 1) |\\n| `.card p` | (0, 1, 1) |\\n| `#nav .item:hover` | (1, 2, 0) |\\n| `ul li a::before` | (0, 0, 4) |\\n| `:is(#id, .cls) p` | (1, 0, 1) — takes the most specific argument |\\n| `:where(#id, .cls) p` | (0, 0, 1) — `:where()` is always zero |\\n| `:not(.hidden)` | (0, 1, 0) — takes its argument\'s specificity |\\n\\nScores don\'t overflow: `(0, 11, 0)` never beats `(1, 0, 0)` — eleven classes lose to one ID.\\n\\n**Watch out.** `!important` is not part of specificity — it\'s a different step in the cascade. Fighting specificity with `!important` starts an arms race; fix it with layers or `:where()` instead."},{"id":"css-questions-ebook-1v3nsye","book":"CSS","part":"Part 1 — Fundamentals","question":"What is inheritance, and which properties inherit?","prompt":"","answer":"**Short answer.** Some properties pass their computed value from parent to child automatically — mostly text-related ones (`color`, `font-*`, `line-height`, `text-align`, `visibility`, `cursor`). Box-related ones (`margin`, `padding`, `border`, `background`, `width`, `display`) don\'t.\\n\\n**Explanation.** You can control it explicitly with global keywords:\\n\\n| Keyword | Effect |\\n|---|---|\\n| `inherit` | Take the parent\'s computed value |\\n| `initial` | Use the property\'s spec-defined initial value |\\n| `unset` | `inherit` if the property inherits, else `initial` |\\n| `revert` | Roll back to the user-agent (browser) style |\\n| `revert-layer` | Roll back to the previous cascade layer |\\n\\n```css\\nbutton { font: inherit; color: inherit; }   /* form controls don\'t inherit fonts by default */\\n```\\n\\n**Watch out.** `initial` is often not what people expect: `display: initial` is `inline`, even on a `\\u003cdiv>`. To undo your own styles, `revert` is usually the right keyword."},{"id":"css-questions-ebook-o2iyi8","book":"CSS","part":"Part 1 — Fundamentals","question":"Explain the box model and `box-sizing`.","prompt":"","answer":"**Short answer.** Every element is a box of content, padding, border, and margin. With the default `box-sizing: content-box`, `width` sets only the content, so padding and border add to it. With `border-box`, `width` includes padding and border.\\n\\n**Explanation.**\\n\\n```css\\n.a { box-sizing: content-box; width: 200px; padding: 20px; border: 5px solid; }  /* renders 250px wide */\\n.b { box-sizing: border-box;  width: 200px; padding: 20px; border: 5px solid; }  /* renders 200px wide */\\n```\\n\\nMost projects reset it globally:\\n\\n```css\\n*, *::before, *::after { box-sizing: border-box; }\\n```\\n\\n**Watch out.** Margin is never included in the box size under either model — it\'s space *outside* the border. And `outline` and `box-shadow` don\'t take up space at all."},{"id":"css-questions-ebook-f5qknu","book":"CSS","part":"Part 1 — Fundamentals","question":"What is margin collapsing?","prompt":"","answer":"**Short answer.** Vertical margins between block elements in normal flow combine into a single margin equal to the largest of them, instead of adding up. It also happens between a parent and its first/last child when nothing separates them.\\n\\n**Explanation.**\\n\\n```css\\nh2 { margin-bottom: 24px; }\\np  { margin-top: 16px; }      /* gap between them is 24px, not 40px */\\n```\\n\\nParent–child collapse:\\n\\n```css\\n.card { background: #eee; }\\n.card h2 { margin-top: 32px; }   /* the margin \\"leaks\\" out above .card */\\n```\\n\\nMargins don\'t collapse when the parent has padding or border, creates a new block formatting context (`display: flow-root`, `overflow` other than `visible`), or is a flex/grid container.\\n\\n**Watch out.** Margins never collapse inside flex or grid layouts, and never horizontally. Many teams sidestep the whole topic by using `gap` on flex/grid containers or by only setting margins in one direction (e.g. only `margin-block-end`)."},{"id":"css-questions-ebook-1gcwa3j","book":"CSS","part":"Part 1 — Fundamentals","question":"Which CSS units should you use, and when?","prompt":"","answer":"**Short answer.** `rem` for font sizes and most spacing (respects user font settings), `em` for things that should scale with the element\'s own font size, `%` and `fr` for fluid layout, viewport units for full-screen sections, `ch` for text measure, and `px` for borders and fine details.\\n\\n**Explanation.**\\n\\n| Unit | Relative to |\\n|---|---|\\n| `px` | CSS pixel (not a device pixel) |\\n| `rem` | Root (`\\u003chtml>`) font size |\\n| `em` | The element\'s font size (parent\'s, for `font-size` itself) |\\n| `%` | Parent\'s dimension (varies by property) |\\n| `vw` / `vh` | 1% of viewport width / height |\\n| `svh` / `lvh` / `dvh` | Small / large / dynamic viewport height (mobile toolbars) |\\n| `ch` | Width of the \\"0\\" glyph |\\n| `cqi` / `cqb` | 1% of the container\'s inline / block size |\\n| `fr` | A share of free space in a grid |\\n\\n```css\\narticle { max-width: 65ch; }               /* readable line length */\\n.hero { min-height: 100dvh; }              /* not 100vh — see the trap below */\\n```\\n\\n**Watch out.** `100vh` on mobile is the height with the browser toolbar *hidden*, so content is cut off when it\'s visible. Use `100dvh` (changes as the toolbar moves) or `100svh` (always the smallest). Also, setting `html { font-size: 62.5% }` to make `1rem = 10px` breaks for users who changed their default font size."},{"id":"css-questions-ebook-1csszpw","book":"CSS","part":"Part 1 — Fundamentals","question":"What do the main `display` values do?","prompt":"","answer":"**Short answer.** `display` sets two things: the *outer* type (how the box participates in its parent\'s layout — block or inline) and the *inner* type (how it lays out its children — flow, flex, grid, table). `none` removes the box entirely; `contents` removes the box but keeps its children.\\n\\n**Explanation.**\\n\\n| Value | Outer / inner |\\n|---|---|\\n| `block` | block / flow |\\n| `inline` | inline / flow — ignores `width`, `height`, vertical margins |\\n| `inline-block` | inline / flow-root — respects width and height |\\n| `flex` / `inline-flex` | block or inline / flex |\\n| `grid` / `inline-grid` | block or inline / grid |\\n| `flow-root` | block / new block formatting context |\\n| `contents` | no box; children promoted |\\n| `none` | not rendered, not in accessibility tree |\\n\\nThe two-value syntax makes this explicit: `display: inline flex`.\\n\\n**Watch out.** `display: contents` used to remove the element\'s semantics in some browsers (a `\\u003cbutton>` or `\\u003cul>` lost its role). Don\'t use it on interactive or semantic elements without testing with a screen reader."},{"id":"css-questions-ebook-1y41iaa","book":"CSS","part":"Part 1 — Fundamentals","question":"What is a block formatting context (BFC), and why does it matter?","prompt":"","answer":"**Short answer.** A BFC is an isolated layout region where floats are contained, margins don\'t collapse through the boundary, and the region doesn\'t overlap neighboring floats. `display: flow-root` creates one explicitly.\\n\\n**Explanation.** Classic problem — a parent with only floated children has zero height:\\n\\n```css\\n.parent { display: flow-root; }   /* now contains its floats — no clearfix hack */\\n```\\n\\nAlso created by: `overflow` other than `visible`/`clip`, `float`, `position: absolute/fixed`, `display: inline-block`, flex and grid items, `contain: layout`.\\n\\n**Watch out.** The old fix, `overflow: hidden`, works but clips shadows and dropdowns. `flow-root` has no side effects."},{"id":"css-questions-ebook-auafl5","book":"CSS","part":"Part 2 — Layout","question":"Explain flexbox in one minute.","prompt":"","answer":"**Short answer.** Flexbox lays out items along one axis — a row or a column. The container controls direction, wrapping, alignment, and gaps; items control how they grow, shrink, and their starting size.\\n\\n**Explanation.**\\n\\n```css\\n.toolbar {\\n  display: flex;\\n  flex-direction: row;         /* main axis */\\n  justify-content: space-between;  /* along the main axis */\\n  align-items: center;         /* along the cross axis */\\n  gap: 0.5rem;\\n  flex-wrap: wrap;\\n}\\n.toolbar .search { flex: 1; }  /* take the remaining space */\\n```\\n\\n| Container | Item |\\n|---|---|\\n| `flex-direction`, `flex-wrap` | `flex-grow`, `flex-shrink`, `flex-basis` |\\n| `justify-content` (main axis) | `align-self` |\\n| `align-items`, `align-content` (cross axis) | `order` |\\n| `gap` | `margin: auto` (pushes items apart) |\\n\\n**Watch out.** `justify-*` and `align-*` swap meaning when `flex-direction` is `column` — \\"justify\\" always means the main axis. Also, `order` changes only visual order, not tab order or reading order, which can confuse keyboard and screen-reader users."},{"id":"css-questions-ebook-1ou9958","book":"CSS","part":"Part 2 — Layout","question":"What\'s the difference between `flex: 1`, `flex: auto`, and `flex: none`?","prompt":"","answer":"**Short answer.** They\'re shorthands for `flex-grow flex-shrink flex-basis`. `flex: 1` (`1 1 0%`) splits space equally regardless of content. `flex: auto` (`1 1 auto`) grows and shrinks from the content\'s size, so bigger content gets more space. `flex: none` (`0 0 auto`) is fixed at content size.\\n\\n**Explanation.**\\n\\n```css\\n.equal > * { flex: 1; }    /* three columns of identical width */\\n.fit > *   { flex: auto; } /* widths proportional to content */\\n.icon      { flex: none; } /* never shrinks */\\n```\\n\\n**Watch out.** The famous overflow bug: a flex item\'s default `min-width` is `auto`, which means it refuses to shrink below its content width. A long URL or a `\\u003cpre>` inside a flex item breaks the layout. Fix it with `min-width: 0` (or `overflow: hidden`) on the item."},{"id":"css-questions-ebook-1sxibeg","book":"CSS","part":"Part 2 — Layout","question":"Explain CSS Grid in one minute.","prompt":"","answer":"**Short answer.** Grid lays out items in two dimensions — rows and columns at the same time. You define tracks on the container, then place items onto lines or named areas, or let auto-placement fill cells.\\n\\n**Explanation.**\\n\\n```css\\n.page {\\n  display: grid;\\n  grid-template-columns: 240px 1fr;\\n  grid-template-rows: auto 1fr auto;\\n  grid-template-areas:\\n    \\"header header\\"\\n    \\"sidebar main\\"\\n    \\"footer footer\\";\\n  gap: 1rem;\\n  min-height: 100dvh;\\n}\\nheader  { grid-area: header; }\\naside   { grid-area: sidebar; }\\nmain    { grid-area: main; }\\nfooter  { grid-area: footer; }\\n```\\n\\nUseful functions: `repeat()`, `minmax()`, `fit-content()`, and the `fr` unit for shares of free space.\\n\\n**Watch out.** `1fr` is really `minmax(auto, 1fr)` — a column won\'t shrink below its content\'s minimum width, so a long word can blow out the track. Use `minmax(0, 1fr)` when columns must stay equal."},{"id":"css-questions-ebook-1g1jrf8","book":"CSS","part":"Part 2 — Layout","question":"Flexbox or grid — how do you choose?","prompt":"","answer":"**Short answer.** Flexbox is content-out: items decide their size and the layout flows along one axis. Grid is layout-in: the container defines the structure and items are placed into it. Use flex for components in a line (toolbars, button groups, nav); use grid for page layouts and anything that must align in both directions (card galleries, forms, dashboards).\\n\\n**Explanation.**\\n\\n| Need | Pick |\\n|---|---|\\n| Items in a row that wrap naturally | Flex |\\n| Push one item to the end | Flex (`margin-left: auto`) |\\n| Columns that must line up across rows | Grid |\\n| Overlapping items | Grid (same cell) |\\n| Equal-width responsive cards | Grid (`auto-fit` + `minmax`) |\\n\\nThey nest freely — a grid page whose cells contain flex components is normal.\\n\\n**Watch out.** A wrapped flex row can\'t align its items with the row above — the last row of cards ends up wider. If items must align in columns, that\'s a grid problem."},{"id":"css-questions-ebook-tbvmnr","book":"CSS","part":"Part 2 — Layout","question":"How do you center something?","prompt":"","answer":"**Short answer.** Horizontally and vertically: `display: grid; place-items: center` on the parent, or flex with `justify-content` and `align-items`. For a block element horizontally only: `margin-inline: auto` with a set width.\\n\\n**Explanation.**\\n\\n```css\\n.center-grid { display: grid; place-items: center; }\\n\\n.center-flex { display: flex; justify-content: center; align-items: center; }\\n\\n.center-block { width: min(100% - 2rem, 60rem); margin-inline: auto; }\\n\\n.center-abs {\\n  position: absolute; inset: 0; margin: auto;\\n  width: fit-content; height: fit-content;\\n}\\n\\n/* Now works in normal block layout too */\\n.center-block-align { align-content: center; }\\n```\\n\\n**Watch out.** `text-align: center` centers *inline content* inside a box, not the box itself. And `vertical-align` only works on inline and table-cell elements — it never centers a block."},{"id":"css-questions-ebook-1y4o7zu","book":"CSS","part":"Part 2 — Layout","question":"Explain the `position` values.","prompt":"","answer":"**Short answer.** `static` is normal flow. `relative` keeps the element in flow but lets you offset it, and makes it the containing block for absolute children. `absolute` removes it from flow and positions it relative to the nearest positioned ancestor. `fixed` positions relative to the viewport. `sticky` acts like relative until a scroll threshold, then sticks.\\n\\n**Explanation.**\\n\\n```css\\n.card { position: relative; }\\n.card .badge { position: absolute; top: 0.5rem; right: 0.5rem; }\\n\\n.site-header { position: sticky; top: 0; }\\n\\n.toast { position: fixed; inset: auto 1rem 1rem auto; }\\n```\\n\\n**Watch out.** `fixed` is not always relative to the viewport: an ancestor with `transform`, `filter`, `perspective`, `contain: paint`, or `will-change: transform` becomes its containing block. A modal with `position: fixed` inside an animated container ends up in the wrong place — render modals at the top level or use `\\u003cdialog>`."},{"id":"css-questions-ebook-m0fls4","book":"CSS","part":"Part 2 — Layout","question":"Why isn\'t `position: sticky` working?","prompt":"","answer":"**Short answer.** Usually one of four reasons: no threshold (`top`, `bottom`, etc.) is set, an ancestor has `overflow: hidden/auto/scroll` and becomes the scroll container, the parent is no taller than the sticky element so it has nowhere to stick, or a flex/grid parent stretches the element to full height.\\n\\n**Explanation.**\\n\\n```css\\n.sidebar { position: sticky; top: 1rem; align-self: start; }  /* align-self fixes the grid/flex stretch case */\\n```\\n\\nDebug by walking up the ancestors in DevTools and checking `overflow` on each one.\\n\\n**Watch out.** `overflow: hidden` added to a wrapper \\"to fix a horizontal scrollbar\\" silently breaks every sticky element inside it. `overflow: clip` hides overflow without creating a scroll container, so sticky keeps working."},{"id":"css-questions-ebook-15mgtfm","book":"CSS","part":"Part 2 — Layout","question":"How does `z-index` work, and what is a stacking context?","prompt":"","answer":"**Short answer.** `z-index` orders elements along the z-axis, but only *within the same stacking context*. A stacking context is a group that\'s flattened and stacked as one unit — a child can never escape above something its parent\'s context sits beneath, no matter how high its `z-index`.\\n\\n**Explanation.** Things that create a stacking context:\\n\\n- The root element\\n- `position` relative/absolute with a `z-index` other than `auto`; `fixed` and `sticky` always\\n- Flex or grid items with a `z-index`\\n- `opacity` below 1\\n- `transform`, `filter`, `backdrop-filter`, `perspective`, `clip-path`, `mask`\\n- `isolation: isolate`\\n- `will-change` on any of the above, `contain: paint`\\n\\n```html\\n\\u003cdiv class=\\"a\\" style=\\"position: relative; z-index: 1\\">\\n  \\u003cdiv style=\\"position: relative; z-index: 9999\\">I can\'t go above .b\\u003c/div>\\n\\u003c/div>\\n\\u003cdiv class=\\"b\\" style=\\"position: relative; z-index: 2\\">\\u003c/div>\\n```\\n\\n**Watch out.** \\"`z-index: 9999` doesn\'t work\\" is almost always a stacking-context problem, not a z-index value problem. The fix is to change the *parent\'s* context. For dropdowns, modals, and tooltips, the top layer (`\\u003cdialog>`, `popover`) sidesteps z-index entirely."},{"id":"css-questions-ebook-1qeap2m","book":"CSS","part":"Part 2 — Layout","question":"What is subgrid?","prompt":"","answer":"**Short answer.** `grid-template-columns: subgrid` (or rows) lets a nested grid use its parent grid\'s tracks, so content in separate child components lines up across them.\\n\\n**Explanation.** Classic case: cards in a row whose titles, bodies, and buttons should align even though each card has different content.\\n\\n```css\\n.cards {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));\\n  gap: 1rem;\\n}\\n.card {\\n  display: grid;\\n  grid-row: span 3;\\n  grid-template-rows: subgrid;   /* title / body / footer rows shared across the row of cards */\\n}\\n```\\n\\n**Watch out.** A subgrid inherits the parent\'s tracks, so it can\'t define its own in that dimension. It also inherits `gap` unless you override it."},{"id":"css-questions-ebook-jud6a5","book":"CSS","part":"Part 2 — Layout","question":"What are floats still used for?","prompt":"","answer":"**Short answer.** Wrapping text around an element — images in articles, drop caps, pull quotes. They\'re no longer used for page layout; flexbox and grid replaced that.\\n\\n**Explanation.**\\n\\n```css\\n.article img.left { float: left; margin: 0 1rem 1rem 0; shape-outside: circle(); }\\n.article::after { content: \\"\\"; display: block; clear: both; }  /* or display: flow-root on .article */\\n```\\n\\n`shape-outside` lets text wrap around non-rectangular shapes.\\n\\n**Watch out.** Floats ignore `display` on flex and grid items — `float` has no effect on a flex child. If someone\'s float \\"doesn\'t work\\", check the parent\'s display."},{"id":"css-questions-ebook-1hg43xm","book":"CSS","part":"Part 3 — Responsive Design","question":"Mobile-first vs desktop-first media queries","prompt":"","answer":"**Short answer.** Mobile-first writes base styles for small screens and adds complexity with `min-width` queries. Desktop-first does the reverse with `max-width`. Mobile-first is preferred: small screens get less CSS to override, and layouts tend to simplify naturally.\\n\\n**Explanation.**\\n\\n```css\\n.grid { display: grid; gap: 1rem; }\\n\\n@media (width >= 48rem) {\\n  .grid { grid-template-columns: repeat(2, 1fr); }\\n}\\n@media (width >= 75rem) {\\n  .grid { grid-template-columns: repeat(4, 1fr); }\\n}\\n```\\n\\nThe range syntax (`width >= 48rem`) is clearer than `min-width` and avoids off-by-one gaps between `max-width: 767px` and `min-width: 768px`.\\n\\n**Watch out.** Breakpoints should come from where *your content* breaks, not from specific device sizes. Using `em`/`rem` in media queries makes them respect browser zoom and font settings."},{"id":"css-questions-ebook-t3xz5f","book":"CSS","part":"Part 3 — Responsive Design","question":"What are container queries, and how are they different from media queries?","prompt":"","answer":"**Short answer.** Media queries respond to the viewport. Container queries respond to the size of a parent container, so a component adapts to the space it\'s actually given — the same card works in a sidebar and in a wide main column.\\n\\n**Explanation.**\\n\\n```css\\n.card-wrapper { container-type: inline-size; container-name: card; }\\n\\n.card { display: grid; gap: 1rem; }\\n\\n@container card (width >= 30rem) {\\n  .card { grid-template-columns: 10rem 1fr; }   /* image beside text when there\'s room */\\n}\\n\\n.card h2 { font-size: clamp(1rem, 4cqi, 1.5rem); }  /* container query units */\\n```\\n\\nStyle queries check custom property values on the container: `@container style(--variant: compact) { … }`.\\n\\n**Watch out.** An element can\'t query itself — it queries its nearest container ancestor. And `container-type: inline-size` applies size containment on the inline axis, so the container\'s width must come from its parent, not from its content."},{"id":"css-questions-ebook-314x2z","book":"CSS","part":"Part 3 — Responsive Design","question":"How do `clamp()`, `min()`, and `max()` help responsive design?","prompt":"","answer":"**Short answer.** They compute values from several options, so sizes adapt fluidly without breakpoints. `clamp(min, preferred, max)` is the most common — e.g. fluid typography that scales with the viewport but never gets too small or too large.\\n\\n**Explanation.**\\n\\n```css\\nh1 { font-size: clamp(1.75rem, 1rem + 3vw, 3rem); }\\n.container { width: min(100% - 2rem, 70rem); margin-inline: auto; }\\n.sidebar { width: max(15rem, 25%); }\\n.section { padding-block: clamp(2rem, 6vw, 6rem); }\\n```\\n\\n**Watch out.** Font sizes using only `vw` (`font-size: 4vw`) don\'t grow when users zoom, which fails WCAG resize-text requirements. Always mix in `rem` (`1rem + 3vw`), as above."},{"id":"css-questions-ebook-1svr3ot","book":"CSS","part":"Part 3 — Responsive Design","question":"How do you build a responsive grid without media queries?","prompt":"","answer":"**Short answer.** `repeat(auto-fit, minmax(MIN, 1fr))` creates as many columns as fit, each at least `MIN` wide, stretching to fill the row.\\n\\n**Explanation.**\\n\\n```css\\n.gallery {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));\\n  gap: 1rem;\\n}\\n```\\n\\n`auto-fill` vs `auto-fit`: `auto-fill` keeps empty tracks when there are few items (items stay at their minimum width); `auto-fit` collapses empty tracks so the existing items stretch.\\n\\n**Watch out.** Without the inner `min(16rem, 100%)`, a container narrower than `16rem` overflows horizontally. That guard is what makes the pattern safe on small screens."},{"id":"css-questions-ebook-1oni35i","book":"CSS","part":"Part 3 — Responsive Design","question":"What are logical properties?","prompt":"","answer":"**Short answer.** Properties defined relative to writing direction instead of physical sides: `inline` (the text direction) and `block` (the line-stacking direction), with `start` and `end`. Layouts then flip automatically for right-to-left languages and vertical writing modes.\\n\\n**Explanation.**\\n\\n| Physical | Logical |\\n|---|---|\\n| `margin-left` | `margin-inline-start` |\\n| `padding-top` / `padding-bottom` | `padding-block` |\\n| `width` / `height` | `inline-size` / `block-size` |\\n| `left` | `inset-inline-start` |\\n| `text-align: left` | `text-align: start` |\\n| `border-top-left-radius` | `border-start-start-radius` |\\n\\n```css\\n.callout { padding-inline: 1rem; border-inline-start: 4px solid; margin-block-end: 1.5rem; }\\n```\\n\\n**Watch out.** Physical properties aren\'t wrong — use them when the direction is truly physical (a shadow that always falls down, an arrow pointing right regardless of language). Use logical ones for anything that follows the text."},{"id":"css-questions-ebook-1eyvjsw","book":"CSS","part":"Part 3 — Responsive Design","question":"How do `aspect-ratio` and `object-fit` work?","prompt":"","answer":"**Short answer.** `aspect-ratio` gives a box a preferred width-to-height ratio, so its height is derived from its width. `object-fit` controls how an image or video fills its box — `cover` crops to fill, `contain` letterboxes.\\n\\n**Explanation.**\\n\\n```css\\n.thumb {\\n  width: 100%;\\n  aspect-ratio: 16 / 9;\\n  object-fit: cover;\\n  object-position: center top;   /* keep faces in view when cropping */\\n}\\n\\n.video-embed { aspect-ratio: 16 / 9; width: 100%; }   /* replaces the old padding-top: 56.25% hack */\\n```\\n\\n**Watch out.** `aspect-ratio` is a *preferred* ratio. Content taller than the box overrides it unless you also set `overflow` or `min-height: 0`."},{"id":"css-questions-ebook-hv6qgf","book":"CSS","part":"Part 4 — Modern CSS","question":"What do `:is()`, `:where()`, and `:has()` do?","prompt":"","answer":"**Short answer.** `:is()` and `:where()` match any selector in a list — they shorten repetitive selectors. They differ only in specificity: `:is()` takes the highest argument\'s, `:where()` is always zero. `:has()` is the \\"parent selector\\": it matches an element based on what it contains or what follows it.\\n\\n**Explanation.**\\n\\n```css\\n/* Shorter selectors */\\n:is(h1, h2, h3):hover { text-decoration: underline; }\\n\\n/* Zero-specificity defaults that are trivial to override */\\n:where(ul, ol)[role=\\"list\\"] { list-style: none; padding: 0; }\\n\\n/* Parent selector */\\n.card:has(img) { grid-template-rows: 12rem auto; }\\nform:has(:user-invalid) .submit { opacity: 0.5; }\\nlabel:has(+ input:required)::after { content: \\" *\\"; }\\n\\n/* Quantity query */\\n.list:has(> :nth-child(6)) { columns: 2; }\\n```\\n\\n**Watch out.** `:has()` can be expensive when the subject is broad (`body:has(...)`, `*:has(...)`), because changes deep in the tree must re-check ancestors. Anchor it to a specific component class. Also, an invalid selector inside `:is()`/`:where()` is ignored instead of invalidating the whole rule — which is useful, but hides typos."},{"id":"css-questions-ebook-18zkcjx","book":"CSS","part":"Part 4 — Modern CSS","question":"Pseudo-classes vs pseudo-elements","prompt":"","answer":"**Short answer.** A pseudo-class (single colon) selects an element in a particular *state* — `:hover`, `:focus-visible`, `:checked`, `:nth-child()`. A pseudo-element (double colon) targets a *part* of an element or creates a virtual one — `::before`, `::after`, `::placeholder`, `::marker`, `::selection`.\\n\\n**Explanation.**\\n\\n```css\\nli:nth-child(odd) { background: var(--stripe); }\\ninput:focus-visible { outline: 2px solid var(--focus); }\\n\\n.required::after { content: \\" *\\"; color: var(--danger); }\\nli::marker { color: var(--accent); }\\n::selection { background: var(--highlight); }\\n```\\n\\n`::before` and `::after` require `content` (even `content: \\"\\"`) to render.\\n\\n**Watch out.** Generated `content` text is read by most screen readers but can\'t be selected or copied, and isn\'t translated reliably. Don\'t put meaningful text in pseudo-elements. Also, `::before`/`::after` don\'t work on void elements like `\\u003cimg>` and `\\u003cinput>`."},{"id":"css-questions-ebook-16hc950","book":"CSS","part":"Part 4 — Modern CSS","question":"CSS custom properties vs Sass variables","prompt":"","answer":"**Short answer.** Sass variables are replaced at build time — they\'re gone by the time CSS reaches the browser. Custom properties (`--name`) are live in the browser: they cascade, inherit, can be changed per element, overridden in media queries, and updated from JavaScript.\\n\\n**Explanation.**\\n\\n```css\\n:root {\\n  --space-md: 1rem;\\n  --color-accent: oklch(62% 0.19 255);\\n}\\n\\n.button {\\n  --button-bg: var(--color-accent);\\n  background: var(--button-bg);\\n  padding: var(--space-md, 1rem);    /* fallback */\\n}\\n.button.danger { --button-bg: crimson; }     /* override per component */\\n\\n@media (width >= 60rem) { :root { --space-md: 1.5rem; } }\\n```\\n\\n```js\\nel.style.setProperty(\'--progress\', \'42%\');\\n```\\n\\n**Watch out.** A custom property with an invalid value doesn\'t fall back to the previous declaration — it makes the property \\"invalid at computed-value time\\", which resolves to `inherit` or `initial`. `color: var(--size)` where `--size: 20px` silently gives you the inherited color."},{"id":"css-questions-ebook-1kxn2e7","book":"CSS","part":"Part 4 — Modern CSS","question":"What is `@property`?","prompt":"","answer":"**Short answer.** It registers a custom property with a type, an initial value, and whether it inherits. Typed custom properties can be animated and transitioned — untyped ones just flip between values.\\n\\n**Explanation.**\\n\\n```css\\n@property --angle {\\n  syntax: \\"\\u003cangle>\\";\\n  inherits: false;\\n  initial-value: 0deg;\\n}\\n\\n.spinner-border {\\n  background: conic-gradient(from var(--angle), var(--accent), transparent);\\n  animation: spin 2s linear infinite;\\n}\\n@keyframes spin { to { --angle: 360deg; } }\\n```\\n\\n**Watch out.** Without registration, the browser doesn\'t know `--angle` is an angle, so it can\'t interpolate — the gradient jumps instead of rotating. Registration also gives you type validation: a bad value falls back to `initial-value`."},{"id":"css-questions-ebook-1eoi8p6","book":"CSS","part":"Part 4 — Modern CSS","question":"What are cascade layers (`@layer`)?","prompt":"","answer":"**Short answer.** Layers let you group styles and set their priority explicitly, independent of specificity. Later layers win over earlier ones; unlayered styles win over all layers. They solve \\"third-party CSS beats mine\\" and specificity wars.\\n\\n**Explanation.**\\n\\n```css\\n@layer reset, base, vendor, components, utilities;\\n\\n@import url(\\"bootstrap.css\\") layer(vendor);\\n\\n@layer reset      { *, *::before, *::after { box-sizing: border-box; } }\\n@layer base       { a { color: var(--link); } }\\n@layer components { .btn { padding: 0.5rem 1rem; } }\\n@layer utilities  { .mt-0 { margin-top: 0; } }   /* always wins over components, whatever the specificity */\\n```\\n\\n**Watch out.** `!important` reverses layer order: an `!important` declaration in an *earlier* layer beats one in a later layer. That\'s intentional — it lets resets and base layers protect critical rules — but it surprises people."},{"id":"css-questions-ebook-ciuxs8","book":"CSS","part":"Part 4 — Modern CSS","question":"What is native CSS nesting?","prompt":"","answer":"**Short answer.** Writing child rules inside a parent rule, as in Sass, but natively in the browser. `&` refers to the parent selector.\\n\\n**Explanation.**\\n\\n```css\\n.card {\\n  padding: 1rem;\\n\\n  & h2 { font-size: 1.25rem; }\\n  &:hover { box-shadow: var(--shadow-lg); }\\n  &.featured { border-color: var(--accent); }\\n\\n  @media (width >= 48rem) {\\n    padding: 2rem;\\n  }\\n}\\n```\\n\\n**Watch out.** Native nesting is *not* string concatenation like Sass: `&__title` (BEM-style suffixing) doesn\'t work. Nested selectors are also wrapped in `:is()`, so specificity follows `:is()` rules — `.a, #b { & .c {} }` gives `.c` the specificity of the ID."},{"id":"css-questions-ebook-1ctzr0m","book":"CSS","part":"Part 4 — Modern CSS","question":"What is `@scope`?","prompt":"","answer":"**Short answer.** It limits styles to a DOM subtree, with an optional lower boundary, without increasing specificity. Rules inside also get *proximity*: when two scopes match, the closer scope root wins.\\n\\n**Explanation.**\\n\\n```css\\n@scope (.card) to (.card-content) {\\n  img { border-radius: 8px; }   /* images in the card, but not inside its slotted content area */\\n}\\n\\n@scope (.theme-dark) { a { color: lightblue; } }\\n@scope (.theme-light) { a { color: navy; } }\\n/* A link inside light-inside-dark gets navy — the nearest scope wins */\\n```\\n\\n**Watch out.** Proximity is checked *after* specificity, so a more specific selector from a farther scope still wins. Keep selectors inside scopes simple."},{"id":"css-questions-ebook-6mbme7","book":"CSS","part":"Part 4 — Modern CSS","question":"What\'s new with color in CSS?","prompt":"","answer":"**Short answer.** Wide-gamut and perceptual color spaces (`oklch()`, `oklab()`, `display-p3`), `color-mix()` for mixing colors, relative color syntax for deriving variants, and `light-dark()` for theme-aware values.\\n\\n**Explanation.**\\n\\n```css\\n:root {\\n  --brand: oklch(60% 0.2 260);\\n  --brand-hover: oklch(from var(--brand) calc(l - 10%) c h);      /* relative color: 10% darker */\\n  --brand-subtle: color-mix(in oklch, var(--brand) 15%, white);   /* tint */\\n  color-scheme: light dark;\\n  --surface: light-dark(white, #111);\\n}\\n```\\n\\nOKLCH is popular for design systems because equal changes in lightness *look* equally different, unlike HSL, where yellow at 50% lightness looks far brighter than blue at 50%.\\n\\n**Watch out.** `light-dark()` only works when `color-scheme` is set to include both `light` and `dark`."},{"id":"css-questions-ebook-1pk8zr4","book":"CSS","part":"Part 4 — Modern CSS","question":"What are anchor positioning and `field-sizing`?","prompt":"","answer":"**Short answer.** Anchor positioning tethers one element (a tooltip, menu, popover) to another without JavaScript, including fallback positions when there\'s no room. `field-sizing: content` makes inputs and textareas grow with their content.\\n\\n**Explanation.**\\n\\n```css\\n.trigger { anchor-name: --menu-anchor; }\\n\\n.menu {\\n  position: absolute;\\n  position-anchor: --menu-anchor;\\n  position-area: block-end span-inline-end;   /* below, aligned to the start */\\n  position-try-fallbacks: flip-block;          /* flip above if no room below */\\n}\\n\\ntextarea { field-sizing: content; min-block-size: 3lh; max-block-size: 12lh; }\\n```\\n\\n**Watch out.** Check current browser support before relying on newer features in production, and provide a sensible fallback (e.g. a fixed position) using `@supports`."},{"id":"css-questions-ebook-1pbu9mc","book":"CSS","part":"Part 4 — Modern CSS","question":"What does `@supports` do?","prompt":"","answer":"**Short answer.** It applies styles only if the browser supports a property-value pair or selector. It\'s the way to use new features with a fallback.\\n\\n**Explanation.**\\n\\n```css\\n.layout { display: flex; flex-wrap: wrap; }\\n\\n@supports (display: grid) {\\n  .layout { display: grid; grid-template-columns: repeat(3, 1fr); }\\n}\\n\\n@supports selector(:has(a)) {\\n  .card:has(a:hover) { outline: 2px solid; }\\n}\\n```\\n\\n**Watch out.** Unsupported declarations are already ignored, so a simple fallback is often just two declarations in a row: `width: 100vh; width: 100dvh;`. Reach for `@supports` when the fallback needs several properties to change together."},{"id":"css-questions-ebook-145je4s","book":"CSS","part":"Part 5 — Architecture and Tooling","question":"How do you organize CSS in a large project?","prompt":"","answer":"**Short answer.** Pick a strategy that controls scope and specificity: a naming methodology (BEM), scoped styles (CSS Modules, Shadow DOM, `@scope`), utility classes (Tailwind), or CSS-in-JS. Combine it with design tokens and cascade layers.\\n\\n**Explanation.**\\n\\n| Approach | How it avoids collisions | Trade-off |\\n|---|---|---|\\n| BEM | Naming convention (`.card__title--large`) | Discipline-dependent, verbose names |\\n| CSS Modules | Build tool hashes class names per file | Needs a bundler |\\n| Utility-first (Tailwind) | Tiny single-purpose classes in markup | Long class lists; design constraints are a feature |\\n| CSS-in-JS (runtime) | Generated class names from JS | Runtime cost, problems with Server Components |\\n| Zero-runtime CSS-in-JS | Extracted at build time | Build complexity |\\n\\nMost mature systems layer: tokens as custom properties → reset/base → component styles → utilities.\\n\\n**Watch out.** Runtime CSS-in-JS libraries (styled-components, Emotion) inject styles during render, which conflicts with React Server Components and streaming. Many teams have moved to CSS Modules, Tailwind, or zero-runtime solutions for that reason."},{"id":"css-questions-ebook-89t9u0","book":"CSS","part":"Part 5 — Architecture and Tooling","question":"What is BEM?","prompt":"","answer":"**Short answer.** Block, Element, Modifier — a naming convention: `.block`, `.block__element`, `.block--modifier`. Every selector is a single class, so specificity stays flat and names describe structure.\\n\\n**Explanation.**\\n\\n```html\\n\\u003carticle class=\\"card card--featured\\">\\n  \\u003ch2 class=\\"card__title\\">…\\u003c/h2>\\n  \\u003cp class=\\"card__body\\">…\\u003c/p>\\n\\u003c/article>\\n```\\n\\n```css\\n.card { … }\\n.card--featured { border-color: var(--accent); }\\n.card__title { … }\\n```\\n\\n**Watch out.** Don\'t nest element names: `.card__body__link` mirrors the DOM and breaks when markup changes. Use `.card__link`. And BEM doesn\'t help with styles that leak *in* from elsewhere — a reset layer and `:where()` defaults handle that."},{"id":"css-questions-ebook-7mq80x","book":"CSS","part":"Part 5 — Architecture and Tooling","question":"What are the pros and cons of utility-first CSS (Tailwind)?","prompt":"","answer":"**Short answer.** Pros: no naming, no dead CSS growth, styles live next to markup, a constrained design scale, tiny production CSS. Cons: long class strings, a learning curve for the vocabulary, and repeated class lists unless you extract components.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cbutton class=\\"inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 focus-visible:outline-2\\">\\n  Save\\n\\u003c/button>\\n```\\n\\nThe duplication problem is solved at the component level (a `\\u003cButton>` component), not by inventing CSS classes.\\n\\n**Watch out.** Building class names dynamically (`` `bg-${color}-600` ``) breaks — the build scans source files for complete class names, so the class never gets generated. Map to full class names instead."},{"id":"css-questions-ebook-1luhrlf","book":"CSS","part":"Part 5 — Architecture and Tooling","question":"Reset vs normalize — what\'s the difference?","prompt":"","answer":"**Short answer.** A reset strips browser default styles to a blank slate. Normalize keeps useful defaults and only fixes inconsistencies between browsers. Modern projects use a small \\"modern reset\\" that does a bit of both.\\n\\n**Explanation.**\\n\\n```css\\n*, *::before, *::after { box-sizing: border-box; }\\n* { margin: 0; }\\nhtml { -webkit-text-size-adjust: none; text-size-adjust: none; }\\nbody { line-height: 1.5; -webkit-font-smoothing: antialiased; }\\nimg, picture, video, canvas, svg { display: block; max-width: 100%; }\\ninput, button, textarea, select { font: inherit; }\\np, h1, h2, h3 { overflow-wrap: break-word; }\\n```\\n\\n**Watch out.** Don\'t reset `outline` on focus or `list-style` on every list. Removing list styles also removes list semantics in Safari unless the list has `role=\\"list\\"`."},{"id":"css-questions-ebook-fujq7o","book":"CSS","part":"Part 5 — Architecture and Tooling","question":"What are design tokens, and how do you implement them in CSS?","prompt":"","answer":"**Short answer.** Named design decisions — colors, spacing, type scale, radii, shadows — stored in one place and consumed everywhere. In CSS they\'re usually custom properties, often in two tiers: primitive tokens (raw values) and semantic tokens (what they\'re used for).\\n\\n**Explanation.**\\n\\n```css\\n:root {\\n  /* primitives */\\n  --blue-600: oklch(55% 0.2 260);\\n  --gray-50: oklch(98% 0 0);\\n  --space-4: 1rem;\\n\\n  /* semantic */\\n  --color-action: var(--blue-600);\\n  --color-surface: var(--gray-50);\\n  --space-inset: var(--space-4);\\n}\\n\\n[data-theme=\\"dark\\"] {\\n  --color-surface: oklch(18% 0 0);\\n}\\n```\\n\\nComponents use only semantic tokens, so theming means changing a handful of variables.\\n\\n**Watch out.** If components reference primitive tokens directly (`--blue-600`), dark mode and rebranding require editing every component. The semantic layer is what makes tokens worth having."},{"id":"css-questions-ebook-lwtx6t","book":"CSS","part":"Part 6 — Animation and Motion","question":"Transitions vs animations","prompt":"","answer":"**Short answer.** A transition animates a property between two states when its value changes (on hover, class toggle). An animation runs keyframes on its own, can loop, have many steps, and doesn\'t need a state change.\\n\\n**Explanation.**\\n\\n```css\\n.button { transition: background-color 150ms ease, transform 150ms ease; }\\n.button:hover { background-color: var(--accent-hover); transform: translateY(-1px); }\\n\\n@keyframes pulse {\\n  0%, 100% { opacity: 1; }\\n  50% { opacity: 0.4; }\\n}\\n.skeleton { animation: pulse 1.5s ease-in-out infinite; }\\n```\\n\\n**Watch out.** `transition: all` animates properties you didn\'t intend (including layout ones) and makes performance unpredictable. List the properties explicitly."},{"id":"css-questions-ebook-1qs242y","book":"CSS","part":"Part 6 — Animation and Motion","question":"Which properties are cheap to animate, and why?","prompt":"","answer":"**Short answer.** `transform` and `opacity` — they can be handled by the compositor on the GPU without recalculating layout or repainting. Animating `width`, `height`, `top`, `left`, `margin`, or `padding` triggers layout on every frame and causes jank.\\n\\n**Explanation.** The rendering pipeline: **style → layout → paint → composite**. Changing a property re-runs the pipeline from the earliest stage it affects:\\n\\n| Property changed | Re-runs |\\n|---|---|\\n| `width`, `top`, `margin`, `font-size` | Layout + paint + composite |\\n| `color`, `background`, `box-shadow` | Paint + composite |\\n| `transform`, `opacity` | Composite only |\\n\\n```css\\n/* Janky */\\n.panel { transition: left 300ms; }\\n/* Smooth */\\n.panel { transition: transform 300ms; }\\n.panel.open { transform: translateX(0); }\\n```\\n\\n**Watch out.** `will-change: transform` promotes an element to its own layer ahead of time, but every layer costs GPU memory. Apply it just before an animation and remove it after — never globally (`* { will-change: transform }`)."},{"id":"css-questions-ebook-pv74eb","book":"CSS","part":"Part 6 — Animation and Motion","question":"How do you respect `prefers-reduced-motion`?","prompt":"","answer":"**Short answer.** Users with vestibular disorders can ask the OS to reduce motion. Honor it by removing or replacing large movements, parallax, and auto-playing animation with fades or no animation.\\n\\n**Explanation.**\\n\\n```css\\n@media (prefers-reduced-motion: no-preference) {\\n  .hero { animation: slide-in 600ms ease-out; }\\n}\\n\\n/* Or a global safety net */\\n@media (prefers-reduced-motion: reduce) {\\n  *, *::before, *::after {\\n    animation-duration: 0.01ms !important;\\n    animation-iteration-count: 1 !important;\\n    transition-duration: 0.01ms !important;\\n    scroll-behavior: auto !important;\\n  }\\n}\\n```\\n\\n**Watch out.** \\"Reduced\\" doesn\'t mean \\"none\\" — a subtle opacity fade is usually fine and keeps state changes understandable. What should go is motion across the screen, zooming, and parallax."},{"id":"css-questions-ebook-tlc93","book":"CSS","part":"Part 6 — Animation and Motion","question":"What are View Transitions?","prompt":"","answer":"**Short answer.** An API that animates between two DOM states — or between two pages — by snapshotting the old and new views and cross-fading or morphing them. Shared elements (a thumbnail becoming a hero image) are matched by `view-transition-name`.\\n\\n**Explanation.**\\n\\n```js\\ndocument.startViewTransition(() => updateTheDOM());\\n```\\n\\n```css\\n/* Cross-document transitions between pages of a multi-page site */\\n@view-transition { navigation: auto; }\\n\\n.product-thumb { view-transition-name: product-image; }\\n\\n::view-transition-old(root),\\n::view-transition-new(root) { animation-duration: 250ms; }\\n```\\n\\n**Watch out.** Each `view-transition-name` must be unique on the page at the moment of the transition — duplicates cancel it. In lists, generate names per item (`view-transition-name: card-42`) or use `view-transition-name: match-element`."},{"id":"css-questions-ebook-k6ajyf","book":"CSS","part":"Part 6 — Animation and Motion","question":"What are scroll-driven animations?","prompt":"","answer":"**Short answer.** Animations whose progress is tied to scroll position instead of time — reading progress bars, reveal-on-scroll, parallax — done in CSS and run off the main thread.\\n\\n**Explanation.**\\n\\n```css\\n.progress {\\n  position: fixed; inset: 0 0 auto; height: 4px;\\n  transform-origin: left;\\n  animation: grow linear;\\n  animation-timeline: scroll(root);\\n}\\n@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\\n\\n.reveal {\\n  animation: fade-up linear both;\\n  animation-timeline: view();\\n  animation-range: entry 0% cover 30%;\\n}\\n```\\n\\n**Watch out.** Wrap these in `prefers-reduced-motion: no-preference`, and provide a non-animated default for browsers without support (`@supports (animation-timeline: view())`)."},{"id":"css-questions-ebook-19123q2","book":"CSS","part":"Part 7 — Rendering and Performance","question":"Why is CSS render-blocking, and what is critical CSS?","prompt":"","answer":"**Short answer.** The browser won\'t paint until it has the CSS for the page, to avoid showing unstyled content. Critical CSS means inlining the small amount of CSS needed for above-the-fold content in the `\\u003chead>` and loading the rest without blocking.\\n\\n**Explanation.**\\n\\n```html\\n\\u003chead>\\n  \\u003cstyle>/* critical: layout shell, header, hero */\\u003c/style>\\n  \\u003clink rel=\\"preload\\" href=\\"/full.css\\" as=\\"style\\" onload=\\"this.rel=\'stylesheet\'\\">\\n  \\u003cnoscript>\\u003clink rel=\\"stylesheet\\" href=\\"/full.css\\">\\u003c/noscript>\\n\\u003c/head>\\n```\\n\\nOther levers: split CSS per route, remove unused CSS, use `media` attributes on `\\u003clink>` so print or large-screen styles don\'t block (`\\u003clink rel=\\"stylesheet\\" href=\\"print.css\\" media=\\"print\\">`).\\n\\n**Watch out.** `@import` inside CSS files creates a request chain — the imported file isn\'t discovered until the parent downloads and parses. Use `\\u003clink>` tags or let the bundler inline imports."},{"id":"css-questions-ebook-r6v8sg","book":"CSS","part":"Part 7 — Rendering and Performance","question":"Do selectors affect performance?","prompt":"","answer":"**Short answer.** Rarely in practice. Browsers match selectors right-to-left and are highly optimized. Layout, paint, huge DOMs, and expensive properties (big blurs, shadows on many elements) matter far more. The main exceptions are broad `:has()` and very large stylesheets recalculated often.\\n\\n**Explanation.** Browsers evaluate `.nav a` by finding every `a`, then checking for a `.nav` ancestor. A key selector like `*` or a bare element type means more candidates, but the cost is usually microseconds.\\n\\nWhat genuinely costs time:\\n\\n- Style recalculation on a large DOM after class changes high in the tree.\\n- Layout thrashing from JavaScript (reading `offsetHeight` after writing styles in a loop).\\n- Paint-heavy effects: large `box-shadow`, `filter: blur()`, `backdrop-filter` on scrolling content.\\n\\n**Watch out.** Use DevTools\' Performance panel and \\"Selector stats\\" before optimizing selectors. Rewriting CSS for selector speed without measuring is usually wasted effort."},{"id":"css-questions-ebook-y91715","book":"CSS","part":"Part 7 — Rendering and Performance","question":"What do `contain` and `content-visibility` do?","prompt":"","answer":"**Short answer.** `contain` tells the browser an element\'s internals don\'t affect the rest of the page, so it can limit layout and paint work to that subtree. `content-visibility: auto` goes further and skips rendering off-screen content entirely until it\'s near the viewport.\\n\\n**Explanation.**\\n\\n```css\\n.widget { contain: layout paint; }\\n\\n.article-section {\\n  content-visibility: auto;\\n  contain-intrinsic-size: auto 800px;   /* placeholder size to keep the scrollbar stable */\\n}\\n```\\n\\nOn long pages this can cut initial rendering time dramatically.\\n\\n**Watch out.** Without `contain-intrinsic-size`, skipped sections collapse to zero height and the scrollbar jumps as you scroll. `contain: paint` also clips overflow and creates a containing block for fixed elements — check dropdowns and tooltips inside."},{"id":"css-questions-ebook-1x8ubxb","book":"CSS","part":"Part 7 — Rendering and Performance","question":"How do you load web fonts without hurting performance?","prompt":"","answer":"**Short answer.** Self-host WOFF2, subset to the characters you need, preload the one or two critical files, use `font-display: swap` (or `optional`), and adjust fallback metrics so the swap doesn\'t shift the layout.\\n\\n**Explanation.**\\n\\n```css\\n@font-face {\\n  font-family: \\"Inter\\";\\n  src: url(\\"/fonts/inter-var.woff2\\") format(\\"woff2\\");\\n  font-weight: 100 900;          /* one variable font file instead of many weights */\\n  font-display: swap;\\n}\\n\\n@font-face {\\n  font-family: \\"Inter Fallback\\";\\n  src: local(\\"Arial\\");\\n  size-adjust: 107%;\\n  ascent-override: 90%;          /* match Inter\'s metrics so swapping causes no layout shift */\\n}\\n\\nbody { font-family: \\"Inter\\", \\"Inter Fallback\\", system-ui, sans-serif; }\\n```\\n\\n| `font-display` | Behavior |\\n|---|---|\\n| `block` | Invisible text up to ~3s (FOIT) |\\n| `swap` | Fallback immediately, swap when loaded (FOUT) |\\n| `optional` | Use the font only if it loads almost instantly |\\n\\n**Watch out.** Each weight and style is a separate file. Loading regular, medium, semibold, bold, and italics can easily add 300 KB — a variable font or a system font stack is often the better choice."},{"id":"css-questions-ebook-1f9e1tg","book":"CSS","part":"Part 8 — Accessibility and Theming","question":"Why is `outline: none` a problem, and what\'s `:focus-visible`?","prompt":"","answer":"**Short answer.** Removing the focus outline makes the page unusable for keyboard users — they can\'t see where they are. `:focus-visible` shows focus styles only when the browser decides they\'re needed (keyboard navigation), not on mouse clicks, which removes the reason people deleted outlines in the first place.\\n\\n**Explanation.**\\n\\n```css\\n/* Don\'t */\\n*:focus { outline: none; }\\n\\n/* Do */\\n:focus-visible {\\n  outline: 3px solid var(--focus-ring);\\n  outline-offset: 2px;\\n}\\n```\\n\\n`:focus-within` styles a parent when anything inside it has focus — useful for highlighting a whole form field group.\\n\\n**Watch out.** `outline` is preferred over `box-shadow` for focus rings, because Windows High Contrast / forced-colors mode removes box shadows but keeps outlines."},{"id":"css-questions-ebook-12tmik2","book":"CSS","part":"Part 8 — Accessibility and Theming","question":"How do you implement dark mode?","prompt":"","answer":"**Short answer.** Define colors as semantic custom properties, switch their values with `prefers-color-scheme` (system preference) and optionally a `[data-theme]` attribute (user override), and set `color-scheme` so form controls and scrollbars match.\\n\\n**Explanation.**\\n\\n```css\\n:root {\\n  color-scheme: light dark;\\n  --bg: white;\\n  --text: #1a1a1a;\\n}\\n\\n@media (prefers-color-scheme: dark) {\\n  :root:not([data-theme=\\"light\\"]) { --bg: #121212; --text: #e8e8e8; }\\n}\\n:root[data-theme=\\"dark\\"] { --bg: #121212; --text: #e8e8e8; }\\n\\nbody { background: var(--bg); color: var(--text); }\\n```\\n\\nAvoid pure black backgrounds with pure white text — the high contrast causes halation for many readers. Reduce image brightness slightly and re-check shadows, which barely show on dark surfaces.\\n\\n**Watch out.** Applying the saved theme from JavaScript after load causes a flash of the wrong theme. Set the attribute in a tiny inline script in `\\u003chead>` before CSS renders, or store the preference in a cookie and render it on the server."},{"id":"css-questions-ebook-vcqylm","book":"CSS","part":"Part 8 — Accessibility and Theming","question":"What do you check for color contrast?","prompt":"","answer":"**Short answer.** WCAG AA requires 4.5:1 for normal text, 3:1 for large text (24px, or ~18.7px bold), and 3:1 for UI component boundaries and focus indicators. Never rely on color alone to convey meaning.\\n\\n**Explanation.**\\n\\n```css\\n.error {\\n  color: var(--danger);\\n  /* plus an icon or text — red alone fails for color-blind users */\\n}\\n.error::before { content: \\"⚠ \\"; }\\n```\\n\\nDevTools shows contrast ratios in the color picker and flags failures in Lighthouse.\\n\\n**Watch out.** Placeholder text, disabled-looking-but-enabled buttons, and text over images are the most common failures. For text on images, add a scrim (`linear-gradient` overlay) to guarantee contrast."},{"id":"css-questions-ebook-uzr8kx","book":"CSS","part":"Part 8 — Accessibility and Theming","question":"What is forced-colors mode?","prompt":"","answer":"**Short answer.** A high-contrast mode (e.g. Windows Contrast Themes) where the OS overrides your colors with a limited user-chosen palette. Backgrounds images, shadows, and most colors are replaced; borders and outlines stay.\\n\\n**Explanation.**\\n\\n```css\\n.card { border: 1px solid transparent; box-shadow: var(--shadow); }   /* transparent border becomes visible */\\n\\n@media (forced-colors: active) {\\n  .icon-button svg { fill: ButtonText; }   /* system color keywords */\\n  .badge { border: 1px solid CanvasText; }\\n}\\n```\\n\\n**Watch out.** UI that relies only on background color or shadows to show boundaries (cards, selected tabs, toggles) disappears in forced-colors mode. A transparent border costs nothing and fixes it."},{"id":"css-questions-ebook-194oawj","book":"CSS","part":"Part 8 — Accessibility and Theming","question":"What other user-preference media features should you know?","prompt":"","answer":"**Short answer.** `prefers-color-scheme`, `prefers-reduced-motion`, `prefers-contrast`, `prefers-reduced-transparency`, `forced-colors`, and interaction features `hover` and `pointer`.\\n\\n**Explanation.**\\n\\n```css\\n@media (hover: hover) and (pointer: fine) {\\n  .card:hover { transform: translateY(-2px); }   /* only on devices that really hover */\\n}\\n\\n@media (pointer: coarse) {\\n  .button { min-height: 44px; }   /* larger touch targets */\\n}\\n\\n@media (prefers-contrast: more) {\\n  :root { --border: CanvasText; }\\n}\\n```\\n\\n**Watch out.** Hover-only interactions (menus that open on hover, actions revealed on hover) don\'t exist on touch screens. Gate hover effects with `(hover: hover)` and make sure everything is reachable by tap and keyboard."},{"id":"css-questions-ebook-1ojznsw","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Which color is the text?","prompt":"```html\\n\\u003cp id=\\"intro\\" class=\\"lead\\">Hello\\u003c/p>\\n```\\n\\n```css\\n#intro { color: red; }\\np.lead.lead.lead { color: blue; }\\n.lead { color: green !important; }\\n```","answer":"Green. `!important` wins over normal declarations regardless of specificity. Without it, red wins: `#intro` is (1, 0, 0) and beats `p.lead.lead.lead` at (0, 3, 1) — classes never add up to an ID."},{"id":"css-questions-ebook-dg1px1","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why is there a gap under this image?","prompt":"```html\\n\\u003cdiv class=\\"frame\\">\\u003cimg src=\\"photo.jpg\\" alt=\\"…\\">\\u003c/div>\\n```","answer":"`\\u003cimg>` is inline by default, so it sits on the text baseline, leaving room below for letter descenders. Fix with `img { display: block; }` or `vertical-align: middle`."},{"id":"css-questions-ebook-1o55b3p","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why does this flex item overflow its container?","prompt":"```css\\n.row { display: flex; }\\n.row .content { flex: 1; }\\n/* .content contains a long unbroken URL */\\n```","answer":"Flex items default to `min-width: auto`, so they won\'t shrink below their content\'s minimum width. Add `min-width: 0` to `.content`, plus `overflow-wrap: anywhere` to break the URL."},{"id":"css-questions-ebook-1ghwz7i","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why is `height: 100%` not working?","prompt":"```css\\n.child { height: 100%; }\\n```","answer":"Percentage heights resolve against the parent\'s *definite* height. If the parent\'s height is `auto` (set by content), `100%` of it resolves to `auto`. Give the parent a height, or use flex/grid on the parent (`display: grid` with the child stretching), or `min-height: 100dvh` on the outer container."},{"id":"css-questions-ebook-gtzmid","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why doesn\'t the modal cover the screen?","prompt":"```css\\n.page { transform: translateZ(0); }\\n.page .modal { position: fixed; inset: 0; z-index: 1000; }\\n```","answer":"`transform` on `.page` makes it the containing block for fixed descendants and creates a new stacking context. The modal is positioned relative to `.page`, not the viewport, and can\'t stack above things outside `.page`. Move the modal to the document root (a portal) or use `\\u003cdialog>`, which renders in the top layer."},{"id":"css-questions-ebook-1ronuk","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why doesn\'t this transition animate?","prompt":"```css\\n.panel { display: none; opacity: 0; transition: opacity 200ms; }\\n.panel.open { display: block; opacity: 1; }\\n```","answer":"`display` historically isn\'t animatable, and the element has no \\"before\\" style when it first appears, so it pops in. Modern fix: `transition: opacity 200ms, display 200ms allow-discrete;` plus `@starting-style { .panel.open { opacity: 0; } }` to define the entry state. Older fix: toggle `visibility` and `opacity` instead of `display`."},{"id":"css-questions-ebook-1ixmdm","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Why do these margins not add up?","prompt":"```css\\n.a { margin-bottom: 40px; }\\n.b { margin-top: 20px; }\\n```","answer":"Vertical margins between adjacent blocks collapse to the larger value, so the gap is 40px, not 60px. Inside a flex or grid container, they wouldn\'t collapse — or use `gap` instead of margins."},{"id":"css-questions-ebook-11dcl6o","book":"CSS","part":"Part 9 — Rapid-Fire and Debugging Puzzles","question":"Quick definitions","prompt":"","answer":"| Term | One line |\\n|---|---|\\n| **Cascade** | Algorithm that picks the winning declaration among conflicting ones |\\n| **Specificity** | (IDs, classes/attributes/pseudo-classes, types) score for selectors |\\n| **Cascade layer** | `@layer` group whose order outranks specificity |\\n| **Box model** | Content + padding + border + margin |\\n| **BFC** | Block formatting context — isolates floats and margins |\\n| **Stacking context** | Group of elements flattened into one z-layer |\\n| **Containing block** | The box that percentages and positioned offsets are measured against |\\n| **`fr`** | Fraction of free space in a grid track |\\n| **Container query** | Style rule based on a parent container\'s size |\\n| **Custom property** | `--name` variable that cascades and inherits at runtime |\\n| **`:has()`** | Selects an element based on its descendants or following siblings |\\n| **Logical properties** | Direction-relative properties (`inline`, `block`, `start`, `end`) |\\n| **Compositing** | Final pipeline stage; `transform`/`opacity` animate here cheaply |\\n| **Critical CSS** | Inlined CSS needed to render above-the-fold content |\\n| **`:focus-visible`** | Focus style shown only when the browser deems it useful |\\n| **Forced-colors** | OS high-contrast mode that overrides author colors |"},{"id":"frontend-interview-bl-1tcklhh","book":"Frontend Interview","part":"0. Warm-up","question":"Introduce yourself in 60 seconds.","prompt":"","answer":"> \\"Hi, I\'m [Name]. I\'m a frontend developer with [X] years of experience building responsive web apps with React, Next.js and TypeScript. Most recently at [Company/Project], I [built a dashboard / e-commerce site / SaaS app] where I converted Figma designs into reusable Tailwind components, integrated REST APIs using TanStack Query, and improved Lighthouse performance from [X] to [Y].\\n>\\n> I use AI tools like GitHub Copilot and Claude daily — for scaffolding components, writing tests and debugging — but I always review the output for security, types and edge cases before it goes into a PR. I enjoy working closely with designers and backend developers, and I\'m looking for a team where I can ship quality product fast. That\'s why this role caught my attention.\\"\\n\\n**Why this works:** it touches every major keyword in the JD (React, Next.js, TypeScript, Figma, Tailwind, REST, state, performance, AI tools, collaboration) in under a minute, and ends with a reason you want the job."},{"id":"frontend-interview-bl-14vyla5","book":"Frontend Interview","part":"0. Warm-up","question":"What formula should you use to answer any technical question?","prompt":"","answer":"1. **Define** it in one sentence.\\n2. **Explain why** it exists or what problem it solves.\\n3. **Give an example** from code or a project you did.\\n4. **Mention a trade-off or pitfall** — this is what separates mid-level from senior answers."},{"id":"frontend-interview-bl-oeh7gw","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"What is the difference between `var`, `let` and `const`?","prompt":"","answer":"**Say this:** `var` is function-scoped and hoisted with `undefined`; `let` and `const` are block-scoped and sit in a \\"temporal dead zone\\" until declared. `const` prevents reassignment, not mutation.\\n\\n**Deeper:** `const user = {name: \'A\'}; user.name = \'B\'` is allowed, because the binding is constant but the object is not. In modern code, default to `const`, use `let` when you must reassign, and avoid `var`."},{"id":"frontend-interview-bl-1qls2ig","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Explain closures with a real use case.","prompt":"","answer":"**Say this:** A closure is a function that remembers the variables from the scope where it was created, even after that scope has finished running.\\n\\n```javascript\\nfunction createCounter() {\\n  let count = 0;\\n  return () => ++count;\\n}\\nconst next = createCounter();\\nnext(); // 1\\nnext(); // 2\\n```\\n\\n**Real use in React:** every event handler and `useEffect` callback is a closure. The classic bug is a **stale closure** — a `setInterval` inside `useEffect` with an empty dependency array keeps reading the first value of state. Fix it with the functional updater `setCount(c => c + 1)` or by adding dependencies."},{"id":"frontend-interview-bl-10ta4zz","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"How does the event loop work?","prompt":"","answer":"**Say this:** JavaScript is single-threaded. Synchronous code runs on the call stack; async callbacks wait in queues. When the stack is empty, the event loop first drains the **microtask queue** (Promises, `queueMicrotask`), then takes one **macrotask** (`setTimeout`, I/O, events).\\n\\n```javascript\\nconsole.log(\'A\');\\nsetTimeout(() => console.log(\'B\'), 0);\\nPromise.resolve().then(() => console.log(\'C\'));\\nconsole.log(\'D\');\\n// Output: A, D, C, B\\n```"},{"id":"frontend-interview-bl-dd2w1g","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"`==` vs `===`?","prompt":"","answer":"`===` compares value and type with no conversion; `==` coerces types first (`\'1\' == 1` is true). Always use `===` except for the deliberate `x == null` check that covers both `null` and `undefined`."},{"id":"frontend-interview-bl-1pvnfy1","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Explain `this`, and arrow functions vs regular functions.","prompt":"","answer":"**Say this:** In a regular function, `this` depends on how the function is called. Arrow functions don\'t have their own `this`; they take it from the surrounding scope. Arrow functions also have no `arguments` object and can\'t be used as constructors."},{"id":"frontend-interview-bl-1umuot0","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Promises vs async/await, and how do you handle errors?","prompt":"","answer":"`async/await` is syntax on top of Promises that makes async code read top-down. Handle errors with `try/catch`. Run independent requests in parallel with `Promise.all` (fails fast on any rejection) or `Promise.allSettled` (waits for all, reports each result).\\n\\n```javascript\\nconst [user, orders] = await Promise.all([getUser(id), getOrders(id)]);\\n```"},{"id":"frontend-interview-bl-t1myrb","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"What are debounce and throttle? When do you use each?","prompt":"","answer":"**Debounce** waits until calls stop for N ms (search input, autosave). **Throttle** runs at most once every N ms (scroll, resize, mouse move).\\n\\n```javascript\\nfunction debounce(fn, delay) {\\n  let timer;\\n  return (...args) => {\\n    clearTimeout(timer);\\n    timer = setTimeout(() => fn(...args), delay);\\n  };\\n}\\n```\\n\\nThis is a very common live-coding question — practice writing it from memory."},{"id":"frontend-interview-bl-105t6kd","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Shallow copy vs deep copy?","prompt":"","answer":"Spread (`{...obj}`) and `Object.assign` copy one level; nested objects are still shared. For a deep copy use `structuredClone(obj)` (modern browsers and Node 17+). This matters in React because state must be updated immutably."},{"id":"frontend-interview-bl-v7jv0q","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Why TypeScript? What benefits have you seen?","prompt":"","answer":"**Say this:** TypeScript catches bugs at compile time, documents the shape of data, and makes refactoring safe because the editor finds every broken usage. It also makes AI-generated code safer, since type errors expose many hallucinated properties immediately."},{"id":"frontend-interview-bl-k4gbgq","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"`interface` vs `type`?","prompt":"","answer":"Both describe object shapes. `interface` can be extended and **merged** (declared twice, combined) — good for public APIs and objects. `type` can express unions, intersections, tuples and mapped types. Many teams use `type` by default and `interface` for extendable component props; the key is consistency.\\n\\n```typescript\\ntype Status = \'idle\' | \'loading\' | \'success\' | \'error\';\\ninterface ButtonProps { label: string; onClick: () => void; }\\n```"},{"id":"frontend-interview-bl-1h59gyi","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"`any` vs `unknown` vs `never`?","prompt":"","answer":"- `any` turns off type checking — avoid it.\\n- `unknown` is the safe \\"I don\'t know yet\\": you must narrow it (`typeof`, type guard, Zod parse) before using it. Use it for API responses and `catch` errors.\\n- `never` means a value that can\'t exist; useful for exhaustive `switch` checks."},{"id":"frontend-interview-bl-19ng9r8","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"What are generics? Give an example.","prompt":"","answer":"Generics let a function or component work with many types while staying type-safe.\\n\\n```typescript\\nasync function fetchJson\\u003cT>(url: string): Promise\\u003cT> {\\n  const res = await fetch(url);\\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\\n  return res.json() as Promise\\u003cT>;\\n}\\nconst users = await fetchJson\\u003cUser[]>(\'/api/users\');\\n```"},{"id":"frontend-interview-bl-gbkba7","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"Name utility types you use.","prompt":"","answer":"`Partial\\u003cT>` (all optional — update forms), `Required\\u003cT>`, `Pick\\u003cT, K>`, `Omit\\u003cT, K>` (e.g. a create form without `id`), `Record\\u003cK, V>` (lookup maps), `ReturnType\\u003ctypeof fn>`, and `ComponentProps\\u003c\'button\'>` to extend native element props."},{"id":"frontend-interview-bl-1tkhlci","book":"Frontend Interview","part":"1. JavaScript & TypeScript","question":"How do you type API responses safely?","prompt":"","answer":"Types vanish at runtime, so the server can still send something unexpected. Define the type and validate at the boundary with a schema library like **Zod**, then infer the type from the schema: `type User = z.infer\\u003ctypeof UserSchema>`. Mentioning runtime validation is a strong signal of maturity."},{"id":"frontend-interview-bl-bbrbyk","book":"Frontend Interview","part":"2. React.js","question":"What is the Virtual DOM and how does reconciliation work?","prompt":"","answer":"**Say this:** React keeps a lightweight in-memory tree of the UI. When state changes, it builds a new tree, compares it to the old one (diffing), and applies only the minimal changes to the real DOM. It assumes elements of different types produce different trees, and it uses `key` to match list items between renders."},{"id":"frontend-interview-bl-ggixsq","book":"Frontend Interview","part":"2. React.js","question":"Why are keys important in lists? Why not use the index?","prompt":"","answer":"Keys tell React which item is which between renders. Using the array index breaks when items are inserted, removed or reordered: React reuses the wrong component, so input values, focus or local state jump to the wrong row. Use a stable unique id from the data. Index is acceptable only for static lists that never change order."},{"id":"frontend-interview-bl-196x32f","book":"Frontend Interview","part":"2. React.js","question":"What causes a component to re-render?","prompt":"","answer":"A component re-renders when (1) its own state changes, (2) its parent re-renders, or (3) a context it consumes changes. Props changing is not a separate cause — it happens because the parent re-rendered. A re-render is not automatically a DOM update; React only touches the DOM if output differs."},{"id":"frontend-interview-bl-1bdxfdb","book":"Frontend Interview","part":"2. React.js","question":"Explain `useState` and why state updates look \\"async\\".","prompt":"","answer":"State updates are scheduled and **batched**, so the new value is available on the next render, not on the next line. When the new value depends on the old one, use the functional form:\\n\\n```tsx\\nsetCount(prev => prev + 1); // safe even if called multiple times\\n```"},{"id":"frontend-interview-bl-1bfr2nq","book":"Frontend Interview","part":"2. React.js","question":"Explain `useEffect` — dependencies and cleanup.","prompt":"","answer":"**Say this:** `useEffect` synchronizes a component with something outside React (subscriptions, timers, manual DOM, analytics). It runs after paint. The dependency array controls when it re-runs, and the returned function cleans up before the next run and on unmount.\\n\\n```tsx\\nuseEffect(() => {\\n  const controller = new AbortController();\\n  fetch(`/api/users/${id}`, { signal: controller.signal })\\n    .then(r => r.json())\\n    .then(setUser)\\n    .catch(() => {});\\n  return () => controller.abort(); // avoids race conditions\\n}, [id]);\\n```\\n\\n**Pitfalls to mention:** missing dependencies (stale data), objects/functions in dependencies causing infinite loops, and using effects for things that should be derived during render. In real apps, prefer TanStack Query or Server Components for data fetching instead of raw `useEffect`."},{"id":"frontend-interview-bl-1mndh5k","book":"Frontend Interview","part":"2. React.js","question":"Why does `useEffect` run twice in development?","prompt":"","answer":"React 18+ **Strict Mode** mounts, unmounts and re-mounts components in development to expose effects that are missing cleanup. It does not happen in production. The fix is a correct cleanup function, not disabling Strict Mode."},{"id":"frontend-interview-bl-u34ow4","book":"Frontend Interview","part":"2. React.js","question":"`useMemo` vs `useCallback` vs `React.memo`?","prompt":"","answer":"- `useMemo` caches a **computed value** (expensive filtering or sorting).\\n- `useCallback` caches a **function reference** so a memoized child doesn\'t re-render.\\n- `React.memo` wraps a **component** so it skips re-render when props are shallowly equal.\\n\\nThey work together: `React.memo` on a child is useless if you pass a new inline function every render. **Trade-off:** memoization has a cost; measure with React DevTools Profiler first. Also mention that the **React Compiler** (stable in React 19 era) can auto-memoize, reducing manual use."},{"id":"frontend-interview-bl-mbf6dm","book":"Frontend Interview","part":"2. React.js","question":"What is `useRef` used for?","prompt":"","answer":"Two things: accessing DOM nodes (focus an input, measure size, scroll) and storing a mutable value that persists across renders **without** causing a re-render (timer ids, previous values)."},{"id":"frontend-interview-bl-oudfr7","book":"Frontend Interview","part":"2. React.js","question":"What are custom hooks? Give an example.","prompt":"","answer":"A custom hook is a function starting with `use` that reuses stateful logic across components. It shares logic, not state — each component gets its own copy.\\n\\n```tsx\\nfunction useDebounce\\u003cT>(value: T, delay = 300): T {\\n  const [debounced, setDebounced] = useState(value);\\n  useEffect(() => {\\n    const t = setTimeout(() => setDebounced(value), delay);\\n    return () => clearTimeout(t);\\n  }, [value, delay]);\\n  return debounced;\\n}\\n```"},{"id":"frontend-interview-bl-ljzdzz","book":"Frontend Interview","part":"2. React.js","question":"What are the Rules of Hooks?","prompt":"","answer":"Call hooks only at the top level (not inside loops, conditions or nested functions) and only from React components or custom hooks. React tracks hooks by call order, so conditional calls break that order."},{"id":"frontend-interview-bl-tj4z8k","book":"Frontend Interview","part":"2. React.js","question":"Controlled vs uncontrolled components?","prompt":"","answer":"Controlled inputs keep their value in React state (`value` + `onChange`) — good for live validation. Uncontrolled inputs keep value in the DOM, read via `ref` or `FormData` — less re-rendering. **React Hook Form** uses uncontrolled inputs for performance, often paired with Zod for validation."},{"id":"frontend-interview-bl-194s94p","book":"Frontend Interview","part":"2. React.js","question":"How do you design a reusable component?","prompt":"","answer":"Walk through these principles with a `Button` or `Modal` example:\\n\\n1. **Typed, minimal props API** — extend native props so it behaves like a real element.\\n2. **Variants instead of booleans** — `variant=\\"primary\\"` instead of `isPrimary`, `isDanger`.\\n3. **Composition over configuration** — accept `children` or compound parts (`\\u003cCard.Header>`) instead of 20 props.\\n4. **Forward refs and spread rest props** — so it works with forms, focus and tooltips.\\n5. **Accessible by default** — semantic element, focus styles, ARIA where needed.\\n6. **Style override** — accept `className` and merge with `tailwind-merge`.\\n\\n```tsx\\nimport { cva, type VariantProps } from \'class-variance-authority\';\\nimport { cn } from \'@/lib/utils\';\\n\\nconst button = cva(\'inline-flex items-center rounded-md font-medium transition focus-visible:ring-2 disabled:opacity-50\', {\\n  variants: {\\n    variant: { primary: \'bg-blue-600 text-white hover:bg-blue-700\', outline: \'border border-gray-300 hover:bg-gray-50\' },\\n    size: { sm: \'h-8 px-3 text-sm\', md: \'h-10 px-4\' },\\n  },\\n  defaultVariants: { variant: \'primary\', size: \'md\' },\\n});\\n\\ntype ButtonProps = React.ComponentProps\\u003c\'button\'> & VariantProps\\u003ctypeof button>;\\n\\nexport function Button({ className, variant, size, ...props }: ButtonProps) {\\n  return \\u003cbutton className={cn(button({ variant, size }), className)} {...props} />;\\n}\\n```\\n\\nMention that this is the pattern used by **shadcn/ui**, which is common in Next.js + Tailwind projects. (In React 19, `ref` is a normal prop, so `forwardRef` is no longer needed.)"},{"id":"frontend-interview-bl-fguxvt","book":"Frontend Interview","part":"2. React.js","question":"How do you avoid prop drilling?","prompt":"","answer":"Options, in order: restructure with composition (pass components as `children`), use **Context** for low-frequency global values (theme, auth, locale), use **Zustand/Redux** for frequently changing shared client state, and use **TanStack Query** for server data. Context is not a performance-optimized state manager — every consumer re-renders when its value changes."},{"id":"frontend-interview-bl-zkv8uu","book":"Frontend Interview","part":"2. React.js","question":"What are Error Boundaries?","prompt":"","answer":"Components that catch render errors in their child tree and show a fallback UI instead of a blank screen. They must be class components (or use the `react-error-boundary` library). They do not catch errors in event handlers or async code. In Next.js App Router, `error.tsx` creates one per route segment."},{"id":"frontend-interview-bl-8nou8c","book":"Frontend Interview","part":"2. React.js","question":"What is new in React 19 that you know about?","prompt":"","answer":"Server Components and Server Actions as stable features, the `use()` hook for reading promises and context, `useActionState` and `useFormStatus` for forms, `useOptimistic` for optimistic UI, `ref` as a regular prop, and the React Compiler for automatic memoization. You don\'t need every detail — knowing the direction shows you keep up."},{"id":"frontend-interview-bl-1nwu4z5","book":"Frontend Interview","part":"3. Next.js","question":"Why use Next.js instead of plain React (Vite/CRA)?","prompt":"","answer":"**Say this:** Next.js adds server-side rendering, static generation, file-based routing, image and font optimization, API routes, middleware and built-in SEO metadata. Plain React renders in the browser, so the first HTML is empty — worse for SEO and first load on slow devices."},{"id":"frontend-interview-bl-1lxznf2","book":"Frontend Interview","part":"3. Next.js","question":"Explain SSR, SSG, ISR and CSR.","prompt":"","answer":"| Strategy | When HTML is built | Best for | App Router way |\\n| --- | --- | --- | --- |\\n| SSG (Static) | At build time | Marketing pages, blogs, docs | Default for routes with no dynamic dat
