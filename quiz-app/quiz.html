03caddress>` is for contact information of the nearest `\\u003carticle>` or the page — not for any postal address in content."},{"id":"html-questions-ebook-11hfelm","book":"HTML","part":"Part 2 — Semantic HTML","question":"When should you use a table?","prompt":"","answer":"**Short answer.** For tabular data — rows and columns where relationships matter. Never for page layout. Use `\\u003ccaption>`, `\\u003cthead>`, `\\u003ctbody>`, `\\u003cth>` with `scope` so screen readers can announce headers for each cell.\\n\\n**Explanation.**\\n\\n```html\\n\\u003ctable>\\n  \\u003ccaption>Q3 sales by region\\u003c/caption>\\n  \\u003cthead>\\n    \\u003ctr>\\u003cth scope=\\"col\\">Region\\u003c/th>\\u003cth scope=\\"col\\">Revenue\\u003c/th>\\u003c/tr>\\n  \\u003c/thead>\\n  \\u003ctbody>\\n    \\u003ctr>\\u003cth scope=\\"row\\">EMEA\\u003c/th>\\u003ctd>$1.2M\\u003c/td>\\u003c/tr>\\n    \\u003ctr>\\u003cth scope=\\"row\\">APAC\\u003c/th>\\u003ctd>$0.9M\\u003c/td>\\u003c/tr>\\n  \\u003c/tbody>\\n\\u003c/table>\\n```\\n\\n**Watch out.** Setting `display: flex` or `grid` on table elements can strip their table semantics in some browsers. Make tables responsive with a horizontally scrolling wrapper instead."},{"id":"html-questions-ebook-1nqpbne","book":"HTML","part":"Part 3 — Forms","question":"How does a form submit, and GET vs POST?","prompt":"","answer":"**Short answer.** On submit, the browser collects every named, enabled control in the form and sends it to `action` using `method`. GET puts the data in the URL query string; POST puts it in the request body.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cform action=\\"/search\\" method=\\"get\\">\\n  \\u003cinput type=\\"search\\" name=\\"q\\">       \\u003c!-- → /search?q=shoes -->\\n  \\u003cbutton>Search\\u003c/button>\\n\\u003c/form>\\n\\n\\u003cform action=\\"/login\\" method=\\"post\\">\\n  \\u003cinput name=\\"email\\" type=\\"email\\" autocomplete=\\"username\\">\\n  \\u003cinput name=\\"password\\" type=\\"password\\" autocomplete=\\"current-password\\">\\n  \\u003cbutton>Sign in\\u003c/button>\\n\\u003c/form>\\n```\\n\\n| | GET | POST |\\n|---|---|---|\\n| Data location | URL | Body |\\n| Bookmarkable / shareable | Yes | No |\\n| Use for | Searches, filters | Anything that changes state, sensitive data |\\n| File uploads | No | Yes (`enctype=\\"multipart/form-data\\"`) |\\n\\n**Watch out.** Controls without a `name` aren\'t submitted. Neither are `disabled` controls — use `readonly` if the value must be sent but not edited."},{"id":"html-questions-ebook-1nar921","book":"HTML","part":"Part 3 — Forms","question":"How do you correctly label a form control?","prompt":"","answer":"**Short answer.** With a `\\u003clabel>` linked by `for`/`id`, or by wrapping the control inside the label. This gives an accessible name and makes clicking the label focus the control.\\n\\n**Explanation.**\\n\\n```html\\n\\u003c!-- Explicit -->\\n\\u003clabel for=\\"email\\">Email\\u003c/label>\\n\\u003cinput id=\\"email\\" name=\\"email\\" type=\\"email\\">\\n\\n\\u003c!-- Implicit -->\\n\\u003clabel>\\n  \\u003cinput type=\\"checkbox\\" name=\\"terms\\"> I agree to the terms\\n\\u003c/label>\\n\\n\\u003c!-- Extra description -->\\n\\u003clabel for=\\"pw\\">Password\\u003c/label>\\n\\u003cinput id=\\"pw\\" type=\\"password\\" aria-describedby=\\"pw-hint\\">\\n\\u003cp id=\\"pw-hint\\">At least 12 characters.\\u003c/p>\\n```\\n\\n**Watch out.** A `placeholder` is not a label. It disappears when typing starts, usually has poor contrast, and isn\'t reliably announced. Use it only for an example format, if at all."},{"id":"html-questions-ebook-bvblre","book":"HTML","part":"Part 3 — Forms","question":"Which input types should you know, and why do they matter?","prompt":"","answer":"**Short answer.** `email`, `tel`, `url`, `number`, `search`, `password`, `date`, `time`, `datetime-local`, `month`, `color`, `range`, `file`, `checkbox`, `radio`, `hidden`. The right type gives the correct mobile keyboard, built-in validation, and native pickers.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cinput type=\\"email\\" autocomplete=\\"email\\">        \\u003c!-- @ key on mobile, format validation -->\\n\\u003cinput type=\\"tel\\" autocomplete=\\"tel\\">            \\u003c!-- phone keypad -->\\n\\u003cinput inputmode=\\"numeric\\" pattern=\\"[0-9]*\\" autocomplete=\\"one-time-code\\">  \\u003c!-- OTP -->\\n\\u003cinput type=\\"date\\" min=\\"2026-01-01\\">\\n```\\n\\n`inputmode` changes only the virtual keyboard without changing validation — useful for things that are digits but not numbers.\\n\\n**Watch out.** Don\'t use `type=\\"number\\"` for credit cards, ZIP codes, or phone numbers. It strips leading zeros, allows `e`, shows spinners, and changes value on scroll. Use `type=\\"text\\" inputmode=\\"numeric\\"`."},{"id":"html-questions-ebook-alwh55","book":"HTML","part":"Part 3 — Forms","question":"How does built-in form validation work?","prompt":"","answer":"**Short answer.** Attributes like `required`, `type`, `min`, `max`, `minlength`, `maxlength`, `pattern`, and `step` define constraints. The browser blocks submission and shows messages if they fail. The Constraint Validation API lets you customize messages and check validity in JavaScript.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cform>\\n  \\u003cinput name=\\"username\\" required minlength=\\"3\\" pattern=\\"[a-z0-9_]+\\"\\n         title=\\"Lowercase letters, numbers, and underscores\\">\\n  \\u003cbutton>Create\\u003c/button>\\n\\u003c/form>\\n```\\n\\n```js\\nconst input = form.elements.username;\\ninput.addEventListener(\'input\', () => {\\n  if (input.validity.patternMismatch) {\\n    input.setCustomValidity(\'Use lowercase letters, numbers, or _\');\\n  } else {\\n    input.setCustomValidity(\'\');   // must clear, or the field stays invalid forever\\n  }\\n});\\n```\\n\\nCSS hooks: `:valid`, `:invalid`, and `:user-invalid` (only after the user interacts — avoids showing errors on page load).\\n\\n**Watch out.** Client-side validation is UX, not security. Anyone can bypass it with DevTools or `curl`. Always validate on the server too."},{"id":"html-questions-ebook-k03l0l","book":"HTML","part":"Part 3 — Forms","question":"What are the `\\u003cbutton>` types, and why is the default a common bug?","prompt":"","answer":"**Short answer.** `submit` (the default), `button`, and `reset`. A `\\u003cbutton>` inside a form without a `type` submits the form — so a \\"Show password\\" or \\"Add row\\" button accidentally submits it.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cform>\\n  \\u003cinput type=\\"password\\" id=\\"pw\\">\\n  \\u003cbutton type=\\"button\\" onclick=\\"togglePassword()\\">Show\\u003c/button>   \\u003c!-- explicit -->\\n  \\u003cbutton type=\\"submit\\">Save\\u003c/button>\\n\\u003c/form>\\n```\\n\\n**Watch out.** Always set `type` explicitly on buttons. `reset` is rarely wanted — users click it by accident and lose everything they typed."},{"id":"html-questions-ebook-16y93u1","book":"HTML","part":"Part 3 — Forms","question":"What are `\\u003cfieldset>` and `\\u003clegend>` for?","prompt":"","answer":"**Short answer.** They group related controls and give the group a name. Essential for radio buttons and checkbox groups, so screen readers announce the question along with each option.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cfieldset>\\n  \\u003clegend>Shipping speed\\u003c/legend>\\n  \\u003clabel>\\u003cinput type=\\"radio\\" name=\\"ship\\" value=\\"std\\" checked> Standard\\u003c/label>\\n  \\u003clabel>\\u003cinput type=\\"radio\\" name=\\"ship\\" value=\\"exp\\"> Express\\u003c/label>\\n\\u003c/fieldset>\\n```\\n\\nBonus: `\\u003cfieldset disabled>` disables every control inside it.\\n\\n**Watch out.** Without the `\\u003clegend>`, a screen reader announces only \\"Express, radio button, 2 of 2\\" — the user never hears what they\'re choosing."},{"id":"html-questions-ebook-128dtny","book":"HTML","part":"Part 3 — Forms","question":"What does `autocomplete` do, and why does it matter?","prompt":"","answer":"**Short answer.** It tells the browser and password managers what kind of data a field expects, so they can autofill correctly. It\'s also a WCAG requirement for fields collecting user information.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cinput name=\\"name\\" autocomplete=\\"name\\">\\n\\u003cinput name=\\"email\\" autocomplete=\\"email\\">\\n\\u003cinput name=\\"address\\" autocomplete=\\"street-address\\">\\n\\u003cinput name=\\"cc\\" autocomplete=\\"cc-number\\" inputmode=\\"numeric\\">\\n\\u003cinput name=\\"new-pw\\" type=\\"password\\" autocomplete=\\"new-password\\">\\n\\u003cinput name=\\"code\\" autocomplete=\\"one-time-code\\">\\n```\\n\\n`new-password` triggers strong-password suggestions; `current-password` triggers saved-password fill; `one-time-code` enables SMS code autofill on mobile.\\n\\n**Watch out.** `autocomplete=\\"off\\"` on login fields hurts security — it pushes users toward weak, reused passwords. Most browsers ignore it for passwords anyway."},{"id":"html-questions-ebook-gnl1zp","book":"HTML","part":"Part 3 — Forms","question":"Name the other form elements worth knowing.","prompt":"","answer":"**Short answer.** `\\u003cselect>`/`\\u003coption>`/`\\u003coptgroup>`, `\\u003ctextarea>`, `\\u003cdatalist>` for suggestions, `\\u003coutput>` for computed results, `\\u003cprogress>` and `\\u003cmeter>` for values, and the `form` attribute for controls outside their form.\\n\\n**Explanation.**\\n\\n```html\\n\\u003clabel for=\\"browser\\">Browser\\u003c/label>\\n\\u003cinput id=\\"browser\\" list=\\"browsers\\">\\n\\u003cdatalist id=\\"browsers\\">\\n  \\u003coption value=\\"Chrome\\">\\u003coption value=\\"Firefox\\">\\u003coption value=\\"Safari\\">\\n\\u003c/datalist>\\n\\n\\u003cprogress value=\\"70\\" max=\\"100\\">70%\\u003c/progress>    \\u003c!-- task completion -->\\n\\u003cmeter value=\\"0.8\\" low=\\"0.3\\" high=\\"0.7\\">80%\\u003c/meter> \\u003c!-- a measurement in a range, e.g. disk use -->\\n\\n\\u003cform id=\\"checkout\\">…\\u003c/form>\\n\\u003cbutton form=\\"checkout\\">Pay\\u003c/button>              \\u003c!-- submits a form it\'s not inside -->\\n```\\n\\n**Watch out.** `\\u003cprogress>` vs `\\u003cmeter>` is a classic question: progress is how far a task has got; meter is a scalar value within a known range."},{"id":"html-questions-ebook-13o8fzg","book":"HTML","part":"Part 4 — Accessibility","question":"How do you write good `alt` text?","prompt":"","answer":"**Short answer.** Describe the image\'s *purpose* in context, not its appearance. Informative images get concise descriptions; decorative images get `alt=\\"\\"`; images that are links or buttons describe the action.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cimg src=\\"logo.svg\\" alt=\\"Acme\\">                         \\u003c!-- inside a link home: \\"Acme home\\" -->\\n\\u003cimg src=\\"divider.png\\" alt=\\"\\">                          \\u003c!-- decorative: skipped by screen readers -->\\n\\u003cimg src=\\"q3.png\\" alt=\\"Revenue rose from $2M to $3M in Q3\\">  \\u003c!-- the point, not \\"a bar chart\\" -->\\n\\u003ca href=\\"/cart\\">\\u003cimg src=\\"cart.svg\\" alt=\\"Cart (3 items)\\">\\u003c/a>\\n```\\n\\n**Watch out.** Omitting `alt` entirely is worse than `alt=\\"\\"` — screen readers often read the file name (\\"IMG underscore 4021 dot jpeg\\"). And don\'t start with \\"Image of…\\" — the screen reader already says \\"image\\"."},{"id":"html-questions-ebook-171gqhu","book":"HTML","part":"Part 4 — Accessibility","question":"What are the rules of ARIA?","prompt":"","answer":"**Short answer.** First rule: don\'t use ARIA if a native element does the job. ARIA only changes what assistive technology is *told* — it adds no behavior, no focus, no keyboard support.\\n\\n**Explanation.** The five rules, condensed:\\n\\n1. Prefer native HTML (`\\u003cbutton>` over `role=\\"button\\"`).\\n2. Don\'t change native semantics unless you must (`\\u003ch2 role=\\"tab\\">` is wrong; wrap it instead).\\n3. All interactive ARIA controls must be keyboard-operable.\\n4. Don\'t put `role=\\"presentation\\"` or `aria-hidden=\\"true\\"` on focusable elements.\\n5. Every interactive element needs an accessible name.\\n\\nCommonly used ARIA that *is* appropriate:\\n\\n```html\\n\\u003cbutton aria-expanded=\\"false\\" aria-controls=\\"menu\\">Menu\\u003c/button>\\n\\u003cul id=\\"menu\\" hidden>…\\u003c/ul>\\n\\n\\u003cbutton aria-label=\\"Close\\">\\u003csvg aria-hidden=\\"true\\">…\\u003c/svg>\\u003c/button>\\n\\n\\u003cdiv role=\\"status\\" aria-live=\\"polite\\">Saved.\\u003c/div>\\n```\\n\\n**Watch out.** Studies of large site samples consistently find pages *with* ARIA have more accessibility errors than pages without. \\"No ARIA is better than bad ARIA.\\""},{"id":"html-questions-ebook-d64cxd","book":"HTML","part":"Part 4 — Accessibility","question":"What is an accessible name, and how is it computed?","prompt":"","answer":"**Short answer.** It\'s what assistive technology announces for an element — \\"Submit, button\\". The browser computes it in priority order: `aria-labelledby`, then `aria-label`, then native labeling (`\\u003clabel>`, `alt`, `\\u003ccaption>`, `\\u003clegend>`), then text content, then `title` as a last resort.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cbutton>Save\\u003c/button>                                    \\u003c!-- \\"Save\\" from content -->\\n\\u003cbutton aria-label=\\"Close dialog\\">×\\u003c/button>             \\u003c!-- \\"Close dialog\\" -->\\n\\u003ch2 id=\\"billing\\">Billing\\u003c/h2>\\n\\u003csection aria-labelledby=\\"billing\\">…\\u003c/section>            \\u003c!-- region named \\"Billing\\" -->\\n```\\n\\nYou can inspect it in DevTools → Accessibility pane.\\n\\n**Watch out.** `aria-label` overrides visible text. If a button says \\"Buy\\" but has `aria-label=\\"Purchase item\\"`, voice-control users saying \\"click Buy\\" fail. Keep the visible text in the accessible name (WCAG \\"Label in Name\\")."},{"id":"html-questions-ebook-ssmnwv","book":"HTML","part":"Part 4 — Accessibility","question":"How does `tabindex` work?","prompt":"","answer":"**Short answer.** `tabindex=\\"0\\"` puts a non-interactive element into the natural tab order. `tabindex=\\"-1\\"` makes it focusable by script but not by Tab. Positive values force a custom order — and should never be used.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cdiv tabindex=\\"0\\" role=\\"region\\" aria-label=\\"Code sample\\">…\\u003c/div>   \\u003c!-- scrollable region -->\\n\\u003ch1 tabindex=\\"-1\\" id=\\"page-title\\">Dashboard\\u003c/h1>                   \\u003c!-- focus target after route change -->\\n```\\n\\n```js\\ndocument.getElementById(\'page-title\').focus();\\n```\\n\\n**Watch out.** `tabindex=\\"5\\"` jumps that element ahead of everything with `0`, creating a confusing order that breaks as the page changes. Fix the DOM order instead."},{"id":"html-questions-ebook-n3tkbm","book":"HTML","part":"Part 4 — Accessibility","question":"What is a skip link?","prompt":"","answer":"**Short answer.** A link at the very start of the page that jumps keyboard users past repeated navigation straight to the main content. Usually visually hidden until focused.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cbody>\\n  \\u003ca class=\\"skip-link\\" href=\\"#main\\">Skip to main content\\u003c/a>\\n  \\u003cheader>…40 nav links…\\u003c/header>\\n  \\u003cmain id=\\"main\\" tabindex=\\"-1\\">…\\u003c/main>\\n\\u003c/body>\\n```\\n\\n```css\\n.skip-link { position: absolute; left: -9999px; }\\n.skip-link:focus { left: 1rem; top: 1rem; }\\n```\\n\\n**Watch out.** Hiding it with `display: none` makes it unfocusable and useless. Hide it off-screen so it appears on focus."},{"id":"html-questions-ebook-1c571hp","book":"HTML","part":"Part 4 — Accessibility","question":"How do you hide content — and from whom?","prompt":"","answer":"**Short answer.** It depends who it should be hidden from: everyone, only screen readers, or only sighted users.\\n\\n**Explanation.**\\n\\n| Goal | Technique |\\n|---|---|\\n| Hidden from everyone | `hidden` attribute, `display: none` |\\n| Visible, hidden from screen readers | `aria-hidden=\\"true\\"` (decorative icons) |\\n| Hidden visually, read by screen readers | `.visually-hidden` CSS class |\\n| Visible but non-interactive and hidden from AT | `inert` attribute |\\n\\n```css\\n.visually-hidden {\\n  position: absolute; width: 1px; height: 1px;\\n  overflow: hidden; clip-path: inset(50%); white-space: nowrap;\\n}\\n```\\n\\n```html\\n\\u003cbutton>\\u003csvg aria-hidden=\\"true\\">…\\u003c/svg>\\u003cspan class=\\"visually-hidden\\">Search\\u003c/span>\\u003c/button>\\n```\\n\\n**Watch out.** `aria-hidden=\\"true\\"` on a container doesn\'t remove focusable children from the tab order — keyboard users land on invisible-to-AT elements. Use `inert` for that."},{"id":"html-questions-ebook-1nito6z","book":"HTML","part":"Part 4 — Accessibility","question":"Button or link?","prompt":"","answer":"**Short answer.** Links (`\\u003ca href>`) navigate to a URL. Buttons perform an action on the current page. The difference matters for keyboard behavior, screen-reader expectations, and browser features like open-in-new-tab.\\n\\n**Explanation.**\\n\\n| | `\\u003ca href>` | `\\u003cbutton>` |\\n|---|---|---|\\n| Purpose | Go somewhere | Do something |\\n| Keyboard | Enter | Enter and Space |\\n| Middle-click / new tab | Yes | No |\\n| Announced as | \\"link\\" | \\"button\\" |\\n\\n```html\\n\\u003ca href=\\"/settings\\">Settings\\u003c/a>\\n\\u003cbutton type=\\"button\\" onclick=\\"openDialog()\\">Edit profile\\u003c/button>\\n```\\n\\n**Watch out.** `\\u003ca href=\\"#\\" onclick=\\"…\\">` and `\\u003ca>` without `href` are anti-patterns — an `\\u003ca>` without `href` isn\'t focusable or announced as a link. If it doesn\'t have a URL, it\'s a button."},{"id":"html-questions-ebook-xx1wo3","book":"HTML","part":"Part 4 — Accessibility","question":"How do live regions work?","prompt":"","answer":"**Short answer.** Elements with `aria-live` (or roles like `status` and `alert`) announce content changes to screen readers without moving focus — for toasts, form errors, search result counts, and chat messages.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cdiv role=\\"status\\" aria-live=\\"polite\\" id=\\"results-count\\">\\u003c/div>   \\u003c!-- waits for a pause -->\\n\\u003cdiv role=\\"alert\\" id=\\"form-error\\">\\u003c/div>                          \\u003c!-- interrupts immediately -->\\n```\\n\\n```js\\ndocument.getElementById(\'results-count\').textContent = \'24 results\';\\n```\\n\\n**Watch out.** The live region must exist in the DOM *before* the content changes. Inserting a new element that already contains text is often not announced. Render the empty container on page load and update its text."},{"id":"html-questions-ebook-13c6is1","book":"HTML","part":"Part 5 — Images and Media","question":"How do responsive images work — `srcset` and `sizes`?","prompt":"","answer":"**Short answer.** `srcset` lists candidate files with their widths (or pixel densities); `sizes` tells the browser how wide the image will be displayed. The browser picks the smallest file that still looks sharp for the screen.\\n\\n**Explanation.**\\n\\n```html\\n\\u003c!-- Width-based: for images that change size with the layout -->\\n\\u003cimg src=\\"hero-800.jpg\\"\\n     srcset=\\"hero-400.jpg 400w, hero-800.jpg 800w, hero-1600.jpg 1600w\\"\\n     sizes=\\"(max-width: 600px) 100vw, 50vw\\"\\n     width=\\"1600\\" height=\\"900\\"\\n     alt=\\"Team planning on a whiteboard\\">\\n\\n\\u003c!-- Density-based: for fixed-size images like logos -->\\n\\u003cimg src=\\"logo.png\\" srcset=\\"logo.png 1x, logo@2x.png 2x\\" width=\\"120\\" height=\\"40\\" alt=\\"Acme\\">\\n```\\n\\nThe browser needs `sizes` because it picks the file before CSS has loaded. Without it, it assumes `100vw` and downloads oversized images.\\n\\n**Watch out.** Always set `width` and `height` — the browser uses their ratio to reserve space before the image loads, preventing layout shift (CLS). CSS `height: auto` keeps it responsive."},{"id":"html-questions-ebook-1tdgaon","book":"HTML","part":"Part 5 — Images and Media","question":"When do you use `\\u003cpicture>`?","prompt":"","answer":"**Short answer.** For *art direction* (different crops at different sizes) or *format fallback* (AVIF → WebP → JPEG). For simple resolution switching, `\\u003cimg srcset>` is enough.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cpicture>\\n  \\u003csource type=\\"image/avif\\" srcset=\\"photo.avif\\">\\n  \\u003csource type=\\"image/webp\\" srcset=\\"photo.webp\\">\\n  \\u003cimg src=\\"photo.jpg\\" alt=\\"Mountain lake at sunrise\\" width=\\"1200\\" height=\\"800\\">\\n\\u003c/picture>\\n\\n\\u003cpicture>\\n  \\u003csource media=\\"(max-width: 600px)\\" srcset=\\"hero-square.jpg\\">\\n  \\u003cimg src=\\"hero-wide.jpg\\" alt=\\"Product on a desk\\" width=\\"1600\\" height=\\"600\\">\\n\\u003c/picture>\\n```\\n\\nThe browser uses the first matching `\\u003csource>`; the `\\u003cimg>` is required and is what actually renders (and carries `alt`).\\n\\n**Watch out.** Styles and `alt` go on the `\\u003cimg>`, not on `\\u003cpicture>` or `\\u003csource>`."},{"id":"html-questions-ebook-1l7x773","book":"HTML","part":"Part 5 — Images and Media","question":"What do `loading=\\"lazy\\"`, `decoding`, and `fetchpriority` do?","prompt":"","answer":"**Short answer.** `loading=\\"lazy\\"` defers off-screen images and iframes until the user scrolls near them. `fetchpriority=\\"high\\"` tells the browser to fetch a resource early — typically the LCP image. `decoding=\\"async\\"` lets image decoding happen off the main rendering path.\\n\\n**Explanation.**\\n\\n```html\\n\\u003c!-- Hero image: the Largest Contentful Paint element -->\\n\\u003cimg src=\\"hero.jpg\\" fetchpriority=\\"high\\" alt=\\"…\\" width=\\"1600\\" height=\\"900\\">\\n\\n\\u003c!-- Below the fold -->\\n\\u003cimg src=\\"gallery-12.jpg\\" loading=\\"lazy\\" alt=\\"…\\" width=\\"400\\" height=\\"300\\">\\n\\u003ciframe src=\\"https://maps.example.com/embed\\" loading=\\"lazy\\" title=\\"Office location\\">\\u003c/iframe>\\n```\\n\\n**Watch out.** Lazy-loading the hero image is a common LCP regression — the browser waits for layout before starting the download. Never lazy-load above-the-fold images."},{"id":"html-questions-ebook-s6m2v9","book":"HTML","part":"Part 5 — Images and Media","question":"What do you need for accessible video and audio?","prompt":"","answer":"**Short answer.** Native `\\u003cvideo>`/`\\u003caudio>` with `controls`, captions via `\\u003ctrack kind=\\"captions\\">`, a transcript for audio, no autoplay with sound, and a way to pause any motion.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cvideo controls width=\\"640\\" height=\\"360\\" preload=\\"metadata\\" poster=\\"thumb.jpg\\">\\n  \\u003csource src=\\"demo.webm\\" type=\\"video/webm\\">\\n  \\u003csource src=\\"demo.mp4\\" type=\\"video/mp4\\">\\n  \\u003ctrack kind=\\"captions\\" src=\\"demo.en.vtt\\" srclang=\\"en\\" label=\\"English\\" default>\\n  \\u003ca href=\\"demo.mp4\\">Download the video\\u003c/a>\\n\\u003c/video>\\n```\\n\\n**Watch out.** Browsers block autoplay with sound. Background videos need `autoplay muted loop playsinline` — `playsinline` stops iOS from going fullscreen — and should respect `prefers-reduced-motion`."},{"id":"html-questions-ebook-ccmhn2","book":"HTML","part":"Part 5 — Images and Media","question":"Inline `\\u003csvg>` vs `\\u003cimg src=\\"icon.svg\\">`","prompt":"","answer":"**Short answer.** Inline SVG can be styled with CSS (`fill: currentColor`), animated, and scripted, and adds no request. `\\u003cimg>` SVGs are cached, keep HTML small, and are isolated from page CSS and scripts.\\n\\n**Explanation.**\\n\\n```html\\n\\u003c!-- Inline icon, inherits text color, hidden from screen readers -->\\n\\u003cbutton>\\n  \\u003csvg aria-hidden=\\"true\\" width=\\"16\\" height=\\"16\\">\\u003cuse href=\\"/icons.svg#trash\\">\\u003c/use>\\u003c/svg>\\n  Delete\\n\\u003c/button>\\n\\n\\u003c!-- Meaningful standalone SVG -->\\n\\u003csvg role=\\"img\\" aria-labelledby=\\"t1\\">\\u003ctitle id=\\"t1\\">Uptime: 99.9%\\u003c/title>…\\u003c/svg>\\n```\\n\\n**Watch out.** An icon-only button needs an accessible name (`aria-label` or visually hidden text). The SVG itself should be `aria-hidden=\\"true\\"`."},{"id":"html-questions-ebook-vqiwuq","book":"HTML","part":"Part 6 — Loading and Performance","question":"`\\u003cscript>` vs `async` vs `defer` vs `type=\\"module\\"`","prompt":"","answer":"**Short answer.** A plain `\\u003cscript>` blocks HTML parsing while it downloads and runs. `async` downloads in parallel and runs as soon as it arrives, in any order. `defer` downloads in parallel and runs after parsing, in document order. Module scripts are deferred by default.\\n\\n**Explanation.**\\n\\n| | Blocks parsing | Execution order | Runs when |\\n|---|---|---|---|\\n| `\\u003cscript>` | Yes | Document order | Immediately |\\n| `async` | No | Whichever loads first | As soon as downloaded |\\n| `defer` | No | Document order | After parsing, before `DOMContentLoaded` |\\n| `type=\\"module\\"` | No | Document order | Like `defer` (or `async` if marked) |\\n\\n```html\\n\\u003cscript src=\\"/app.js\\" defer>\\u003c/script>               \\u003c!-- your app: needs DOM, order matters -->\\n\\u003cscript src=\\"https://analytics.example.js\\" async>\\u003c/script>   \\u003c!-- independent third party -->\\n\\u003cscript type=\\"module\\" src=\\"/main.js\\">\\u003c/script>\\n```\\n\\n**Watch out.** `async` scripts that depend on each other break randomly, because order isn\'t guaranteed. Use `defer` for anything that depends on other scripts or the full DOM."},{"id":"html-questions-ebook-3taqvf","book":"HTML","part":"Part 6 — Loading and Performance","question":"What is the critical rendering path?","prompt":"","answer":"**Short answer.** The steps from receiving HTML to painting pixels: parse HTML into the DOM, parse CSS into the CSSOM, combine them into the render tree, calculate layout, paint, and composite. Anything that blocks those steps delays first render.\\n\\n**Explanation.**\\n\\n- **CSS is render-blocking** — the browser won\'t paint until stylesheets in `\\u003chead>` load.\\n- **Classic scripts are parser-blocking** — and they wait for preceding CSS, since scripts may read styles.\\n- **Fonts** can delay text paint (FOIT) unless `font-display: swap` is used.\\n\\nOptimizations: inline critical CSS, `defer` scripts, preload key resources, compress and cache assets, and reduce the number of requests on the critical path.\\n\\n**Watch out.** Moving scripts to the end of `\\u003cbody>` was the old fix. `defer` in `\\u003chead>` is better — the download starts earlier, and execution still waits for the parser."},{"id":"html-questions-ebook-1yy18r6","book":"HTML","part":"Part 6 — Loading and Performance","question":"`preload` vs `prefetch` vs `preconnect` vs `dns-prefetch`","prompt":"","answer":"**Short answer.** `preload` fetches a resource needed for *this* page now, at high priority. `prefetch` fetches something likely needed for the *next* page, at low priority. `preconnect` opens the connection (DNS + TCP + TLS) to an origin early. `dns-prefetch` does only the DNS lookup.\\n\\n**Explanation.**\\n\\n```html\\n\\u003clink rel=\\"preconnect\\" href=\\"https://cdn.example.com\\" crossorigin>\\n\\u003clink rel=\\"preload\\" href=\\"/fonts/inter.woff2\\" as=\\"font\\" type=\\"font/woff2\\" crossorigin>\\n\\u003clink rel=\\"preload\\" href=\\"/hero.avif\\" as=\\"image\\" fetchpriority=\\"high\\">\\n\\u003clink rel=\\"prefetch\\" href=\\"/checkout.js\\">\\n\\u003clink rel=\\"modulepreload\\" href=\\"/app.mjs\\">\\n```\\n\\n**Watch out.** Preloading too much competes with genuinely critical resources and slows the page down. Preloaded resources that aren\'t used within a few seconds trigger a console warning. Font preloads need `crossorigin` even on the same origin, or they\'re fetched twice."},{"id":"html-questions-ebook-lhelfg","book":"HTML","part":"Part 6 — Loading and Performance","question":"What are the Speculation Rules API and bfcache?","prompt":"","answer":"**Short answer.** The Speculation Rules API lets a page tell the browser to prefetch or *prerender* likely next pages, so navigation feels instant. bfcache (back/forward cache) keeps a full page snapshot in memory so Back and Forward restore it instantly.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cscript type=\\"speculationrules\\">\\n{\\n  \\"prerender\\": [{ \\"where\\": { \\"href_matches\\": \\"/products/*\\" }, \\"eagerness\\": \\"moderate\\" }]\\n}\\n\\u003c/script>\\n```\\n\\nThings that make a page ineligible for bfcache: `unload` event listeners, `Cache-Control: no-store` (in some browsers), and open connections that aren\'t closed in `pagehide`.\\n\\n**Watch out.** Prerendering runs the page\'s JavaScript before the user visits. Analytics must wait for the `prerenderingchange` event (or check `document.prerendering`) to avoid counting page views that never happened."},{"id":"html-questions-ebook-1gs3zni","book":"HTML","part":"Part 7 — Modern HTML","question":"What does the `\\u003cdialog>` element give you?","prompt":"","answer":"**Short answer.** A native modal or non-modal dialog. `showModal()` gives you a top-layer modal with a `::backdrop`, focus moved into the dialog, `Escape` to close, and the rest of the page made inert — work that used to need a library.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cbutton type=\\"button\\" onclick=\\"confirmDlg.showModal()\\">Delete\\u003c/button>\\n\\n\\u003cdialog id=\\"confirmDlg\\" aria-labelledby=\\"dlg-title\\">\\n  \\u003ch2 id=\\"dlg-title\\">Delete this file?\\u003c/h2>\\n  \\u003cform method=\\"dialog\\">\\n    \\u003cbutton value=\\"cancel\\">Cancel\\u003c/button>\\n    \\u003cbutton value=\\"delete\\">Delete\\u003c/button>\\n  \\u003c/form>\\n\\u003c/dialog>\\n```\\n\\n```js\\nconfirmDlg.addEventListener(\'close\', () => {\\n  if (confirmDlg.returnValue === \'delete\') deleteFile();\\n});\\n```\\n\\nA form with `method=\\"dialog\\"` closes the dialog and sets `returnValue` to the clicked button\'s `value` — no submit handler needed. `closedby=\\"any\\"` enables closing by clicking the backdrop where supported.\\n\\n**Watch out.** `show()` opens a *non-modal* dialog — no backdrop, no inert background. Use `showModal()` for true modals. Focus returns to the trigger on close automatically."},{"id":"html-questions-ebook-l0sboe","book":"HTML","part":"Part 7 — Modern HTML","question":"What is the Popover API?","prompt":"","answer":"**Short answer.** The `popover` attribute turns any element into a top-layer popup — menus, tooltips, toasts — with light dismiss (click outside or `Escape`), no z-index fights, and no JavaScript required.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cbutton popovertarget=\\"menu\\">Options\\u003c/button>\\n\\u003cdiv id=\\"menu\\" popover>\\n  \\u003cbutton>Rename\\u003c/button>\\n  \\u003cbutton>Duplicate\\u003c/button>\\n\\u003c/div>\\n```\\n\\n| Value | Behavior |\\n|---|---|\\n| `popover` / `popover=\\"auto\\"` | Light dismiss; opening one closes other auto popovers |\\n| `popover=\\"manual\\"` | Only closes when you close it (toasts) |\\n| `popover=\\"hint\\"` | For tooltips; doesn\'t close auto popovers |\\n\\nCombine with CSS anchor positioning to place the popover next to its trigger.\\n\\n**Watch out.** Popover vs dialog: a popover is non-modal — the rest of the page stays interactive. If the user must respond before continuing, use `\\u003cdialog>` with `showModal()`."},{"id":"html-questions-ebook-1wj93bz","book":"HTML","part":"Part 7 — Modern HTML","question":"What are `\\u003cdetails>` and `\\u003csummary>`?","prompt":"","answer":"**Short answer.** A native disclosure widget: `\\u003csummary>` is the always-visible toggle, the rest is shown when open. Keyboard and screen-reader support is built in. The `name` attribute groups several into an exclusive accordion.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cdetails name=\\"faq\\" open>\\n  \\u003csummary>How do refunds work?\\u003c/summary>\\n  \\u003cp>Refunds are processed within 5 business days.\\u003c/p>\\n\\u003c/details>\\n\\u003cdetails name=\\"faq\\">\\n  \\u003csummary>Can I change plans?\\u003c/summary>\\n  \\u003cp>Yes, at any time.\\u003c/p>\\n\\u003c/details>\\n```\\n\\nListen for the `toggle` event to react in JavaScript. Content inside closed `\\u003cdetails>` is still found by find-in-page, which opens the element automatically.\\n\\n**Watch out.** Don\'t put interactive elements (links, buttons) inside `\\u003csummary>` — they conflict with its own toggle behavior."},{"id":"html-questions-ebook-1xty4ch","book":"HTML","part":"Part 7 — Modern HTML","question":"What are `\\u003ctemplate>` and `\\u003cslot>`?","prompt":"","answer":"**Short answer.** `\\u003ctemplate>` holds inert markup that isn\'t rendered or executed until cloned with JavaScript. `\\u003cslot>` is a placeholder inside a web component\'s shadow DOM where the component\'s light-DOM children are projected.\\n\\n**Explanation.**\\n\\n```html\\n\\u003ctemplate id=\\"row\\">\\n  \\u003ctr>\\u003ctd class=\\"name\\">\\u003c/td>\\u003ctd class=\\"price\\">\\u003c/td>\\u003c/tr>\\n\\u003c/template>\\n```\\n\\n```js\\nconst tpl = document.getElementById(\'row\');\\nconst row = tpl.content.cloneNode(true);\\nrow.querySelector(\'.name\').textContent = \'Widget\';\\ntbody.append(row);\\n```\\n\\nDeclarative Shadow DOM lets the server render shadow roots in plain HTML:\\n\\n```html\\n\\u003cuser-card>\\n  \\u003ctemplate shadowrootmode=\\"open\\">\\n    \\u003cstyle>:host { display: block; border: 1px solid; }\\u003c/style>\\n    \\u003cslot name=\\"name\\">\\u003c/slot>\\n  \\u003c/template>\\n  \\u003cspan slot=\\"name\\">Ana\\u003c/span>\\n\\u003c/user-card>\\n```\\n\\n**Watch out.** Images in a `\\u003ctemplate>` don\'t load and scripts don\'t run until the content is inserted into the document — that\'s the point, but it surprises people who expect preloading."},{"id":"html-questions-ebook-9ienc0","book":"HTML","part":"Part 7 — Modern HTML","question":"What are Web Components?","prompt":"","answer":"**Short answer.** A set of browser standards for reusable custom elements: Custom Elements (define `\\u003cmy-tag>` with a class), Shadow DOM (encapsulated DOM and styles), and templates/slots. They work in any framework or none.\\n\\n**Explanation.**\\n\\n```js\\nclass CopyButton extends HTMLElement {\\n  connectedCallback() {\\n    this.innerHTML = `\\u003cbutton type=\\"button\\">Copy\\u003c/button>`;\\n    this.querySelector(\'button\').addEventListener(\'click\', () =>\\n      navigator.clipboard.writeText(this.getAttribute(\'text\'))\\n    );\\n  }\\n}\\ncustomElements.define(\'copy-button\', CopyButton);\\n```\\n\\n```html\\n\\u003ccopy-button text=\\"npm install acme\\">\\u003c/copy-button>\\n```\\n\\nCustom element names must contain a hyphen, so they never collide with future HTML elements.\\n\\n**Watch out.** Shadow DOM also encapsulates accessibility relationships — a `\\u003clabel for>` outside can\'t point to an `\\u003cinput>` inside a shadow root. Form-associated custom elements and `ElementInternals` exist to address part of this."},{"id":"html-questions-ebook-kvfedw","book":"HTML","part":"Part 7 — Modern HTML","question":"What do `contenteditable`, `hidden`, `inert`, and `translate` do?","prompt":"","answer":"**Short answer.** Global attributes worth knowing: `contenteditable` makes any element editable; `hidden` removes an element from rendering; `inert` makes a subtree non-interactive and hidden from assistive technology; `translate=\\"no\\"` tells translation tools to leave content alone.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cdiv contenteditable=\\"plaintext-only\\">Edit me\\u003c/div>\\n\\u003csection hidden>Shown later by script\\u003c/section>\\n\\u003cdiv hidden=\\"until-found\\">Revealed by find-in-page\\u003c/div>\\n\\u003cmain inert>…background while a custom modal is open…\\u003c/main>\\n\\u003cspan translate=\\"no\\">Acme Cloud\\u003c/span>\\n```\\n\\n**Watch out.** `hidden` is overridden by any CSS that sets `display` on the element (e.g. `.card { display: flex }`). Add `[hidden] { display: none !important; }` to your base styles."},{"id":"html-questions-ebook-a5m4ew","book":"HTML","part":"Part 8 — SEO and Metadata","question":"Which tags matter most for SEO?","prompt":"","answer":"**Short answer.** A unique, descriptive `\\u003ctitle>`; a `\\u003cmeta name=\\"description\\">`; a clean heading structure; descriptive link text; `alt` text; a canonical URL; and crawlable links (`\\u003ca href>`, not click handlers). Content and performance matter more than any meta tag.\\n\\n**Explanation.**\\n\\n```html\\n\\u003ctitle>Running Shoes for Flat Feet | Acme\\u003c/title>\\n\\u003cmeta name=\\"description\\" content=\\"Compare 24 stability running shoes, tested by podiatrists.\\">\\n\\u003clink rel=\\"canonical\\" href=\\"https://acme.com/shoes/flat-feet\\">\\n\\u003cmeta name=\\"robots\\" content=\\"index, follow\\">\\n```\\n\\n- **Canonical** — tells search engines which URL is the original when the same content is reachable at several (`?sort=price`, tracking params).\\n- **Robots** — `noindex` keeps a page out of results; `nofollow` stops link-following.\\n\\n**Watch out.** `\\u003cmeta name=\\"keywords\\">` has been ignored by Google for over 15 years. Mentioning it as an SEO technique is a red flag."},{"id":"html-questions-ebook-eqjqf","book":"HTML","part":"Part 8 — SEO and Metadata","question":"What are Open Graph and Twitter Card tags?","prompt":"","answer":"**Short answer.** Metadata that controls how a link looks when shared on social platforms and chat apps — title, description, image, and type.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cmeta property=\\"og:title\\" content=\\"How we cut build times by 70%\\">\\n\\u003cmeta property=\\"og:description\\" content=\\"Notes from migrating to Turbopack.\\">\\n\\u003cmeta property=\\"og:image\\" content=\\"https://acme.com/og/build-times.png\\">\\n\\u003cmeta property=\\"og:url\\" content=\\"https://acme.com/blog/build-times\\">\\n\\u003cmeta property=\\"og:type\\" content=\\"article\\">\\n\\u003cmeta name=\\"twitter:card\\" content=\\"summary_large_image\\">\\n```\\n\\n**Watch out.** `og:image` must be an absolute URL, and crawlers don\'t run JavaScript — tags injected client-side are invisible to them. Recommended image size is 1200×630."},{"id":"html-questions-ebook-1uzma1","book":"HTML","part":"Part 8 — SEO and Metadata","question":"What is structured data (JSON-LD)?","prompt":"","answer":"**Short answer.** Machine-readable descriptions of page content using the schema.org vocabulary, embedded in a `\\u003cscript type=\\"application/ld+json\\">`. Search engines use it for rich results — ratings, prices, FAQs, breadcrumbs, events.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cscript type=\\"application/ld+json\\">\\n{\\n  \\"@context\\": \\"https://schema.org\\",\\n  \\"@type\\": \\"Product\\",\\n  \\"name\\": \\"Trail Runner 3\\",\\n  \\"offers\\": { \\"@type\\": \\"Offer\\", \\"price\\": \\"129.00\\", \\"priceCurrency\\": \\"USD\\" },\\n  \\"aggregateRating\\": { \\"@type\\": \\"AggregateRating\\", \\"ratingValue\\": \\"4.6\\", \\"reviewCount\\": \\"212\\" }\\n}\\n\\u003c/script>\\n```\\n\\n**Watch out.** Structured data must match visible content. Marking up reviews or prices that users can\'t see violates search guidelines and can get rich results removed."},{"id":"html-questions-ebook-uvh4y7","book":"HTML","part":"Part 8 — SEO and Metadata","question":"How do you handle a multilingual site?","prompt":"","answer":"**Short answer.** Set `lang` on `\\u003chtml>`, use separate URLs per language, link versions together with `hreflang` alternates, and set `dir=\\"rtl\\"` for right-to-left languages.\\n\\n**Explanation.**\\n\\n```html\\n\\u003chtml lang=\\"ar\\" dir=\\"rtl\\">\\n\\u003chead>\\n  \\u003clink rel=\\"alternate\\" hreflang=\\"en\\" href=\\"https://acme.com/en/pricing\\">\\n  \\u003clink rel=\\"alternate\\" hreflang=\\"ar\\" href=\\"https://acme.com/ar/pricing\\">\\n  \\u003clink rel=\\"alternate\\" hreflang=\\"x-default\\" href=\\"https://acme.com/pricing\\">\\n\\u003c/head>\\n```\\n\\nUse CSS logical properties (`margin-inline-start` instead of `margin-left`) so layouts flip correctly for RTL.\\n\\n**Watch out.** `hreflang` annotations must be reciprocal — every version must list all the others, including itself — or search engines ignore them."},{"id":"html-questions-ebook-1t6mlrs","book":"HTML","part":"Part 9 — Security","question":"Why use `rel=\\"noopener noreferrer\\"` on external links?","prompt":"","answer":"**Short answer.** A page opened with `target=\\"_blank\\"` used to get a `window.opener` reference to your page and could redirect it to a phishing page (\\"reverse tabnabbing\\"). `noopener` removes that reference; `noreferrer` also hides the `Referer` header.\\n\\n**Explanation.**\\n\\n```html\\n\\u003ca href=\\"https://external.example\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\">Partner site\\u003c/a>\\n```\\n\\nModern browsers now apply `noopener` by default for `target=\\"_blank\\"`, but adding it explicitly still matters for older browsers and makes intent clear.\\n\\n**Watch out.** `noreferrer` breaks referral analytics for the destination site. Use only `noopener` if partners need to see where traffic came from — or set a `referrerpolicy`."},{"id":"html-questions-ebook-1wkesj4","book":"HTML","part":"Part 9 — Security","question":"How do you sandbox an `\\u003ciframe>`?","prompt":"","answer":"**Short answer.** The `sandbox` attribute applies maximum restrictions — no scripts, no forms, no popups, unique origin — and you add back only what\'s needed with tokens like `allow-scripts` or `allow-forms`. The `allow` attribute controls feature access (camera, geolocation, fullscreen).\\n\\n**Explanation.**\\n\\n```html\\n\\u003ciframe src=\\"https://widgets.example.com/embed\\"\\n        sandbox=\\"allow-scripts allow-popups\\"\\n        allow=\\"fullscreen\\"\\n        referrerpolicy=\\"no-referrer\\"\\n        loading=\\"lazy\\"\\n        title=\\"Pricing calculator\\">\\u003c/iframe>\\n```\\n\\nTo stop *your* page being framed by others (clickjacking), send `Content-Security-Policy: frame-ancestors \'self\'` (or the older `X-Frame-Options: DENY`).\\n\\n**Watch out.** `allow-scripts` together with `allow-same-origin` on same-origin content lets the framed page remove its own sandbox. Never combine them for untrusted content. Every iframe also needs a `title` for accessibility."},{"id":"html-questions-ebook-off5i4","book":"HTML","part":"Part 9 — Security","question":"Where does XSS enter through HTML?","prompt":"","answer":"**Short answer.** Anywhere untrusted data is inserted as markup rather than text: `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`, `javascript:` URLs, inline event handler attributes, and unescaped server templates.\\n\\n**Explanation.**\\n\\n```js\\nel.innerHTML = userComment;          // dangerous — \\u003cimg src=x onerror=alert(1)> runs\\nel.textContent = userComment;        // safe — treated as text\\n\\nel.setHTML(userComment);             // Sanitizer API: parses and strips unsafe content\\nel.innerHTML = DOMPurify.sanitize(userComment);  // library fallback\\n```\\n\\nDefenses in depth:\\n\\n- Escape output by context (HTML body, attribute, URL, JS).\\n- A Content Security Policy that blocks inline scripts.\\n- Trusted Types to make dangerous sinks reject raw strings.\\n- Validate URL schemes (`https:` only) before putting user data in `href`/`src`.\\n\\n**Watch out.** `sandbox` and CSP are mitigations, not substitutes for escaping. And an HTML `\\u003cmeta http-equiv=\\"Content-Security-Policy\\">` can\'t set `frame-ancestors` or reporting — set CSP as an HTTP header when you can."},{"id":"html-questions-ebook-h3mrom","book":"HTML","part":"Part 9 — Security","question":"What is Subresource Integrity (SRI)?","prompt":"","answer":"**Short answer.** An `integrity` attribute with a hash of the expected file. If a CDN serves a modified script or stylesheet, the hash won\'t match and the browser refuses to run it.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cscript src=\\"https://cdn.example.com/lib@4.2.0/lib.min.js\\"\\n        integrity=\\"sha384-oqVuAfXRKap7fdgcCY5uykM6+R9GqQ8K/uxy9rx7HNQlGYl1kPzQho1wx4JwY8wC\\"\\n        crossorigin=\\"anonymous\\">\\u003c/script>\\n```\\n\\n**Watch out.** SRI only works with version-pinned URLs. A \\"latest\\" URL changes content on every release and breaks the hash — which is the point: you shouldn\'t load unpinned third-party code."},{"id":"html-questions-ebook-wcq9vb","book":"HTML","part":"Part 10 — How Browsers Parse HTML","question":"Why doesn\'t invalid HTML throw an error?","prompt":"","answer":"**Short answer.** The HTML parsing algorithm is specified to recover from errors in a defined way, so every browser builds the same DOM from the same broken markup. Missing end tags are inferred, misnested tags are restructured, and unknown elements become `HTMLUnknownElement`.\\n\\n**Explanation.**\\n\\n```html\\n\\u003cp>One\\n\\u003cp>Two\\n\\u003c!-- Parsed as two separate \\u003cp> elements: the second \\u003cp> implicitly closes the first -->\\n\\n\\u003ctable>\\u003cdiv>oops\\u003c/div>\\u003ctr>\\u003ctd>cell\\u003c/td>\\u003c/tr>\\u003c/table>\\n\\u003c!-- The \\u003cdiv> is \\"foster-parented\\" — moved before the \\u003ctable> in the DOM -->\\n```\\n\\n**Watch out.** \\"It renders fine\\" doesn\'t mean the DOM matches your source. Check the Elements panel, not View Source — they can differ dramatically, and frameworks that hydrate expect them to match."},{"id":"html-questions-ebook-t73vzw","book":"HTML","part":"Part 10 — How Browsers Parse HTML","question":"What\'s the difference between HTML source and the DOM?","prompt":"","answer":"**Short answer.** HTML is text sent over the network. The DOM is the live object tree the browser builds from it — then modified by the parser\'s error recovery, by JavaScript, and by browser extensions.\\n\\n**Explanation.** The DOM is what CSS selectors match, what `querySelector` searches, what screen readers read (via the accessibility tree), and what you see in DevTools. View Source shows only the original text.\\n\\nRelated trees:\\n\\n| Tree | Built from | Used for |\\n|---|---|---|\\n| DOM | HTML + scripts | Scripting, selectors |\\n| CSSOM | Stylesheets | Computing styles |\\n| Render tree | DOM + CSSOM (visible nodes only) | Layout and paint |\\n| Accessibility tree | DOM + ARIA + computed roles/names | Assistive technology |\\n\\n**Watch out.** Elements with `display: none` are in the DOM but not in the render tree or the accessibility tree. `visibility: hidden` elements take up space but are hidden from screen readers; `opacity: 0` elements are still read by screen readers and still clickable."},{"id":"html-questions-ebook-olnmdy","book":"HTML","part":"Part 10 — How Browsers Parse HTML","question":"When do `DOMContentLoaded` and `load` fire?","prompt":"","answer":"**Short answer.** `DOMContentLoaded` fires when the HTML is fully parsed and deferred scripts have run — stylesheets and images may still be loading. `load` fires when everything, including images, iframes, and stylesheets, has finished.\\n\\n**Explanation.**\\n\\n```js\\ndocument.addEventListener(\'DOMContentLoaded\', () => { /* DOM ready, start the app */ });\\nwindow.addEventListener(\'load\', () => { /* all resources loaded */ });\\n```\\n\\nPage lifecycle events beyond these: `pageshow`/`pagehide` (fire on bfcache restores too), and `visibilitychange` (tab hidden or shown — the reliable place to send analytics before the user leaves).\\n\\n**Watch out.** Don\'t use `unload` or `beforeunload` for analytics — they\'re unreliable on mobile and `unload` blocks bfcache. Use `visibilitychange` with `navigator.sendBeacon()`."},{"id":"html-questions-ebook-1ckjwor","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"What\'s wrong with this markup?","prompt":"```html\\n\\u003cp>\\n  \\u003cdiv class=\\"card\\">Hello\\u003c/div>\\n\\u003c/p>\\n```","answer":"`\\u003cp>` can only contain phrasing content. The parser closes the `\\u003cp>` when it sees `\\u003cdiv>`, producing an empty `\\u003cp>`, the `\\u003cdiv>`, then a stray `\\u003c/p>` that creates another empty `\\u003cp>`. Use a `\\u003cdiv>` wrapper, or replace the inner `\\u003cdiv>` with a `\\u003cspan>`."},{"id":"html-questions-ebook-1chfnq1","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"Why doesn\'t this \\"button\\" work for keyboard users?","prompt":"```html\\n\\u003cdiv class=\\"btn\\" onclick=\\"checkout()\\">Checkout\\u003c/div>\\n```","answer":"A `\\u003cdiv>` isn\'t focusable, doesn\'t respond to Enter or Space, and isn\'t announced as a button. Replace it with `\\u003cbutton type=\\"button\\" onclick=\\"checkout()\\">Checkout\\u003c/button>`."},{"id":"html-questions-ebook-dotfkq","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"Why does clicking \\"Add item\\" reload the page?","prompt":"```html\\n\\u003cform action=\\"/order\\">\\n  \\u003cinput name=\\"item\\">\\n  \\u003cbutton onclick=\\"addRow()\\">Add item\\u003c/button>\\n  \\u003cbutton>Place order\\u003c/button>\\n\\u003c/form>\\n```","answer":"A `\\u003cbutton>` inside a form defaults to `type=\\"submit\\"`, so \\"Add item\\" submits the form. Set `type=\\"button\\"` on it."},{"id":"html-questions-ebook-1pf4nhn","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"What\'s wrong with these images?","prompt":"```html\\n\\u003cimg src=\\"hero.jpg\\" loading=\\"lazy\\">\\n\\u003cimg src=\\"spacer.gif\\">\\n```","answer":"The hero is lazy-loaded (hurts LCP), has no `width`/`height` (causes layout shift), and has no `alt`. The spacer has no `alt` — screen readers may read the file name; give it `alt=\\"\\"`, or better, remove it and use CSS spacing."},{"id":"html-questions-ebook-1iyjkd7","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"Why is this a security issue?","prompt":"```html\\n\\u003ca href=\\"https://partner.example\\" target=\\"_blank\\">Partner\\u003c/a>\\n\\u003cdiv id=\\"bio\\">\\u003c/div>\\n\\u003cscript>bio.innerHTML = new URLSearchParams(location.search).get(\'bio\');\\u003c/script>\\n```","answer":"The `innerHTML` line is reflected DOM XSS — `?bio=\\u003cimg src=x onerror=alert(document.cookie)>` runs script. Use `textContent`. The link should also carry `rel=\\"noopener\\"` for older browsers."},{"id":"html-questions-ebook-acvuq3","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"Why is the disabled field missing from the submitted data?","prompt":"```html\\n\\u003cform method=\\"post\\">\\n  \\u003cinput name=\\"plan\\" value=\\"pro\\" disabled>\\n  \\u003cbutton>Continue\\u003c/button>\\n\\u003c/form>\\n```","answer":"Disabled controls are never submitted. Use `readonly` (for text-like inputs) if the value should be sent but not edited, or a `type=\\"hidden\\"` input alongside the visible disabled one."},{"id":"html-questions-ebook-11dcl6o","book":"HTML","part":"Part 11 — Rapid-Fire and Markup Puzzles","question":"Quick definitions","prompt":"","answer":"| Term | One line |\\n|---|---|\\n| **DOCTYPE** | Declaration that triggers standards mode |\\n| **Void element** | Element with no content and no end tag (`\\u003cimg>`, `\\u003cinput>`) |\\n| **Semantic HTML** | Choosing elements by meaning, not appearance |\\n| **Landmark** | Region role (`main`, `nav`, …) screen-reader users can jump between |\\n| **Accessible name** | What assistive technology announces for an element |\\n| **ARIA** | Attributes that adjust the accessibility tree — no behavior |\\n| **Live region** | Element whose changes are announced without moving focus |\\n| **`srcset` / `sizes`** | Candidate images and their display width for responsive loading |\\n| **`defer`** | Download in parallel, run after parsing, in order |\\n| **`async`** | Download in parallel, run as soon as ready, in any order |\\n| **Critical rendering path** | DOM + CSSOM → render tree → layout → paint |\\n| **Top layer** | Layer above all z-index, used by `\\u003cdialog>` and popovers |\\n| **`inert`** | Makes a subtree non-interactive and hidden from assistive tech |\\n| **Canonical URL** | The preferred URL for duplicate content |\\n| **SRI** | Hash check that blocks tampered third-party files |\\n| **bfcache** | Browser cache of full pages for instant back/forward |"},{"id":"javascript-explained-ebook-1w8aqo4","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What are the data types in JavaScript?","prompt":"","answer":"**Short answer:** Seven primitives — `string`, `number`, `bigint`, `boolean`, `undefined`, `symbol`, `null` — plus one non-primitive type, `object` (which includes arrays, functions, dates, maps, etc.).\\n\\n**Explanation**\\n\\nPrimitives are immutable and compared by value. Objects are mutable and compared by reference.\\n\\n```js\\nlet a = \\"hi\\";\\na[0] = \\"H\\";\\nconsole.log(a); // \\"hi\\"  — strings can\'t be mutated\\n\\nlet obj1 = { x: 1 };\\nlet obj2 = { x: 1 };\\nconsole.log(obj1 === obj2); // false — two different references\\n```\\n\\nThe one famous wart:\\n\\n```js\\ntypeof null; // \\"object\\"\\n```\\n\\nThis is a bug from 1995 that can never be fixed without breaking the web. `null` is a primitive despite what `typeof` says. To test for it, use `value === null`.\\n\\n> **Where you\'ll hit this**\\n> Parsing an API response. A JSON payload gives you `{ \\"discount\\": null, \\"coupon\\": undefined }` — except `undefined` never survives JSON, so the field is simply absent. Knowing that `typeof null === \\"object\\"` is why `typeof res.discount === \\"object\\"` passes and your \\"is this a nested object?\\" check silently accepts nulls and crashes one line later."},{"id":"javascript-explained-ebook-1ixn47c","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What\'s the difference between `null` and `undefined`?","prompt":"","answer":"**Short answer:** `undefined` means \\"no value has been assigned yet\\" — it\'s the language\'s default. `null` means \\"intentionally empty\\" — it\'s a value *you* assign.\\n\\n**Explanation**\\n\\n```js\\nlet x;\\nconsole.log(x); // undefined — JS gave it this\\n\\nlet y = null;   // you chose this\\n```\\n\\nYou get `undefined` from: uninitialised variables, missing function arguments, missing object properties, and functions with no `return`.\\n\\nThey\'re loosely equal but not strictly equal:\\n\\n```js\\nnull == undefined;  // true\\nnull === undefined; // false\\ntypeof undefined;   // \\"undefined\\"\\ntypeof null;        // \\"object\\"\\n```\\n\\n**Practical rule:** never assign `undefined` manually. Use `null` when you mean \\"deliberately nothing\\".\\n\\n> **Where you\'ll hit this**\\n> Form state. An untouched field is `undefined` (never rendered, never typed in). A field the user actively cleared is `null` or `\\"\\"`. Your PATCH request needs that distinction: send `null` to clear a column in the database, omit the key entirely to leave it unchanged. Collapsing the two is how users lose data they didn\'t mean to."},{"id":"javascript-explained-ebook-gd3v9q","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"`==` vs `===` — what actually happens?","prompt":"","answer":"**Short answer:** `===` compares type and value with no conversion. `==` converts operands to a common type first, then compares.\\n\\n**Explanation**\\n\\nThe coercion rules for `==` are specific:\\n\\n```js\\n1 == \\"1\\";        // true  — string converted to number\\n0 == false;      // true  — boolean converted to number\\n\\"\\" == 0;         // true\\nnull == 0;       // false — null only equals undefined\\nnull == undefined; // true\\nNaN == NaN;      // false — NaN equals nothing, including itself\\n[] == false;     // true  — [] → \\"\\" → 0, false → 0\\n[1] == 1;        // true  — [1] → \\"1\\" → 1\\n```\\n\\n`[] == false` being `true` is the standard example of why teams ban `==`.\\n\\n**Use `===` everywhere.** The single legitimate exception is `x == null`, which is a compact check for \\"null or undefined\\":\\n\\n```js\\nif (value == null) { /* catches both null and undefined */ }\\n```\\n\\n> **Where you\'ll hit this**\\n> A search filter with `if (filters.status == 0)`. A status of `\\"0\\"` from a query string passes, `false` passes, and `\\"\\"` passes. On an admin dashboard where \\"0\\" means Draft, that\'s the difference between showing drafts and showing everything."},{"id":"javascript-explained-ebook-1vm6qc1","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What is type coercion? Explain implicit vs explicit.","prompt":"","answer":"**Short answer:** Coercion is JavaScript converting a value from one type to another. Explicit coercion is you calling `Number()`, `String()`, `Boolean()`. Implicit is the engine doing it silently inside an operation.\\n\\n**Explanation**\\n\\n```js\\n// Explicit\\nNumber(\\"42\\");    // 42\\nString(42);      // \\"42\\"\\nBoolean(0);      // false\\n\\n// Implicit\\n\\"5\\" - 2;   // 3   — minus only works on numbers, so \\"5\\" → 5\\n\\"5\\" + 2;   // \\"52\\" — plus prefers string concatenation if either side is a string\\ntrue + 1;  // 2    — true → 1\\n[] + {};   // \\"[object Object]\\"\\n```\\n\\nThe `+` operator is the troublemaker: it\'s both addition and concatenation. If **either** operand is a string, it concatenates. Every other arithmetic operator converts to number.\\n\\n> **Where you\'ll hit this**\\n> Query params and form inputs are always strings. `page + 1` gives `\\"11\\"` instead of `12` when `page` came from `?page=1`. Every off-by-a-concatenation bug in pagination is this. Coerce at the boundary: `const page = Number(params.page) || 1`."},{"id":"javascript-explained-ebook-19b9rsg","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What are truthy and falsy values?","prompt":"","answer":"**Short answer:** There are exactly eight falsy values. Everything else is truthy.\\n\\n**Explanation**\\n\\nThe complete falsy list:\\n\\n```js\\nfalse\\n0\\n-0\\n0n        // BigInt zero\\n\\"\\"        // empty string\\nnull\\nundefined\\nNaN\\n```\\n\\nEverything else is truthy — including things people expect to be falsy:\\n\\n```js\\nBoolean([]);        // true — empty array is truthy\\nBoolean({});        // true — empty object is truthy\\nBoolean(\\"0\\");       // true — non-empty string\\nBoolean(\\"false\\");   // true\\nBoolean(function(){}); // true\\n```\\n\\nThis is why `if (arr)` never tells you whether an array has items. Use `if (arr.length)`.\\n\\n> **Where you\'ll hit this**\\n> `if (!cart.items)` never fires, because `[]` is truthy — so your \\"your cart is empty\\" message never shows. Same for `if (config)` on `{}`. And on a quantity field, `if (!qty)` treats a legitimate `0` as missing."},{"id":"javascript-explained-ebook-1ljox4u","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What is `NaN` and how do you check for it?","prompt":"","answer":"**Short answer:** `NaN` is the result of a failed numeric operation. It\'s the only value in JavaScript not equal to itself, so you check it with `Number.isNaN()`.\\n\\n**Explanation**\\n\\n```js\\n0 / 0;            // NaN\\nparseInt(\\"abc\\");  // NaN\\nMath.sqrt(-1);    // NaN\\n\\nNaN === NaN;      // false\\n```\\n\\nTwo ways to check, and they differ:\\n\\n```js\\nisNaN(\\"hello\\");        // true  — coerces first, misleading\\nNumber.isNaN(\\"hello\\"); // false — correct: the string isn\'t NaN\\nNumber.isNaN(NaN);     // true\\n```\\n\\nAlways use `Number.isNaN`. The global `isNaN` coerces its argument, so it really means \\"is not a number-ish thing\\", which is a different question.\\n\\n> **Where you\'ll hit this**\\n> A price column with a stray `\\"N/A\\"` in it. `total += Number(row.price)` turns the whole total into `NaN`, and every downstream calculation, chart axis and currency format silently becomes `NaN` too. One bad row poisons the report. Guard with `Number.isNaN` at parse time, not at display time."},{"id":"javascript-explained-ebook-1xu4n85","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"Why does `0.1 + 0.2 !== 0.3`?","prompt":"","answer":"**Short answer:** JavaScript numbers are IEEE-754 64-bit floats. 0.1 and 0.2 have no exact binary representation, so the sum carries a tiny rounding error.\\n\\n**Explanation**\\n\\n```js\\n0.1 + 0.2;              // 0.30000000000000004\\n0.1 + 0.2 === 0.3;      // false\\n```\\n\\nFix it by comparing within a tolerance:\\n\\n```js\\nconst nearlyEqual = (a, b, eps = Number.EPSILON) => Math.abs(a - b) \\u003c eps;\\nnearlyEqual(0.1 + 0.2, 0.3); // true\\n```\\n\\nFor money, never use floats. Store amounts as integers in the smallest unit (paisa, cents) or use a decimal library.\\n\\n> **Where you\'ll hit this**\\n> Invoice totals. `19.99 * 3` gives `59.97000000000001`, and comparing a computed total to a stored one with `===` fails on rows that are actually correct. Store money in paisa/cents as integers, divide only when you render."},{"id":"javascript-explained-ebook-4bps7x","book":"JavaScript","part":"Section 1 — Types, Values and Coercion","question":"What is `BigInt` and when do you need it?","prompt":"","answer":"**Short answer:** `BigInt` represents integers beyond `Number.MAX_SAFE_INTEGER` (2^53 − 1). You need it for large IDs, precise counters, and cryptography.\\n\\n**Explanation**\\n\\n```js\\nNumber.MAX_SAFE_INTEGER;      // 9007199254740991\\n9007199254740991 + 2;         // 9007199254740992  ← wrong\\n\\nconst big = 9007199254740991n;\\nbig + 2n;                     // 9007199254740993n ← correct\\n```\\n\\nYou cannot mix BigInt and Number in arithmetic:\\n\\n```js\\n1n + 1;   // TypeError\\n1n + BigInt(1); // 2n\\n```\\n\\n> **Where you\'ll hit this**\\n> Snowflake IDs from Twitter/Discord, or 64-bit primary keys from a database. `JSON.parse` reads them as Numbers and quietly rounds the last few digits, so you fetch the wrong record. The fix is to keep such IDs as strings end-to-end, or use BigInt with a custom reviver."},{"id":"javascript-explained-ebook-1ph5us6","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"`var`, `let`, and `const` — what\'s the real difference?","prompt":"","answer":"**Short answer:** `var` is function-scoped and hoisted as `undefined`. `let` and `const` are block-scoped and sit in the temporal dead zone until initialised. `const` prevents reassignment, not mutation.\\n\\n**Explanation**\\n\\n| | `var` | `let` | `const` |\\n|---|---|---|---|\\n| Scope | function | block | block |\\n| Hoisted | yes, as `undefined` | yes, but TDZ | yes, but TDZ |\\n| Redeclare in same scope | yes | no | no |\\n| Reassign | yes | yes | no |\\n| On `globalThis` | yes | no | no |\\n\\n```js\\nfunction demo() {\\n  if (true) {\\n    var a = 1;\\n    let b = 2;\\n  }\\n  console.log(a); // 1 — var escaped the block\\n  console.log(b); // ReferenceError\\n}\\n```\\n\\nThe `const` misunderstanding:\\n\\n```js\\nconst user = { name: \\"Ana\\" };\\nuser.name = \\"Bea\\";   // fine — the object is mutable\\nuser = {};           // TypeError — the binding can\'t be reassigned\\n```\\n\\n`const` freezes the *binding*, not the value. For a shallow immutable object use `Object.freeze()`.\\n\\n> **Where you\'ll hit this**\\n> The classic: a table of rows with `var row` inside a loop, where every \\"Edit\\" button ends up editing the last row. Also `const` on a config object that a helper function then mutates — the lint rule passes, the bug ships. `const` is a promise about the variable, not about the data."},{"id":"javascript-explained-ebook-1gr96wj","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"What is hoisting?","prompt":"","answer":"**Short answer:** During compilation, declarations are registered in their scope before any code runs. `var` and function declarations become usable early; `let`/`const`/`class` are registered but unusable until their line executes.\\n\\n**Explanation**\\n\\n```js\\nconsole.log(x);   // undefined — declaration hoisted, assignment not\\nvar x = 5;\\n\\nconsole.log(y);   // ReferenceError: Cannot access \'y\' before initialization\\nlet y = 5;\\n\\ngreet();          // \\"hi\\" — function declarations are fully hoisted\\nfunction greet() { console.log(\\"hi\\"); }\\n\\nspeak();          // TypeError: speak is not a function\\nvar speak = function () {};  // only the var is hoisted, as undefined\\n```\\n\\nNote the two different errors. `ReferenceError` means the binding exists but is in the TDZ. `TypeError` means the binding exists, holds `undefined`, and you tried to call it.\\n\\n> **Where you\'ll hit this**\\n> A utility file where you call `formatDate()` at the top and define it at the bottom — works, because function declarations hoist. Convert it to `const formatDate = () => {}` during a refactor and it throws immediately. That\'s why \\"arrow functions everywhere\\" refactors break in ways that look unrelated."},{"id":"javascript-explained-ebook-kt91lh","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"What is the Temporal Dead Zone?","prompt":"","answer":"**Short answer:** The stretch between entering a scope and the line where a `let`/`const`/`class` binding is initialised. Touching the variable in that window throws.\\n\\n**Explanation**\\n\\n```js\\n{\\n  // TDZ for `n` starts here\\n  console.log(typeof n); // ReferenceError — even typeof throws in the TDZ\\n  let n = 1;             // TDZ ends here\\n  console.log(n);        // 1\\n}\\n```\\n\\nThe TDZ exists so that `const` genuinely means \\"assigned exactly once\\" and so that using a variable before its declaration is a loud error rather than a silent `undefined`.\\n\\n> **Where you\'ll hit this**\\n> Circular imports between modules. Module A imports B, B imports A, and one of them reads an exported `const` before the other has finished evaluating — `ReferenceError: Cannot access \'X\' before initialization`. The TDZ is what turns a silent `undefined` into a loud error pointing at the real problem."},{"id":"javascript-explained-ebook-qfacrz","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"Explain lexical scope and the scope chain.","prompt":"","answer":"**Short answer:** A function\'s scope is determined by where it\'s *written* in the source, not where it\'s called. Lookups walk outward through enclosing scopes until they hit the global scope.\\n\\n**Explanation**\\n\\n```js\\nconst level = \\"global\\";\\n\\nfunction outer() {\\n  const level = \\"outer\\";\\n  function inner() {\\n    console.log(level); // \\"outer\\" — found in the nearest enclosing scope\\n  }\\n  inner();\\n}\\nouter();\\n```\\n\\nEven if `inner` were passed elsewhere and called from a completely different place, it would still print `\\"outer\\"`. That\'s what \\"lexical\\" means — fixed at authoring time.\\n\\n> **Where you\'ll hit this**\\n> A `createLogger(prefix)` factory. Every logger it returns keeps its own `prefix` because of where it was written, not where it\'s called — so the same logger works identically whether it\'s invoked from a route handler, a worker, or a test."},{"id":"javascript-explained-ebook-h9a0tp","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"What is a closure? Give a real use.","prompt":"","answer":"**Short answer:** A closure is a function bundled with the scope it was created in. It keeps that scope alive after the outer function has returned.\\n\\n**Explanation**\\n\\n```js\\nfunction counter() {\\n  let count = 0;              // stays alive\\n  return {\\n    increment: () => ++count,\\n    get value() { return count; }\\n  };\\n}\\n\\nconst c = counter();\\nc.increment();\\nc.increment();\\nconsole.log(c.value); // 2\\nconsole.log(c.count); // undefined — genuinely private\\n```\\n\\nReal uses: private state, function factories, memoisation caches, `once()` wrappers, and every debounce/throttle implementation.\\n\\nThe classic interview trap:\\n\\n```js\\nfor (var i = 0; i \\u003c 3; i++) {\\n  setTimeout(() => console.log(i), 0);\\n}\\n// 3, 3, 3 — one shared `i`, read after the loop ends\\n\\nfor (let i = 0; i \\u003c 3; i++) {\\n  setTimeout(() => console.log(i), 0);\\n}\\n// 0, 1, 2 — `let` creates a fresh binding per iteration\\n```\\n\\n> **Where you\'ll hit this**\\n> Rate limiters, connection pools, and \\"run this only once\\" guards. Also every React hook: `useState` returns a setter that closes over which slot in the component it owns. And the stale-closure bug — an event handler capturing an old `count` — is the same mechanism working against you."},{"id":"javascript-explained-ebook-9sdsd2","book":"JavaScript","part":"Section 2 — Scope, Hoisting and Declarations","question":"What is an IIFE and why was it used?","prompt":"","answer":"**Short answer:** An Immediately Invoked Function Expression runs the moment it\'s defined. Before ES6 modules and `let`, it was the only way to avoid polluting the global scope.\\n\\n**Explanation**\\n\\n```js\\n(function () {\\n  var secret = \\"hidden\\";\\n})();\\nconsole.log(typeof secret); // \\"undefined\\"\\n```\\n\\nThe wrapping parentheses turn the function *declaration* into an *expression*, which can then be called.\\n\\nToday, blocks with `let` and ES modules cover most of what IIFEs were for. You\'ll still see them in bundled library code and in `(async () => { ... })()` when you need `await` at the top level of a non-module script.\\n\\n> **Where you\'ll hit this**\\n> Legacy scripts loaded with `\\u003cscript>` tags where two vendor libraries both define `$`. Also useful today for top-level `await` in a plain script: `(async () => { await init(); })()`."},{"id":"javascript-explained-ebook-1hjeov8","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"How does `this` get its value?","prompt":"","answer":"**Short answer:** For normal functions, `this` is decided at call time by *how* the function is called. Arrow functions have no `this` of their own — they inherit it lexically.\\n\\n**Explanation**\\n\\nFive binding rules, in priority order:\\n\\n```js\\n// 1. new binding\\nfunction Person(n) { this.name = n; }\\nconst p = new Person(\\"Ana\\");   // this = the new object\\n\\n// 2. explicit binding\\nfunction show() { console.log(this.tag); }\\nshow.call({ tag: \\"A\\" });       // this = { tag: \\"A\\" }\\n\\n// 3. method / implicit binding\\nconst obj = { tag: \\"B\\", show };\\nobj.show();                    // this = obj\\n\\n// 4. default binding\\nshow();  // this = globalThis (or undefined in strict mode)\\n\\n// 5. arrow functions — ignore all of the above\\nconst arrow = () => console.log(this);\\n```\\n\\nThe most common bug in real code:\\n\\n```js\\nconst timer = {\\n  seconds: 0,\\n  startBroken() {\\n    setInterval(function () {\\n      this.seconds++;   // `this` is not `timer` here\\n    }, 1000);\\n  },\\n  startFixed() {\\n    setInterval(() => {\\n      this.seconds++;   // arrow inherits `this` from startFixed\\n    }, 1000);\\n  }\\n};\\n```\\n\\n> **Where you\'ll hit this**\\n> A class method passed straight to `addEventListener` or `setTimeout` loses `this` and throws \\"cannot read property of undefined\\". This is the single most common runtime error in class-based components, and the reason `this.handleClick = this.handleClick.bind(this)` filled every old React constructor."},{"id":"javascript-explained-ebook-1h0bobf","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"Arrow functions vs regular functions.","prompt":"","answer":"**Short answer:** Arrows have no own `this`, no `arguments`, no `prototype`, can\'t be called with `new`, and can\'t be generators. They\'re for short callbacks, not for object methods or constructors.\\n\\n**Explanation**\\n\\n```js\\nconst obj = {\\n  name: \\"Ana\\",\\n  regular() { return this.name; },\\n  arrow: () => this?.name\\n};\\nobj.regular(); // \\"Ana\\"\\nobj.arrow();   // undefined — `this` came from the module/global scope\\n```\\n\\nNever use an arrow as an object method that needs `this`, or as a prototype method. Do use them for callbacks inside methods, where lexical `this` is exactly what you want.\\n\\n> **Where you\'ll hit this**\\n> Arrow for the `.map` callback inside a component, regular function for the object method that needs `this`. Get it backwards and either your callback can\'t see the component or your method can\'t see the object. Also: an arrow can\'t be a constructor, so `new` on one throws — worth knowing before you convert a factory function."},{"id":"javascript-explained-ebook-40zg54","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"`call`, `apply`, and `bind` — differences?","prompt":"","answer":"**Short answer:** `call` invokes with a given `this` and comma-separated args. `apply` is the same but takes an array. `bind` doesn\'t invoke — it returns a new permanently bound function.\\n\\n**Explanation**\\n\\n```js\\nfunction intro(greeting, punct) {\\n  return `${greeting}, I\'m ${this.name}${punct}`;\\n}\\nconst user = { name: \\"Ana\\" };\\n\\nintro.call(user, \\"Hi\\", \\"!\\");     // \\"Hi, I\'m Ana!\\"\\nintro.apply(user, [\\"Hi\\", \\"!\\"]);  // same, array form\\nconst bound = intro.bind(user);\\nbound(\\"Hey\\", \\".\\");               // \\"Hey, I\'m Ana.\\"\\n```\\n\\nMemory hook: **c**all = **c**ommas, **a**pply = **a**rray, **b**ind = **b**ound for later.\\n\\n`bind` also supports partial application:\\n\\n```js\\nconst double = ((a, b) => a * b).bind(null, 2);\\ndouble(21); // 42\\n```\\n\\nA bound function cannot be re-bound — the first `bind` wins.\\n\\n> **Where you\'ll hit this**\\n> Borrowing array methods on a NodeList or `arguments`: `Array.prototype.slice.call(nodeList)`. And in event handling, `handler.bind(this, itemId)` gives you a listener that already knows which row it belongs to — no closure or data attribute needed."},{"id":"javascript-explained-ebook-1g9mnz3","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"What is currying?","prompt":"","answer":"**Short answer:** Transforming `f(a, b, c)` into `f(a)(b)(c)` — a chain of single-argument functions.\\n\\n**Explanation**\\n\\n```js\\nconst curry = (fn) =>\\n  function curried(...args) {\\n    return args.length >= fn.length\\n      ? fn.apply(this, args)\\n      : (...rest) => curried.apply(this, [...args, ...rest]);\\n  };\\n\\nconst add = (a, b, c) => a + b + c;\\nconst curriedAdd = curry(add);\\n\\ncurriedAdd(1)(2)(3);   // 6\\ncurriedAdd(1, 2)(3);   // 6\\ncurriedAdd(1)(2, 3);   // 6\\n```\\n\\n`fn.length` is the number of declared parameters, which is how the wrapper knows when it has enough. Currying is useful for building specialised functions from general ones: `const addTax = curriedRate(0.15)`.\\n\\n> **Where you\'ll hit this**\\n> Configured API clients: `const api = request(baseUrl)` then `api(\'/users\')`. Or validation: `const minLength = (n) => (val) => val.length >= n`, letting you build `minLength(8)` once and reuse it across every password field."},{"id":"javascript-explained-ebook-jzb8nv","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"Default, rest, and spread — what\'s the difference?","prompt":"","answer":"**Short answer:** Rest (`...` in a parameter list) collects many values into an array. Spread (`...` in a call or literal) expands one iterable into many values. Same syntax, opposite directions.\\n\\n**Explanation**\\n\\n```js\\n// rest — gathers\\nfunction sum(first, ...others) {\\n  return others.reduce((t, n) => t + n, first);\\n}\\nsum(1, 2, 3, 4); // 10\\n\\n// spread — scatters\\nconst nums = [1, 2, 3];\\nMath.max(...nums);           // 3\\nconst copy = [...nums];      // shallow copy\\nconst merged = { ...a, ...b }; // later keys win\\n```\\n\\nDefaults are evaluated at call time, left to right, and can reference earlier parameters:\\n\\n```js\\nfunction area(w, h = w) { return w * h; }\\narea(5);    // 25\\narea(5, 2); // 10\\n```\\n\\nNote: `undefined` triggers the default, `null` does not.\\n\\n```js\\narea(5, undefined); // 25\\narea(5, null);      // 0\\n```\\n\\n> **Where you\'ll hit this**\\n> `function createUser({ role = \\"viewer\\", ...profile })` — rest collects whatever extra fields the caller sent so you can pass them through untouched, while defaults fill in what\'s missing. Spread is how you build the next state object in Redux or `useState` without mutating the old one."},{"id":"javascript-explained-ebook-xg4yt9","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"What is a pure function?","prompt":"","answer":"**Short answer:** Same input always gives the same output, and it causes no side effects.\\n\\n**Explanation**\\n\\n```js\\n// Pure\\nconst add = (a, b) => a + b;\\n\\n// Impure — mutates its argument\\nconst pushItem = (arr, x) => { arr.push(x); return arr; };\\n\\n// Pure alternative\\nconst withItem = (arr, x) => [...arr, x];\\n\\n// Impure — depends on external state\\nlet rate = 0.15;\\nconst tax = (amt) => amt * rate;\\n```\\n\\nPure functions are trivially testable, cacheable, and safe to reorder or parallelise. React\'s rendering model, Redux reducers, and `Array.map` callbacks all assume purity.\\n\\n> **Where you\'ll hit this**\\n> Redux reducers must be pure or time-travel debugging breaks. React re-renders assume pure render functions. And a pure `calculateTotal(cart)` can be unit-tested with no database, no mocks, and no setup — which is the difference between a test suite you run and one you skip."},{"id":"javascript-explained-ebook-60vgih","book":"JavaScript","part":"Section 3 — Functions and `this`","question":"What is a higher-order function?","prompt":"","answer":"**Short answer:** A function that takes a function as an argument, returns a function, or both.\\n\\n**Explanation**\\n\\n```js\\n// Takes a function\\n[1, 2, 3].map(n => n * 2);\\n\\n// Returns a function\\nconst multiplier = (factor) => (n) => n * factor;\\nconst triple = multiplier(3);\\ntriple(5); // 15\\n\\n// Both\\nconst withLogging = (fn) => (...args) => {\\n  console.log(\\"calling with\\", args);\\n  const result = fn(...args);\\n  console.log(\\"→\\", result);\\n  return result;\\n};\\n```\\n\\n`map`, `filter`, `reduce`, `setTimeout`, `addEventListener`, and every decorator pattern are higher-order functions.\\n\\n> **Where you\'ll hit this**\\n> Middleware. Express\'s `app.use(authenticate)`, a `withRetry(fetchUser)` wrapper, a `requireRole(\\"admin\\")(handler)` guard — all higher-order functions. Every React HOC and every decorator is this pattern."},{"id":"javascript-explained-ebook-6y21re","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"Explain prototypal inheritance.","prompt":"","answer":"**Short answer:** Every object has an internal link to another object — its prototype. When a property isn\'t found on an object, the engine walks up this chain until it finds it or reaches `null`.\\n\\n**Explanation**\\n\\n```js\\nconst animal = {\\n  speak() { return `${this.name} makes a sound`; }\\n};\\n\\nconst dog = Object.create(animal);\\ndog.name = \\"Rex\\";\\n\\ndog.speak();                        // \\"Rex makes a sound\\"\\nObject.getPrototypeOf(dog) === animal; // true\\n```\\n\\nThe chain for a plain array:\\n\\n```\\n[1,2,3] → Array.prototype → Object.prototype → null\\n```\\n\\nThat\'s
