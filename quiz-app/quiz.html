why every array has `.map` (from `Array.prototype`) and `.toString` (from `Object.prototype`).\\n\\nUnlike class-based languages, there is no copying. `dog` doesn\'t own `speak` — it borrows it live from `animal`. Change `animal.speak` and `dog` sees the change immediately.\\n\\n> **Where you\'ll hit this**\\n> Why `[].hasOwnProperty` exists even though you never defined it, and why adding to `Array.prototype` breaks unrelated libraries. Also why a \\"class\\" from an old library still works with `extends` — under the hood it\'s all the same chain."},{"id":"javascript-explained-ebook-bdckjl","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"What does `new` actually do?","prompt":"","answer":"**Short answer:** It creates an empty object, links its prototype to the constructor\'s `.prototype`, calls the constructor with `this` bound to that object, and returns it unless the constructor returns its own object.\\n\\n**Explanation**\\n\\nA faithful reimplementation:\\n\\n```js\\nfunction myNew(Constructor, ...args) {\\n  const obj = Object.create(Constructor.prototype); // steps 1 & 2\\n  const result = Constructor.apply(obj, args);      // step 3\\n  return (result !== null && typeof result === \\"object\\") ? result : obj; // step 4\\n}\\n```\\n\\nThis is why forgetting `new` used to be catastrophic — `this` would leak onto the global object. ES6 `class` constructors throw a `TypeError` if called without `new`, which closes that hole.\\n\\n> **Where you\'ll hit this**\\n> Debugging a factory that sometimes returns `undefined`: the constructor had an early `return` on a validation failure, which returns a primitive, which `new` ignores — so you get a half-built object instead of an error. Knowing the four steps tells you where to look."},{"id":"javascript-explained-ebook-xg5evy","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"Are ES6 classes just syntactic sugar?","prompt":"","answer":"**Short answer:** Mostly, but not entirely. They compile down to prototypes, yet they add real semantics you can\'t replicate with functions.\\n\\n**Explanation**\\n\\n```js\\nclass Animal {\\n  #secret = \\"private\\";              // truly private field\\n  static count = 0;                 // static field\\n\\n  constructor(name) { this.name = name; }\\n  speak() { return `${this.name} speaks`; }\\n  get label() { return `\\u003c${this.name}>`; }\\n  static create(n) { return new Animal(n); }\\n}\\n\\nclass Dog extends Animal {\\n  speak() { return super.speak() + \\" (barks)\\"; }\\n}\\n```\\n\\nWhat classes add beyond sugar:\\n\\n- Always run in strict mode\\n- Not hoisted for use (TDZ applies)\\n- Constructors throw if called without `new`\\n- `#private` fields are inaccessible from outside, even via bracket notation\\n- `super` works properly, including in static methods\\n- `extends` can subclass built-ins like `Array` and `Error` correctly\\n\\n> **Where you\'ll hit this**\\n> Custom error classes (`class ApiError extends Error`) so your catch blocks can branch on type. And `#private` fields for things like an API token that must not leak through `Object.keys`, `JSON.stringify`, or a devtools inspection."},{"id":"javascript-explained-ebook-1bquy5p","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"`__proto__` vs `prototype` — what\'s the difference?","prompt":"","answer":"**Short answer:** `prototype` is a property on constructor *functions*, holding the object that instances will inherit from. `__proto__` is on every *object* and points to its actual prototype.\\n\\n**Explanation**\\n\\n```js\\nfunction Dog() {}\\nconst rex = new Dog();\\n\\nrex.__proto__ === Dog.prototype;   // true\\nDog.prototype.constructor === Dog; // true\\nrex.prototype;                     // undefined — instances don\'t have one\\n```\\n\\nUse the standard accessors rather than `__proto__`, which is legacy:\\n\\n```js\\nObject.getPrototypeOf(rex);\\nObject.setPrototypeOf(rex, someOtherProto); // avoid — deoptimises the engine\\n```\\n\\n> **Where you\'ll hit this**\\n> Reading a stack trace or a devtools inspector, where you see `[[Prototype]]` on the instance and `prototype` on the constructor and need to know which one to patch. Monkey-patching a library method means editing `Lib.prototype.method`, not the instance."},{"id":"javascript-explained-ebook-mtpref","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"Shallow copy vs deep copy — how do you do each?","prompt":"","answer":"**Short answer:** A shallow copy duplicates the top level and shares nested references. A deep copy duplicates everything recursively. Use `structuredClone()` for deep copies in modern environments.\\n\\n**Explanation**\\n\\n```js\\nconst original = { a: 1, nested: { b: 2 } };\\n\\n// Shallow\\nconst shallow = { ...original };\\nshallow.nested.b = 99;\\noriginal.nested.b; // 99 — shared reference\\n\\n// Deep\\nconst deep = structuredClone(original);\\ndeep.nested.b = 42;\\noriginal.nested.b; // unchanged\\n```\\n\\n`JSON.parse(JSON.stringify(obj))` is the old trick and it silently breaks on: `Date` (becomes a string), `undefined` and functions (dropped), `Infinity`/`NaN` (become `null`), `Map`/`Set` (become `{}`), and circular references (throws).\\n\\n`structuredClone` handles Dates, Maps, Sets, RegExp, typed arrays and cycles. It does not clone functions, DOM nodes, or prototype chains.\\n\\n> **Where you\'ll hit this**\\n> Editing a form: you copy the record with `{...record}`, the user edits a nested address field, and hitting Cancel doesn\'t restore anything — because the nested object was shared the whole time. Every \\"cancel doesn\'t work\\" bug in a nested form is a shallow copy."},{"id":"javascript-explained-ebook-nulxge","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"How do you make an object immutable?","prompt":"","answer":"**Short answer:** `Object.freeze()` — but it\'s shallow. Deep immutability requires recursion.\\n\\n**Explanation**\\n\\n```js\\nconst config = Object.freeze({ url: \\"/api\\", opts: { retry: 3 } });\\n\\nconfig.url = \\"x\\";       // silently ignored (throws in strict mode)\\nconfig.opts.retry = 99; // works! nested object isn\'t frozen\\n\\nfunction deepFreeze(obj) {\\n  Object.values(obj).forEach(v => {\\n    if (v && typeof v === \\"object\\") deepFreeze(v);\\n  });\\n  return Object.freeze(obj);\\n}\\n```\\n\\nRelated: `Object.seal()` prevents adding or deleting properties but allows editing existing ones. `Object.preventExtensions()` only blocks additions.\\n\\n> **Where you\'ll hit this**\\n> A frozen config object exported from a module, so no feature can quietly flip a flag at runtime and leave you debugging why staging behaves differently from production. Also useful as a cheap runtime guard around constants that a junior dev might otherwise \\"fix\\"."},{"id":"javascript-explained-ebook-c8b47h","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"What are getters and setters?","prompt":"","answer":"**Short answer:** Accessor properties that look like plain fields but run a function when read or written.\\n\\n**Explanation**\\n\\n```js\\nclass Temperature {\\n  #celsius = 0;\\n\\n  get fahrenheit() { return this.#celsius * 9 / 5 + 32; }\\n  set fahrenheit(f) {\\n    if (typeof f !== \\"number\\") throw new TypeError(\\"number required\\");\\n    this.#celsius = (f - 32) * 5 / 9;\\n  }\\n}\\n\\nconst t = new Temperature();\\nt.fahrenheit = 212;      // calls the setter\\nconsole.log(t.fahrenheit); // 212 — calls the getter\\n```\\n\\nGood for validation, computed values, and lazy loading. Keep them cheap — callers assume property access is fast, so a getter doing a network call is a nasty surprise.\\n\\n> **Where you\'ll hit this**\\n> A model class where `fullName` is derived from `first` and `last`, so templates can read `user.fullName` without knowing it\'s computed. Or a setter that normalises phone numbers to E.164 on assignment, so bad formats never reach the database."},{"id":"javascript-explained-ebook-hshjow","book":"JavaScript","part":"Section 4 — Objects, Prototypes and Classes","question":"`Object.keys` vs `for...in` vs `Object.entries`?","prompt":"","answer":"**Short answer:** `Object.keys` gives own enumerable string keys. `for...in` also walks the prototype chain. `Object.entries` gives `[key, value]` pairs.\\n\\n**Explanation**\\n\\n```js\\nconst parent = { inherited: 1 };\\nconst child = Object.create(parent);\\nchild.own = 2;\\n\\nObject.keys(child);          // [\\"own\\"]\\nObject.entries(child);       // [[\\"own\\", 2]]\\nfor (const k in child) console.log(k); // \\"own\\", then \\"inherited\\"\\n```\\n\\nIf you must use `for...in`, guard it:\\n\\n```js\\nfor (const k in child) {\\n  if (Object.hasOwn(child, k)) { /* ... */ }\\n}\\n```\\n\\n`Object.hasOwn` is the modern replacement for `obj.hasOwnProperty(k)`, which breaks on objects created with `Object.create(null)`.\\n\\n> **Where you\'ll hit this**\\n> Rendering a table from an API object. `Object.entries(row).map(([k, v]) => ...)` builds cells directly. And `for...in` over an object whose prototype was extended by a library is how you end up with a phantom column in your UI."},{"id":"javascript-explained-ebook-1ew7vem","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"`map` vs `forEach` vs `filter` vs `reduce`.","prompt":"","answer":"**Short answer:** `map` transforms and returns a new array of the same length. `forEach` just iterates and returns `undefined`. `filter` returns a subset. `reduce` folds the array into a single value of any shape.\\n\\n**Explanation**\\n\\n```js\\nconst nums = [1, 2, 3, 4];\\n\\nnums.map(n => n * 2);              // [2, 4, 6, 8]\\nnums.filter(n => n % 2 === 0);     // [2, 4]\\nnums.reduce((sum, n) => sum + n, 0); // 10\\nnums.forEach(n => console.log(n)); // undefined\\n```\\n\\n`reduce` is the general one — the others can all be written with it:\\n\\n```js\\nconst map = (arr, fn) => arr.reduce((acc, x) => [...acc, fn(x)], []);\\n```\\n\\nA very common real use — grouping:\\n\\n```js\\nconst users = [\\n  { name: \\"Ana\\", city: \\"Dhaka\\" },\\n  { name: \\"Bea\\", city: \\"Dhaka\\" },\\n  { name: \\"Cy\\",  city: \\"Chittagong\\" }\\n];\\n\\nconst byCity = users.reduce((acc, u) => {\\n  (acc[u.city] ||= []).push(u.name);\\n  return acc;\\n}, {});\\n// { Dhaka: [\\"Ana\\", \\"Bea\\"], Chittagong: [\\"Cy\\"] }\\n```\\n\\nNote: you cannot `break` out of `map`/`forEach`. Use `for...of`, `some`, or `find` when you need early exit.\\n\\n> **Where you\'ll hit this**\\n> A dashboard: `filter` to the selected date range, `map` to chart points, `reduce` to the summary totals — usually all three in one pipeline. The grouping reduce above is exactly how you build a \\"sales by branch\\" widget from a flat API response."},{"id":"javascript-explained-ebook-qn21oz","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"Why does `[10, 9, 1].sort()` give `[1, 10, 9]`?","prompt":"","answer":"**Short answer:** The default sort converts every element to a string and compares UTF-16 code units. `\\"10\\"` sorts before `\\"9\\"`.\\n\\n**Explanation**\\n\\n```js\\n[10, 9, 1].sort();               // [1, 10, 9]\\n[10, 9, 1].sort((a, b) => a - b); // [1, 9, 10]\\n```\\n\\nThe comparator contract: return negative if `a` comes first, positive if `b` comes first, zero to leave the order alone.\\n\\n```js\\n// Numbers ascending\\narr.sort((a, b) => a - b);\\n// Strings, locale-aware\\narr.sort((a, b) => a.localeCompare(b));\\n// Objects by field, then by name\\nusers.sort((a, b) => b.age - a.age || a.name.localeCompare(b.name));\\n```\\n\\nTwo more gotchas: `sort` **mutates** the original array, and since ES2019 it\'s guaranteed stable. Use `toSorted()` for a non-mutating version.\\n\\n> **Where you\'ll hit this**\\n> A leaderboard sorted by score that puts 100 below 9. Or a sorted list that mysteriously reorders itself on re-render — because `sort` mutated the prop array you were handed. `toSorted()` or `[...arr].sort()` fixes both."},{"id":"javascript-explained-ebook-1passvd","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"What are the non-mutating array methods added recently?","prompt":"","answer":"**Short answer:** `toSorted`, `toReversed`, `toSpliced`, and `with` — copy-and-modify versions of the classic mutators.\\n\\n**Explanation**\\n\\n```js\\nconst arr = [3, 1, 2];\\n\\narr.toSorted();      // [1, 2, 3], arr unchanged\\narr.toReversed();    // [2, 1, 3], arr unchanged\\narr.with(0, 99);     // [99, 1, 2], arr unchanged\\narr.toSpliced(1, 1); // [3, 2], arr unchanged\\n```\\n\\nAlso worth knowing:\\n\\n```js\\n[1, [2, [3, [4]]]].flat(2);        // [1, 2, 3, [4]]\\n[1, 2].flatMap(n => [n, n * 10]);  // [1, 10, 2, 20]\\n[1, 2, 3].at(-1);                  // 3 — negative indexing\\n[1, 2, 3].findLast(n => n \\u003c 3);    // 2\\nObject.groupBy(users, u => u.city); // native grouping\\n```\\n\\n> **Where you\'ll hit this**\\n> React and Vue state updates. `setItems(items.with(i, updated))` replaces one row immutably in a single expression, where before you needed a `map` with an index comparison. `Object.groupBy` replaces the grouping reduce for straightforward cases."},{"id":"javascript-explained-ebook-fgmib4","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"`slice` vs `splice`.","prompt":"","answer":"**Short answer:** `slice` copies a section and leaves the original alone. `splice` cuts into the original and changes it.\\n\\n**Explanation**\\n\\n```js\\nconst arr = [1, 2, 3, 4, 5];\\n\\narr.slice(1, 3);   // [2, 3]  — arr is still [1,2,3,4,5]\\narr.splice(1, 2);  // [2, 3]  — arr is now [1, 4, 5]\\n\\n// splice can also insert\\nconst b = [1, 4];\\nb.splice(1, 0, 2, 3); // b → [1, 2, 3, 4]\\n```\\n\\nMemory hook: sp**l**ice has an **l** for \\"alters\\".\\n\\n> **Where you\'ll hit this**\\n> `slice` for pagination (`rows.slice(page * size, (page + 1) * size)`) — never mutates your source data. `splice` for a genuine in-place removal, like dropping an item from a cart array you own. Mixing them up is how a \\"remove one row\\" button deletes rows from the master list."},{"id":"javascript-explained-ebook-1qw65o4","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"How do you deduplicate an array?","prompt":"","answer":"**Short answer:** `[...new Set(arr)]` for primitives. For objects, dedupe by a key using a `Map`.\\n\\n**Explanation**\\n\\n```js\\n[...new Set([1, 2, 2, 3])]; // [1, 2, 3]\\n\\n// Objects — Set won\'t help, references differ\\nconst unique = [...new Map(users.map(u => [u.id, u])).values()];\\n```\\n\\nThe `Map` version keeps the *last* occurrence of each id. Reverse the array first if you want the first.\\n\\n> **Where you\'ll hit this**\\n> Merging results from two API endpoints that overlap, or cleaning a tag input where users type the same tag twice with different casing. The `Map` version is the one you want for records, since two API calls returning the same user produce two different objects."},{"id":"javascript-explained-ebook-o8oyp3","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"What makes something iterable?","prompt":"","answer":"**Short answer:** An object is iterable if it has a `[Symbol.iterator]` method returning an iterator — an object with a `next()` that yields `{ value, done }`.\\n\\n**Explanation**\\n\\n```js\\nconst range = {\\n  from: 1,\\n  to: 3,\\n  [Symbol.iterator]() {\\n    let current = this.from, last = this.to;\\n    return {\\n      next: () => current \\u003c= last\\n        ? { value: current++, done: false }\\n        : { value: undefined, done: true }\\n    };\\n  }\\n};\\n\\n[...range];                       // [1, 2, 3]\\nfor (const n of range) console.log(n); // 1 2 3\\n```\\n\\nIterables work with `for...of`, spread, destructuring, `Array.from`, `Promise.all`, and `new Set()`. Strings, arrays, Maps, Sets and NodeLists are all iterable. Plain objects are **not** — which is why `for...of` on `{}` throws.\\n\\n> **Where you\'ll hit this**\\n> Paginated APIs. Make the client an async iterable and callers write `for await (const user of api.users())` without ever thinking about cursors or page tokens. Also why `Promise.all` accepts a Set, and why spreading a `FileList` from a file input works."},{"id":"javascript-explained-ebook-1bkhhk2","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"`for...of` vs `for...in`.","prompt":"","answer":"**Short answer:** `for...of` iterates **values** of an iterable. `for...in` iterates **keys** of an object, including inherited ones.\\n\\n**Explanation**\\n\\n```js\\nconst arr = [\\"a\\", \\"b\\"];\\narr.extra = \\"x\\";\\n\\nfor (const v of arr) console.log(v);  // \\"a\\", \\"b\\"\\nfor (const k in arr) console.log(k);  // \\"0\\", \\"1\\", \\"extra\\"\\n```\\n\\nRule of thumb: `for...in` for objects, `for...of` for arrays and everything iterable. `for...in` on an array gives you string indices and any stray properties — almost never what you want.\\n\\n> **Where you\'ll hit this**\\n> Iterating `document.querySelectorAll` results, `FormData` entries, or a `Map` of settings — all `for...of`. Reach for `for...in` on an array and you\'ll get string indices, which quietly breaks any arithmetic you do with them."},{"id":"javascript-explained-ebook-o2ootw","book":"JavaScript","part":"Section 5 — Arrays and Iteration","question":"Explain destructuring, including nested and default cases.","prompt":"","answer":"**Short answer:** Syntax for pulling values out of arrays and objects into variables in one statement.\\n\\n**Explanation**\\n\\n```js\\n// Array\\nconst [first, , third = 0, ...rest] = [1, 2];\\n// first = 1, third = 0, rest = []\\n\\n// Object with rename and default\\nconst { name: userName, age = 18, address: { city } = {} } = user;\\n\\n// Swap\\nlet a = 1, b = 2;\\n[a, b] = [b, a];\\n\\n// Function parameters — very common in React\\nfunction Card({ title, items = [], onClick }) { /* ... */ }\\n```\\n\\nThe one that trips people up:\\n\\n```js\\nconst { x } = null; // TypeError — cannot destructure null\\nconst { x } = {};   // fine, x is undefined\\n```\\n\\nGuard with a default: `function f({ x } = {}) {}`.\\n\\n> **Where you\'ll hit this**\\n> Every React component signature, every `const { data, error, isLoading } = useQuery(...)`, and every Node handler that pulls `{ id }` off `req.params`. The nested-default form matters when an API sometimes omits a whole sub-object — `{ address: { city } = {} }` is what stops the page from crashing on incomplete records."},{"id":"javascript-explained-ebook-dbuu1z","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"Explain the event loop.","prompt":"","answer":"**Short answer:** JavaScript runs one call stack. Async work is handed to the host (browser or Node), and when it finishes, the callback is queued. The event loop moves queued callbacks onto the stack whenever the stack is empty — draining all microtasks before taking the next macrotask.\\n\\n**Explanation**\\n\\nThe pieces:\\n\\n- **Call stack** — where synchronous code executes, one frame at a time\\n- **Web APIs / libuv** — timers, network, I/O, handled outside the engine\\n- **Macrotask queue** — `setTimeout`, `setInterval`, I/O, UI events\\n- **Microtask queue** — promise callbacks, `queueMicrotask`, `MutationObserver`\\n- **Event loop** — the scheduler\\n\\nEach tick: run one macrotask → drain the **entire** microtask queue → render (in browsers) → repeat.\\n\\n```js\\nconsole.log(\\"1\\");\\nsetTimeout(() => console.log(\\"2\\"), 0);\\nPromise.resolve().then(() => console.log(\\"3\\"));\\nconsole.log(\\"4\\");\\n\\n// 1, 4, 3, 2\\n```\\n\\n`3` beats `2` because microtasks are drained completely before the next macrotask, regardless of the `0ms` delay.\\n\\nThis is also why an infinite microtask chain freezes the page — the loop never gets to rendering."},{"id":"javascript-explained-ebook-49hfkn","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"What is a Promise and what are its states?","prompt":"","answer":"**Short answer:** An object representing a value that will exist later. It\'s in exactly one of three states: `pending`, `fulfilled`, or `rejected`. Once settled, it never changes.\\n\\n**Explanation**\\n\\n```js\\nconst p = new Promise((resolve, reject) => {\\n  setTimeout(() => resolve(\\"done\\"), 100);\\n});\\n\\np.then(v => console.log(v))\\n .catch(e => console.error(e))\\n .finally(() => console.log(\\"cleanup\\"));\\n```\\n\\nKey behaviours:\\n\\n- `.then` always returns a **new** promise, which is what makes chaining work\\n- Returning a value from `.then` fulfils the next promise with it\\n- Returning a promise from `.then` waits for it to settle first\\n- Throwing inside `.then` rejects the next promise\\n- `.catch(fn)` is just `.then(undefined, fn)`\\n- `.finally` passes the value or error straight through\\n\\n```js\\nPromise.resolve(1)\\n  .then(v => v + 1)          // 2\\n  .then(v => { throw new Error(\\"boom\\"); })\\n  .then(v => console.log(\\"skipped\\"))\\n  .catch(e => e.message)     // \\"boom\\" — recovers\\n  .then(v => console.log(v)); // \\"boom\\"\\n```"},{"id":"javascript-explained-ebook-jnjko5","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"`Promise.all` vs `allSettled` vs `race` vs `any`.","prompt":"","answer":"**Short answer:** `all` fails fast, `allSettled` never rejects, `race` settles on the first result either way, `any` resolves on the first success.\\n\\n**Explanation**\\n\\n```js\\nconst ok = Promise.resolve(\\"ok\\");\\nconst bad = Promise.reject(new Error(\\"bad\\"));\\n\\nPromise.all([ok, bad]);\\n// rejects immediately with the first error\\n\\nPromise.allSettled([ok, bad]);\\n// [{status:\\"fulfilled\\", value:\\"ok\\"}, {status:\\"rejected\\", reason:Error}]\\n\\nPromise.race([ok, bad]);\\n// settles with whichever finishes first — could be a rejection\\n\\nPromise.any([bad, ok]);\\n// \\"ok\\" — ignores rejections; rejects with AggregateError only if all fail\\n```\\n\\nWhen to use which:\\n\\n- `all` — you need every result and any failure means abort\\n- `allSettled` — dashboards, batch jobs, \\"show what loaded\\"\\n- `race` — timeouts (`race([fetchData(), timeout(5000)])`)\\n- `any` — mirror servers, first responder wins\\n\\nImportant with `all`: the other promises don\'t get cancelled on failure, they just get ignored."},{"id":"javascript-explained-ebook-jzweii","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"How does `async/await` relate to promises?","prompt":"","answer":"**Short answer:** `async` functions always return a promise. `await` pauses the function until a promise settles, unwrapping the value or throwing the rejection.\\n\\n**Explanation**\\n\\n```js\\nasync function getUser(id) {\\n  const res = await fetch(`/api/users/${id}`);\\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\\n  return res.json();\\n}\\n// equivalent to a .then chain, but reads top-to-bottom\\n```\\n\\nError handling uses ordinary `try/catch`:\\n\\n```js\\ntry {\\n  const user = await getUser(1);\\n} catch (err) {\\n  console.error(err);\\n} finally {\\n  setLoading(false);\\n}\\n```\\n\\nThe performance mistake everyone makes:\\n\\n```js\\n// Sequential — 3 seconds\\nconst a = await taskA();\\nconst b = await taskB();\\nconst c = await taskC();\\n\\n// Parallel — 1 second\\nconst [a, b, c] = await Promise.all([taskA(), taskB(), taskC()]);\\n```\\n\\nOnly await sequentially when a later call genuinely depends on an earlier result."},{"id":"javascript-explained-ebook-v3xd7p","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"Why doesn\'t `await` work inside `forEach`?","prompt":"","answer":"**Short answer:** `forEach` ignores the promise its callback returns, so nothing waits. Use `for...of` for sequential work or `Promise.all(map(...))` for parallel.\\n\\n**Explanation**\\n\\n```js\\n// Broken — logs \\"done\\" before any user arrives\\nids.forEach(async (id) => { await save(id); });\\nconsole.log(\\"done\\");\\n\\n// Sequential\\nfor (const id of ids) await save(id);\\n\\n// Parallel\\nawait Promise.all(ids.map(id => save(id)));\\n```\\n\\n`forEach`\'s implementation calls the callback and discards the return value — it has no concept of async."},{"id":"javascript-explained-ebook-13g4igy","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"What is callback hell and how did promises solve it?","prompt":"","answer":"**Short answer:** Deeply nested callbacks with duplicated error handling at every level. Promises flattened the nesting into a chain with one error handler.\\n\\n**Explanation**\\n\\n```js\\n// Before\\ngetUser(id, (err, user) => {\\n  if (err) return handle(err);\\n  getOrders(user.id, (err, orders) => {\\n    if (err) return handle(err);\\n    getItems(orders[0].id, (err, items) => {\\n      if (err) return handle(err);\\n      render(items);\\n    });\\n  });\\n});\\n\\n// After\\ngetUser(id)\\n  .then(user => getOrders(user.id))\\n  .then(orders => getItems(orders[0].id))\\n  .then(render)\\n  .catch(handle);\\n\\n// Now\\ntry {\\n  const user = await getUser(id);\\n  const orders = await getOrders(user.id);\\n  render(await getItems(orders[0].id));\\n} catch (e) { handle(e); }\\n```"},{"id":"javascript-explained-ebook-r3medt","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"`setTimeout(fn, 0)` — does it run immediately?","prompt":"","answer":"**Short answer:** No. It runs after the current synchronous code finishes and after all pending microtasks, and browsers clamp nested timeouts to a minimum of about 4ms.\\n\\n**Explanation**\\n\\n```js\\nsetTimeout(() => console.log(\\"timeout\\"), 0);\\nqueueMicrotask(() => console.log(\\"micro\\"));\\nconsole.log(\\"sync\\");\\n\\n// sync, micro, timeout\\n```\\n\\nThe legitimate use is yielding to the browser so it can paint or handle input before you continue with more work."},{"id":"javascript-explained-ebook-13bosyg","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"What are generators and where are they useful?","prompt":"","answer":"**Short answer:** Functions that can pause and resume. Calling one returns an iterator; each `next()` runs until the next `yield`.\\n\\n**Explanation**\\n\\n```js\\nfunction* idGenerator() {\\n  let id = 1;\\n  while (true) yield id++;\\n}\\n\\nconst ids = idGenerator();\\nids.next().value; // 1\\nids.next().value; // 2\\n```\\n\\nTwo-way communication — `yield` also *receives* a value:\\n\\n```js\\nfunction* dialogue() {\\n  const name = yield \\"What\'s your name?\\";\\n  yield `Hello, ${name}`;\\n}\\nconst d = dialogue();\\nd.next().value;        // \\"What\'s your name?\\"\\nd.next(\\"Ana\\").value;   // \\"Hello, Ana\\"\\n```\\n\\nReal uses: infinite sequences without infinite memory, lazy pagination, `redux-saga`, and custom iterables. Async generators (`for await...of`) are excellent for consuming streams:\\n\\n```js\\nasync function* readLines(stream) { /* ... */ }\\nfor await (const line of readLines(s)) process(line);\\n```"},{"id":"javascript-explained-ebook-ut7sa0","book":"JavaScript","part":"Section 6 — Asynchronous JavaScript","question":"How do you cancel an in-flight request?","prompt":"","answer":"**Short answer:** `AbortController` — pass its `signal` to `fetch` and call `abort()`.\\n\\n**Explanation**\\n\\n```js\\nconst controller = new AbortController();\\n\\nfetch(\\"/api/data\\", { signal: controller.signal })\\n  .then(r => r.json())\\n  .catch(err => {\\n    if (err.name === \\"AbortError\\") return; // expected\\n    throw err;\\n  });\\n\\ncontroller.abort();\\n```\\n\\nA timeout built on it:\\n\\n```js\\nconst withTimeout = (url, ms) =>\\n  fetch(url, { signal: AbortSignal.timeout(ms) });\\n```\\n\\nThe same signal works with `addEventListener`, which is the cleanest way to remove many listeners at once."},{"id":"javascript-explained-ebook-znzcim","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"Optional chaining and nullish coalescing.","prompt":"","answer":"**Short answer:** `?.` short-circuits to `undefined` instead of throwing on null/undefined. `??` falls back only for `null` or `undefined`, unlike `||` which falls back for any falsy value.\\n\\n**Explanation**\\n\\n```js\\nuser?.address?.city;      // undefined instead of TypeError\\nuser?.getName?.();        // safe method call\\narr?.[0];                 // safe index\\n\\n// The important difference\\nconst count = 0;\\ncount || 10;   // 10  ← bug: 0 is valid\\ncount ?? 10;   // 0   ← correct\\n\\nconst name = \\"\\";\\nname || \\"Anon\\"; // \\"Anon\\"\\nname ?? \\"Anon\\"; // \\"\\"\\n```\\n\\nUse `??` for defaults whenever `0`, `\\"\\"` or `false` are legitimate values. Logical assignment operators follow the same rules:\\n\\n```js\\nconfig.retries ??= 3;   // only if null/undefined\\ncounts[key] ||= 0;\\nflags.enabled &&= isValid;\\n```"},{"id":"javascript-explained-ebook-e3sn9b","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"`Map` vs plain object. `Set` vs array.","prompt":"","answer":"**Short answer:** `Map` allows any key type, keeps insertion order, has a `.size`, and is faster for frequent additions and removals. `Set` gives O(1) membership tests and automatic uniqueness.\\n\\n**Explanation**\\n\\n```js\\nconst m = new Map();\\nm.set({ id: 1 }, \\"object key\\");\\nm.set(fn, \\"function key\\");\\nm.set(NaN, \\"even NaN works\\");\\nm.size;         // 3\\nm.has(NaN);     // true\\n\\nconst obj = {};\\nobj[{ id: 1 }] = \\"x\\";  // key becomes \\"[object Object]\\" — collision\\n```\\n\\nChoose an object for JSON-shaped records with string keys. Choose a `Map` for a cache, a registry, or anything keyed by objects.\\n\\n```js\\nconst seen = new Set();\\nseen.add(1); seen.add(1);\\nseen.size;      // 1\\nseen.has(1);    // true, O(1) — vs arr.includes which is O(n)\\n```"},{"id":"javascript-explained-ebook-e8omvg","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"What are `WeakMap` and `WeakSet` for?","prompt":"","answer":"**Short answer:** Collections that hold keys weakly, so entries disappear when the key object is garbage collected. They prevent memory leaks in caches and private-data patterns.\\n\\n**Explanation**\\n\\n```js\\nconst cache = new WeakMap();\\n\\nfunction getData(node) {\\n  if (!cache.has(node)) cache.set(node, expensiveComputation(node));\\n  return cache.get(node);\\n}\\n// When the DOM node is removed, its cache entry is freed automatically\\n```\\n\\nRestrictions: keys must be objects, and you cannot iterate or check `.size` — because the contents can change at any moment due to GC.\\n\\nWith a regular `Map`, that cache would keep every node alive forever. That\'s a genuine, common production leak."},{"id":"javascript-explained-ebook-1l1bpm1","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"What are Symbols?","prompt":"","answer":"**Short answer:** Unique, immutable primitives used as collision-proof property keys and as hooks into language behaviour.\\n\\n**Explanation**\\n\\n```js\\nconst id = Symbol(\\"id\\");\\nconst obj = { [id]: 123, name: \\"Ana\\" };\\n\\nObject.keys(obj);      // [\\"name\\"] — symbol keys are skipped\\nJSON.stringify(obj);   // {\\"name\\":\\"Ana\\"}\\nobj[id];               // 123\\n\\nSymbol(\\"a\\") === Symbol(\\"a\\"); // false — always unique\\nSymbol.for(\\"a\\") === Symbol.for(\\"a\\"); // true — global registry\\n```\\n\\nWell-known symbols customise built-in operations:\\n\\n```js\\nclass Collection {\\n  *[Symbol.iterator]() { yield* this.items; }\\n  get [Symbol.toStringTag]() { return \\"Collection\\"; }\\n}\\n```\\n\\nPractical use: attaching metadata to objects you don\'t own, without any risk of clashing with existing or future properties."},{"id":"javascript-explained-ebook-1phafb","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"ES modules vs CommonJS.","prompt":"","answer":"**Short answer:** ESM (`import`/`export`) is static, hoisted, asynchronous and supports tree-shaking. CommonJS (`require`/`module.exports`) is dynamic, synchronous, and evaluated at call time.\\n\\n**Explanation**\\n\\n```js\\n// ESM\\nimport { helper } from \\"./util.js\\";\\nexport default function App() {}\\nconst mod = await import(\\"./heavy.js\\"); // dynamic, code-splitting\\n\\n// CommonJS\\nconst { helper } = require(\\"./util\\");\\nmodule.exports = App;\\n```\\n\\nDifferences that actually bite:\\n\\n- ESM imports are hoisted and read-only *live bindings*; CJS exports are a copied snapshot\\n- ESM is always strict mode\\n- `this` at top level is `undefined` in ESM, `module.exports` in CJS\\n- ESM has top-level `await`; CJS doesn\'t\\n- ESM\'s static structure is what allows bundlers to tree-shake dead code"},{"id":"javascript-explained-ebook-5f07wc","book":"JavaScript","part":"Section 7 — Modern Language Features","question":"What are template literals and tagged templates?","prompt":"","answer":"**Short answer:** Backtick strings with interpolation and multi-line support. A tagged template hands the string parts and values to a function so you can process them.\\n\\n**Explanation**\\n\\n```js\\nconst name = \\"Ana\\";\\nconst msg = `Hello, ${name}!\\nThis spans lines.`;\\n\\n// Tagged\\nfunction safe(strings, ...values) {\\n  return strings.reduce((out, s, i) =>\\n    out + s + (values[i] != null ? escapeHtml(values[i]) : \\"\\"), \\"\\");\\n}\\nconst html = safe`\\u003cp>${userInput}\\u003c/p>`;\\n```\\n\\nTagged templates power `styled-components`, GraphQL `gql`, and SQL escaping libraries."},{"id":"javascript-explained-ebook-zc2wcp","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"Implement debounce.","prompt":"","answer":"**Short answer:** Delay running a function until it has stopped being called for N milliseconds. Use it for search-as-you-type and resize handlers.\\n\\n**Explanation**\\n\\n```js\\nfunction debounce(fn, delay) {\\n  let timer;\\n  function debounced(...args) {\\n    clearTimeout(timer);\\n    timer = setTimeout(() => fn.apply(this, args), delay);\\n  }\\n  debounced.cancel = () => clearTimeout(timer);\\n  return debounced;\\n}\\n\\nconst search = debounce((q) => fetchResults(q), 300);\\n```\\n\\nNote `fn.apply(this, args)` rather than an arrow — that preserves `this` when the debounced function is used as a method or DOM handler."},{"id":"javascript-explained-ebook-15j7x52","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"Implement throttle. How does it differ from debounce?","prompt":"","answer":"**Short answer:** Throttle runs the function at most once every N ms. Debounce waits for silence. Throttle for scroll position; debounce for autocomplete.\\n\\n**Explanation**\\n\\n```js\\nfunction throttle(fn, limit) {\\n  let waiting = false, lastArgs = null;\\n  return function (...args) {\\n    if (waiting) { lastArgs = args; return; }\\n    fn.apply(this, args);\\n    waiting = true;\\n    setTimeout(() => {\\n      waiting = false;\\n      if (lastArgs) { fn.apply(this, lastArgs); lastArgs = null; }\\n    }, limit);\\n  };\\n}\\n```\\n\\nWith rapid calls over one second at a 200ms setting: throttle fires roughly five times, debounce fires once, after the calls stop."},{"id":"javascript-explained-ebook-gahj54","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"Implement memoization.","prompt":"","answer":"**Short answer:** Cache results keyed by arguments so repeated calls skip the work. Only valid for pure functions.\\n\\n**Explanation**\\n\\n```js\\nfunction memoize(fn, keyFn = (...a) => JSON.stringify(a)) {\\n  const cache = new Map();\\n  return function (...args) {\\n    const key = keyFn(...args);\\n    if (cache.has(key)) return cache.get(key);\\n    const result = fn.apply(this, args);\\n    cache.set(key, result);\\n    return result;\\n  };\\n}\\n\\nconst slowFib = (n) => n \\u003c 2 ? n : slowFib(n - 1) + slowFib(n - 2);\\nconst fib = memoize((n) => n \\u003c 2 ? n : fib(n - 1) + fib(n - 2));\\nfib(40); // instant; slowFib(40) takes seconds\\n```\\n\\nWatch out: an unbounded cache is a memory leak. In production, cap the size (LRU) or use a `WeakMap` when the key is an object."},{"id":"javascript-explained-ebook-wu2i58","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"What is event delegation?","prompt":"","answer":"**Short answer:** Attach one listener to a common ancestor and use `event.target` to work out which child was clicked. It scales to any number of children, including ones added later.\\n\\n**Explanation**\\n\\n```js\\ndocument.querySelector(\\"#list\\").addEventListener(\\"click\\", (e) => {\\n  const btn = e.target.closest(\\"[data-action]\\");\\n  if (!btn) return;\\n  handle(btn.dataset.action, btn.dataset.id);\\n});\\n```\\n\\nThis relies on **bubbling** — events travel from the target up through its ancestors. The full cycle is capture (down), target, then bubble (up). Pass `{ capture: true }` to listen on the way down.\\n\\n`e.stopPropagation()` halts the journey; `e.preventDefault()` cancels the browser\'s default action. They\'re independent."},{"id":"javascript-explained-ebook-1uecjfj","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"What causes memory leaks in JavaScript?","prompt":"","answer":"**Short answer:** Anything that keeps a reference alive after it\'s needed — forgotten timers, detached DOM nodes, unremoved listeners, and unbounded caches.\\n\\n**Explanation**\\n\\n```js\\n// 1. Timer never cleared\\nconst id = setInterval(poll, 1000);\\n// fix: clearInterval(id) on teardown\\n\\n// 2. Detached DOM held by a closure\\nlet cached = document.getElementById(\\"big-table\\");\\ndocument.body.removeChild(cached);\\n// The node is gone from the page but not from memory until cached = null\\n\\n// 3. Listener on a long-lived object\\nwindow.addEventListener(\\"resize\\", onResize);\\n// fix: removeEventListener, or use an AbortController signal\\n\\n// 4. Growing cache\\nconst cache = new Map(); // never evicts → use WeakMap or an LRU\\n```\\n\\nIn a component framework, the cleanup function (React\'s `useEffect` return, Vue\'s `onUnmounted`) exists precisely for cases 1–3."},{"id":"javascript-explained-ebook-1oipmzc","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"Explain `try/catch/finally` and custom errors.","prompt":"","answer":"**Short answer:** `try` runs risky code, `catch` handles a thrown value, `finally` always runs. Extend `Error` to create meaningful error types.\\n\\n**Explanation**\\n\\n```js\\nclass ValidationError extends Error {\\n  constructor(field, message) {\\n    super(message);\\n    this.name = \\"ValidationError\\";\\n    this.field = field;\\n  }\\n}\\n\\ntry {\\n  throw new ValidationError(\\"email\\", \\"Invalid format\\");\\n} catch (err) {\\n  if (err instanceof ValidationError) console.log(err.field);\\n  else throw err;   // re-throw what you don\'t understand\\n} finally {\\n  cleanup();        // runs even if you return or throw above\\n}\\n```\\n\\nTwo things to know:\\n\\n- `try/catch` does **not** catch errors thrown inside async callbacks or in a later tick — only what\'s on the current stack\\n- A `return` inside `finally` overrides a `return` in `try`, which is almost always a bug\\n\\nUse the `cause` option to preserve context when wrapping:\\n\\n```js\\nthrow new Error(\\"Failed to load config\\", { cause: originalError });\\n```"},{"id":"javascript-explained-ebook-36eetc","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"What\'s the difference between `Object.assign` and spread?","prompt":"","answer":"**Short answer:** Both do a shallow merge. `Object.assign` mutates its first argument and triggers setters on the target; spread always creates a new object and copies plain values.\\n\\n**Explanation**\\n\\n```js\\nconst target = { a: 1 };\\nObject.assign(target, { b: 2 });  // target is modified\\nconst fresh = { ...target, b: 2 }; // target untouched\\n```\\n\\nPrefer spread for its immutability. Reach for `Object.assign` when you deliberately want to mutate an existing object, such as updating a class instance in place.\\n\\nNeither copies getters as getters — both invoke them and copy the resulting value. `Object.getOwnPropertyDescriptors` plus `Object.defineProperties` is the faithful copy."},{"id":"javascript-explained-ebook-1ojh0y1","book":"JavaScript","part":"Section 8 — Practical Patterns","question":"How does `JSON.stringify` handle unusual values?","prompt":"","answer":"**Short answer:** It drops `undefined`, functions and symbols in objects; converts them to `null` in arrays; calls `toJSON` when present; and throws on circular references and BigInt.\\n\\n**Explanation**\\n\\n```js\\nJSON.stringify({ a: undefined, b: () => {}, c: 1 }); // {\\"c\\":1}\\nJSON.stringify([undefined, () => {}, 1]);            // [null,null,1]\\nJSON.stringify(new Date());        // ISO string via Date.prototype.toJSON\\nJSON.stringify({ n: NaN });        // {\\"n\\":null}\\nJSON.stringify(10n);               // TypeError\\n```\\n\\nThe second and third arguments are underused:\\n\\n```js\\nJSON.stringify(user, [\\"id\\", \\"name\\"], 2);          // whitelist keys + indent\\nJSON.stringify(obj, (k, v) => k === \\"password\\" ? undefined : v);\\n```"},{"id":"javascript-explained-ebook-atvhtq","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconsole.log(typeof typeof 1);\\n```","answer":"**`\\"string\\"`.** The inner `typeof 1` gives `\\"number\\"`, and `typeof \\"number\\"` is `\\"string\\"`."},{"id":"javascript-explained-ebook-1du4ff7","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconst arr = [1, 2, 3];\\narr.length = 0;\\nconsole.log(arr);\\n```","answer":"**`[]`.** Setting `length` lower truncates the array in place. This is a legitimate (if blunt) way to empty an array while keeping the same reference."},{"id":"javascript-explained-ebook-1jppd0c","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconsole.log([...\\"hello\\"]);\\nconsole.log([, , ,].length);\\n```","answer":"**`[\\"h\\",\\"e\\",\\"l\\",\\"l\\",\\"o\\"]`** — strings are iterable.\\n**`3`** — trailing commas create holes; the last one is ignored."},{"id":"javascript-explained-ebook-1fz9djs","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconst obj = { a: 1 };\\nconst copy = obj;\\ncopy.a = 2;\\nconsole.log(obj.a);\\n```","answer":"**`2`.** Objects are assigned by reference. `copy` and `obj` point at the same thing."},{"id":"javascript-explained-ebook-13c6ts7","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nfunction foo() { return this; }\\nconst bar = { foo };\\nconsole.log(foo() === bar.foo());\\n```","answer":"**`false`.** `foo()` uses default binding (`globalThis` or `undefined`); `bar.foo()` uses implicit binding, so `this` is `bar`."},{"id":"javascript-explained-ebook-4ldr56","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nasync function f() {\\n  console.log(\\"A\\");\\n  await null;\\n  console.log(\\"B\\");\\n}\\nf();\\nconsole.log(\\"C\\");\\n```","answer":"**A, C, B.** Everything before the first `await` runs synchronously. `await` — even on a non-promise — schedules the rest as a microtask, so `C` runs first."},{"id":"javascript-explained-ebook-191fhpp","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconsole.log([1, 2, 3] + [4, 5]);\\n```","answer":"**`\\"1,2,34,5\\"`.** `+` has no array behaviour, so both are converted to strings via `join(\\",\\")` and concatenated."},{"id":"javascript-explained-ebook-16qbdft","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nlet a = { x: 1 };\\nlet b = { x: 1 };\\nconst set = new Set([a, b, a]);\\nconsole.log(set.size);\\n```","answer":"**`2`.** `Set` uses SameValueZero, which compares objects by reference. `a` and `b` are different objects."},{"id":"javascript-explained-ebook-e1m5c","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconsole.log(1 \\u003c 2 \\u003c 3);\\nconsole.log(3 > 2 > 1);\\n```","answer":"**`true`, then `false`.** Comparisons are left-associative. `3 > 2` is `true`, then `true > 1` becomes `1 > 1`, which is `false`."},{"id":"javascript-explained-ebook-nbfnu0","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconst obj = {\\n  name: \\"Ana\\",\\n  greet: function () {\\n    const inner = () => `Hi ${this.name}`;\\n    return inner();\\n  }\\n};\\nconsole.log(obj.greet());\\n```","answer":"**`\\"Hi Ana\\"`.** The arrow inherits `this` from `greet`, which was called as a method, so `this` is `obj`. Change `inner` to a regular function and it breaks."},{"id":"javascript-explained-ebook-1xddkxm","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconsole.log(Math.max());\\nconsole.log(Math.min());\\n```","answer":"**`-Infinity` and `Infinity`.** With no arguments, `max` returns the identity for maximum (the smallest possible value) and vice versa. Consistent, if surprising."},{"id":"javascript-explained-ebook-1itexri","book":"JavaScript","part":"Section 9 — Output Prediction Puzzles","question":"What does this code output?","prompt":"```js\\nconst p = Promise.resolve(1);\\np.then(v => { console.log(v); return v + 1; });\\np.then(v => console.log(v));\\n```","answer":"**`1`, then `1`.** Both handlers attach to the *same* promise, so both receive `1`. Chaining (`p.then().then()`) is what passes values forward."},{"id":"nestjs-interview-guide-1soji98","book":"NestJS","part":"Part 1 — Foundations","question":"What is NestJS and what problem does it solve?","prompt":"","answer":"**Short answer**\\nNestJS is a Node.js server-side framework built on TypeScript that provides an opinionated, modular architecture out of the box. It solves the \\"empty Express project\\" problem — Express gives you routing and nothing else, so every team invents its own folder structure, DI approach, and testing strategy. Nest standardises that.\\n\\n**Full explanation**\\n\\nExpress and Fastify are HTTP libraries. They\'re deliberately unopinionated: no prescribed structure, no dependency injection, no built-in validation layer, no first-class testing story. That\'s fine for a 300-line service. It falls apart on a 50-file codebase with six developers, because architectural decisions get made ad hoc and inconsistently.\\n\\nNest sits **on top of** Express (by default) or Fastify (optional adapter) and adds:\\n\\n- A **module system** for organising features into cohesive, encapsulated units.\\n- A **dependency injection container**, so classes declare what they need instead of importing concrete instances.\\n- **Decorator-based metadata** (`@Controller`, `@Get`, `@Injectable`) that keeps routing declarations next to the code they route to.\\n- A defined **request lifecycle** with standard extension points — middleware, guards, interceptors, pipes, filters.\\n- Built-in support for testing, config, validation, OpenAPI, microservices, GraphQL, and WebSockets.\\n\\nThe design is openly borrowed from Angular, which is why it feels familiar to front-end developers and slightly alien to people coming straight from Express.\\n\\nThe trade-off is worth naming in an interview: Nest costs you a learning curve and some boilerplate, and it adds a layer of abstraction over the underlying HTTP library. You accept that in exchange for consistency across a team and across time.\\n\\n**Interviewer\'s angle**\\nThey want to hear that you chose Nest for a reason, not because it was trending. A strong follow-up is \\"when would you *not* use Nest?\\" — good answers: a tiny single-purpose microservice, a serverless function with cold-start sensitivity, or a team with no TypeScript experience and a two-week deadline."},{"id":"nestjs-interview-guide-1rkm9jo","book":"NestJS","part":"Part 1 — Foundations","question":"What are the three core building blocks of a Nest application?","prompt":"","answer":"**Short answer**\\nModules, controllers, and providers.\\n\\n**Full explanation**\\n\\n- **Module** — an organisational unit. It declares which controllers it exposes, which providers it instantiates, what it imports from other modules, and what it exports for others to use. Every app has at least a root `AppModule`.\\n- **Controller** — handles incoming requests. It maps routes to handler methods, extracts data from the request, and returns a response. Controllers should be thin: parse, delegate, return.\\n- **Provider** — anything that can be injected. Usually a service holding business logic, but also repositories, factories, helpers, and third-party clients.\\n\\nThe mental model: a **module** is the box, **controllers** are the doors into the box, **providers** are the machinery inside it.\\n\\n```ts\\n// users.service.ts\\n@Injectable()\\nexport class UsersService {\\n  private readonly users: User[] = [];\\n  findAll(): User[] {\\n    return this.users;\\n  }\\n}\\n\\n// users.controller.ts\\n@Controller(\'users\')\\nexport class UsersController {\\n  constructor(private readonly usersService: UsersService) {}\\n\\n  @Get()\\n  findAll(): User[] {\\n    return this.usersService.findAll();\\n  }\\n}\\n\\n// users.module.ts\\n@Module({\\n  controllers: [UsersController],\\n  providers: [UsersService],\\n  exports: [UsersService],\\n})\\nexport class UsersModule {}\\n```\\n\\n**Interviewer\'s angle**\\nThey\'ll immediately push on the separation: \\"why not put the database query in the controller?\\" Answer: testability (you can unit-test the service without an HTTP layer), reuse (a cron job or a message handler can call the same service), and single responsibility."},{"id":"nestjs-interview-guide-zlptvy","book":"NestJS","part":"Part 1 — Foundations","question":"What is a decorator, and how does NestJS use them?","prompt":"","answer":"**Short answer**\\nA decorator is a TypeScript function that attaches metadata to a class, method, property, or parameter. Nest reads that metadata at bootstrap time to wire the application together.\\n\\n**Full explanation**\\n\\nDecorators aren\'t magic — they\'re functions that run once when the class is defined. `@Controller(\'users\')` stores the string `\'users\'` in a metadata registry keyed to that class, using `Reflect.defineMetadata` from the `reflect-metadata` package. At startup, Nest scans every class you registered, reads the metadata, and builds the routing table and DI graph.\\n\\nThat\'s why `reflect-metadata` is imported at the top of `main.ts` in older setups, and why `emitDecoratorMetadata` and `experimentalDecorators` must be `true` in `tsconfig.json`. Without `emitDecoratorMetadata`, TypeScript won\'t emit constructor parameter types, and DI by type resolution breaks.\\n\\nCategories of Nest decorator:\\n\\n| Category | Examples |\\n|---|---|\\n| Class | `@Module`, `@Controller`, `@Injectable`, `@Catch` |\\n| Method | `@Get`, `@Post`, `@UseGuards`, `@HttpCode` |\\n| Parameter | `@Body`, `@Param`, `@Query`, `@Req`, `@Headers` |\\n| Property | `@InjectRepository`, `@IsString` (class-validator) |\\n\\n**Interviewer\'s angle**\\nThe follow-up is usually \\"write a custom decorator.\\" Have `@CurrentUser()` ready — it appears in Q34."},{"id":"nestjs-interview-guide-ljjxb0","book":"NestJS","part":"Part 1 — Foundations","question":"Explain dependency injection in NestJS.","prompt":"","answer":"**Short answer**\\nInstead of a class creating its own dependencies, it declares them as constructor parameters and Nest\'s IoC container supplies them at runtime. Nest resolves them by type, using metadata TypeScript emits about constructor parameters.\\n\\n**Full explanation**\\n\\nCompare the two styles:\\n\\n```ts\\n// Without DI — tightly coupled\\nexport class UsersService {\\n  private db = new PostgresConnection(\'localhost:5432\'); // hardcoded\\n}\\n\\n// With DI — the dependency is declared, not constructed\\n@Injectable()\\nexport class UsersService {\\n  constructor(private readonly db: DatabaseConnection) {}\\n}\\n```\\n\\nThe second version can be tested by passing a mock `DatabaseConnection`, and swapped for a different implementation without touching the class.\\n\\nThe mechanics:\\n\\n1. `@Injectable()` marks the class so Nest emits and stores its constructor parameter types.\\n2. You list the class in a module\'s `providers` array. This registers it in that module\'s injector.\\n3. When something needs `UsersService`, Nest looks up the token (the class itself, by default), finds or creates the instance, and injects it.\\n4. By default, instances are **singletons** scoped to the application — the same instance is shared everywhere.\\n\\nFor non-class dependencies (a config object, a string), the type can\'t be used as a token, so you use a string or symbol token with `@Inject`:\\n\\n```ts\\n@Injectable()\\nexport class MailService {\\n  constructor(@Inject(\'MAIL_CONFIG\') private config: MailConfig) {}\\n}\\n```\\n\\n**Interviewer\'s angle**\\nCommon trap: \\"what happens if you forget to add a service to `providers`?\\" Answer: Nest throws a `Nest can\'t resolve dependencies of the X` error at bootstrap, listing the unresolved parameter index. That error message is worth recognising on sight — the `?` in the argument list marks the parameter it couldn\'t resolve."},{"id":"nestjs-interview-guide-1ipgxyg","book":"NestJS","part":"Part 1 — Foundations","question":"What is the purpose of `main.ts`?","prompt":"","answer":"**Short answer**\\nIt\'s the entry point. It creates the Nest application instance from the root module, applies global configuration, and starts listening.\\n\\n**Full explanation**\\n\\n```ts\\nimport { NestFactory } from \'@nestjs/core\';\\nimport { ValidationPipe } from \'@nestjs/common\';\\nimport { AppModule } from \'./app.module\';\\n\\nasync function bootstrap() {\\n  const app = await NestFactory.create(AppModule);\\n\\n  app.setGlobalPrefix(\'api/v1\');\\n  app.useGlobalPipes(new ValidationPipe({ whitelist: true, transform: true }));\\n  app.enableCors({ origin: process.env.CORS_ORIGIN });\\n  app.enableShutdownHooks();\\n\\n  await app.listen(process.env.PORT ?? 3000);\\n}\\nbootstrap();\\n```\\n\\n`NestFactory.create()` walks the module graph starting at `AppModule`, instantiates every provider, builds the router, and returns an application object. Nothing is listening yet — `listen()` does that.\\n\\nThings that belong here: global prefix, global pipes/filters/interceptors that need no DI, CORS, helmet, Swagger setup, shutdown hooks, body size limits.\\n\\nOne nuance worth mentioning: globals registered in `main.ts` with `new ValidationPipe()` are created **outside** the DI container, so they can\'t inject anything. If your global pipe or filter needs a service, register it as a provider with `APP_PIPE` instead (Q38).\\n\\n**Interviewer\'s angle**\\nThey may ask why `bootstrap` is async. Because `NestFactory.create` resolves async providers and module initialisation hooks, both of which return promises."},{"id":"nestjs-interview-guide-q1ye44","book":"NestJS","part":"Part 1 — Foundations","question":"How does routing work in NestJS?","prompt":"","answer":"**Short answer**\\nThe path in `@Controller()` is the prefix, the path in the method decorator is the suffix, and Nest concatenates them into the final route.\\n\\n**Full explanation**\\n\\n```ts\\n@Controller(\'users\')          // → /users\\nexport class UsersController {\\n  @Get()                      // → GET /users\\n  findAll() {}\\n\\n  @Get(\':id\')                 // → GET /users/:id\\n  findOne(@Param(\'id\') id: string) {}\\n\\n  @Get(\'active\')              // → GET /users/active\\n  findActive() {}\\n\\n  @Post()                     // → POST /users\\n  @HttpCode(201)\\n  create(@Body() dto: CreateUserDto) {}\\n\\n  @Patch(\':id\')               // → PATCH /users/:id\\n  update(@Param(\'id\') id: string, @Body() dto: UpdateUserDto) {}\\n\\n  @Delete(\':id\')              // → DELETE /users/:id\\n  remove(@Param(\'id\') id: string) {}\\n}\\n```\\n\\n**The ordering gotcha, which interviewers love:** routes are matched in declaration order. If `@Get(\':id\')` is declared before `@Get(\'active\')`, a request to `/users/active` matches the parameterised route with `id = \'active\'`, and the `findActive` handler is never reached. Static segments must be declared before dynamic ones.\\n\\nDefault status codes: `200` for everything except `POST`, which is `201`. Override with `@HttpCode()`.\\n\\nWildcards (`@Get(\'ab*cd\')`) exist but are rarely a good idea in production APIs.\\n\\n**Interviewer\'s angle**\\nThe route-ordering trap is a favourite. If they ask \\"why does `/users/active` return a 404 or a weird result?\\", that\'s the answer they\'re fishing for."},{"id":"nestjs-interview-guide-18atxkq","book":"NestJS","part":"Part 1 — Foundations","question":"What is a DTO and why use one?","prompt":"","answer":"**Short answer**\\nA Data Transfer Object defines the shape of data crossing a boundary — typically the request body. In Nest it\'s a class (not an interface), so it survives compilation and can carry validation decorators.\\n\\n**Full explanation**\\n\\n```ts\\nexport class CreateUserDto {\\n  @IsString()\\n  @MinLength(2)\\n  name: string;\\n\\n  @IsEmail()\\n  email: string;\\n\\n  @IsInt()\\n  @Min(18)\\n  @IsOptional()\\n  age?: number;\\n}\\n```\\n\\n**Why a class, not an interface?** Interfaces are erased at compile time — they don\'t exist in the emitted JavaScript. Nest\'s `ValidationPipe` needs a runtime constructor to inspect metadata against, and `class-validator` decorators need something to attach to. An interface gives you neither.\\n\\nDTOs buy you four things: a single source of truth for request shape, runtime validation, automatic Swagger schema generation, and type safety in the handler.\\n\\nKeep DTOs separate from entities. An entity models the database row; a DTO models what a client is allowed to send. Merging them is how you end up letting a client set `isAdmin: true`.\\n\\n**Interviewer\'s angle**\\n\\"Why not just use an interface?\\" is asked constantly. The compile-time-erasure answer is the one they want."},{"id":"nestjs-interview-guide-16358q5","book":"NestJS","part":"Part 1 — Foundations","question":"How do you handle validation?","prompt":"","answer":"**Short answer**\\n`ValidationPipe` from `@nestjs/common`, combined with `class-validator` and `class-transformer` decorators on DTOs. Register it globally in `main.ts`.\\n\\n**Full explanation**\\n\\n```bash\\nnpm install class-validator class-transformer\\n```\\n\\n```ts\\napp.useGlobalPipes(new ValidationPipe({\\n  whitelist: true,             // strip properties with no decorator\\n  forbidNonWhitelisted: true,  // or throw 400 if extras are present\\n  transform: true,             // convert plain object → DTO instance\\n  transformOptions: {\\n    enableImplicitConversion: true, // \\"42\\" → 42 based on TS type\\n  },\\n}));\\n```\\n\\nEach option matters:\\n\\n- **`whitelist`** is a security control. Without it, a client can send `{ name, email, role: \'admin\' }` and if you do `repo.save(dto)`, `role` gets persisted. This is mass assignment, and it\'s a real vulnerability.\\n- **`forbidNonWhitelisted`** is stricter — instead of silently dropping unknown fields, it rejects the request. Better for internal APIs where a stray field signals a client bug.\\n- **`transform`** turns the incoming plain object into an actual instance of your DTO class, which matters if the DTO has methods or getters.\\n- **`enableImplicitConversion`** handles the fact that query params and route params always arrive as strings.\\n\\nWhen validation fails, the pipe throws `BadRequestException` with an array of messages, producing a `400` with a structured body. You can override that with a custom `exceptionFactory`.\\n\\n**Interviewer\'s angle**\\nThe mass-assignment point is the differentiator. Most candidates say \\"it validates input.\\" Few mention `whitelist` as a security boundary."},{"id":"nestjs-interview-guide-1im9jqs","book":"NestJS","part":"Part 1 — Foundations","question":"What\'s the difference between `@Body`, `@Param`, `@Query`, and `@Req`?","prompt":"","answer":"**Short answer**\\nThey extract different parts of the HTTP request: the parsed body, route parameters, query string values, and the raw underlying request object respectively.\\n\\n**Full explanation**\\n\\n```ts\\n// POST /orders/42/items?expand=product&page=2\\n@Post(\':orderId/items\')\\naddItem(\\n  @Param(\'orderId\', ParseIntPipe) orderId: number,  // 42\\n  @Query(\'page\', ParseIntPipe) page: number,        // 2\\n  @Query() allQuery: Record\\u003cstring, string>,        // { expand, page }\\n  @Body() dto: AddItemDto,                          // parsed JSON body\\n  @Headers(\'authorization\') auth: string,\\n  @Req() req: Request,                              // raw Express request\\n) {}\\n```\\n\\nCalled with an argument, they extract one key; called bare, they return the whole object.\\n\\n**Avoid `@Req()` unless you genuinely need it.** Using it couples your handler to Express, which breaks if you switch to the Fastify adapter, and makes unit testing harder because you must construct a fake request object. The specific decorators are platform-agnostic.\\n\\n**Interviewer\'s angle**\\nFollow-up: \\"how do you get the authenticated user?\\" The naive answer is `@Req() req` then `req.user`. The better answer is a custom `@CurrentUser()` decorator (Q34)."},{"id":"nestjs-interview-guide-137748e","book":"NestJS","part":"Part 1 — Foundations","question":"What are pipes and when do they run?","prompt":"","answer":"**Short answer**\\nPipes transform or validate handler arguments. They run after guards and before the route handler executes.\\n\\n**Full explanation**\\n\\nA pipe is a class implementing `PipeTransform`. Its `transform(value, metadata)` method receives the incoming value and returns either the transformed value or throws an exception.\\n\\nTwo jobs:\\n\\n- **Transformation** — `\'42\'` → `42`, `\'true\'` → `true`, string → Date.\\n- **Validation** — check the value and throw if invalid.\\n\\nBuilt-in pipes: `ValidationPipe`, `ParseIntPipe`, `ParseFloatPipe`, `ParseBoolPipe`, `ParseArrayPipe`, `ParseUUIDPipe`, `ParseEnumPipe`, `DefaultValuePipe`, `ParseFilePipe`.\\n\\n```ts\\n@Get(\':id\')\\nfindOne(@Param(\'id\', ParseIntPipe) id: number) {\\n  // id is guaranteed to be a number here, or a 400 was already thrown\\n}\\n\\n@Get()\\nlist(@Query(\'page\', new DefaultValuePipe(1), ParseIntPipe) page: number) {}\\n```\\n\\nA custom pipe:\\n\\n```ts\\n@Injectable()\\nexport class TrimPipe implements PipeTransform {\\n  transform(value: unknown, metadata: ArgumentMetadata) {\\n    return typeof value === \'string\' ? value.trim() : value;\\n  }\\n}\\n```\\n\\nBinding levels: parameter, method (`@UsePipes()`), controller, or global.\\n\\n**Interviewer\'s angle**\\nThe precise ordering question — middleware → guards → interceptors (pre) → pipes → handler — comes up in Part 2 (Q30). Know it cold."},{"id":"nestjs-interview-guide-wo8b8a","book":"NestJS","part":"Part 1 — Foundations","question":"What are the Nest CLI commands you use most?","prompt":"","answer":"**Short answer**\\n`nest new`, `nest g resource`, `nest g module|controller|service`, `nest start --watch`, `nest build`.\\n\\n**Full explanation**\\n\\n```bash\\nnest new my-app                    # scaffold a project\\nnest g module users                # module, auto-registered in AppModule\\nnest g controller users            # controller + spec file\\nnest g service users               # service + spec file\\nnest g resource users              # all of the above + DTOs + entity + CRUD\\nnest g guard auth\\nnest g pipe validation\\nnest g mo users --no-spec          # skip test file\\nnest start --watch                 # dev mode with reload\\nnest build                         # compile to dist/\\n```\\n\\n`nest g resource` is the one that saves real time — it asks whether you want REST, GraphQL, microservice, or WebSocket transport, then generates a complete CRUD skeleton with DTOs.\\n\\nThe CLI also **auto-registers** what it generates. Running `nest g service users` inside the users module adds it to that module\'s `providers` array. That\'s a small thing that catches people out when they generate by hand and then get a resolution error.\\n\\n**Interviewer\'s angle**\\nLow-stakes question, usually a warm-up. Don\'t over-answer it."},{"id":"nestjs-interview-guide-1u2br4","book":"NestJS","part":"Part 1 — Foundations","question":"How do you handle errors and exceptions?","prompt":"","answer":"**Short answer**\\nThrow one of Nest\'s built-in HTTP exceptions. The default global exception filter catches them and formats the response.\\n\\n**Full explanation**\\n\\n```ts\\nimport {\\n  NotFoundException,\\n  BadRequestException,\\n  UnauthorizedException,\\n  ForbiddenException,\\n  ConflictException,\\n  UnprocessableEntityException,\\n  InternalServerErrorException,\\n} from \'@nestjs/common\';\\n\\nasync findOne(id: number) {\\n  const user = await this.repo.findOneBy({ id });\\n  if (!user) {\\n    throw new NotFoundException(`User ${id} not found`);\\n  }\\n  return user;\\n}\\n```\\n\\nProduces:\\n\\n```json\\n{ \\"statusCode\\": 404, \\"message\\": \\"User 42 not found\\", \\"error\\": \\"Not Found\\" }\\n```\\n\\nAll of these extend `HttpException`, which takes a response body and a status code. For a status without a dedicated class:\\n\\n```ts\\nthrow new HttpException(\'Too many requests\', HttpStatus.TOO_MANY_REQUESTS);\\n```\\n\\nAnything thrown that isn\'t an `HttpException` — a raw `Error`, a database driver error — is caught by the default filter and returned as a generic `500`, with the real message logged but not exposed. That\'s the correct default: leaking a Postgres error string to a client tells an attacker your schema.\\n\\n**Where to throw:** in the service, not the controller. The service knows the business rule was violated; the controller just passes the result along.\\n\\n**Interviewer\'s angle**\\nFollow-up: \\"what if you need a different error format for a client?\\" That\'s a custom exception filter — Q28."},{"id":"nestjs-interview-guide-k8m99e","book":"NestJS","part":"Part 1 — Foundations","question":"What is a module, and what do the four `@Module` properties do?","prompt":"","answer":"**Short answer**\\nA module groups related functionality. `imports` brings in other modules, `controllers` registers route handlers, `providers` registers injectables owned by this module, `exports` makes providers available to modules that import this one.\\n\\n**Full explanation**\\n\\n```ts\\n@Module({\\n  imports: [TypeOrmModule.forFeature([User]), ConfigModule],\\n  controllers: [UsersController],\\n  providers: [UsersService, UsersRepository],\\n  exports: [UsersService],\\n})\\nexport class UsersModule {}\\n```\\n\\nThe critical concept is **encapsulation**. A provider in `providers` is private to that module by default. If `OrdersModule` wants `UsersService`, two things must both be true:\\n\\n1. `UsersModule` lists `UsersService` in `exports`.\\n2. `OrdersModule` lists `UsersModule` in `imports`.\\n\\nImporting a module does **not** give you access to everything inside it — only what it exports. This is the source of the most common beginner error in Nest: \\"I imported the module, why can\'t it resolve the service?\\" Because the service wasn\'t exported.\\n\\nAlso note: importing a module does not re-export it transitively. If A exports S, B imports A, and C imports B, then C cannot see S unless B also exports A.\\n\\n**Interviewer\'s angle**\\nAsk yourself: can you explain why encapsulation is desirable at all? Because it makes the public surface of a feature explicit, so you can refactor internals without breaking consumers."},{"id":"nestjs-interview-guide-pqu8x4","book":"NestJS","part":"Part 1 — Foundations","question":"What is a global module and when should you use one?","prompt":"","answer":"**Short answer**\\n`@Global()` makes a module\'s exported providers available everywhere without importing it. Use it sparingly — config, database, logging.\\n\\n**Full explanation**\\n\\n```ts\\n@Global()\\n@Module({\\n  providers: [ConfigService],\\n  exports: [ConfigService],\\n})\\nexport class ConfigModule {}\\n```\\n\\nNow any module can inject `ConfigService` without listing `ConfigModule` in its imports.\\n\\nThe trade-off: it\'s convenient, but it hides dependencies. Reading a module\'s `imports` array should tell you what it depends on. Global modules break that. Nest\'s own documentation advises against overusing it, and I\'d echo that — if three or four things are global, dependency tracing becomes guesswork.\\n\\nRegister global modules once, in the root module. Registering the same global module twice is a common misconfiguration.\\n\\n**Interviewer\'s angle**\\nThis is a judgement question disguised as a syntax question. The right answer includes the caveat, not just the mechanism."},{"id":"nestjs-interview-guide-5lg38t","book":"NestJS","part":"Part 1 — Foundations","question":"What\'s the difference between a service and a provider?","prompt":"","answer":"**Short answer**\\nEvery service is a provider. Not every provider is a service. \\"Provider\\" is the DI concept; \\"service\\" is a conventional name for a provider that holds business logic.\\n\\n**Full explanation**\\n\\nA provider is anything registered in a module\'s `providers` array and resolvable by the injector. That includes:\\n\\n- Services (`UsersService`)\\n- Repositories\\n- Factories\\n- Value providers (a config object, a constant)\\n- Third-party clients (a Redis client, an S3 client)\\n- Guards, interceptors, pipes, and filters when they need injection\\n\\nThe four provider forms:\\n\\n```ts\\nproviders: [\\n  UsersService,                                        // shorthand for useClass\\n\\n  { provide: \'CONFIG\', useValue: { retries: 3 } },     // value provider\\n\\n  { provide: MailService,                              // class provider\\n    useClass: process.env.NODE_ENV === \'test\' ? MockMailService : SmtpMailService },\\n\\n  { provide: \'DB_CONNECTION\',                          // factory provider\\n    useFactory: async (config: ConfigService) => createConnection(config.get(\'DB_URL\')),\\n    inject: [ConfigService] },\\n\\n  { provide: \'ALIAS\', useExisting: UsersService },     // alias to an existing provider\\n]\\n```\\n\\n**Interviewer\'s angle**\\nKnowing all four forms — especially `useFactory` with `inject` — reads as production experience. Most candidates only know the shorthand."},{"id":"nestjs-interview-guide-1jl2bse","book":"NestJS","part":"Part 1 — Foundations","question":"How do you connect NestJS to a database?","prompt":"","answer":"**Short answer**\\nThrough an ORM integration module. TypeORM and Prisma are the two dominant choices; Mongoose for MongoDB.\\n\\n**Full explanation**\\n\\nTypeORM:\\n\\n```ts\\n@Module({\\n  imports: [\\n    TypeOrmModule.forRootAsync({\\n      imports: [ConfigModule],\\n      inject: [ConfigService],\\n      useFactory: (config: ConfigService) => ({\\n        type: \'postgres\',\\n        url: config.get(\'DATABASE_URL\'),\\n        autoLoadEntities: true,\\n        synchronize: false,   // NEVER true in production\\n      }),\\n    }),\\n  ],\\n})\\nexport class AppModule {}\\n```\\n\\nThen per feature:\\n\\n```ts\\n@Module({\\n  imports: [TypeOrmModule.forFeature([User])],\\n  providers: [UsersService],\\n})\\nexport class UsersModule {}\\n\\n@Injectable()\\nexport class UsersService {\\n  constructor(\\n    @InjectRepository(User) private readonly repo: Repository\\u003cUser>,\\n  ) {}\\n}\\n```\\n\\nPrisma has no official Nest module, so you wrap the client yourself:\\n\\n```ts\\n@Injectable()\\nexport class PrismaService extends PrismaClient implements OnModuleInit {\\n  async onModuleInit() {\\n    await this.$connect();\\n  }\\n}\\n```\\n\\n**`synchronize: true` is the interview landmine.** It auto-alters your schema to match your entities on every boot. In development it\'s a convenience. In production it silently drops columns and destroys data. Always `false`, always use migrations.\\n\\n**Interviewer\'s angle**\\nIf you say \\"I use TypeORM,\\" expect \\"how do you handle migrations?\\" Answer: `typeorm migration:generate` against a datasource file, committed to the repo, run in CI or on deploy — never auto-run from application code without a lock."},{"id":"nestjs-interview-guide-17r1ero","book":"NestJS","part":"Part 1 — Foundations","question":"What is the difference between `forRoot`, `forRootAsync`, and `forFeature`?","prompt":"","answer":"**Short answer**\\n`forRoot` configures a module once globally with static values. `forRootAsync` does the same but resolves configuration asynchronously, usually from `ConfigService`. `forFeature` registers scoped resources for one feature module.\\n\\n**Full explanation**\\n\\nThese are conventions for **dynamic modules** — modules configured by a static method that returns a module definition object.\\n\\n- `forRoot(options)` — called once in `AppModule`. Sets up the connection, the client, the global config. Returns a module whose providers include the parsed options.\\n- `forRootAsync(options)` — same, but options come from a `useFactory`, `useClass`, or `useExisting`. Needed whenever configuration depends on something else in the DI container, like environment config loaded at runtime.\\n- `forFeature(entities)` — called in each feature module. Doesn\'t create a connection; it registers narrower providers (repositories for these specific entities) into that module\'s injector.\\n\\nThe same pattern appears in `JwtModule`, `ConfigModule`, `BullModule`, `MongooseModule`, and `CacheModule`. Recognising it means you can read an unfamiliar Nest integration without documentation.\\n\\n**Interviewer\'s angle**\\nFollow-up: \\"write your own dynamic module.\\" That\'s Q46."},{"id":"nestjs-interview-guide-4i0sa6","book":"NestJS","part":"Part 1 — Foundations","question":"How do you manage configuration and environment variables?","prompt":"","answer":"**Short answer**\\n`@nestjs/config`, loaded once in `AppModule` as a global module, with a Joi schema validating the environment at boot.\\n\\n**Full explanation**\\n\\n```ts\\n@Module({\\n  imports: [\\n    ConfigModule.forRoot({\\n      isGlobal: true,\\n      envFilePath: [`.env.${process.env.NODE_ENV}`, \'.env\'],\\n      load: [databaseConfig, authConfig],\\n      cache: true,\\n      validationSchema: Joi.object({\\n        NODE_ENV: Joi.string().valid(\'development\', \'test\', \'production\').required(),\\n        PORT: Joi.number().default(3000),\\n        DATABASE_URL: Joi.string().required(),\\n        JWT_SECRET: Joi.string().min(32).required(),\\n      }),\\n    }),\\n  ],\\n})\\nexport class AppModule {}\\n```\\n\\nThen inject it:\\n\\n```ts\\nconstructor(private readonly config: ConfigService) {}\\nconst secret = this.config.get\\u003cstring>(\'JWT_SECRET\');\\n```\\n\\n**Why validate?** Because without a schema, a missing `JWT_SECRET` doesn\'t fail at boot — it fails at 2am when the first user tries to log in, with a confusing error. Fail fast at startup instead.\\n\\n**Never** read `process.env` directly inside services. It bypasses validation, can\'t be mocked in tests, and scatters environment knowledge across the codebase.\\n\\nRegistered config namespaces (`registerAs`) give you typed grouping:\\n\\n```ts\\nexport default registerAs(\'database\', () => ({\\n  host: process.env.DB_HOST,\\n  port: parseInt(process.env.DB_PORT, 10) || 5432,\\n}));\\n```\\n\\n**Interviewer\'s angle**\\n\\"How do you keep secrets out of the repo?\\" — `.env` gitignored, real secrets from a secret manager (AWS Secrets Manager, Vault, Doppler) injected as environment variables at deploy time."},{"id":"nestjs-interview-guide-1q302pb","book":"NestJS","part":"Part 1 — Foundations","question":"What are async providers and when do you need them?","prompt":"","answer":"**Short answer**\\nA provider whose `useFactory` returns a promise. Nest awaits it before the application finishes bootstrapping, so nothing receives a half-initialised dependency.\\n\\n**Full explanation**\\n\\n```ts\\n{\\n  provide: \'DB_CONNECTION\',\\n  useFactory: async (config: ConfigService) => {\\n    const connection = await createConnection(config.get(\'DB_URL\'));\\n    await connection.ping();\\n    return connection;\\n  },\\n  inject: [ConfigService],\\n}\\n```\\n\\nThe whole application bootstrap blocks until every async provider resolves. That\'s the point — it guarantees that by the time a request can arrive, connections are live.\\n\\nThe cost is startup time, and a failed async provider crashes the boot. That\'s usually correct behaviour: a service that can\'t reach its database shouldn\'t report itself as ready.\\n\\n**Interviewer\'s angle**\\nRelated: how is this different from `OnModuleInit`? Async providers block *creation* of the provider; `OnModuleInit` runs *after* all providers in the module are instantiated. Use the former for constructing a dependency, the latter for work that needs other dependencies present."},{"id":"nestjs-interview-guide-1xwjx91","book":"NestJS","part":"Part 1 — Foundations","question":"How do you enable CORS, and what does it actually protect?","prompt":"","answer":"**Short answer**\\n`app.enableCors()` in `main.ts`, or `NestFactory.create(AppModule, { cors: true })`. It\'s a browser-enforced policy controlling which origins may read responses from your API.\\n\\n**Full explanation**\\n\\n```ts\\napp.enableCors({\\n  origin: [\'https://app.example.com\'],\\n  methods: [\'GET\', \'POST\', \'PATCH\', \'DELETE\'],\\n  credentials: true,          // required for cookies\\n  maxAge: 86400,              // cache preflight for a day\\n});\\n```\\n\\nTwo clarifications that separate a real answer from a memorised one:\\n\\n1. **CORS is enforced by browsers, not servers.** curl, Postman, and any server-to-server client ignore it entirely. It is not an access-control mechanism — authentication and authorisation are. CORS stops a malicious website from reading your API\'s responses using a logged-in user\'s browser.\\n\\n2. **`origin: \'*\'` and `credentials: true` are mutually exclusive.** The spec forbids the combination, and browsers will reject it. If you need cookies, you must enumerate origins.\\n\\n**Interviewer\'s angle**\\nSaying \\"CORS is a security feature that protects my API from unauthorised access\\" is the wrong answer and a common one. Being precise here is a genuine signal."},{"id":"nestjs-interview-guide-1fhx22y","book":"NestJS","part":"Part 2 — Working knowledge","question":"What is middleware in NestJS?","prompt":"","answer":"**Short answer**\\nA function that runs before the route handler is even matched to a controller. It has access to the raw request and response objects and a `next()` callback — t
